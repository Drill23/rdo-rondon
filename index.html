/* ============================================================
   PLANILHA DE DESCARTES DO PCP (disco T)
   O painel lê a planilha deles SEM alterar nada (só leitura),
   transforma cada coluna na linha equivalente do RDO e grava
   na base (campo "descartes"). A planilha continua sendo deles.
   ============================================================ */

/* ---------- leitor de .xlsx (sem biblioteca: zip + XML do próprio navegador) ---------- */
async function lerXlsx(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('O arquivo não parece ser uma planilha .xlsx.');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const ents = {}, td = new TextDecoder();
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const met = dv.getUint16(p + 10, true), tam = dv.getUint32(p + 20, true);
    const ln = dv.getUint16(p + 28, true), le = dv.getUint16(p + 30, true), lc = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    ents[td.decode(u8.subarray(p + 46, p + 46 + ln))] = { met, tam, off };
    p += 46 + ln + le + lc;
  }
  async function arquivo(nome) {
    const e = ents[nome]; if (!e) return null;
    const ini = e.off + 30 + dv.getUint16(e.off + 26, true) + dv.getUint16(e.off + 28, true);
    const dados = u8.subarray(ini, ini + e.tam);
    if (e.met === 0) return td.decode(dados);
    if (e.met !== 8 || typeof DecompressionStream === 'undefined') throw new Error('Este navegador não consegue abrir a planilha (use o Chrome ou o Edge atualizados).');
    const st = new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(st).text();
  }
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const wb = xml(await arquivo('xl/workbook.xml'));
  const rels = xml(await arquivo('xl/_rels/workbook.xml.rels') || '<r/>');
  const alvoRel = {}; [...rels.getElementsByTagName('Relationship')].forEach(r => (alvoRel[r.getAttribute('Id')] = r.getAttribute('Target')));
  const ssTxt = await arquivo('xl/sharedStrings.xml');
  const ss = ssTxt ? [...xml(ssTxt).getElementsByTagName('si')].map(si => [...si.getElementsByTagName('t')].map(t => t.textContent).join('')) : [];
  const colIdx = ref => { let c = 0; for (const ch of ref.replace(/\d+/g, '')) c = c * 26 + ch.charCodeAt(0) - 64; return c - 1; };
  const abas = {};
  for (const sh of wb.getElementsByTagName('sheet')) {
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let alvo = alvoRel[rid] || ''; alvo = alvo.replace(/^\/?xl\//, '').replace(/^\//, '');
    const txt = await arquivo('xl/' + alvo); if (!txt) continue;
    const linhas = [];
    for (const row of xml(txt).getElementsByTagName('row')) {
      const r = +row.getAttribute('r') - 1, lin = [];
      for (const c of row.getElementsByTagName('c')) {
        const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
        let val = null;
        if (t === 's') val = v ? ss[+v.textContent] : null;
        else if (t === 'inlineStr') { const is = c.getElementsByTagName('t')[0]; val = is ? is.textContent : null; }
        else if (t === 'str' || t === 'e') val = v ? v.textContent : null;
        else if (t === 'b') val = v ? v.textContent === '1' : null;
        else if (v && v.textContent !== '') val = parseFloat(v.textContent);
        if (val !== null && val !== '') lin[colIdx(c.getAttribute('r'))] = val;
      }
      linhas[r] = lin;
    }
    abas[sh.getAttribute('name')] = linhas;
  }
  return abas;
}

/* ---------- de-para: coluna da planilha → linha do RDO ---------- */
const semAc = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
// [palavras do cabeçalho, linha se a origem for ÁREA DIF, linha se for PCC 1B]
const PLAN_DEPARA = [
  [['pes', 'escaldagem'], '1.10', '1.10'], [['pes', 'calo'], '1.11', '1.11'], [['pe inteiro'], '1.9', '1.9'], [['pes', 'queda'], '1.12', '1.12'],
  [['queda escaldagem'], '1.4', '1.4'], [['escaldagem excessiva'], '1.1', '1.1'], [['ma sangria'], '1.2', '1.2'], [['nao eviscerad'], '1.3', '1.3'],
  [['pre', 'inspecao'], '2.7', '2.7'], [['linha dif'], '2.8', '2.8'],
  [['asa'], '2.1', '3.2'], [['file'], '2.2', '3.3'], [['dorso'], '2.3', '3.4'], [['artrite'], '3.6', '3.6'], [['coxa'], '2.4', '3.5'],
  [['papo'], '2.5', '3.7'], [['aspecto'], '3.8', '3.8'], [['pes'], '2.6', '3.9'], [['pata'], '2.6', '3.9'],
  [['coracao'], '1.13', '1.13'], [['moela'], '1.14', '1.14'], [['figado'], '1.15', '1.15']
];
function planCampo(cab) {
  const h = semAc(cab); if (!h || /^(data|turno|origem|total)/.test(h)) return null;
  const d = PLAN_DEPARA.find(([ps]) => ps.every(p => h.includes(p)));
  return d ? { dif: d[1], pcc: d[2] } : null;
}
const serialISO = v => { if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); } const m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); return m ? `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : null; };

// Lê as abas e devolve a soma por dia × turno × linha do RDO
function descDaPlanilha(abas, desde, ate) {
  const soma = new Map(), avisos = new Set();
  for (const [nomeAba, linhas] of Object.entries(abas)) {
    const iCab = linhas.findIndex(l => l && l.some(c => semAc(c) === 'data') && l.some(c => semAc(c) === 'origem'));
    if (iCab < 0) continue;
    const cab = linhas[iCab];
    // cada bloco (evisceração, escaldagem, pós-chiller) começa numa coluna "Data"
    const blocos = [];
    cab.forEach((c, k) => { if (semAc(c) === 'data') blocos.push({ d: k, t: null, o: null, cols: [] }); });
    blocos.forEach((b, j) => {
      const fim = j + 1 < blocos.length ? blocos[j + 1].d : cab.length;
      for (let k = b.d + 1; k < fim; k++) {
        const h = semAc(cab[k]);
        if (h === 'turno') b.t = k; else if (h === 'origem') b.o = k;
        else { const m = planCampo(cab[k]); if (m) b.cols.push({ k, m, nome: String(cab[k]).trim() }); else if (cab[k] && !/^total/.test(h)) avisos.add(`coluna não reconhecida: "${cab[k]}" (${nomeAba})`); }
      }
    });
    for (let r = iCab + 1; r < linhas.length; r++) {
      const l = linhas[r]; if (!l) continue;
      for (const b of blocos) {
        const data = serialISO(l[b.d]); if (!data || data < desde || data > ate) continue;
        const tt = String(l[b.t] || '').match(/([123])/); if (!tt) continue;
        const turno = 'T' + tt[1];
        const pcc = /pcc/i.test(String(l[b.o] || ''));
        for (const c of b.cols) {
          const v = l[c.k]; if (typeof v !== 'number' || !(v > 0)) continue;
          const linha = pcc ? c.m.pcc : c.m.dif;
          const ch = `${data}|${turno}|${linha}`;
          const o = soma.get(ch) || { data, turno, linha, qtd: 0, de: [] };
          o.qtd += v; o.de.push(`${c.nome} · ${pcc ? 'PCC 1B' : 'Área DIF'}`); soma.set(ch, o);
        }
      }
    }
  }
  const lista = [...soma.values()].map(o => {
    const def = RDO.NQ[o.linha], und = def.un === 'und';
    return { id: idFdr(o.data, o.turno, o.linha), data: o.data, turno: o.turno, linha: o.linha, alvo: und ? 'carcaca' : def.alvo, un: und ? 'carcacas' : 'kg', qtd: Math.round(o.qtd * 1000) / 1000, causa: def.n, obs: 'da planilha: ' + [...new Set(o.de)].join(' + '), lancadoPor: 'planilha de descartes (PCP)' };
  }).sort((x, y) => (x.data + x.turno + x.linha).localeCompare(y.data + y.turno + y.linha, 'pt-BR', { numeric: true }));
  return { lista, avisos: [...avisos] };
}

/* ---------- conexão com o arquivo (fica guardada neste aparelho) ---------- */
const PLAN = { handle: null, lendo: false, ult: store.get('planUlt', null) };
const planSuporta = () => typeof window.showOpenFilePicker === 'function';
function planDB(modo, fn) {
  return new Promise((ok, erro) => {
    try {
      const rq = indexedDB.open('rdo-planilha', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('h');
      rq.onerror = () => erro(rq.error);
      rq.onsuccess = () => { const tx = rq.result.transaction('h', modo); const r = fn(tx.objectStore('h')); tx.oncomplete = () => ok(r && 'result' in r ? r.result : undefined); tx.onerror = () => erro(tx.error); };
    } catch (e) { erro(e); }
  });
}
const planSalvarHandle = h => planDB('readwrite', s => (h ? s.put(h, 'arq') : s.delete('arq')));
const planCarregarHandle = () => planDB('readonly', s => s.get('arq')).catch(() => null);
function planDesde() { const reais = S.regs.filter(r => !r.demo).map(r => r.data).sort(); return store.get('planDesde', null) || reais[0] || RDO.addDays(RDO.toISO(new Date()), -30); }

async function planConectar() {
  if (!planSuporta()) return $('#plan-arq') && $('#plan-arq').click();
  try {
    const [h] = await window.showOpenFilePicker({ multiple: false, types: [{ description: 'Planilha de descartes', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx', '.xlsm'] } }] });
    PLAN.handle = h; await planSalvarHandle(h).catch(() => { });
    toast('Planilha conectada. Lendo…');
    await planLer({ manual: true });
  } catch (e) { if (e && e.name !== 'AbortError') toast('Não consegui conectar: ' + e.message, 4200); }
}
async function planDesconectar() {
  PLAN.handle = null; await planSalvarHandle(null).catch(() => { });
  store.del('planUlt'); PLAN.ult = null; render(false); toast('Planilha desconectada deste aparelho. Os descartes já lançados continuam na base.');
}
// manual = o usuário clicou (pode pedir permissão); auto = só lê se a permissão já estiver dada
async function planLer(o = {}) {
  if (PLAN.lendo || S.demo) return;
  if (!PLAN.handle) PLAN.handle = await planCarregarHandle();
  if (!PLAN.handle) return;
  try {
    let perm = await PLAN.handle.queryPermission({ mode: 'read' });
    if (perm !== 'granted' && o.manual) perm = await PLAN.handle.requestPermission({ mode: 'read' });
    if (perm !== 'granted') { PLAN.pedePerm = true; renderFonte(); return; }
    PLAN.pedePerm = false;
    const f = await PLAN.handle.getFile();
    if (!o.manual && PLAN.ult && PLAN.ult.mod === f.lastModified && PLAN.ult.ok) return; // nada mudou desde a última leitura
    await planProcessar(f, o);
  } catch (e) {
    PLAN.ult = Object.assign({}, PLAN.ult, { erro: /NotReadable|lock|busy/i.test(e.name + e.message) ? 'a planilha está aberta em outro computador; tento de novo em 5 minutos' : e.message, quando: Date.now() });
    store.set('planUlt', PLAN.ult); renderFonte();
    if (o.manual) toast('Não consegui ler a planilha: ' + PLAN.ult.erro, 4800);
  }
}
async function planProcessar(f, o = {}) {
  PLAN.lendo = true; renderFonte();
  try {
    const abas = await lerXlsx(await f.arrayBuffer());
    const desde = planDesde(), ate = RDO.toISO(new Date());
    const { lista, avisos } = descDaPlanilha(abas, desde, ate);
    const r = await planEnviar(lista, desde, ate, f.name);
    PLAN.ult = { ok: true, nome: f.name, mod: f.lastModified, quando: Date.now(), n: lista.length, dias: new Set(lista.map(x => x.data + x.turno)).size, novos: r.novos, removidos: r.removidos, destino: r.destino, desde, avisos };
    store.set('planUlt', PLAN.ult);
    if (o.manual || r.novos || r.removidos) toast(r.novos || r.removidos ? `Planilha lida: ${r.novos} linha(s) nova(s) ou alterada(s)${r.removidos ? `, ${r.removidos} removida(s)` : ''} ${r.destino === 'nuvem' ? 'gravadas na base da nuvem' : 'salvas neste aparelho'}.` : 'Planilha lida: nada novo para lançar.', 4200);
  } finally { PLAN.lendo = false; renderFonte(); if (S.view === 'lancar' || S.view === 'perdas') render(false); }
}
// compara com o que já está na base e grava só a diferença
async function planEnviar(lista, desde, ate, nome) {
  const atual = (S.desc || []).filter(d => d.data >= desde && d.data <= ate);
  const igual = (a, b) => a && b && +a.qtd === +b.qtd && a.alvo === b.alvo && a.un === b.un && (a.lancadoPor || '') === (b.lancadoPor || '');
  const agora = agoraISO();
  const novos = lista.filter(n => !igual(atual.find(d => d.id === n.id), n)).map(n => Object.assign({ lancadoEm: agora }, n));
  const ids = new Set(lista.map(n => n.id));
  const remover = atual.filter(d => /^planilha/.test(d.lancadoPor || '') && !ids.has(d.id) && +d.qtd > 0).map(d => d.id);
  if (!novos.length && !remover.length) return { novos: 0, removidos: 0, destino: 'nada' };
  const gh = ghCfg(), nuvem = !!(gh.token && gh.owner && gh.repo);
  if (nuvem) {
    try {
      const b = await GH.gravar(null, `Descartes da planilha do PCP (${nome}): ${novos.length} linha(s)${remover.length ? `, ${remover.length} removida(s)` : ''}`, lst => RDO.upsertDesc(lst.filter(d => !remover.includes(d.id)), novos));
      S.remoto = b.registros; S.remotoDesc = b.descartes || [];
      store.set('cacheRemoto', { registros: b.registros, descartes: S.remotoDesc, quando: Date.now(), via: 'GitHub (API)' });
      salvarDescLocais(descLocais().filter(d => !ids.has(d.id) && !remover.includes(d.id)));
      montarRegs();
      return { novos: novos.length, removidos: remover.length, destino: 'nuvem' };
    } catch (e) { toast('Não consegui gravar no GitHub (' + e.message + '). Ficou salvo neste aparelho.', 5000); }
  }
  const lapides = atual.filter(d => remover.includes(d.id)).map(d => Object.assign({}, d, { qtd: 0 }));
  salvarDescLocais(RDO.upsertDesc(descLocais(), novos.concat(lapides)));
  montarRegs();
  return { novos: novos.length, removidos: remover.length, destino: 'local' };
}

function ligarBusca(win) {
  const inp = win.querySelector('#bi-q'), lista = win.querySelector('#bi-lista');
  if (!inp || !lista) return;
  let ativo = 0;
  const ops = () => [...lista.querySelectorAll('.bi-op')];
  const marcar = k => { const o = ops(); if (!o.length) return; ativo = (k + o.length) % o.length; o.forEach((b, i) => b.classList.toggle('ativo', i === ativo)); o[ativo].scrollIntoView({ block: 'nearest' }); };
  inp.addEventListener('input', () => { lista.innerHTML = buscaItemHTML(inp.value); marcar(0); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); marcar(ativo + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); marcar(ativo - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); const o = ops()[ativo]; if (o) ligarFoco(o.dataset.item); }
  });
  const atual = ops().findIndex(b => b.classList.contains('atual'));
  marcar(atual >= 0 ? atual : 0);
  setTimeout(() => { try { inp.focus({ preventScroll: true }); } catch (e) { } }, 120);
}

  const sp = serie(regsEntre(fx.de, p.ate), gran);
  const pts = sp.map(x => RDO.analisarItens(x.a, CFG).find(y => y.c === c));
  if (sp.length >= 3) sl.push({ kick: 'No tempo', titulo: `${esc(i.n)} nos últimos dias`, corpo: `<div class="s-card">${Charts.slot({ type: 'line', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series: [{ name: i.n, color: 'var(--accent)', values: pts.map(o => o && o.real), status: i.analisa ? pts.map(o => o && o.status) : null, area: true }], meta: i.analisa ? pts.map(o => o && o.meta) : undefined, yFmt: (v, s) => N(v, s < .01 ? 3 : 2) + '%', tipFmt: v => P(v, 3) }, Math.max(280, Math.round(innerHeight * .42)))}</div>`,
    nota: `Cada ponto é um ${gran === 'dia' ? 'dia' : 'turno'}. ${i.analisa ? `Fechou em ${pts.filter(o => o && o.fechou).length} de ${pts.length}. Linha tracejada = meta.` : ''}` });
  if (L) {
    const lin = AI.imp.descartes.linhas.filter(l => (l.porItem[c] || 0) > 0.05).sort((x, y) => y.porItem[c] - x.porItem[c]).slice(0, 6);
    sl.push({ kick: 'Descartes', titulo: L.desc > 0.05 ? `Descartes tiraram ${N(L.desc, 1)} kg de ${esc(i.n.toLowerCase())}` : 'Nenhum descarte apontado para este item', corpo: L.desc > 0.05 ? `<div class="s-cols"><div><div class="s-big c-ruim">${ppNeg(L.ppDesc)}<small style="font-size:.4em"> p.p.</small></div><p class="sl-sub" style="margin:1.4vh 0 2.4vh">${P(i.real, 3)} realizado → <b>${P(L.realSem, 3)}</b> sem os descartes</p>${L.falta > 0 ? `<div class="s-lista"><div class="sl"><span>Faltou para a meta</span><b>${N(L.falta)} kg</b><span>100%</span></div><div class="sl"><span>· foi descarte</span><b>${N(L.explic)} kg</b><span>${N(L.pctExplic, 1)}%</span></div><div class="sl"><span>· outros pontos do processo</span><b>${N(L.processo)} kg</b><span>${N(100 - L.pctExplic, 1)}%</span></div></div>` : `<p class="sl-sub">O item ficou acima da meta mesmo com os descartes.</p>`}</div>
      <div class="s-card"><div class="s-lista">${lin.map(l => `<div class="sl"><span>${esc(l.n)}</span><b>${N(l.porItem[c], 1)} kg</b><span>${N(l.porItem[c] / AI.S0 * 100, 3)} p.p.</span></div>`).join('')}</div></div></div>` : `<p class="sl-sub">Se o RDO veio com as linhas de descarte em branco, lance em Perdas e impacto › Lançar descartes do RDO para ver o impacto aqui.</p>`,
      nota: 'p.p. = kg descartados ÷ peso vivo abatido × 100. Peça descartada conta inteira no próprio item; asa e carcaça são divididas na proporção real em que cada item foi produzido no turno.' });
  }
  const tt = ['T1', 'T2'].map(t => { const rs = regsPeriodo(p, t); return rs.length ? { t, i: RDO.analisarItens(agg(rs), CFG).find(y => y.c === c) } : null; }).filter(Boolean);
  if (tt.length === 2) sl.push({ kick: 'Turnos', titulo: `${esc(i.n)}: 1º × 2º turno`, corpo: `<div class="tb-wrap"><table class="tb"><thead><tr><th>Turno</th><th class="n">Rendimento</th><th class="n">Meta</th><th class="n">Saldo</th><th class="n">Caixas</th></tr></thead><tbody>${tt.map(x => `<tr><td><b>${x.t === 'T1' ? '1º turno' : '2º turno'}</b></td><td class="n c-${x.i.analisa ? x.i.status : 'neutro'}"><b>${P(x.i.real, 3)}</b></td><td class="n">${P(x.i.meta, 3)}</td><td class="n">${x.i.analisa ? KG(x.i.gapKg) : N(x.i.kg) + ' kg'}</td><td class="n">${x.i.cx != null ? SN(x.i.cx) : '—'}</td></tr>`).join('')}</tbody></table></div>`, nota: `Diferença: ${SN(tt[0].i.real - tt[1].i.real, 3)} p.p. (1º turno menos 2º turno).` });
  if (i.analisa) {
    const ate = p.ate > S.ref ? S.ref : p.ate;
    const cc = contaCorrente(ate.slice(0, 8) + '01', ate, S.turno).find(x => x.it.c === c);
    const pr = projecaoMes(S.ref, S.turno), fl = pr && pr.hist.length >= 4 ? pr.linhas.find(l => l.i.c === c) : null;
    if (cc && cc.n) sl.push({ kick: 'O mês', titulo: cc.saldo >= 0 ? `No mês, ${esc(i.n.toLowerCase())} está ${N(cc.saldo)} kg acima da meta` : `No mês, ${esc(i.n.toLowerCase())} está devendo ${N(-cc.saldo)} kg`, corpo: `<div class="s-lista"><div class="sl"><span>Saldo acumulado até ${RDO.dm(ate)}</span><b class="c-${cc.saldo >= 0 ? 'ok' : 'ruim'}">${KG(cc.saldo)}</b><span>${cc.cx != null ? SN(cc.cx) + ' caixas' : 'menos de 1 caixa'}</span></div><div class="sl"><span>Dias abaixo da meta</span><b>${cc.nAbaixo} de ${cc.n}</b><span></span></div>${fl && pr.rest ? `<div class="sl"><span>Projeção do mês</span><b>${P(fl.final, 3)}</b><span>chance de fechar ${pctChance(fl.chMes)}</span></div><div class="sl"><span>Precisa render daqui em diante</span><b>${fl.precisa <= 0 ? 'garantido' : P(fl.precisa, 3)}</b><span>${pr.rest} dia(s) de produção</span></div>` : ''}</div>`, nota: 'Saldo acumulado = soma dos kg ganhos e perdidos contra a meta em cada lançamento do mês.' });
  }
  sl.push({ kick: 'Comparado', titulo: 'Onde este item está entre os outros', corpo: `<div class="s-card">${destacar(hbarsKg(its), c)}</div>`, nota: 'Saldo em kg de cada item no período. O item filtrado aparece em destaque.' });
  return sl;
}


/* ============================================================
   FICHAS: o conteúdo que aparece quando um cartão se expande
   ============================================================ */
function itemTopoHTML(i, a, rot) {
  const st = i.analisa ? i.status : 'neutro';
  const esc0 = Math.max(i.real || 0, i.meta || 0) * 1.12 || 1;
  const w = Math.max(1.5, (i.real || 0) / esc0 * 100), m = (i.meta || 0) / esc0 * 100;
  const carimbo = !i.analisa ? 'Só produção' : i.fechou ? 'Fechou' : st === 'quase' ? 'Quase' : 'Não fechou';
  const desc = i.analisa && isNum(i.gapKg)
    ? `${i.gapKg >= 0 ? 'Rendeu <b>acima</b> da meta' : 'Rendeu <b>abaixo</b> da meta'}: foram produzidos <b>${N(i.kg, 0)} kg</b> de ${esc(i.n.toLowerCase())}; pela meta seriam <b>${N(i.metaKg, 0)} kg</b>.`
    : `Produzidos <b>${N(i.kg, 0)} kg</b> neste período. Este item não entra na conta de caixas.`;
  const placar = i.analisa && isNum(i.gapKg)
    ? `<div class="fi-placar"><div class="pl-l">Saldo contra a meta</div><div class="pl-v c-${i.gapKg >= 0 ? 'ok' : 'ruim'}"><span data-count="${i.gapKg}" data-dec="0" data-sinal="1">${SN(i.gapKg)}</span><small>kg</small></div><div class="pl-cx">${i.cx != null ? `= ${SN(i.cx)} caixas de ${i.pesoCx} kg` : 'menos de 1 caixa (fica só em kg)'}</div><div class="fp-l"><span>Produzido</span><b>${N(i.kg, 0)} kg</b></div><div class="fp-l" style="border:0;margin:0;padding-top:0"><span>Pela meta</span><b>${N(i.metaKg, 0)} kg</b></div></div>`
    : `<div class="fi-placar"><div class="pl-l">Produzido no período</div><div class="pl-v"><span>${N(i.kg, 0)}</span><small>kg</small></div><div class="pl-cx">só produção (sem meta de caixas)</div></div>`;
  const gcol = st === 'neutro' ? 'var(--accent)' : `var(--${st})`;
  const gauge = `<div class="fi-gauge"><span class="gauge grande" style="--gcol:${gcol};--w:${w.toFixed(1)}%;--m:${m.toFixed(1)}%"><i class="fill"></i>${i.analisa && isNum(i.meta) ? `<i class="mk"></i><span class="g-lab cima" style="left:${m.toFixed(1)}%">meta ${P(i.meta, 3)}</span>` : ''}<span class="g-lab zero">0%</span><span class="g-lab" style="left:${Math.min(94, w).toFixed(1)}%">realizado ${P(i.real, 3)}</span></span></div>`;
  return `<div class="fi-topo"><div class="fi-num"><div class="fi-lbl">${esc(rot)}</div><div class="fi-linha"><div class="fi-big c-${st}">${P(i.real, 3)}</div><span class="carimbo ${st}">${carimbo}</span></div><div class="fi-meta">${i.analisa && isNum(i.meta) ? `meta ${P(i.meta, 3)} · diferença ${SN(i.pp, 3)} p.p.` : 'sem meta analisada'}</div><p class="fi-desc">${desc}</p></div>${placar}</div>${gauge}`;
}

function cupomItem(i, a) {
  const S0 = a.val.S;
  if (!isNum(i.real) || !isNum(S0)) return '';
  const l = (t, v, cls = '') => `<div class="cp-l ${cls}"><span>${t}</span><i></i><b>${v}</b></div>`;
  let h = `<div class="cupom"><div class="cp-h">*** A conta ***</div>`;
  h += l('Frango vivo abatido', `${N(S0, 0)} kg`);
  h += l(`${esc(i.n)} produzido`, `${N(i.kg, 0)} kg`);
  h += l('Rendimento (÷)', P(i.real, 3));
  if (i.analisa && isNum(i.meta)) {
    h += l('Meta', P(i.meta, 3));
    h += `<div class="cp-sep"></div>`;
    h += l('Diferença', `${SN(i.pp, 3)} p.p.`);
    h += l(`× ${N(S0, 0)} kg vivos`, KG(i.gapKg), 'cp-tot');
    h += l(`÷ ${i.pesoCx} kg por caixa`, i.cx != null ? `${SN(i.cx)} cx` : '< 1 cx', 'cp-tot');
  }
  h += `<div class="cp-pe">${i.analisa ? (i.fechou ? '— item fechou a meta —' : '— item não fechou a meta —') : '— item só de produção —'}</div></div>`;
  return h;
}

function descItemTxt(i, a, p) {
  const imp = RDO.impacto(a, CFG);
  const rec = imp ? imp.descartes.porItem[i.c] || 0 : 0;
  const S0 = a.val.S;
  if (rec > 0.05) {
    const sem = i.real + rec / S0 * 100, gapSem = (i.gapKg || 0) + rec, cx = RDO.caixas(gapSem, i.pesoCx);
    return `<p><b>${N(rec, 1)} kg</b> descartados = −${N(rec / S0 * 100, 3)} p.p. de rendimento.</p><p>Sem eles o rendimento seria <b>${P(sem, 3)}</b> e o saldo ficaria <b class="c-${gapSem >= 0 ? 'ok' : 'ruim'}">${KG(gapSem)}</b>${cx != null ? ` (${SN(cx)} cx)` : ''} — ${i.fechou ? 'o item já fechou mesmo com os descartes.' : gapSem >= 0 ? '<b class="c-ok">teria fechado</b>.' : 'ainda faltaria: a maior parte da perda está em outro ponto do processo.'}</p>`;
  }
  return `<p>Nenhum descarte apontado para este item em ${esc(p.rot.toLowerCase())} (nem no RDO, nem lançado à parte).</p>`;
}

function fichaItem(c) {
  const p = periodo(), regs = regsPeriodo(p);
  if (!regs.length) return null;
  const a = agg(regs);
  const its = RDO.analisarItens(a, CFG);
  const i = its.find(x => x.c === c);
  if (!i || !i.tem) return null;
  const rot = `${p.rot} · ${turnoRot(S.turno, regs)}`;
  const fx = faixaContexto(p);
  const gran = S.turno === 'todos' ? 'dia' : 'reg';
  const sp = serie(regsEntre(fx.de, p.ate), gran);
  const pts = sp.map(x => RDO.analisarItens(x.a, CFG).find(y => y.c === c));
  let graf = '';
  if (sp.length >= 2) {
    const nOk = pts.filter(o => o.fechou).length;
    graf = `<div class="fi-bloco"><h4>${ic('tendencia')}${esc(cap(fx.nota))}${i.analisa ? ` · ${nOk} de ${pts.length} fecharam` : ''}</h4>${Charts.slot({ type: 'line', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series: [{ name: i.n, color: 'var(--accent)', values: pts.map(o => o.real), status: i.analisa ? pts.map(o => o.status) : null, area: true }], meta: i.analisa ? pts.map(o => o.meta) : undefined, yFmt: (v, s) => N(v, s < .01 ? 3 : 2) + '%', tipFmt: v => P(v, 3), tipExtra: k => { const ii = pts[k]; return i.analisa && isNum(ii.gapKg) ? `<div class="tt-row"><span>Saldo</span><b>${KG(ii.gapKg)}${ii.cx != null ? ` · ${SN(ii.cx)} cx` : ''}</b></div>` : ''; } }, 240)}<div class="legenda"><span><i style="background:var(--accent)"></i>realizado</span>${i.analisa ? '<span><i class="tr"></i>meta</span><span>ponto verde = fechou · vermelho = não fechou</span>' : ''}</div></div>`;
  }
  let turnos = '';
  if (S.turno === 'todos' && a.turnos.length > 1) {
    const ts = a.turnos.map(t => ({ t, i: RDO.analisarItens(agg(regs.filter(r => r.turno === t)), CFG).find(y => y.c === c) }));
    turnos = `<div class="fi-bloco"><h4>${ic('comparar')}Por turno</h4><div class="tb-wrap"><table class="tb"><thead><tr><th>Turno</th><th class="n">Rend.</th><th class="n">Saldo</th><th class="n">Caixas</th></tr></thead><tbody>${ts.map(x => `<tr><td><b>${x.t === 'T1' ? '1º turno' : x.t === 'T2' ? '2º turno' : esc(x.t)}</b></td><td class="n">${P(x.i.real, 3)}</td><td class="n c-${x.i.analisa ? x.i.status : 'neutro'}"><b>${x.i.analisa ? KG(x.i.gapKg) : N(x.i.kg, 0) + ' kg'}</b></td><td class="n">${x.i.cx != null ? SN(x.i.cx) : '—'}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  let mes = '';
  if (i.analisa) {
    const ate = p.ate > S.ref ? S.ref : p.ate;
    const cc = contaCorrente(ate.slice(0, 8) + '01', ate, S.turno).find(x => x.it.c === c);
    if (cc && cc.n > 1) mes = `<div class="fi-bloco"><h4>${ic('calendario')}Acumulado do mês até ${RDO.dm(ate)}</h4><div class="kv"><span>Saldo do mês</span><span class="c-${cc.saldo >= 0 ? 'ok' : 'ruim'}">${KG(cc.saldo)}${cc.cx != null ? ` · ${SN(cc.cx)} cx` : ''}</span><span>Dias abaixo da meta</span><span>${cc.nAbaixo} de ${cc.n}</span><span>Faltou nesses dias</span><span class="c-ruim">${cc.nAbaixo ? KG(cc.faltou) : '—'}</span><span>Sobrou nos outros</span><span class="c-ok">${cc.n - cc.nAbaixo ? KG(cc.sobrou) : '—'}</span></div>${cc.seq >= 2 ? `<p class="cc-seq">${ic('desce')}<span><b>${cc.seq} dias seguidos</b> sem fechar · ${KG(cc.seqKg)}</span></p>` : ''}</div>`;
  }
  const desc = i.analisa ? `<div class="fi-bloco"><h4>${ic('alvo')}Descartes</h4>${descItemTxt(i, a, p)}</div>` : '';
  const html = `<div class="ficha">${itemTopoHTML(i, a, rot)}
    <div class="fi-grid"><div class="fi-col">${cupomItem(i, a)}${mes}</div><div class="fi-col">${graf}${turnos}${desc}</div></div>
    <div class="fi-acoes"><button class="btn tinta" data-act="view" data-v="itens" data-item="${c}">${ic('itens')}Ver análise completa do item</button><button class="btn" data-act="view" data-v="tendencias" data-ind="${c}">${ic('tendencia')}Ver em Tendências</button></div></div>`;
  return { titulo: i.n, sub: rot, html };
}

function fichaInd(c) {
  if (String(c).startsWith('seg:')) return fichaSeg(+String(c).slice(4));
  const a = S._a; if (!a) return null;
  const d = indDef(c), l = RDO.L[c] || {};
  const v = indVal(a, c), m = indMeta(a, c);
  if (!isNum(v)) return null;
  const st = d.dir && isNum(m) ? RDO.status(v, m, d.dir, CFG) : 'neutro';
  const ct = contaInd(c, a);
  const ex = l.ex || (c === 'mortPct' ? 'Aves que chegaram mortas do transporte, em % dos frangos abatidos. Quanto menor, melhor. Elas não entram no abate, então tiram volume do dia.' : '');
  const p = periodo(), regs = regsPeriodo(p);
  const rot = `${p.rot} · ${turnoRot(S.turno, regs)}`;
  const fx = faixaContexto(p);
  const gran = S.turno === 'todos' ? 'dia' : 'reg';
  const sp = serie(regsEntre(fx.de, p.ate), gran);
  const vals = sp.map(x => indVal(x.a, c)), metas = sp.map(x => indMeta(x.a, c));
  const dec = d.un === '%' ? Math.min(d.dec, 3) : d.dec;
  const fmtE = (x, s) => fmtInd(c, x, s < .01 ? 3 : s < .1 ? 2 : s < 1 ? 1 : 0).replace(' kg', '').replace(' min', '');
  const graf = vals.filter(isNum).length >= 2
    ? Charts.slot({ type: 'line', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series: [{ name: d.n, color: 'var(--accent)', values: vals, status: d.dir ? vals.map((x, k) => RDO.status(x, metas[k], d.dir, CFG)) : null, area: true }], meta: metas.some(isNum) ? metas : undefined, yFmt: fmtE, tipFmt: x => fmtInd(c, x, dec) }, 250)
    : '<p class="muted">O histórico aparece quando houver mais lançamentos.</p>';
  const dif = isNum(m) ? v - m : null;
  const html = `<div class="ficha">
    <div class="fi-topo ${ct ? '' : 'solo'}"><div class="fi-num"><div class="fi-lbl">${esc(rot)}</div><div class="fi-linha"><div class="fi-big c-${st}">${fmtInd(c, v, dec)}</div>${d.dir && isNum(m) ? `<span class="carimbo ${st}">${STATUS_TXT[st]}</span>` : ''}</div><div class="fi-meta">${isNum(m) ? `meta ${fmtInd(c, m, dec)}${dif != null ? ` · diferença ${d.un === '%' ? SN(dif, dec) + ' p.p.' : SN(dif, dec)}` : ''}` : 'indicador sem meta'}</div>${ex ? `<p class="fi-desc">${esc(ex)}</p>` : ''}</div>
      ${ct ? `<div class="cupom"><div class="cp-h">*** A conta ***</div><div style="font-size:13px;line-height:1.95">${ct}</div>${l.f ? `<div class="cp-pe">fórmula do RDO: ${esc(l.f)}</div>` : ''}</div>` : ''}</div>
    <div class="fi-bloco"><h4>${ic('tendencia')}${esc(cap(fx.nota))}</h4>${graf}${metas.some(isNum) ? '<div class="legenda"><span><i style="background:var(--accent)"></i>realizado</span><span><i class="tr"></i>meta</span></div>' : ''}</div>
    <div class="fi-acoes"><button class="btn tinta" data-act="view" data-v="tendencias" data-ind="${c}">${ic('tendencia')}Abrir em Tendências</button></div>
  </div>`;
  return { titulo: d.n, sub: rot, html };
}

function fichaSeg(k) {
  const s = (S._segs || [])[k]; if (!s) return null;
  if (s.st === 'quebra') return fichaInd('BB');
  if (RDO.ITEM[s.c] && s.n !== 'CMS + dorso') return fichaItem(s.c);
  const a = S._a;
  return { titulo: s.n, sub: 'De cada 100 kg de frango vivo', tam: 'm', html: `<div class="ficha"><div class="fi-topo solo"><div class="fi-num"><div class="fi-lbl">De cada 100 kg de frango vivo</div><div class="fi-linha"><div class="fi-big">${N(s.v, 3)}<span style="font-size:.4em"> kg</span></div></div><div class="fi-meta">${N(s.kg, 0)} kg no período</div><p class="fi-desc">CMS (carne mecanicamente separada) e dorso não entram na conta de caixas: aparecem só como produção. A meta do CMS + dorso é ${P(15, 0)} do peso vivo.</p></div></div>${a ? `<div class="ficha-txt">${infoHTML('seg:' + k, a)}</div>` : ''}</div>` };
}

function fichaCC(c) {
  const x = (S._cc || {})[c]; if (!x) return null;
  const rot = S._ccRot || '';
  const st = x.n === 0 ? 'neutro' : x.saldo >= 0 ? 'ok' : (x.nAbaixo === x.n ? 'ruim' : 'quase');
  const graf = x.pts.length >= 1 ? Charts.slot({ type: 'bars', labels: x.pts.map(q => q.lab), tipLabels: x.pts.map(q => q.tip), series: [{ name: 'Saldo do dia', color: 'var(--accent)', values: x.pts.map(q => q.gap), status: x.pts.map(q => q.gap >= 0 ? 'ok' : 'ruim') }], yFmt: v => N(v, 0), tipFmt: v => KG(v) }, 240) : '';
  const tab = `<div class="tb-wrap"><table class="tb"><thead><tr><th>Dia</th><th class="n">Realizado</th><th class="n">Meta</th><th class="n">Saldo</th></tr></thead><tbody>${x.pts.map(q => `<tr><td>${esc(q.tip)}</td><td class="n">${P(q.real, 3)}</td><td class="n">${P(q.meta, 3)}</td><td class="n c-${q.gap >= 0 ? 'ok' : 'ruim'}"><b>${KG(q.gap)}</b></td></tr>`).join('')}</tbody></table></div>`;
  const html = `<div class="ficha">
    <div class="fi-topo"><div class="fi-num"><div class="fi-lbl">Conta corrente · ${esc(rot)}</div><div class="fi-linha"><div class="fi-big c-${x.saldo >= 0 ? 'ok' : 'ruim'}">${KG(x.saldo)}</div><span class="carimbo ${st}">${x.saldo >= 0 ? 'Em dia' : 'Devendo'}</span></div><div class="fi-meta">${x.nAbaixo} de ${x.n} dia(s) abaixo da meta${x.cx != null ? ` · ≈ ${SN(x.cx)} caixas de ${x.pc} kg` : ''}</div><p class="fi-desc">Soma, dia a dia, do que o item ficou devendo (abaixo da meta) e do que sobrou (acima da meta).${x.seq >= 2 ? ` Está há <b>${x.seq} dias seguidos</b> sem fechar.` : ''}</p></div>

/* ============================================================
   NAVEGAÇÃO: pilha de camadas (telas, janelas e apresentação)
   integrada ao botão voltar do navegador e do celular.
   ============================================================ */
const NAV = { pilha: [], seq: 0, base: 0, hist: true, pend: null };
const CHAVES = ['view', 'per', 'ref', 'turno', 'item', 'de', 'ate', 'cmp', 'perdasAba', 'tendInd', 'foco'];
function hashAtual() { return `#${S.view}/${S.per}/${S.ref}/${S.turno}${S.foco ? '/' + S.foco : ''}`; }
function histInit() {
  NAV.base = NAV.seq = Math.floor(Date.now() / 1000) % 100000000;
  try { history.scrollRestoration = 'manual'; } catch (e) { }
  try { history.replaceState({ rdo: NAV.base }, '', hashAtual()); } catch (e) { NAV.hist = false; }
  window.addEventListener('popstate', aoPopState);
}
function topoSeq() { return NAV.pilha.length ? NAV.pilha[NAV.pilha.length - 1].seq : NAV.base; }
function empilhar(c) {
  c.seq = ++NAV.seq;
  NAV.pilha.push(c);
  if (NAV.hist) { try { history.pushState({ rdo: c.seq }, '', hashAtual()); } catch (e) { NAV.hist = false; } }
  atualizarVoltar();
}
function aoPopState(e) {
  const s = e.state && typeof e.state.rdo === 'number' ? e.state.rdo : NAV.base;
  const t = topoSeq();
  if (NAV.pilha.length && s < t) desempilharAte(s);
  else if (s !== t && !NAV.pend) { lerHash(); render(true, 'fade'); }
  if (NAV.pend) { const p = NAV.pend; NAV.pend = null; clearTimeout(p.t); aplicarNavegacao(p.novo, p.o); }
}
function desempilharAte(s) {
  const removidas = [];
  while (NAV.pilha.length && NAV.pilha[NAV.pilha.length - 1].seq > s) removidas.push(NAV.pilha.pop());
  const anima = removidas.length === 1;
  let restaurar = null;
  for (const c of removidas) {
    if (c.tipo === 'foco') Focus.fecharTopo(anima);
    else if (c.tipo === 'apr') sairApresentacao();
    else if (c.tipo === 'tela') restaurar = c.antes;
  }
  if (restaurar) aplicarEstado(restaurar);
  atualizarVoltar();
}
function voltar() {
  if (!NAV.pilha.length) { if (S.view !== 'painel') navegarPara({ view: 'painel' }); return; }
  if (NAV.hist) { try { history.back(); return; } catch (e) { NAV.hist = false; } }
  desempilharAte(NAV.pilha[NAV.pilha.length - 1].seq - 1);
}
function voltarN(n) {
  // volta n telas de uma vez (trilha de navegação)
  const telas = NAV.pilha.filter(c => c.tipo === 'tela');
  const alvo = telas[telas.length - n]; if (!alvo) return;
  const s = alvo.seq - 1;
  const k = NAV.pilha.filter(c => c.seq > s).length;
  if (NAV.hist) { try { history.go(-k); return; } catch (e) { NAV.hist = false; } }
  desempilharAte(s);
}
function estadoAtual() { const e = {}; CHAVES.forEach(k => (e[k] = S[k])); e.scroll = lerRolagem(); return e; }
function lerRolagem() { return celular() ? (window.scrollY || 0) : ($('#view') ? $('#view').scrollTop : 0); }
function rolarPara(y) { if (celular()) window.scrollTo(0, y); else { const v = $('#view'); if (v) v.scrollTop = y; } }
function aplicarEstado(e) {
  CHAVES.forEach(k => { if (k in e) S[k] = e[k]; });
  render(true, 'back');
  const y = e.scroll || 0;
  requestAnimationFrame(() => { rolarPara(y); requestAnimationFrame(() => rolarPara(y)); });
}
function rotuloEstado(e) {
  const v = VIEWS[e.view] ? VIEWS[e.view].t : 'Tela';
  if (e.view === 'itens' && RDO.ITEM[e.item]) return `${v} · ${RDO.ITEM[e.item].n}`;
  const f = e.foco && RDO.ITEM[e.foco] ? ` · ${RDO.ITEM[e.foco].n}` : '';
  if (e.view === 'painel' && e.per === 'dia' && e.ref) return `${v} · ${RDO.dm(e.ref)}${f}`;
  return v + f;
}
// Troca de tela: fecha janelas abertas por cima, guarda a tela atual na pilha e desenha a nova.
function navegarPara(novo, o = {}) {
  Tip.hide(true);
  const cima = [];
  for (let k = NAV.pilha.length - 1; k >= 0 && NAV.pilha[k].tipo !== 'tela'; k--) cima.push(NAV.pilha[k]);
  if (cima.length) {
    const s = cima[cima.length - 1].seq - 1;
    if (NAV.hist) {
      NAV.pend = { novo, o, t: setTimeout(() => { if (NAV.pend) { const p = NAV.pend; NAV.pend = null; desempilharAte(s); aplicarNavegacao(p.novo, p.o); } }, 500) };
      try { history.go(-cima.length); return; } catch (e) { clearTimeout(NAV.pend.t); NAV.pend = null; NAV.hist = false; }
    }
    desempilharAte(s);
  }
  aplicarNavegacao(novo, o);
}
function aplicarNavegacao(novo, o = {}) {
  const antes = estadoAtual();
  Object.assign(S, novo);
  if (!VIEWS[S.view]) S.view = 'painel';
  const mudou = CHAVES.some(k => antes[k] !== S[k]);
  if (mudou) {
    empilhar({ tipo: 'tela', antes, rotulo: rotuloEstado(antes) });
    render(true, 'fwd');
  }
  if (o.ancora) setTimeout(() => abrirAncora(o.ancora), mudou ? 160 : 30);
}
function ir(o) {
  if (!o) return;
  const novo = {};
  if (o.view) novo.view = o.view;
  if (o.item) novo.item = o.item;
  navegarPara(novo, { ancora: o.ancora });
}
function voltarHTML() {
  const telas = NAV.pilha.filter(c => c.tipo === 'tela');
  if (telas.length) {
    const ult = telas[telas.length - 1];
    return `<button class="btn-voltar" data-act="voltar" title="Voltar para ${esc(ult.rotulo)} (tecla Alt + ←)">${ic('esq')}<span class="bv-t"><b>Voltar</b><small>${esc(ult.rotulo)}</small></span></button>`;
  }
  if (S.view !== 'painel') return `<button class="btn-voltar casa" data-act="casa" title="Ir para a visão geral">${ic('casa')}<span class="bv-t"><b>Início</b><small>Visão geral</small></span></button>`;
  return '';
}
function trilhaHTML(sub) {
  const telas = NAV.pilha.filter(c => c.tipo === 'tela');
  if (!telas.length) return `<span>${esc(sub)}</span>`;
  const ult = telas.slice(-3);

}
function atualizarVoltar() {

/* ============================================================
   JANELAS EXPANDIDAS (o cartão "cresce" até virar uma janela)
   ============================================================ */
const Focus = (() => {
  const pilha = [];
  const texto = s => stripTags(s).replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  function retangulo(el) {
    if (!el || !el.isConnected) return null;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height || r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) return null;
    return r;
  }
  function abrir(o) {
    Tip.hide(true);
    const root = $('#focos');
    const lay = document.createElement('div');
    lay.className = 'foco';
    const tit = texto(o.titulo || '');
    lay.innerHTML = `<div class="foco-bg" data-act="voltar" aria-hidden="true"></div>
      <div class="foco-win tam-${o.tam || 'g'} ${o.cls || ''}" role="dialog" aria-modal="true" aria-label="${esc(tit)}">
        <div class="foco-bar"><button class="foco-voltar" data-act="voltar" title="Voltar (Esc)">${ic('esq')}<span>Voltar</span></button>
          <div class="foco-tit"><b>${esc(tit)}</b>${o.sub ? `<small>${esc(texto(o.sub))}</small>` : ''}</div>
          <button class="foco-x" data-act="voltar" aria-label="Fechar" title="Fechar (Esc)">${ic('x')}</button></div>
        <div class="foco-b"><div class="foco-in">${o.html}</div></div>
      </div>`;
    root.appendChild(lay);
    const win = lay.querySelector('.foco-win'), inn = lay.querySelector('.foco-in');
    const f = { lay, win, inn, origem: o.origem || null, aoAbrir: o.aoAbrir };
    ajustar(f);
    pilha.push(f);
    document.body.classList.add('com-foco');
    empilhar({ tipo: 'foco' });
    requestAnimationFrame(() => lay.classList.add('on'));
    const r1 = !reduzMov() && retangulo(f.origem);
    let feito = false;
    const fim = () => { if (feito) return; feito = true; win.classList.remove('voando'); win.style.transition = ''; win.style.transform = ''; win.style.transformOrigin = ''; preparar(f); };
    if (r1) {
      const r2 = win.getBoundingClientRect();
      win.style.transformOrigin = '0 0';
      win.style.transform = `translate(${r1.left - r2.left}px, ${r1.top - r2.top}px) scale(${r1.width / r2.width}, ${r1.height / r2.height})`;
      win.classList.add('voando');
      f.origem.classList.add('foco-origem');
      win.getBoundingClientRect();
      requestAnimationFrame(() => requestAnimationFrame(() => { win.style.transition = 'transform .55s cubic-bezier(.2,.9,.25,1)'; win.style.transform = 'none'; }));
      win.addEventListener('transitionend', ev => { if (ev.target === win && ev.propertyName === 'transform') fim(); });
      setTimeout(fim, 700);
    } else { if (!reduzMov()) win.classList.add('pop'); setTimeout(fim, reduzMov() ? 0 : 300); }
    setTimeout(() => { const b = win.querySelector('.foco-voltar'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { } }, 90);
  }
  // Ajusta a janela à tela: mede a altura disponível e distribui a sobra (ou a falta)
  // entre os gráficos, para o conteúdo caber sem rolagem e sem gráfico minúsculo em tela grande.
  function ajustar(f) {
    const { win, inn } = f;
    const bar = win.querySelector('.foco-bar');
    const cs = getComputedStyle(win);
    const maxH = parseFloat(cs.maxHeight) || innerHeight;
    const bordas = (parseFloat(cs.borderTopWidth) || 0) + (parseFloat(cs.borderBottomWidth) || 0);
    const disp = Math.max(200, Math.floor(maxH - bordas - (bar ? bar.offsetHeight : 0)));
    win.style.setProperty('--disp', disp + 'px');
    const charts = [...inn.querySelectorAll('.chart[data-chart]')].filter(c => c.offsetParent !== null);
    if (!charts.length) return;
    charts.forEach(c => { if (!c.dataset.h0) c.dataset.h0 = Math.round(parseFloat(c.style.height) || c.offsetHeight || 220); c.style.height = c.dataset.h0 + 'px'; });
    const lim = c => { const h0 = +c.dataset.h0; return [Math.max(170, Math.round(h0 * .72)), Math.max(h0, Math.round(Math.min(h0 * 2.8, disp * .78)))]; };
    for (let passo = 0; passo < 5; passo++) {
      const sobra = disp - inn.offsetHeight;
      if (Math.abs(sobra) < 10) break;
      const podem = charts.filter(c => { const [mn, mx] = lim(c); return sobra > 0 ? c.offsetHeight < mx - 1 : c.offsetHeight > mn + 1; });
      if (!podem.length) break;
      if (sobra < 0 && -sobra > podem.reduce((t, c) => t + c.offsetHeight - lim(c)[0], 0)) break; // não cabe nem encolhendo: deixa rolar
      const d = sobra / podem.length;
      podem.forEach(c => { const [mn, mx] = lim(c); c.style.height = Math.round(Math.max(mn, Math.min(mx, c.offsetHeight + d))) + 'px'; });
    }
  }
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const f = pilha[pilha.length - 1]; if (f && f.lay.isConnected) ajustar(f); }, 160); });
  function preparar(f) {
    if (!f.lay.isConnected) return;
    f.inn.classList.add('pronto');
    f.inn.querySelectorAll('.reveal, [data-strip]').forEach(e => e.classList.add('in'));
    Charts.mountAll(f.inn);
    contar(f.inn);
    posThumbs(f.inn);
    if (f.aoAbrir) f.aoAbrir(f.win);
  }
  function fecharTopo(anim = true) {
    const f = pilha.pop(); if (!f) return;
    Tip.hide(true);
    const { lay, win } = f;
    if (!pilha.length) document.body.classList.remove('com-foco');
    lay.classList.add('saindo');
    const remover = () => { lay.remove(); if (f.origem) f.origem.classList.remove('foco-origem'); };
    const r1 = anim && !reduzMov() && retangulo(f.origem);
    if (r1) {
      const r2 = win.getBoundingClientRect();
      win.classList.add('voando');
      win.style.transformOrigin = '0 0';
      win.style.transition = 'transform .44s cubic-bezier(.65,0,.35,1)';
      win.style.transform = `translate(${r1.left - r2.left}px, ${r1.top - r2.top}px) scale(${r1.width / r2.width}, ${r1.height / r2.height})`;
      setTimeout(remover, 450);
    } else if (anim && !reduzMov()) { win.classList.remove('pop'); win.classList.add('pop-out'); setTimeout(remover, 270); }
    else remover();
    if (f.origem && f.origem.isConnected) setTimeout(() => { try { f.origem.focus({ preventScroll: true }); } catch (e) { } }, 60);
  }
  function fecharTodos() { while (pilha.length) fecharTopo(false); }
  return { abrir, fecharTopo, fecharTodos, n: () => pilha.length, ajustarTopo: () => { const f = pilha[pilha.length - 1]; if (f) ajustar(f); } };
})();

/* ---------------- RENDER ---------------- */
let REV = null;
function revelar(root) {
  const alvos = $$('.reveal, [data-strip]', root);
  if (reduzMov() || !('IntersectionObserver' in window)) { alvos.forEach(e => e.classList.add('in')); contar(root); return; }
  if (!REV) REV = new IntersectionObserver(ents => {
    let k = 0;
    for (const e of ents) if (e.isIntersecting) {
      const t = e.target;
      if (t.classList.contains('reveal')) t.style.animationDelay = Math.min(k++ * 55, 450) + 'ms';
      t.classList.add('in'); REV.unobserve(t); contar(t);
    }
  }, { rootMargin: '0px 0px -4% 0px', threshold: 0.04 });
  alvos.forEach(e => REV.observe(e));
}
function contar(root) {
  $$('[data-count]', root).forEach(el => {
    if (el._contou) return; el._contou = true;
    const fim = parseFloat(el.dataset.count), dec = +el.dataset.dec || 0;
    if (!isFinite(fim) || reduzMov()) return;
    const t0 = performance.now(), dur = 1000;
    const fmt = v => el.dataset.sinal ? SN(v, dec) : N(v, dec);
    const passo = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(fim * e); if (k < 1) requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  });
}
function render(anim = true, dir = 'fwd') {
  Tip.hide(true);
  if (!VIEWS[S.view]) S.view = 'painel';
  const v = VIEWS[S.view];
  renderNav(); renderToolbar(); renderFiltros(); renderDemoFaixa();
  let html;
  try { html = v.r(); } catch (e) { console.error(e); html = pane('Algo deu errado nesta tela', '', `<p class="c-ruim">${esc(e.message)}</p><p class="p-sm">Tente outra data ou recarregue a página. Se continuar, a base pode ter um lançamento com formato estranho (veja em Base de dados).</p>`); }
  const el = $('#view');
  el.innerHTML = `<div class="view-in ${v.larga ? 'larga' : ''} ${anim && !reduzMov() ? dir : ''}">${html}</div>`;
  if (anim) { el.scrollTop = 0; if (celular()) window.scrollTo(0, 0); }
  Charts.mountAll(el);
  revelar(el);
  requestAnimationFrame(() => posThumbs(el));
  salvarUI(); atualizarHash();
}
function atualizarHash() {
  try { history.replaceState(history.state, '', hashAtual()); } catch (e) { }
}
function lerHash() {
  const h = (location.hash || '').replace(/^#/, '').split('/');
  if (h[0] && VIEWS[h[0]]) S.view = h[0];
  if (h[1] && ['dia', 'semana', 'mes', 'ano', 'perso'].includes(h[1])) S.per = h[1] === 'perso' ? 'dia' : h[1];
  if (h[2] && /^\d{4}-\d{2}-\d{2}$/.test(h[2])) S.ref = h[2];
  if (h[3] && ['T1', 'T2', 'todos'].includes(h[3])) S.turno = h[3];
  if (h[0]) S.foco = h[4] && RDO.ITEM[h[4]] ? h[4] : null;
}

/* ---------------- NAVEGAÇÃO DE DATAS ---------------- */
function navegar(dir) {
  const v = VIEWS[S.view];
  const per = v.per === 'semana' ? 'semana' : v.per === 'mes' ? 'dia' : S.per;
  if (per === 'dia') {
    const ds = datasComDados(S.turno);
    const alvo = dir < 0 ? ds.filter(x => x < S.ref).pop() : ds.find(x => x > S.ref);
    if (alvo) S.ref = alvo; else return toast(dir < 0 ? 'Não há lançamento anterior.' : 'Este é o último lançamento.');
  } else if (per === 'semana') S.ref = RDO.addDays(RDO.inicioSemana(S.ref), dir * 7 + 6);
  else if (per === 'mes') { const d = RDO.parseISO(S.ref); d.setDate(1); d.setMonth(d.getMonth() + dir); S.ref = RDO.toISO(new Date(d.getFullYear(), d.getMonth() + 1, 0, 12)); }
  else if (per === 'ano') S.ref = `${+S.ref.slice(0, 4) + dir}-12-31`;
  else if (per === 'perso') { const n = Math.round((RDO.parseISO(S.ate) - RDO.parseISO(S.de)) / 864e5) + 1; S.de = RDO.addDays(S.de, dir * n); S.ate = RDO.addDays(S.ate, dir * n); S.ref = S.ate; }
  if (per !== 'dia') { const p = periodo(per === 'perso' ? 'perso' : per); const ds = datasComDados(S.turno).filter(x => x >= p.de && x <= p.ate); if (ds.length) S.ref = ds[ds.length - 1]; }
  render(true, dir < 0 ? 'back' : 'fwd');
}
function abrirPeriodo() {
  const de = S.de || RDO.addDays(S.ref, -6), ate = S.ate || S.ref;
  sheet('Escolher período', `<div class="row"><div class="field"><label>De</label><input type="date" class="inp" id="p-de" value="${de}"></div><div class="field"><label>Até</label><input type="date" class="inp" id="p-ate" value="${ate}"></div></div>
    <div class="pick" style="margin-bottom:18px">${[[7, 'Últimos 7 dias'], [15, 'Últimos 15 dias'], [30, 'Últimos 30 dias'], [90, 'Últimos 90 dias']].map(([n, t]) => `<button data-act="p-rapido" data-n="${n}">${t}</button>`).join('')}</div>
    <button class="btn tinta grande" data-act="p-ok">${ic('check')}Aplicar</button>`);
}

/* ---------------- DADOS: sincronizar, publicar ---------------- */
let sincronizando = false;
async function sincronizar(manual) {
  if (S.demo) { if (manual) toast('Modo demonstração ligado. Desligue para ver os dados reais.'); return; }
  if (sincronizando) return; sincronizando = true;
  const b = $('#btn-sync'); if (b) b.classList.add('gira');
  const assinatura = () => S.regs.length + '|' + (S.regs.length ? S.regs[S.regs.length - 1].id : '') + '|' + JSON.stringify(S.regs.slice(-1)[0] && S.regs.slice(-1)[0].v || {}).length;
  const antes = assinatura();
  const ultimaAntes = datasComDados().slice(-1)[0];
  try {
    const r = await GH.carregar();
    if (r) {
      S.remoto = r.registros; S.remotoDesc = r.descartes || [];
      S.fonte = { tipo: 'github', via: r.via, quando: new Date(), atualizadoEm: r.atualizadoEm };
      store.set('cacheRemoto', { registros: r.registros, descartes: S.remotoDesc, quando: Date.now(), via: r.via });
      if (manual) toast(`Base atualizada: ${r.registros.length} lançamento(s).`);
    } else if (manual) toast('Configure o GitHub em Ajustes para buscar a base.');
  } catch (e) {
    S.fonte = Object.assign({}, S.fonte, { erro: e.message });
    if (manual) toast(e.message, 4200);
  } finally {
    sincronizando = false;
    const b2 = $('#btn-sync'); if (b2) b2.classList.remove('gira');
  }
  const refAntes = S.ref;
  montarRegs();
  const ultima = datasComDados().slice(-1)[0];
  if (ultimaAntes && refAntes === ultimaAntes && ultima && ultima > ultimaAntes) S.ref = ultima;
  if (assinatura() !== antes || manual) render(false); else renderFonte();
}
function addPendente(r, por) {
  const c = RDO.canonico(Object.assign({}, r, { lancadoPor: r.lancadoPor || por, lancadoEm: r.lancadoEm || agoraISO() }));
  S.pendentes = S.pendentes.filter(x => x.id !== c.id).concat(c).sort((x, y) => (x.data + x.turno).localeCompare(y.data + y.turno));
}
async function processarArquivos(files) {
  S.lancErro = null;
  const lst = [...files].filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  if (!lst.length) { S.lancErro = 'Escolha um arquivo PDF do RDO.'; return S.view === 'lancar' ? render(false) : navegarPara({ view: 'lancar' }); }
  toast(`Lendo ${lst.length > 1 ? lst.length + ' PDFs' : 'o PDF'}…`, 6000);
  const erros = [];
  for (const f of lst) {
    try {
      const res = await lerPDF(f);
      if (!res.registros.length) throw new Error(`${f.name}: não achei nenhum dia com produção (frangos e peso).`);
      if (!res.turno) erros.push(`${f.name}: não achei o turno no cabeçalho — confira antes de publicar.`);
      res.registros.forEach(r => addPendente(r, 'leitor de PDF do sistema'));
    } catch (e) { erros.push(e.message); }
  }
  S.lancErro = erros.join(' ') || null;
  toast(S.pendentes.length ? `${S.pendentes.length} lançamento(s) pronto(s) para conferir.` : 'Nada lido.');
  if (S.view === 'lancar') render(false); else navegarPara({ view: 'lancar' });
}
async function publicarPendentes() {
  if (!S.pendentes.length) return;
  const btn = $('[data-act="publicar"]'); if (btn) { btn.disabled = true; btn.innerHTML = `${ic('refresh', 'gira')}Publicando…`; }
  const ids = S.pendentes.map(r => r.id);
  const msg = `RDO ${[...new Set(S.pendentes.map(r => RDO.dm(r.data) + ' ' + r.turno))].join(', ')} (lançado pelo painel)`;
  try {
    const base = await GH.publicar(S.pendentes, msg);
    salvarLocais(locais().filter(r => !ids.includes(r.id)));
    S.remoto = base.registros; S.remotoDesc = base.descartes || []; S.fonte = { tipo: 'github', via: 'GitHub (API)', quando: new Date() };
    store.set('cacheRemoto', { registros: base.registros, descartes: S.remotoDesc, quando: Date.now(), via: 'GitHub (API)' });
    const ultimo = S.pendentes[S.pendentes.length - 1];
    S.pendentes = []; S.lancErro = null;
    montarRegs();
    toast('Publicado no GitHub. Quem abrir o link já vê.', 3600);
    navegarPara({ ref: ultimo.data, per: 'dia', view: 'painel' });
  } catch (e) { S.lancErro = e.message; render(false); }
}

/* ============================================================
   MODO APRESENTAÇÃO

let PR = null;
const AUTO_MS = 12000;
function montarSlides() {
  if (focoAtivo()) return montarSlidesItem(S.foco);
  const p = periodo(), regs = regsPeriodo(p);
  if (!regs.length) return [];
  const a = agg(regs); S._a = a;
  const its = RDO.analisarItens(a, CFG);
  const an = its.filter(i => i.analisa && i.tem && isNum(i.gapKg));
  const ok = an.filter(i => i.fechou), nok = an.filter(i => !i.fechou);
  const saldo = an.reduce((s, i) => s + i.gapKg, 0);
  const tom = nok.length === 0 ? 'ok' : saldo >= 0 ? 'quase' : 'ruim';
  const tR = turnoRot(S.turno, regs);
  const V = a.val, M = a.meta;
  const sl = [];
  /* capa */
  const frase = !an.length ? 'Sem itens com meta neste período.' : nok.length ? `Abaixo da meta: <b>${esc(nok.slice().sort((x, y) => x.gapKg - y.gapKg).map(i => i.n).join(', '))}</b>.` : 'Todos os itens ficaram acima da meta.';
  sl.push({ capa: true, kick: 'Abertura', titulo: p.rot, html: `<div class="capa-grid s-anim">
      <div><div class="capa-k"><span>RDO · Rondon</span>${esc(tR)}</div>
        <h2 class="capa-t">${esc(p.rot)}</h2>
        <p class="capa-ver"><b>${ok.length} de ${an.length} itens</b> fecharam a meta. ${frase}</p>
        <div style="margin-top:3.4vh"><span class="carimbo ${tom}">${nok.length === 0 ? 'Tudo fechado' : saldo >= 0 ? 'Saldo positivo' : 'Saldo negativo'}</span></div></div>
      <div class="capa-stats">
        <div class="capa-stat"><div class="v"><span data-count="${V.R}" data-dec="0">${N(V.R)}</span></div><div class="l">frangos abatidos · ${P(V.P, 1)} do plano</div></div>
        <div class="capa-stat"><div class="v"><span data-count="${V.S}" data-dec="0">${N(V.S)}</span> <small style="font-size:.45em">kg</small></div><div class="l">peso vivo · ${N(V.U, 3)} kg por frango</div></div>
        <div class="capa-stat"><div class="v c-${saldo >= 0 ? 'ok' : 'ruim'}"><span data-count="${saldo}" data-dec="0" data-sinal="1">${SN(saldo)}</span> <small style="font-size:.45em">kg</small></div><div class="l">saldo somado dos itens · ≈ ${SN(Math.round(an.reduce((s, i) => s + i.gapKg / i.pesoCx, 0)))} cx</div></div>
      </div></div>` });
  /* para onde foi */
  const ex = its.find(i => i.c === 'BE') || its[0];
  sl.push({ kick: 'Para onde foi o frango', titulo: 'De cada 100 kg de frango vivo…', corpo: `<div class="s-card">${stripHTML(a, its).replace(/<div class="strip-h">[\s\S]*?<\/div>/, '')}</div>`,
    nota: `Cada pedaço da barra é quanto de 100 kg de frango vivo virou aquele item. Exemplo: ${esc(ex.n.toLowerCase())} rendeu ${P(ex.real, 3)}, ou seja, ${N(ex.real, 1)} kg a cada 100 kg. A marca preta dentro do pedaço é a meta. A parte listrada é a quebra (sangue, penas, vísceras). Toque num pedaço para abrir.` });
  /* itens */
  if (an.length) {
    const pior = nok.slice().sort((x, y) => x.gapKg - y.gapKg)[0] || ok[0];
    sl.push({ kick: 'Itens', titulo: nok.length ? `${ok.length} fecharam, ${nok.length} não fecharam` : 'Todos os itens fecharam', corpo: `<div class="s-card">${hbarsKg(its)}</div>`,
      nota: `Saldo em kg = (rendimento realizado − meta) × peso vivo abatido. Caixas = kg ÷ peso da caixa (20 kg; pés 16 kg). Exemplo, ${esc(pior.n.toLowerCase())}: (${P(pior.real, 3)} − ${P(pior.meta, 3)}) × ${N(V.S)} kg = <b>${KG(pior.gapKg)}</b>${pior.cx != null ? ` = <b>${SN(pior.cx)} caixas</b>` : ''}. Toque num item para abrir a ficha.` });
  }
  /* ponte */
  const pt = RDO.ponte(a);
  if (pt) sl.push({ kick: 'Rendimento de cortes', titulo: `${V.BA >= M.BA ? 'Fechou' : 'Não fechou'}: ${P(V.BA, 3)} contra ${P(M.BA, 3)}`, corpo: `<div class="s-card">${Charts.slot({ type: 'ponte', ponte: pt }, (pt.passos.length + 2) * 27 + 12)}</div>`,
    nota: `A barra cinza é a meta (soma das metas de todos os itens). Cada item soma (verde) ou tira (vermelho) a diferença dele. A última barra é o realizado. Cada 0,1 ponto percentual aqui vale <b>${N(V.S * 0.001)} kg</b>.` });

    tr.innerHTML = `<td colspan="11"><div class="det-in"><div style="display:flex;justify-content:flex-end;margin-bottom:6px"><button class="btn-amp" data-act="rdo-amp" data-c="${el.dataset.c}" data-tab="${el.dataset.tab || ''}">${ic('ampliar')}<span>Abrir em tela grande</span></button></div>${rdoDetalhe(el.dataset.c, el.dataset.tab || null)}</div></td>`;
    el.after(tr); el.classList.add('aberta'); Charts.mountAll(tr);
  },
  'rdo-amp': el => { const c = el.dataset.c, tab = el.dataset.tab || null; Focus.abrir({ titulo: nomeCod(c, tab), sub: 'RDO vivo · ' + subTitulo(), html: rdoDetalhe(c, tab), origem: el.closest('tr.det') || el, tam: 'g' }); },
  item: el => { S.item = el.dataset.item; if (S.foco) { S.foco = S.item; S.tendInd = S.item; } render(true, 'fade'); },
  'prev-item': el => { S.item = el.dataset.item; if (S.foco) S.foco = S.item; render(false); setTimeout(() => { const c = $$('.chart').pop(); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60); },
  cmp: el => { S.cmp = el.dataset.k; render(true, 'fade'); },
  cmpB: el => { S.cmpB = el.dataset.k; render(false); },
  rel: el => { S.relX = el.dataset.x; S.relY = el.dataset.y; render(false); },
  itcmp: el => { const c = el.dataset.item; if (S.itensCmp.includes(c)) S.itensCmp = S.itensCmp.filter(x => x !== c); else { S.itensCmp.push(c); if (S.itensCmp.length > 4) S.itensCmp.shift(); } if (!S.itensCmp.length) S.itensCmp = [c]; render(false); },
  tgran: el => { S.tendGran = el.dataset.k; render(false); },
  'perdas-aba': el => { S.perdasAba = el.dataset.k; render(false); },
  whats: el => abrirWhats(el),
  'copiar-whats': async () => { toast(await copiar(S._whats || '') ? 'Copiado. É só colar no WhatsApp.' : 'Não consegui copiar; selecione o texto.'); },
  apresentar: () => apresentar(),
  'pr-ant': () => PR && irSlide(PR.k - 1), 'pr-prox': () => PR && irSlide(PR.k + 1),
  'pr-ir': el => { if (!PR) return; alternarGrade(false); irSlide(+el.dataset.k); },
  'pr-grade': () => alternarGrade(),
  'pr-auto': () => alternarAuto(),
  'pr-laser': () => alternarLaser(),
  'pr-cheia': () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { toast('Este aparelho não permite tela cheia.'); } },
  sync: () => sincronizar(true),
  'tema-ciclo': () => { const o = ['auto', 'light', 'dark']; const t = o[(o.indexOf(temaAtual()) + 1) % 3]; aplicarTema(t); toast(t === 'auto' ? 'Tema automático (segue o aparelho)' : t === 'light' ? 'Tema claro (papel)' : 'Tema escuro (noite)'); renderToolbar(); requestAnimationFrame(() => Charts.redrawAll()); },
  tema: el => { aplicarTema(el.dataset.k); render(false); },
  side: () => { $('#app').classList.toggle('sem-side'); setTimeout(() => Charts.redrawAll(), 420); },
  mais: el => sheet('Mais opções', `<div class="leit">${Object.keys(VIEWS).filter(v => !TABS.includes(v)).map(v => `<button class="leit-i info" data-act="view" data-v="${v}"><span class="lic">${ic(VIEWS[v].ic)}</span><span><span class="lt-t">${VIEWS[v].t}</span></span><span class="go">${ic('dir')}</span></button>`).join('')}
    <button class="leit-i ok" data-act="whats"><span class="lic">${ic('whats')}</span><span><span class="lt-t">Resumo para WhatsApp</span><span class="lt-p">Texto pronto do período escolhido.</span></span><span class="go">${ic('dir')}</span></button>
    <button class="leit-i" data-act="tema-ciclo"><span class="lic">${ic('lua')}</span><span><span class="lt-t">Trocar tema</span><span class="lt-p">Automático, claro (papel) ou escuro (noite).</span></span><span class="go">${ic('dir')}</span></button></div>`, { origem: el }),
  'fechar-sheet': () => fecharSheet(),
  'tip-fechar': () => Tip.hide(true),
  acc: el => { S.acc = el.dataset.k; render(false); },
  colar: () => { S.lancErro = null; try { lerJSONColado($('#colar').value).forEach(r => addPendente(r, 'IA (colado)')); toast('Pronto para conferir.'); } catch (e) { S.lancErro = 'O texto colado não é um JSON válido de lançamento. ' + e.message; } render(false); },
  'pend-rem': el => { S.pendentes.splice(+el.dataset.k, 1); render(false); },
  publicar: () => publicarPendentes(),
  'salvar-local': () => { salvarLocais(RDO.upsert(locais(), S.pendentes)); const u = S.pendentes[S.pendentes.length - 1]; S.pendentes = []; montarRegs(); toast('Salvo neste aparelho. Publique depois em Base de dados.'); navegarPara({ ref: u.data, per: 'dia', view: 'painel' }); },
  'baixar-base-pend': () => { const base = { sistema: 'RDO Rondon', atualizadoEm: new Date().toISOString(), registros: RDO.upsert(S.regs.filter(r => !r.demo), S.pendentes), descartes: descParaBase() }; baixar('rdo-base.json', RDO.serializar(base)); toast('Arquivo baixado. Suba no GitHub em dados/rdo-base.json.'); },
  'baixar-base': () => { baixar('rdo-base.json', RDO.serializar({ sistema: 'RDO Rondon', atualizadoEm: new Date().toISOString(), registros: S.regs.filter(r => !r.demo || S.demo), descartes: S.demo ? [] : descParaBase() })); },
  'baixar-csv': () => baixar('rdo-base.csv', '﻿' + csv(S.regs), 'text/csv;charset=utf-8'),
  'publicar-locais': async () => {
    const dl = descLocais();
    if (dl.length) {
      const lapides = dl.filter(d => !(+d.qtd > 0)).map(d => d.id), vivos = dl.filter(d => +d.qtd > 0);
      try { const b = await GH.gravar(null, `Descartes lançados no aparelho (${vivos.length}${lapides.length ? `, ${lapides.length} removido(s)` : ''})`, lst => RDO.upsertDesc(lst.filter(d => !lapides.includes(d.id)), vivos)); S.remoto = b.registros; S.remotoDesc = b.descartes || []; salvarDescLocais([]); }
      catch (e) { return toast(e.message, 4200); }
    }
    if (locais().length) { S.pendentes = locais(); await publicarPendentes(); } else { montarRegs(); render(false); toast('Publicado no GitHub.'); }
  },
  'ir-form-desc': () => { if (S.view === 'lancar') { const f = document.getElementById('form-desc'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' }); } else navegarPara({ view: 'lancar' }, { ancora: 'form-desc' }); },
  'desc-add': async () => {
    const f = lerFormDesc();
    if (!(f.qtd > 0)) return toast('Informe a quantidade.');
    if (f.data > RDO.toISO(new Date())) return toast('A data está no futuro.');
    const novo = Object.assign({ id: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), lancadoPor: 'painel', lancadoEm: agoraISO() }, f);
    const gh = ghCfg();
    if (gh.token && gh.owner && gh.repo && !S.demo) {
      try { const b = await GH.publicarDesc([novo], `Descarte ${RDO.dm(f.data)} ${f.turno}: ${f.qtd} ${f.un === 'carcacas' ? 'carcaças' : 'kg'} (${RDO.nomeAlvo(f.alvo)})`); S.remoto = b.registros; S.remotoDesc = b.descartes || []; toast('Descarte publicado no GitHub.'); }
      catch (e) { salvarDescLocais(RDO.upsertDesc(descLocais(), [novo])); toast('Não consegui publicar (' + e.message + '). Ficou salvo neste aparelho.', 4200); }
    } else { salvarDescLocais(RDO.upsertDesc(descLocais(), [novo])); toast(S.demo ? 'Salvo neste aparelho (modo demonstração).' : 'Descarte salvo neste aparelho. Publique depois em Base de dados.'); }
    montarRegs(); render(false);
    setTimeout(() => { const el = document.getElementById('form-desc'); if (el) el.scrollIntoView({ block: 'start' }); }, 60);
  },
  'desc-del': async el => {
    const id = el.dataset.id; const d = (S.desc || []).find(x => x.id === id); if (!d) return;
    if (d._local) { salvarDescLocais(descLocais().filter(x => x.id !== id)); montarRegs(); render(false); return toast('Descarte removido deste aparelho.'); }
    if (!ghCfg().token) return toast('Para excluir da base do GitHub, cole o token em Ajustes.', 3600);
    if (!confirm(`Excluir o descarte de ${RDO.diaCurto(d.data)} ${d.turno} (${qtdDesc(d)} de ${RDO.nomeAlvo(d.alvo)})?`)) return;
    try { const b = await GH.excluirDesc([id], `Remove descarte ${d.data} ${d.turno} (pelo painel)`); S.remoto = b.registros; S.remotoDesc = b.descartes || []; montarRegs(); render(false); toast('Descarte excluído.'); } catch (e) { toast(e.message, 4000); }
  },
  'ver-json': el => { const r = S.regs.find(x => x.id === el.dataset.id); if (r) sheet(`${RDO.diaCurto(r.data)} · ${r.turno}`, `<pre class="cupom" style="font-size:11.5px;white-space:pre-wrap;margin:0">${esc(JSON.stringify(RDO.canonico(r), null, 2))}</pre>`, { origem: el, tam: 'm' }); },
  excluir: async el => {
    const id = el.dataset.id; const r = S.regs.find(x => x.id === id); if (!r) return;
    if (r._local) { salvarLocais(locais().filter(x => x.id !== id)); montarRegs(); render(false); return toast('Removido deste aparelho.'); }
    if (!ghCfg().token) return toast('Para excluir da base do GitHub, cole o token em Ajustes.', 3600);
    if (!confirm(`Excluir ${RDO.diaCurto(r.data)} ${r.turno} da base no GitHub?`)) return;
    try { const base = await GH.excluir([id], `Remove RDO ${r.data} ${r.turno} (pelo painel)`); S.remoto = base.registros; S.remotoDesc = base.descartes || []; montarRegs(); render(false); toast('Excluído da base.'); } catch (e) { toast(e.message, 4000); }
  },
  'gh-salvar': () => { store.set('gh', { owner: $('#gh-owner').value.trim(), repo: $('#gh-repo').value.trim(), branch: $('#gh-branch').value.trim() || 'main', path: $('#gh-path').value.trim() || 'dados/rdo-base.json', token: $('#gh-token').value.trim() }); toast('Conexão salva neste aparelho.'); sincronizar(true); },
  'gh-testar': async () => { ACT['gh-salvar'](); const box = $('#gh-res'); box.innerHTML = 'Testando…'; try { const r = await GH.testar(); box.innerHTML = r.map(x => `<div class="c-ok">✓ ${esc(x)}</div>`).join(''); } catch (e) { box.innerHTML = `<div class="c-ruim">✕ ${esc(e.message)}</div>`; } },
  'gh-sair': () => { const g = store.get('gh', {}); delete g.token; store.set('gh', g); toast('Token apagado deste aparelho.'); render(false); },
  'cfg-dia': el => { const k = +el.dataset.k; CFG.diasProducao = CFG.diasProducao.includes(k) ? CFG.diasProducao.filter(x => x !== k) : CFG.diasProducao.concat(k).sort(); salvarCfg(); render(false); },
  'limpar-local': () => { if (!confirm('Apagar lançamentos locais, preferências e a cópia salva da base deste aparelho? (A base no GitHub não é afetada.)')) return; ['locais', 'descLocais', 'cfg', 'ui', 'cacheRemoto', 'demo'].forEach(k => store.del(k)); location.reload(); },
  'demo-on': () => { S.demo = true; store.set('demo', true); montarRegs(); render(true, 'fade'); },
  'demo-off': () => { S.demo = false; store.set('demo', false); montarRegs(); render(true, 'fade'); sincronizar(false); }
};
const CHG = {
  'rdo-vazias': el => { S.semVazias = el.checked; render(false); },
  pdf: el => { if (el.files && el.files.length) processarArquivos(el.files); el.value = ''; },
  importar: async el => { const f = el.files && el.files[0]; if (!f) return; try { const regs = lerJSONColado(await f.text()); regs.forEach(r => addPendente(r, 'importado de arquivo')); toast(`${regs.length} lançamento(s) para conferir.`); navegarPara({ view: 'lancar' }); } catch (e) { toast('Arquivo inválido: ' + e.message, 4000); } el.value = ''; },
  calmo: el => { store.set('calmo', el.checked); document.documentElement.classList.toggle('calmo', el.checked); },
  demo: el => el.checked ? ACT['demo-on']() : ACT['demo-off'](),
  'cfg-an': el => { CFG.analisar[el.dataset.item] = el.checked; salvarCfg(); toast('Regra atualizada.'); },
  'cfg-plano': el => { CFG.planoCompartilhado = el.checked; salvarCfg(); },
  'cfg-cx': el => { const v = parseFloat(String(el.value).replace(',', '.')); if (v > 0) { CFG.caixas[el.dataset.item] = v; salvarCfg(); toast('Peso da caixa atualizado.'); } },
  'cfg-amarelo': el => { CFG.amarelo = +el.value; salvarCfg(); render(false); },
  'cfg-red': el => { CFG.fatorReducao = +el.value; salvarCfg(); },
  relX: el => { S.relX = el.value; render(false); }, relY: el => { S.relY = el.value; render(false); },
  tendInd: el => { S.tendInd = el.value; render(false); },
  cmpBde: el => { S.cmpBde = el.value; render(false); }, cmpBate: el => { S.cmpBate = el.value; render(false); },
  data: el => { if (!el.value) return; S.ref = el.value; if (S.per === 'perso') S.per = 'dia'; render(true, 'fade'); },
  'fdr-data': el => { if (el.value && S._fdr) fdrIr(el.value, S._fdr.turno); },
  'plan-desde': el => { if (!el.value) return; store.set('planDesde', el.value); if (PLAN.ult) { PLAN.ult.mod = null; planLer({ manual: true }); } },
  'plan-arq': async el => { const f = el.files && el.files[0]; el.value = ''; if (!f) return; try { await planProcessar(f, { manual: true }); } catch (e) { toast('Não consegui ler a planilha: ' + e.message, 4800); } }
};
// descartes que vão junto quando a base é baixada (os da nuvem + os deste aparelho, sem os apagados)
function descParaBase() {
  const base = S.remotoDesc ? S.remotoDesc : (typeof BASE_EMBUTIDA !== 'undefined' ? BASE_EMBUTIDA.descartes || [] : []);
  return RDO.upsertDesc(base, descLocais()).filter(d => +d.qtd > 0).map(d => { const c = Object.assign({}, d); delete c._local; return c; });
}
function csv(regs) {
  const cods = RDO.LINHAS.map(l => l.c);
  const itens = RDO.ITENS.filter(i => i.analisa);
  const head = ['data', 'turno', ...cods, ...itens.map(i => `saldo_kg_${i.c}`), 'mortalidade_und', 'interrupcoes_min', 'reducoes_min', 'paradas_prog_min'];
  const f = v => isNum(v) ? String(v).replace('.', ',') : (v == null ? '' : String(v));
  const lin = regs.map(r => { const a = agg([r]); const it = RDO.analisarItens(a, CFG); return [r.data, r.turno, ...cods.map(c => f(r.v[c])), ...itens.map(i => f(RDO.round((it.find(x => x.c === i.c) || {}).gapKg || 0, 1))), f(a.mort), f(a.intMin), f(a.redMin), f(a.ppMin)].join(';'); });
  return [head.join(';'), ...lin].join('\n');
}

/* ---------------- EVENTOS ---------------- */
function ligarEventos() {
  document.addEventListener('click', e => {
    if (e.target.matches && e.target.matches('input[type="date"]') && e.target.showPicker) { try { e.target.showPicker(); } catch (er) { } }
    if (e.target.closest('#tip')) { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) { e.preventDefault(); ACT[b.dataset.act](b, e); } return; }
    const el = e.target.closest('[data-act]');
    if (el && !['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName)) { const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); } return; }
    const po = e.target.closest('[data-portal]');
    if (po) { abrirPortal(po); return; }
    const inf = e.target.closest('[data-info],[data-seg],[data-pin]');
    if (inf) { Tip.hide(true); abrirFicha(inf); e.stopPropagation(); return; }
    if (!e.target.closest('.chart')) Tip.hide(true);
  });
  document.addEventListener('change', e => { if (e.target.id && e.target.id.startsWith('d-')) atualizarFormDesc(); const el = e.target.closest('[data-act]'); if (el && CHG[el.dataset.act]) CHG[el.dataset.act](el, e); });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.act === 'cfg-amarelo') { const o = $('#amarelo-v'); if (o) o.textContent = el.value + '%'; }
    if (el.dataset.act === 'cfg-red') { const o = $('#red-v'); if (o) o.textContent = el.value + '%'; }
    if (el.id && el.id.startsWith('d-')) atualizarFormDesc();
    if (el.dataset && el.dataset.fdr && S._fdr) { S._fdr.vals[el.dataset.fdr] = el.value; clearTimeout(ligarEventos._fp); ligarEventos._fp = setTimeout(fdrPrevia, 220); }
  });
  // dica rápida ao passar o mouse só nos pedaços da faixa (que podem ser estreitos demais para ter texto)
  document.addEventListener('pointerover', e => {
    if (e.pointerType === 'touch' || Tip.pinned()) return;
    const sg = e.target.closest('[data-seg]');
    if (sg && sg !== mostrarInfo._el) mostrarInfo(sg);
  });
  document.addEventListener('pointerout', e => {
    if (e.pointerType === 'touch') return;
    const sg = e.target.closest('[data-seg]');
    if (sg && !sg.contains(e.relatedTarget)) { mostrarInfo._el = null; Tip.hide(); }
  });
  document.addEventListener('dragover', e => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('sobre'); } });
  document.addEventListener('dragleave', e => { const d = e.target.closest('#drop'); if (d) d.classList.remove('sobre'); });
  document.addEventListener('drop', e => {
    const d = e.target.closest('#drop');
    if (!d && S.view !== 'lancar' && e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); processarArquivos(e.dataTransfer.files); return; }
    if (d) { e.preventDefault(); d.classList.remove('sobre'); processarArquivos(e.dataTransfer.files); }
  });
  window.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    const tag = (document.activeElement || {}).tagName;
    if (Focus.n()) { if (e.key === 'Escape') { e.preventDefault(); ACT.voltar(); } return; }
    if (PR) {
      const g = $('#pr-grade');
      if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); if (g && !g.hidden) alternarGrade(false); irSlide(PR.k + 1); }
      else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); irSlide(PR.k - 1); }
      else if (e.key === 'Escape') { e.preventDefault(); if (g && !g.hidden) alternarGrade(false); else voltar(); }
      else if (e.key === 'Home') irSlide(0); else if (e.key === 'End') irSlide(PR.n - 1);
      else if (/^[gG]$/.test(e.key)) alternarGrade();
      else if (/^[aA]$/.test(e.key)) alternarAuto();
      else if (/^[lL]$/.test(e.key)) alternarLaser();
      else if (/^[fF]$/.test(e.key)) ACT['pr-cheia']();
      return;
    }
    if (e.key === 'Escape') { Tip.hide(true); return; }
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag) || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === '/' && VIEWS[S.view].per) { e.preventDefault(); abrirBuscaItem(); return; }
    if (e.key === 'ArrowLeft' && VIEWS[S.view].per) navegar(-1);
    if (e.key === 'ArrowRight' && VIEWS[S.view].per) navegar(1);
  });
  window.addEventListener('resize', () => { clearTimeout(ligarEventos._r); ligarEventos._r = setTimeout(() => posThumbs(), 100); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.fonte.quando && Date.now() - new Date(S.fonte.quando) > 120000) sincronizar(false); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { aplicarTema(temaAtual()); Charts.redrawAll(); });
  document.addEventListener('scroll', () => Tip.seguir(), { passive: true, capture: true });
  window.addEventListener('resize', () => Tip.seguir());
}
function atualizarFormDesc() {
  const alvo = $('#d-alvo'), un = $('#d-un'), pv = $('#d-prev');
  if (!alvo || !un) return;
  const parte = alvo.value !== 'carcaca';
  un.options[0].disabled = parte;
  if (parte) un.value = 'kg';
  if (pv) pv.innerHTML = prevDescHTML();
}
function conteudoInfo(el) {
  if (el.dataset.pin) return PINS.get(el.dataset.pin) || '';
  return infoHTML(el.dataset.info || ('seg:' + el.dataset.seg), S._a);
}
function mostrarInfo(el) {
  mostrarInfo._el = el;
  const html = conteudoInfo(el);
  if (!html) return;
  const r = el.getBoundingClientRect();
  Tip.show(html + '<div class="tt-dica">Clique para abrir ▸</div>', r.left + Math.min(r.width / 2, 120), r.bottom - 4, { wide: true });
}

/* ---------------- INÍCIO ---------------- */
function iniciar() {
  aplicarTema(temaAtual());
  if (store.get('calmo', false)) document.documentElement.classList.add('calmo');
  const cache = store.get('cacheRemoto', null);
  if (cache && Array.isArray(cache.registros) && cache.registros.length) { S.remoto = cache.registros; S.remotoDesc = cache.descartes || []; S.fonte = { tipo: 'cache', quando: cache.quando, via: cache.via }; }
  lerHash();
  montarRegs();
  if (!S.regs.some(r => r.data === S.ref)) S.ref = datasComDados().slice(-1)[0] || S.ref;
  histInit();
  ligarEventos();
  render(true, 'fade');
  sincronizar(false).catch(() => { }).then(() => planAuto());
  setInterval(() => { if (document.visibilityState === 'visible') sincronizar(false); }, 4 * 60 * 1000);
  setInterval(() => { if (document.visibilityState === 'visible') planAuto(); }, 5 * 60 * 1000);
  if (/apresentar/.test(location.search)) setTimeout(apresentar, 600);
}
document.addEventListener('DOMContentLoaded', iniciar);

</script>
<script type="text/markdown" id="lei-lancamento-ia">
# LEI DE LANÇAMENTO DO RDO · RDO Rondon

> **Documento exclusivo da IA que lança o RDO.** Não aparece no painel e não é para o usuário ler.
> **Versão 3 · 21/10/2026.** Vale para todo lançamento, sempre, do começo ao fim.

---

## 0. Antes de tudo

**Você foi chamada para transformar o PDF do RDO em registros na base do sistema.** Leia esta LEI inteira antes de começar, mesmo que já tenha lançado antes: ela pode ter mudado (veja a versão acima).

**Onde esta LEI está** (as três cópias são iguais; se divergirem, vale a de versão mais nova):

1. `INSTRUCOES_IA.md`, na raiz do repositório;
2. dentro do `index.html`, no bloco `script` de id `lei-lancamento-ia` (o navegador não mostra esse bloco);
3. a base `dados/rdo-base.json` tem a chave `LEI_IA` apontando para cá.

**Princípio de ouro: você é transcritor, não analista.** Copie exatamente o que o PDF mostra, célula por célula. O painel faz todas as contas: rendimento, kg, caixas, impacto dos descartes, previsões, OEE. Um número inventado, arredondado ou "corrigido" estraga a análise de todo mundo sem ninguém perceber. Na dúvida entre copiar e deduzir, copie. Na dúvida sobre o que o PDF diz, pergunte ao usuário.

## 3. Anatomia do PDF

### 3.1 O arquivo

- Um PDF por turno: `RDORONDON dd.mm Nº Turno.pdf` (ex.: `RDORONDON 20.10 1º Turno.pdf`).
- É a planilha do RDO exportada em PDF. A planilha é **semanal e acumulada**: cada PDF traz as colunas da semana inteira (domingo a sábado), preenchidas até o dia do envio. O PDF de sábado traz a semana toda.
- **Página 1** = indicadores do turno (códigos N … BX).
- **Página 2** = paradas e não-qualidade (códigos PP, P, R, 1 … 5.2.3).
- Página 3 em diante: ignore. Se a ordem vier trocada, identifique pelo conteúdo: a página que tem `PP01` é a página 2.
