<style>
/* ============================================================
   RDO RONDON — visual estilo macOS, claro e escuro
   ============================================================ */
:root {
  color-scheme: light;
  --f-ui: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-disp: "Bricolage Grotesque", "Onest", -apple-system, system-ui, sans-serif;

  --desk: #DFE3EB;
  --desk-2: #E9ECF2;
  --win: #F5F6F9;
  --side: rgba(233, 236, 242, .82);
  --side-solid: #ECEEF3;
  --card: #FFFFFF;
  --sunk: #EEF0F4;
  --sunk-2: #E5E8EE;
  --hover: rgba(18, 24, 38, .045);
  --line: rgba(18, 24, 38, .08);
  --line-2: rgba(18, 24, 38, .14);
  --ink: #11141B;
  --ink-2: #4A5265;
  --ink-3: #7F879A;
  --ink-inv: #FFFFFF;

  --accent: #1F5FD6;
  --accent-2: #3D7BF0;
  --accent-soft: rgba(31, 95, 214, .10);
  --accent-ink: #1A4FB4;
  --accent-solid: #1F5FD6;

  --ok: #0E9F57;  --ok-ink: #077640;  --ok-soft: rgba(14, 159, 87, .12);
  --quase: #EFA100; --quase-ink: #8F5E00; --quase-soft: rgba(239, 161, 0, .16);
  --ruim: #E2443B; --ruim-ink: #B12A21; --ruim-soft: rgba(226, 68, 59, .11);
  --neutro: #8B93A6; --neutro-soft: rgba(139, 147, 166, .14);
  --prev: rgba(108, 85, 227, .16); --prev-ink: #5B45D6; --violet: #6C55E3;

  --t1: #2A78D6; --t2: #EB6834; --s3: #1BAF7A; --s4: #6250D6;

  --sh-1: 0 1px 2px rgba(17, 20, 27, .06), 0 0 0 1px rgba(17, 20, 27, .04);
  --sh-2: 0 1px 2px rgba(17, 20, 27, .05), 0 8px 24px -10px rgba(17, 20, 27, .18), 0 0 0 1px rgba(17, 20, 27, .04);
  --sh-win: 0 30px 80px -20px rgba(17, 30, 60, .35), 0 0 0 1px rgba(17, 20, 27, .10);
  --sh-pop: 0 18px 50px -12px rgba(17, 20, 27, .35), 0 0 0 1px rgba(17, 20, 27, .08);

  --r-win: 14px; --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  --side-w: 236px;
  --ease: cubic-bezier(.22, .9, .26, 1);
  --ease-io: cubic-bezier(.65, 0, .35, 1);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --desk: #07080A; --desk-2: #0C0E12;
  --win: #121419; --side: rgba(27, 30, 37, .78); --side-solid: #1A1D23;
  --card: #1A1D24; --sunk: #22262F; --sunk-2: #2A2F39;
  --hover: rgba(255, 255, 255, .05);
  --line: rgba(255, 255, 255, .075); --line-2: rgba(255, 255, 255, .13);
  --ink: #EEF1F6; --ink-2: #AFB6C5; --ink-3: #7D8597; --ink-inv: #0E1014;
  --accent: #6C9DFF; --accent-2: #8DB3FF; --accent-soft: rgba(108, 157, 255, .14); --accent-ink: #9BBDFF; --accent-solid: #3166DA;
  --ok: #34D07E; --ok-ink: #5BE29A; --ok-soft: rgba(52, 208, 126, .14);
  --quase: #FFC145; --quase-ink: #FFD27A; --quase-soft: rgba(255, 193, 69, .15);
  --ruim: #FF6A5F; --ruim-ink: #FF8E85; --ruim-soft: rgba(255, 106, 95, .14);
  --neutro: #7D8597; --neutro-soft: rgba(125, 133, 151, .16);
  --prev: rgba(161, 147, 255, .20); --prev-ink: #B5AAFF; --violet: #A193FF;
  --t1: #3987E5; --t2: #E8743F; --s3: #2BC28A; --s4: #9085E9;
  --sh-1: 0 0 0 1px rgba(255, 255, 255, .06);
  --sh-2: 0 0 0 1px rgba(255, 255, 255, .07), 0 10px 30px -12px rgba(0, 0, 0, .6);
  --sh-win: 0 40px 100px -20px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .09);
  --sh-pop: 0 20px 60px -10px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --desk: #07080A; --desk-2: #0C0E12;
    --win: #121419; --side: rgba(27, 30, 37, .78); --side-solid: #1A1D23;
    --card: #1A1D24; --sunk: #22262F; --sunk-2: #2A2F39;
    --hover: rgba(255, 255, 255, .05);
    --line: rgba(255, 255, 255, .075); --line-2: rgba(255, 255, 255, .13);
    --ink: #EEF1F6; --ink-2: #AFB6C5; --ink-3: #7D8597; --ink-inv: #0E1014;
    --accent: #6C9DFF; --accent-2: #8DB3FF; --accent-soft: rgba(108, 157, 255, .14); --accent-ink: #9BBDFF; --accent-solid: #3166DA;
    --ok: #34D07E; --ok-ink: #5BE29A; --ok-soft: rgba(52, 208, 126, .14);
    --quase: #FFC145; --quase-ink: #FFD27A; --quase-soft: rgba(255, 193, 69, .15);
    --ruim: #FF6A5F; --ruim-ink: #FF8E85; --ruim-soft: rgba(255, 106, 95, .14);
    --neutro: #7D8597; --neutro-soft: rgba(125, 133, 151, .16);
    --prev: rgba(161, 147, 255, .20); --prev-ink: #B5AAFF; --violet: #A193FF;
    --t1: #3987E5; --t2: #E8743F; --s3: #2BC28A; --s4: #9085E9;
    --sh-1: 0 0 0 1px rgba(255, 255, 255, .06);
    --sh-2: 0 0 0 1px rgba(255, 255, 255, .07), 0 10px 30px -12px rgba(0, 0, 0, .6);
    --sh-win: 0 40px 100px -20px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .09);
    --sh-pop: 0 20px 60px -10px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .1);
  }
}

* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--f-ui); font-size: 14px; line-height: 1.45; color: var(--ink);
  background: var(--desk);
  background-image: radial-gradient(1200px 700px at 12% -10%, var(--desk-2), transparent 60%), radial-gradient(900px 600px at 110% 110%, var(--desk-2), transparent 60%);
  min-height: 100vh; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); }
b, strong { font-weight: 650; }
.num, .tab { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent-soft); }
svg { display: block; }
.ic { width: 1.15em; height: 1.15em; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.demo-faixa .ic { width: 16px; height: 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- JANELA ---------- */
.desk { position: fixed; inset: 0; display: flex; padding: 14px; }
.window {
  position: relative; flex: 1; display: flex; min-width: 0; overflow: hidden;
  background: var(--win); border-radius: var(--r-win); box-shadow: var(--sh-win);
}
.side {
  width: var(--side-w); flex: none; display: flex; flex-direction: column;
  background: var(--side); border-right: 1px solid var(--line);
  -webkit-backdrop-filter: saturate(180%) blur(30px); backdrop-filter: saturate(180%) blur(30px);
  transition: width .35s var(--ease), opacity .25s ease;
  overflow: hidden;
}
.window.sem-side .side { width: 0; opacity: 0; border-right: 0; }
.lights { display: flex; gap: 8px; padding: 18px 18px 10px; }
.lights button {
  width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; position: relative;
  box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .18);
}
.lights button::after { content: ""; position: absolute; inset: -8px; }
.lights .l-r { background: #FF5F57; } .lights .l-y { background: #FEBC2E; } .lights .l-g { background: #28C840; }
.lights button svg { width: 8px; height: 8px; margin: 2px; opacity: 0; stroke: rgba(0, 0, 0, .55); stroke-width: 1.4; fill: none; stroke-linecap: round; transition: opacity .15s; }
.lights:hover button svg { opacity: 1; }

.brand { display: flex; align-items: center; gap: 11px; padding: 8px 18px 18px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; flex: none; position: relative; overflow: hidden;
  background: linear-gradient(145deg, #2C6BE0, #163E96); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 4px 10px -4px rgba(22, 62, 150, .6); }
.brand-mark svg { width: 34px; height: 34px; }
.brand-t { font-family: var(--f-disp); font-weight: 700; font-size: 16px; letter-spacing: -.01em; line-height: 1.1; }
.brand-s { font-size: 11.5px; color: var(--ink-3); }

.nav { flex: 1; overflow-y: auto; padding: 0 10px 12px; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav-g { margin-top: 6px; }
.nav-gh { display: flex; align-items: center; width: 100%; border: 0; background: none; padding: 8px 8px 4px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
.nav-gh svg { width: 12px; height: 12px; margin-left: auto; transition: transform .3s var(--ease); stroke: currentColor; }
.nav-g.fechado .nav-gh svg { transform: rotate(-90deg); }
.nav-items { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .35s var(--ease); }
.nav-g.fechado .nav-items { grid-template-rows: 0fr; }
.nav-items > div { overflow: hidden; }
.nav-i {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; border-radius: 8px;
  background: none; text-align: left; color: var(--ink); font-size: 13.5px; position: relative;
  transition: background-color .15s ease, color .15s ease;
}
.nav-i svg { width: 17px; height: 17px; flex: none; stroke: var(--accent); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav-i:hover { background: var(--hover); }
.nav-i.on { background: var(--accent-solid); color: #fff; }
.nav-i.on svg { stroke: #fff; }
.nav-i .badge { margin-left: auto; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--sunk-2); color: var(--ink-2); }
.nav-i.on .badge { background: rgba(255, 255, 255, .22); color: #fff; }

.side-foot { padding: 12px 14px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
.fonte { display: flex; align-items: center; gap: 8px; }
.fonte .pulso { width: 8px; height: 8px; border-radius: 50%; background: var(--neutro); position: relative; flex: none; }
.fonte .pulso.on { background: var(--ok); }
.fonte .pulso.on::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--ok); opacity: 0; animation: respira 2.8s var(--ease-io) infinite; }
.fonte .pulso.demo { background: var(--violet); }
.fonte .pulso.local { background: var(--quase); }
.fonte small { display: block; color: var(--ink-3); font-size: 11px; }
@keyframes respira { 0% { transform: scale(.6); opacity: .6; } 70% { transform: scale(1.5); opacity: 0; } 100% { opacity: 0; } }

/* ---------- ÁREA PRINCIPAL ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.toolbar {
  display: flex; align-items: center; gap: 12px; padding: 10px 18px; min-height: 58px;
  border-bottom: 1px solid var(--line); background: var(--win); background: color-mix(in srgb, var(--win) 80%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  position: relative; z-index: 5;
}
.tb-title { min-width: 0; margin-right: auto; }
.tb-title h1 { margin: 0; font-family: var(--f-disp); font-weight: 650; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-title p { margin: 0; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-ctrls { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
.tb-sep { width: 1px; height: 22px; background: var(--line-2); }

.icon-btn {
  width: 32px; height: 30px; border-radius: 8px; border: 0; background: none; display: inline-grid; place-items: center;
  color: var(--ink-2); transition: background-color .15s ease, transform .15s ease, color .15s ease; position: relative; flex: none;
}
.icon-btn::after { content: ""; position: absolute; inset: -6px; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn.gira svg { animation: gira .9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 8px;
  border: 0; background: var(--card); color: var(--ink); font-size: 13px; font-weight: 550; box-shadow: var(--sh-1);
  transition: transform .15s ease, background-color .15s ease, box-shadow .15s ease; white-space: nowrap;
}
.btn:hover { background: var(--sunk); }
.btn:active { transform: scale(.97); }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn.pri { background: var(--accent-solid); color: #fff; box-shadow: 0 1px 0 rgba(255, 255, 255, .2) inset, 0 4px 12px -4px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn.pri:hover { background: var(--accent-2); }
.btn.ghost { background: none; box-shadow: none; color: var(--accent-ink); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.perigo { color: var(--ruim-ink); }
.btn.grande { height: 40px; padding: 0 18px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* controle segmentado (macOS) */
.seg { position: relative; display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 2px; box-shadow: inset 0 0 0 1px var(--line); flex: none; }
.seg button { position: relative; z-index: 1; border: 0; background: none; height: 26px; padding: 0 11px; font-size: 12.5px; font-weight: 550; color: var(--ink-2); border-radius: 7px; transition: color .2s ease; white-space: nowrap; }
.seg button.on { color: var(--ink); }
.seg .thumb { position: absolute; z-index: 0; top: 2px; bottom: 2px; border-radius: 7px; background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .06); transition: transform .32s var(--ease), width .32s var(--ease); }
:root[data-theme="dark"] .seg .thumb { background: #3A3F4B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg .thumb { background: #3A3F4B; } }

.datenav { display: inline-flex; align-items: center; gap: 2px; background: var(--sunk); border-radius: 9px; padding: 2px; box-shadow: inset 0 0 0 1px var(--line); flex: none; }
.datenav .icon-btn { width: 26px; height: 26px; }
.datenav .icon-btn svg { width: 15px; height: 15px; }
.datenav .dn-lab { border: 0; background: var(--card); height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; font-weight: 600; min-width: 110px; box-shadow: 0 1px 2px rgba(0, 0, 0, .1); white-space: nowrap; }
:root[data-theme="dark"] .datenav .dn-lab { background: #3A3F4B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .datenav .dn-lab { background: #3A3F4B; } }

.view { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
.view-in { max-width: 1240px; margin: 0 auto; padding: 22px 24px 64px; }
.view-in.larga { max-width: 1480px; }
.view.troca .view-in { animation: entra .42s var(--ease) both; }
@keyframes entra { from { opacity: 0; transform: translateY(8px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }

.demo-faixa { display: flex; align-items: center; gap: 10px; padding: 8px 18px; font-size: 12.5px; background: var(--prev); color: var(--prev-ink); border-bottom: 1px solid var(--line); }
.demo-faixa .btn { height: 26px; margin-left: auto; }

/* ---------- BLOCOS ---------- */
.pane { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--sh-2); padding: 18px 20px; position: relative; min-width: 0; }
.pane + .pane, .row + .pane, .pane + .row, .row + .row, .sec + .sec { margin-top: 18px; }
.pane-h { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.pane-h > div:first-child { min-width: 0; flex: 1; }
.pane-h h2 { margin: 0; font-family: var(--f-disp); font-size: 17px; font-weight: 650; letter-spacing: -.01em; text-wrap: balance; }
.pane-h p { margin: 2px 0 0; color: var(--ink-3); font-size: 12.5px; text-wrap: pretty; }
.pane-h .acts { display: flex; gap: 6px; flex: none; }
[hidden] { display: none !important; }
.row > .pane, .row > section, .row > div { margin-top: 0 !important; }
.row { display: grid; gap: 18px; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); }
.row.c3 { --cols: 3; } .row.c4 { --cols: 4; } .row.c1-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); } .row.c2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.sec-t { display: flex; align-items: baseline; gap: 10px; margin: 30px 2px 12px; }
.sec-t h2 { margin: 0; font-family: var(--f-disp); font-size: 20px; font-weight: 650; letter-spacing: -.015em; }
.sec-t span { color: var(--ink-3); font-size: 12.5px; }
.muted { color: var(--ink-3); }
.p-sm { font-size: 12.5px; color: var(--ink-2); }

.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 6px; border-radius: 99px; font-size: 11.5px; font-weight: 650; white-space: nowrap; }
.chip svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chip.ok { background: var(--ok-soft); color: var(--ok-ink); }
.chip.quase { background: var(--quase-soft); color: var(--quase-ink); }
.chip.ruim { background: var(--ruim-soft); color: var(--ruim-ink); }
.chip.neutro { background: var(--neutro-soft); color: var(--ink-2); }
.chip.prev { background: var(--prev); color: var(--prev-ink); }
.c-ok { color: var(--ok-ink); } .c-quase { color: var(--quase-ink); } .c-ruim { color: var(--ruim-ink); } .c-neutro { color: var(--ink-2); }



/* ---------- HERO ---------- */
.hero { position: relative; overflow: hidden; padding: 24px 26px 22px; }
.hero::before { content: ""; position: absolute; inset: -40% -10% auto auto; width: 520px; height: 520px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, var(--hero-glow, var(--accent-soft)), transparent); opacity: .9; animation: deriva 18s ease-in-out infinite alternate; }
@keyframes deriva { from { transform: translate(0, 0); } to { transform: translate(-60px, 40px); } }
.hero-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: relative; }
.hero-top .quando { font-size: 13px; color: var(--ink-2); font-weight: 550; }
.hero h2.veredito { position: relative; margin: 10px 0 4px; font-family: var(--f-disp); font-weight: 700; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.08; letter-spacing: -.025em; text-wrap: balance; max-width: 22ch; }
.hero .sub { position: relative; margin: 0; color: var(--ink-2); font-size: 14.5px; max-width: 70ch; text-wrap: pretty; }
.hero .sub b { color: var(--ink); }
.hero-kpis { position: relative; display: flex; gap: 28px; flex-wrap: wrap; margin-top: 18px; }
.kpi .k-v { font-family: var(--f-disp); font-size: 28px; font-weight: 650; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi .k-v small { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.kpi .k-l { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* faixa "para onde foi cada quilo" */
.strip-w { position: relative; margin-top: 22px; }
.strip-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.strip-h h3 { margin: 0; font-size: 14px; font-weight: 650; }
.strip-h span { font-size: 12px; color: var(--ink-3); }
.strip { display: flex; height: 54px; gap: 2px; border-radius: 12px; overflow: hidden; position: relative; }
.strip .sg { position: relative; min-width: 3px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 7px; overflow: hidden; color: #fff;
  transform-origin: left center; transform: scaleX(0); transition: transform .9s var(--ease), filter .2s ease; cursor: pointer; }
.strip.in .sg { transform: scaleX(1); }
.strip .sg:hover { filter: brightness(1.08) saturate(1.1); }
.strip .sg b { font-family: var(--f-disp); font-size: 15px; font-weight: 650; line-height: 1; white-space: nowrap; }
.strip .sg span { font-size: 10.5px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .sg.ok { background: linear-gradient(180deg, color-mix(in srgb, var(--ok) 88%, #fff), var(--ok)); }
.strip .sg.quase { background: linear-gradient(180deg, color-mix(in srgb, var(--quase) 85%, #fff), var(--quase)); color: #3D2A00; }
.strip .sg.ruim { background: linear-gradient(180deg, color-mix(in srgb, var(--ruim) 88%, #fff), var(--ruim)); }
.strip .sg.neutro { background: linear-gradient(180deg, #8E97AA, #737C90); }
.strip .sg.quebra { background: repeating-linear-gradient(135deg, var(--sunk-2) 0 6px, var(--sunk) 6px 12px); color: var(--ink-2); }
.strip .sg .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(0, 0, 0, .32); left: var(--m); }
.strip .sg .tick::after { content: ""; position: absolute; top: -1px; left: -3px; border: 4px solid transparent; border-top-color: rgba(0, 0, 0, .45); }
.strip::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .22) 45%, transparent 60%); background-size: 250% 100%; background-position: 130% 0; animation: brilho 9s ease-in-out 2s infinite; }
@keyframes brilho { 0%, 70% { background-position: 130% 0; } 100% { background-position: -30% 0; } }
.strip-leg { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.strip-leg i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* ---------- LEITURA ---------- */
.leit { display: grid; gap: 2px; }
.leit-i { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start; padding: 12px 10px; border-radius: 12px; transition: background-color .15s ease; border: 0; background: none; text-align: left; width: 100%; }
.leit-i:hover { background: var(--hover); }
.leit-i .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.leit-i .ic svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.leit-i.ok .ic { background: var(--ok-soft); color: var(--ok-ink); }
.leit-i.quase .ic { background: var(--quase-soft); color: var(--quase-ink); }
.leit-i.ruim .ic { background: var(--ruim-soft); color: var(--ruim-ink); }
.leit-i.info .ic, .leit-i.neutro .ic { background: var(--accent-soft); color: var(--accent-ink); }
.leit-i h4 { margin: 0; font-size: 14px; font-weight: 650; }
.leit-i p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); text-wrap: pretty; }
.leit-i .go { color: var(--ink-3); align-self: center; }
.leit-i .go svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ---------- ITENS (tiles expansíveis) ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tile { background: var(--card); border-radius: 14px; box-shadow: var(--sh-2); position: relative; overflow: hidden; transition: box-shadow .2s ease, transform .2s var(--ease); }
.tile:hover { transform: translateY(-1px); }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--neutro); }
.tile.ok::before { background: var(--ok); } .tile.quase::before { background: var(--quase); } .tile.ruim::before { background: var(--ruim); }
.tile-h { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 14px 16px 12px 18px; }
.tile-top { display: flex; align-items: center; gap: 8px; }
.tile-top .nm { font-weight: 650; font-size: 14px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-mid { display: flex; align-items: flex-end; gap: 10px; margin-top: 10px; }
.tile-mid .big { font-family: var(--f-disp); font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.tile-mid .vs { font-size: 12px; color: var(--ink-3); padding-bottom: 2px; }
.tile-mid .spark { width: 84px; height: 30px; margin-left: auto; color: var(--ink-3); }
.tile.ok .spark { color: var(--ok); } .tile.quase .spark { color: var(--quase); } .tile.ruim .spark { color: var(--ruim); }
.gauge { position: relative; height: 6px; border-radius: 99px; background: var(--sunk); margin-top: 12px; }
.gauge .fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; width: 0; transition: width 1s var(--ease); }
.reveal.in .gauge .fill, .tile.in .gauge .fill { width: var(--w); }
.gauge .mk { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 2px; background: var(--ink); left: var(--m); opacity: .75; }
.tile.ok .fill { background: var(--ok); } .tile.quase .fill { background: var(--quase); } .tile.ruim .fill { background: var(--ruim); } .tile.neutro .fill { background: var(--neutro); }
.tile.ruim .gauge .fill::after { content: ""; position: absolute; right: -3px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--ruim); opacity: .4; animation: respira 2.6s var(--ease-io) infinite; }
.tile-bot { display: flex; gap: 10px; align-items: baseline; margin-top: 10px; font-size: 13px; }
.tile-bot .kgv { font-weight: 700; font-variant-numeric: tabular-nums; }
.tile-bot .cxv { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tile-bot .chev { margin-left: auto; color: var(--ink-3); transition: transform .3s var(--ease); }
.tile-bot .chev svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.tile.aberto .chev { transform: rotate(180deg); }
.tile-x { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
.tile.aberto .tile-x { grid-template-rows: 1fr; }
.tile-x > div { overflow: hidden; }
.tile-x .inner { padding: 0 16px 16px 18px; border-top: 1px solid var(--line); margin-top: 2px; padding-top: 12px; font-size: 13px; color: var(--ink-2); }
.conta { background: var(--sunk); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }
.conta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12.5px; }
.kv span:nth-child(odd) { color: var(--ink-3); }
.kv span:nth-child(even) { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }

/* ---------- MOSTRADORES (OEE) ---------- */
.dials { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.dialc { text-align: center; padding: 8px 4px 4px; border-radius: 12px; position: relative; border: 0; background: none; transition: background-color .15s ease; }
.dialc:hover { background: var(--hover); }
.dialc .dial { width: 100px; height: 100px; margin: 0 auto; }
.dialc .dv { position: absolute; left: 0; right: 0; top: 41px; font-family: var(--f-disp); font-weight: 650; font-size: 15.5px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.dialc .dn { font-size: 12.5px; font-weight: 600; margin-top: -8px; }
.dialc .dm { font-size: 11px; color: var(--ink-3); }
.dl-track { fill: none; stroke: var(--sunk-2); stroke-width: 7; stroke-linecap: round; }
.dl-val { fill: none; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 0 var(--full); transition: stroke-dasharray 1.2s var(--ease); }
.reveal.in .dl-val, .slide.on .dl-val { stroke-dasharray: var(--len) var(--full); }
.dial.st-ok .dl-val { stroke: var(--ok); } .dial.st-quase .dl-val { stroke: var(--quase); } .dial.st-ruim .dl-val { stroke: var(--ruim); } .dial.st-neutro .dl-val { stroke: var(--accent); }
.dl-meta { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; opacity: .7; }

/* ---------- BARRAS HTML (kg por item, pareto) ---------- */
.hb { display: grid; gap: 6px; }
.hb-r { display: grid; grid-template-columns: minmax(96px, 150px) 1fr 108px; gap: 12px; align-items: center; font-size: 13px; padding: 3px 4px; border-radius: 8px; border: 0; background: none; text-align: left; width: 100%; }
button.hb-r:hover { background: var(--hover); }
.hb-r .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-r .vl { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.hb-r .vl small { display: block; font-weight: 500; color: var(--ink-3); font-size: 11.5px; }
.hb-t { position: relative; height: 18px; }
.hb-t .zero { position: absolute; top: -3px; bottom: -3px; left: 50%; width: 1px; background: var(--line-2); }
.hb-t .b { position: absolute; top: 2px; bottom: 2px; border-radius: 5px; width: 0; transition: width .9s var(--ease); }
.hb-t .b.pos { left: 50%; } .hb-t .b.neg { right: 50%; }
.reveal.in .hb-t .b, .slide.on .hb-t .b { width: var(--w); }
.hb-t .b.ok { background: var(--ok); } .hb-t .b.quase { background: var(--quase); } .hb-t .b.ruim { background: var(--ruim); } .hb-t .b.acc { background: var(--accent); } .hb-t .b.neutro { background: var(--neutro); }
.hb-t.uni .b { left: 0; right: auto; }
.hb-t.uni { background: var(--sunk); border-radius: 6px; }

/* ---------- GRÁFICOS ---------- */
.chart { position: relative; width: 100%; }
.chart svg { overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .grid.zero { stroke: var(--line-2); }
.chart .ax { fill: var(--ink-3); font-size: 11px; font-family: var(--f-ui); font-variant-numeric: tabular-nums; }
.chart .ax.nome { fill: var(--ink-2); font-weight: 600; }
.chart .meta-line { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; opacity: .55; }
.chart .meta-tx { fill: var(--ink-2); font-size: 11px; font-weight: 600; }
.chart .ln { fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.chart .ln.dash { stroke-dasharray: 4 4 !important; }
.chart .ln.fino { stroke-width: 1.6; opacity: .9; }
.chart .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.3s var(--ease); }
.chart.in .ln.draw { stroke-dashoffset: 0; }
.chart.in .ln.dash { stroke-dashoffset: 0; }
.chart .area { opacity: 0; transition: opacity 1s ease .4s; }
.chart.in .area { opacity: .1; }
.chart .band { opacity: 0; transition: opacity .8s ease .5s; }
.chart.in .band { opacity: 1; }
.chart .dot { stroke: var(--card); stroke-width: 2; opacity: 0; transition: opacity .4s ease .9s; }
.chart.in .dot { opacity: 1; }
.chart .dot.st-ok { fill: var(--ok); } .chart .dot.st-quase { fill: var(--quase); } .chart .dot.st-ruim { fill: var(--ruim); }
.chart .xhair { stroke: var(--ink-3); stroke-width: 1; opacity: 0; }
.chart .xhair.on { opacity: .6; }
.chart .xdot { stroke: var(--card); stroke-width: 2.5; }
.chart .hit { cursor: crosshair; }
.chart .bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); transition: transform .8s var(--ease); cursor: pointer; }
.chart .bar.down { transform-origin: top; }
.chart.in .bar { transform: scaleY(1); }
.chart .bar.st-ok { fill: var(--ok); } .chart .bar.st-quase { fill: var(--quase); } .chart .bar.st-ruim { fill: var(--ruim); } .chart .bar.st-neutro { fill: var(--neutro); }
.chart .bar:hover { filter: brightness(1.1); }
.chart .pt-lab { fill: var(--ink-2); font-size: 12px; }
.chart .pt-lab.forte { fill: var(--ink); font-weight: 650; }
.chart .pt-val { fill: var(--ink); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chart .pt-val.pos { fill: var(--ok-ink); } .chart .pt-val.neg { fill: var(--ruim-ink); }
.chart .pt-bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); transition: transform .7s var(--ease); cursor: pointer; }
.chart.in .pt-bar { transform: scaleX(1); }
.chart .pt-base { fill: var(--sunk-2); } .chart .pt-pos { fill: var(--ok); } .chart .pt-neg { fill: var(--ruim); }
.chart .pt-fim.ok { fill: var(--accent); } .chart .pt-fim.ruim { fill: var(--ruim); }
.chart .pt-link { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 2; }
.chart .reg { stroke: var(--violet); stroke-width: 2; stroke-dasharray: 6 4; }
.chart .sc-dot { stroke: var(--card); stroke-width: 1.5; opacity: 0; transition: opacity .5s ease; cursor: pointer; }
.chart.in .sc-dot { opacity: .9; }
.chart.sem-anim * { transition: none !important; }
.chart-vazio { display: grid; place-items: center; color: var(--ink-3); font-size: 13px; background: var(--sunk); border-radius: 12px; text-align: center; padding: 10px; }
.spark { display: block; overflow: visible; }
.spark .sp-ln { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.spark .sp-meta { stroke: var(--ink-3); stroke-dasharray: 3 3; stroke-width: 1; opacity: .7; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legenda i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
.legenda i.tr { height: 0; border-top: 2px dashed var(--ink-2); background: none; }

/* ---------- TOOLTIP / POPOVER ---------- */
#tip { position: fixed; left: 0; top: 0; z-index: 90; max-width: 300px; pointer-events: none; opacity: 0; transition: opacity .15s ease;
  background: var(--card); background: color-mix(in srgb, var(--card) 92%, transparent); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  border-radius: 12px; box-shadow: var(--sh-pop); padding: 10px 12px; font-size: 12.5px; }
#tip.on { opacity: 1; }
#tip.wide { max-width: 360px; }
#tip .tt-h { font-weight: 700; margin-bottom: 6px; font-size: 13px; }
#tip .tt-p { color: var(--ink-2); margin: 4px 0; line-height: 1.5; }
#tip .tt-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
#tip .tt-row i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
#tip .tt-row.meta i { border-top: 2px dashed var(--ink-2); height: 0; width: 10px; border-radius: 0; }
#tip .tt-row span { color: var(--ink-2); flex: 1; }
#tip .tt-row b { font-variant-numeric: tabular-nums; }
#tip .conta { margin: 6px 0 2px; }

/* ---------- TABELA RDO ---------- */
.rdo-wrap { overflow-x: auto; border-radius: 14px; box-shadow: var(--sh-2); background: var(--card); -webkit-overflow-scrolling: touch; }
.rdo { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; min-width: 980px; }
.rdo th, .rdo td { padding: 0; text-align: right; white-space: nowrap; }
.rdo thead th { position: sticky; top: 0; z-index: 3; background: var(--card); padding: 12px 10px 10px; font-size: 11.5px; font-weight: 650; color: var(--ink-2); border-bottom: 1px solid var(--line-2); }
.rdo thead th small { display: block; font-weight: 500; color: var(--ink-3); }
.rdo thead th.hoje { color: var(--accent-ink); }
.rdo .c-cod { width: 48px; text-align: left; position: sticky; left: 0; z-index: 2; background: var(--card); }
.rdo .c-item { text-align: left; position: sticky; left: 48px; z-index: 2; background: var(--card); min-width: 190px; box-shadow: 1px 0 0 var(--line); }
.rdo thead .c-cod, .rdo thead .c-item { z-index: 4; }
.rdo td { border-bottom: 1px solid var(--line); }
.rdo td > .cel { padding: 8px 10px; font-variant-numeric: tabular-nums; }
.rdo .dcol { min-width: 96px; }
.rdo tr.lin { cursor: pointer; transition: background-color .12s ease; }
.rdo tr.lin:hover td { background: var(--hover); }
.rdo tr.lin:hover .c-cod, .rdo tr.lin:hover .c-item { background: color-mix(in srgb, var(--card) 94%, var(--ink)); }
.rdo .cod { font-size: 11px; color: var(--ink-3); font-weight: 600; padding-left: 14px !important; }
.rdo .nm { font-weight: 550; display: flex; align-items: center; gap: 6px; }
.rdo .nm.sub { padding-left: 22px !important; color: var(--ink-2); font-weight: 450; }
.rdo .nm svg { width: 12px; height: 12px; stroke: var(--ink-3); fill: none; stroke-width: 2.2; transition: transform .25s var(--ease); flex: none; }
.rdo tr.lin.aberta .nm svg { transform: rotate(90deg); }
.rdo .meta { color: var(--ink-2); }
.rdo .pill { display: inline-block; min-width: 64px; padding: 2px 8px; border-radius: 6px; font-weight: 650; }
.rdo .pill.ok { background: var(--ok-soft); color: var(--ok-ink); }
.rdo .pill.quase { background: var(--quase-soft); color: var(--quase-ink); }
.rdo .pill.ruim { background: var(--ruim-soft); color: var(--ruim-ink); }
.rdo .acum { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); font-weight: 650; }
.rdo .vazio { color: var(--ink-3); opacity: .5; }
.rdo tr.secao td { background: var(--sunk); padding: 0; position: sticky; left: 0; }
.rdo tr.secao button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 10px 14px; font-weight: 700; font-size: 13px; text-align: left; position: sticky; left: 0; }
.rdo tr.secao button svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; transition: transform .3s var(--ease); }
.rdo tr.secao.fechada button svg { transform: rotate(-90deg); }
.rdo tr.secao button span { font-weight: 500; color: var(--ink-3); font-size: 12px; }
.rdo tr.det td { background: var(--sunk); padding: 0; border-bottom: 1px solid var(--line-2); }
.rdo tr.det .det-in { position: sticky; left: 0; width: min(100vw - 80px, 1100px); padding: 14px 18px 16px; white-space: normal; text-align: left; animation: entra .35s var(--ease) both; }
.det-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; }
.det-grid h4 { margin: 0 0 6px; font-size: 14px; }
.det-grid p { margin: 0 0 6px; color: var(--ink-2); font-size: 13px; }
.rdo .det-in .tb td, .rdo .det-in .tb th { text-align: left; border-bottom: 1px solid var(--line); background: none; padding: 7px 8px; }
.rdo .det-in .tb td.n, .rdo .det-in .tb th.n { text-align: right; }

/* ---------- FORMULÁRIOS ---------- */
.field { display: grid; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field small { color: var(--ink-3); font-size: 11.5px; }
.inp, select.inp, textarea.inp { height: 34px; padding: 0 11px; border-radius: 9px; border: 0; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; width: 100%; transition: box-shadow .15s ease; }
textarea.inp { height: auto; min-height: 120px; padding: 10px 11px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; resize: vertical; }
.inp:focus { outline: none; box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px var(--accent-soft); }
.sw { position: relative; width: 38px; height: 22px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; border-radius: 99px; background: var(--sunk-2); transition: background-color .2s ease; }
.sw span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .25s var(--ease); }
.sw input:checked + span { background: var(--ok); }
.sw input:checked + span::after { transform: translateX(16px); }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.opt:last-child { border-bottom: 0; }
.opt > div { flex: 1; min-width: 0; }
.opt b { display: block; font-size: 13.5px; font-weight: 600; }
.opt small { color: var(--ink-3); font-size: 12px; }
.opt .inp { width: 110px; }

.drop { display: block; cursor: pointer; border: 2px dashed var(--line-2); border-radius: 16px; padding: 34px 20px; text-align: center; transition: border-color .2s ease, background-color .2s ease; position: relative; }
.drop.sobre { border-color: var(--accent); background: var(--accent-soft); }

      .map(i => ({ s: i.s.trim(), x: i.x, y: i.y, w: i.w || 0, cx: i.x + (i.w || 0) / 2 }));
  }

  function nearest(list, v, key, tol) {
    let best = null, bd = Infinity;
    for (const c of list) {
      const d = Math.abs(c[key] - v);
      if (d < bd) { bd = d; best = c; }
    }
    return bd <= tol ? best : null;
  }

  function toISO(dmy) {
    const [d, m, y] = dmy.split('/');
    const yy = y.length === 2 ? '20' + y : y;
    return `${yy}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
  }

  function parsePage1(items) {
    const its = norm(items);
    const tLabel = its.find(i => /^TURNO$/i.test(i.s));
    let turno = null;
    for (const i of its) {
      const m = i.s.match(/^([123])\s*[ºo°]?\s*T(URNO)?$/i);
      if (m && (!tLabel || Math.abs(i.y - tLabel.y) < 8)) { turno = 'T' + m[1]; break; }
    }
    let semana = null;
    const sem = its.find(i => /^SEMANA\s+\d{1,2}$/i.test(i.s));
    if (sem) semana = parseInt(sem.s.replace(/\D/g, ''), 10);

    const dates = its.filter(i => /^\d{2}\/\d{2}\/\d{2,4}$/.test(i.s)).sort((a, b) => a.x - b.x);
    if (!dates.length) throw new Error('Não encontrei as datas do cabeçalho (ex.: 19/10/26) na página 1 do RDO.');
    const headerY = dates[0].y;
    const metaH = its.find(i => /^META$/i.test(i.s) && Math.abs(i.y - headerY) < 30);
    const acumH = its.find(i => /^ACUMULADO$/i.test(i.s));

    const cols = dates.map((d, k) => ({ type: 'day', k, iso: toISO(d.s), cx: d.cx }));
    if (metaH) cols.push({ type: 'meta', cx: metaH.cx });
    if (acumH) cols.push({ type: 'acum', cx: acumH.cx });

    const codeRe = /^[A-Z]{1,2}(\.\d{1,2})?$/;
    const rows = its
      .filter(i => i.x < 75 && i.y > headerY && codeRe.test(i.s))
      .map(i => ({ key: i.s.replace(/\./g, ''), y: i.y }));
    const dorso = its.find(i => /^DORSO$/i.test(i.s) && i.x < 250 && i.y > headerY);
    if (dorso) rows.push({ key: 'DORSO', y: dorso.y });
    const ag3 = its.find(i => /^TEMPERADO MEIO DA ASA$/i.test(i.s));
    if (ag3) rows.push({ key: 'AG3', y: ag3.y });
    if (rows.length < 20) throw new Error('A página 1 não tem a coluna de códigos (N, O, P…) no formato esperado.');

    const xMin = metaH ? metaH.x - 25 : 420;
    const out = { turno, semana, dates: dates.map(d => toISO(d.s)), days: {}, metas: {}, acum: {} };
    out.dates.forEach(iso => (out.days[iso] = {}));

    for (const i of its) {
      if (i.y <= headerY + 2 || i.x < xMin) continue;
      const val = parseNum(i.s);
      if (val === undefined) continue;
      const row = nearest(rows, i.y, 'y', 7);
      if (!row) continue;
      const col = nearest(cols, i.cx, 'cx', 48);
      if (!col) continue;
      if (col.type === 'day') out.days[col.iso][row.key] = val;
      else if (col.type === 'meta') out.metas[row.key] = val;
      else out.acum[row.key] = val;
    }
    return out;
  }

  function parsePage2(items, isoDates) {
    const its = norm(items);
    const dateHdr = its.filter(i => /^\d{1,2}-[a-zç]{3}\.?$/i.test(i.s));
    if (!dateHdr.length) return null;
    const firstY = Math.min(...dateHdr.map(i => i.y));
    const hdr = dateHdr.filter(i => Math.abs(i.y - firstY) < 3).sort((a, b) => a.x - b.x);
    const pctHdr = its.filter(i => Math.abs(i.y - firstY) < 3 && /^%/.test(i.s));
    const acumH = its.find(i => Math.abs(i.y - firstY) < 3 && /^ACUM/i.test(i.s));

    const cols = hdr.map((h, k) => ({ type: 'day', iso: isoDates[k] || null, cx: h.cx }))
      .concat(pctHdr.map(p => ({ type: 'pct', cx: p.cx })));
    if (acumH) cols.push({ type: 'acum', cx: acumH.cx });
    cols.push({ type: 'meta', cx: hdr[0].cx - 45 });

    const codeRe = /^(PP\d{2}|P\d{2}|R\d{2}|\d{1,2}(\.\d{1,2}){0,3})$/;
    const rows = its.filter(i => i.x < 62 && i.y > firstY - 2 && codeRe.test(i.s)).map(i => ({ key: i.s, y: i.y }));

    const out = { days: {}, metas: {} };
    isoDates.forEach(iso => (out.days[iso] = { pp: {}, p: {}, r: {}, nq: {} }));
    for (const i of its) {
      if (i.x < 425) continue;
      const val = parseNum(i.s);
      if (val === undefined || typeof val !== 'number') continue;
      const row = nearest(rows, i.y, 'y', 7);
      if (!row) continue;
      const col = nearest(cols, i.cx, 'cx', 30);
      if (!col) continue;
      if (col.type === 'meta') { out.metas[row.key] = val; continue; }
      if (col.type !== 'day' || !col.iso || !out.days[col.iso]) continue;
      const k = row.key;
      const sec = /^PP/.test(k) ? 'pp' : /^P\d/.test(k) ? 'p' : /^R\d/.test(k) ? 'r' : 'nq';
      out.days[col.iso][sec][k] = val;
    }
    return out;
  }

  /* pages: [{ items:[{s,x,y,w}] }, ...]  — y medido de cima para baixo */
  function parse(pages, fonte) {
    if (!pages || !pages.length) throw new Error('O arquivo não tem páginas legíveis.');
    const p1 = parsePage1(pages[0].items);
    let p2 = null;
    for (let k = 1; k < pages.length && !p2; k++) {
      try { p2 = parsePage2(pages[k].items, p1.dates); } catch (e) { p2 = null; }
    }
    const turno = p1.turno || guessTurno(fonte);
    const registros = [];
    for (const iso of p1.dates) {
      const v = p1.days[iso];
      if (!v || !(v.R > 0) || !(v.S > 0)) continue;
      const d2 = p2 && p2.days[iso] ? p2.days[iso] : { pp: {}, p: {}, r: {}, nq: {} };
      const metas = Object.assign({}, p1.metas);
      if (p2) Object.assign(metas, p2.metas);
      registros.push({
        id: `${iso}_${turno || 'T?'}`,
        data: iso,
        turno: turno || 'T?',
        semana: p1.semana,
        fonte: fonte || '',
        v: Object.assign({}, v),
        metas,
        paradasProgramadas: d2.pp,
        interrupcoes: d2.p,
        reducoes: d2.r,
        naoQualidade: d2.nq,
        obs: ''
      });
    }
    return { turno, semana: p1.semana, dates: p1.dates, registros, acum: p1.acum };
  }

  function guessTurno(nome) {
    if (!nome) return null;
    const m = String(nome).match(/([123])\s*[ºo°]?\s*turno/i) || String(nome).match(/\bT\s*([123])\b/i);
    return m ? 'T' + m[1] : null;
  }

  return { parse, parseNum, toISO, guessTurno };
})();
