/* ============================================================
   RDO RONDON — visual RETRÔ INDUSTRIAL
   papel creme, tinta preta, bordas fortes, sombras duras,
   faixas de cor de status e tipografia expandida.
   ============================================================ */
:root {
  color-scheme: light;
  --f-ui: "Archivo R", "Archivo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "Space Mono R", "Space Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --bg: #EFE5CF; --bg-dot: rgba(26, 24, 19, .085);
  --paper: #FFFAF0; --paper-2: #F7EEDB; --paper-3: #E9DDC3;
  --ink: #1A1813; --ink-2: #46413A; --ink-3: #685F53; --inv: #FFFAF0;
  --line: #1A1813; --line-soft: rgba(26, 24, 19, .16); --line-mid: rgba(26, 24, 19, .34);
  --hover: rgba(26, 24, 19, .05);

  --accent: #2443C4; --accent-2: #3557DB; --accent-ink: #1B3399; --accent-soft: #DCE1F8; --on-accent: #FFFAF0;
  --ok: #26A65D; --ok-ink: #0E6634; --ok-soft: #CDEAD5;
  --quase: #F2B431; --quase-ink: #774F00; --quase-soft: #FBE5B0;
  --ruim: #E2492B; --ruim-ink: #A32910; --ruim-soft: #F8D2C7;
  --neutro: #A0968A; --neutro-soft: #E8E0D0;
  --prev: #E5DBF8; --prev-ink: #5530AD; --violet: #7A4FD0;
  --t1: #2443C4; --t2: #E07A1F; --s3: #26A65D; --s4: #B0367C;
  --on-fill: #1A1813;

  --sh-c: #1A1813;
  --sh-1: 2px 2px 0 var(--sh-c); --sh-2: 4px 4px 0 var(--sh-c); --sh-3: 6px 6px 0 var(--sh-c); --sh-4: 10px 10px 0 var(--sh-c);
  --bw: 2.5px; --bw-s: 2px;
  --r-lg: 14px; --r-md: 10px; --r-sm: 7px;
  --side-w: 252px;
  --side-bg: #1A1813; --side-ink: #F6ECD8; --side-ink-2: #B4A88F; --side-hl: #F2B431; --side-sh: #E2492B;
  --placar: #1A1813; --placar-ink: #F6ECD8; --pl-ok: #4ADE8E; --pl-quase: #FFC94D; --pl-ruim: #FF7A5C;

  --ease: cubic-bezier(.2, .9, .25, 1);
  --ease-io: cubic-bezier(.65, 0, .35, 1);
  --ease-mola: cubic-bezier(.34, 1.56, .64, 1);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #13110D; --bg-dot: rgba(246, 236, 216, .055);
  --paper: #1F1C16; --paper-2: #29251E; --paper-3: #3A3429;
  --ink: #F6ECD8; --ink-2: #D2C7B1; --ink-3: #A99D87; --inv: #13110D;
  --line: #CDBF9F; --line-soft: rgba(246, 236, 216, .14); --line-mid: rgba(246, 236, 216, .3);
  --hover: rgba(246, 236, 216, .06);
  --accent: #8098FF; --accent-2: #9BAEFF; --accent-ink: #AEBDFF; --accent-soft: #262D52; --on-accent: #13110D;
  --ok: #44D28A; --ok-ink: #7EE6AE; --ok-soft: #1C3A2A;
  --quase: #FFC94D; --quase-ink: #FFD983; --quase-soft: #403419;
  --ruim: #FF7454; --ruim-ink: #FFA28C; --ruim-soft: #4A231A;
  --neutro: #8F8573; --neutro-soft: #332E26;
  --prev: #2E2547; --prev-ink: #C6B4FF; --violet: #A88BFF;
  --t1: #8098FF; --t2: #FF9A4A; --s3: #44D28A; --s4: #F27BBF;
  --on-fill: #13110D;
  --sh-c: #000;
  --side-bg: #0B0A08; --side-ink: #F6ECD8; --side-ink-2: #A99D87;
  --placar: #0B0A08;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #13110D; --bg-dot: rgba(246, 236, 216, .055);
    --paper: #1F1C16; --paper-2: #29251E; --paper-3: #3A3429;
    --ink: #F6ECD8; --ink-2: #D2C7B1; --ink-3: #A99D87; --inv: #13110D;
    --line: #CDBF9F; --line-soft: rgba(246, 236, 216, .14); --line-mid: rgba(246, 236, 216, .3);
    --hover: rgba(246, 236, 216, .06);
    --accent: #8098FF; --accent-2: #9BAEFF; --accent-ink: #AEBDFF; --accent-soft: #262D52; --on-accent: #13110D;
    --ok: #44D28A; --ok-ink: #7EE6AE; --ok-soft: #1C3A2A;
    --quase: #FFC94D; --quase-ink: #FFD983; --quase-soft: #403419;
    --ruim: #FF7454; --ruim-ink: #FFA28C; --ruim-soft: #4A231A;
    --neutro: #8F8573; --neutro-soft: #332E26;
    --prev: #2E2547; --prev-ink: #C6B4FF; --violet: #A88BFF;
    --t1: #8098FF; --t2: #FF9A4A; --s3: #44D28A; --s4: #F27BBF;
    --on-fill: #13110D;
    --sh-c: #000;
    --side-bg: #0B0A08; --side-ink: #F6ECD8; --side-ink-2: #A99D87;
    --placar: #0B0A08;
  }
}

* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--f-ui); font-size: 14.5px; line-height: 1.5; color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.1px, transparent 1.5px);
  background-size: 18px 18px;
  min-height: 100vh; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); }
b, strong { font-weight: 750; }
.num, .tab { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--quase); color: #1A1813; }
svg { display: block; }
.ic { width: 1.15em; height: 1.15em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--f-mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.muted { color: var(--ink-3); }
.p-sm { font-size: 13px; color: var(--ink-2); }
.c-ok { color: var(--ok-ink); } .c-quase { color: var(--quase-ink); } .c-ruim { color: var(--ruim-ink); } .c-neutro { color: var(--ink-2); }

/* ============ REVELAR (animações de entrada) ============ */
.reveal { opacity: 0; }
.reveal.in { opacity: 1; animation: surgir .62s var(--ease) backwards; }
@keyframes surgir { from { opacity: 0; transform: translateY(18px) scale(.985); } }
@keyframes sobe { from { opacity: 0; transform: translateY(14px); } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes gira { to { transform: rotate(360deg); } }
@keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
@keyframes carimbar { 0% { opacity: 0; transform: rotate(-14deg) scale(2.3); } 55% { opacity: 1; transform: rotate(-2deg) scale(.93); } 100% { opacity: 1; transform: rotate(-4deg) scale(1); } }
@keyframes cutuca { 50% { transform: translateX(-4px); } }
@keyframes cutucaD { 50% { transform: translateX(4px); } }

/* ============ JANELA / CASCA ============ */
.app { position: fixed; inset: 0; display: flex; }
.side { width: var(--side-w); flex: none; background: var(--side-bg); color: var(--side-ink); overflow: hidden; position: relative; transition: width .4s var(--ease); z-index: 7; }
.app.sem-side .side { width: 0; }
.side-in { width: var(--side-w); height: 100%; display: flex; flex-direction: column; }
.side::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 3px); }
.marca { display: flex; align-items: center; gap: 12px; width: 100%; padding: 22px 18px 20px; border: 0; background: none; color: inherit; text-align: left; border-bottom: 2px dashed rgba(246, 236, 216, .16); }
.marca-ic { width: 44px; height: 44px; border-radius: 11px; flex: none; background: var(--side-hl); border: 2.5px solid var(--side-ink); box-shadow: 3px 3px 0 var(--side-sh); display: grid; place-items: center; transition: transform .25s var(--ease-mola); }
.marca:hover .marca-ic { transform: rotate(-6deg) scale(1.05); }
.marca-ic svg { width: 28px; height: 28px; }
.marca-t, .marca-s { display: block; }
#tb-voltar:empty { display: none; }
.h3-faixa .ic { width: 17px; height: 17px; stroke-width: 3; }
.wg-v, .wg-sp, .po-mini { display: block; }
.slide.on .sl-nota { animation: sobe .6s var(--ease) .7s both; }
.marca-t { font-weight: 900; font-stretch: 125%; font-size: 21px; letter-spacing: .02em; line-height: 1; }

.wg-top { display: flex; align-items: center; gap: 8px; padding: 8px 11px; background: var(--paper-2); border-bottom: 2px solid var(--line); color: var(--ink); }

.wg-ic svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.wg-l { font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; line-height: 1.2; flex: 1; min-width: 0; }
.wg-v { font-weight: 900; font-stretch: 80%; font-size: 37px; line-height: 1; padding: 14px 13px 0; font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.wg-v small { font-size: 16px; font-weight: 700; font-stretch: 100%; color: var(--ink-3); margin-left: 3px; letter-spacing: 0; }
.wg-f { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; color: var(--ink-3); padding: 6px 13px 0; line-height: 1.35; }
.wg-sp { margin-top: auto; height: 46px; padding-top: 8px; color: var(--accent); }
.wg-sp.vazio { height: 18px; }
.wg.st-ok .wg-sp { color: var(--ok); } .wg.st-quase .wg-sp { color: var(--quase); } .wg.st-ruim .wg-sp { color: var(--ruim); }
.wg-sp .spark { width: 100%; height: 38px; }
.dl { display: inline-block; padding: 1px 6px; border-radius: 5px; border: 1.5px solid var(--line); font-family: var(--f-mono); font-weight: 700; font-size: 10.5px; font-variant-numeric: tabular-nums; color: #1A1813; }
.dl.ok { background: var(--ok); } .dl.quase { background: var(--quase); } .dl.ruim { background: var(--ruim); } .dl.neutro { background: var(--neutro-soft); color: var(--ink-2); }

/* cartões clicáveis: mesmo comportamento físico */
.wg, .tile, .portal, .aba-n, .gr-card { transition: transform .22s var(--ease), box-shadow .22s ease, background-color .2s ease; cursor: pointer; }
.wg:hover, .tile:hover, .portal:hover, .aba-n:hover, .gr-card:hover { transform: translate(-3px, -3px); box-shadow: 7px 7px 0 var(--sh-c); }
.wg:active, .tile:active, .portal:active, .aba-n:active, .gr-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--sh-c); transition-duration: .08s; }
.foco-origem { visibility: hidden; }

/* ============ ITENS (cartões) ============ */
.grupo-t { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin: 22px 2px 12px; color: var(--ink-2); }
.grupo-t svg { width: 20px; height: 20px; stroke: #1A1813; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; border: 2px solid var(--line); border-radius: 50%; padding: 2px; background: var(--neutro-soft); }
.grupo-t.c-ruim svg { background: var(--ruim); } .grupo-t.c-ok svg { background: var(--ok); }
.grupo-t:first-of-type { margin-top: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.tile { display: flex; flex-direction: column; text-align: left; padding: 0; border: var(--bw) solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: var(--sh-2); overflow: hidden; color: var(--ink); --gcol: var(--neutro); }
.tile.st-ok { --gcol: var(--ok); } .tile.st-quase { --gcol: var(--quase); } .tile.st-ruim { --gcol: var(--ruim); }
.tl-band { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 2px solid var(--line); background: var(--neutro-soft); color: var(--ink); }
.tile.st-ok .tl-band, .tile.st-quase .tl-band, .tile.st-ruim .tl-band { background: var(--gcol); color: #1A1813; }
.tl-nm { font-weight: 850; font-size: 14.5px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-band svg { width: 20px; height: 20px; stroke: #1A1813; fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; background: #FFFAF0; border: 2px solid #1A1813; border-radius: 50%; padding: 2px; }
.tl-corpo { display: flex; flex-direction: column; padding: 14px 14px 12px; }
.tl-big { font-weight: 900; font-stretch: 80%; font-size: 35px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tl-meta { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); margin-top: 3px; }
.tl-bot { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; font-size: 13.5px; }
.tl-bot b { font-weight: 850; font-variant-numeric: tabular-nums; }
.tl-bot span { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tl-abrir { margin-left: auto; font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: var(--ink-3) !important; transition: transform .2s var(--ease), color .2s; white-space: nowrap; }
.tile:hover .tl-abrir { color: var(--ink) !important; transform: translateX(3px); }

.gauge { position: relative; display: block; height: 16px; border: 2px solid var(--line); border-radius: 5px; background: var(--paper-2); margin: 12px 0 6px; }
.gauge .fill { position: absolute; left: 2px; top: 2px; bottom: 2px; width: 0; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--gcol, var(--accent)) 0 7px, transparent 7px 9px); transition: width 1.15s var(--ease) .15s; }
.reveal.in .gauge .fill, .pronto .gauge .fill, .slide.on .gauge .fill { width: calc(var(--w) - 4px); }
.gauge .mk { position: absolute; top: -7px; bottom: -7px; width: 3px; left: var(--m); background: var(--ink); border-radius: 2px; transform: translateX(-1.5px); }
.gauge .mk::before { content: ""; position: absolute; top: -7px; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--ink); }
.gauge.grande { height: 30px; border-width: var(--bw); border-radius: 8px; margin: 46px 0 40px; }
.gauge.grande .fill { left: 3px; top: 3px; bottom: 3px; background: repeating-linear-gradient(90deg, var(--gcol, var(--accent)) 0 12px, transparent 12px 15px); }
.gauge.grande .mk { top: -12px; bottom: -12px; width: 4px; }
.g-lab { position: absolute; top: calc(100% + 10px); font-family: var(--f-mono); font-size: 11px; font-weight: 700; white-space: nowrap; transform: translateX(-50%); color: var(--ink-2); }
.g-lab.cima { top: auto; bottom: calc(100% + 24px); }
.g-lab.zero { transform: none; left: 0; }

/* ============ FAIXA "PARA ONDE FOI CADA 100 KG" ============ */
.strip-w { position: relative; }
.strip-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.strip-h h3 { margin: 0; font-size: 14px; font-weight: 800; }
.strip-h span { font-size: 12px; color: var(--ink-3); }
.strip { display: flex; height: 66px; border: var(--bw) solid var(--line); border-radius: 12px; overflow: hidden; position: relative; background: var(--paper-2); box-shadow: var(--sh-1); }
.strip .sg { position: relative; min-width: 3px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 7px 8px; overflow: hidden; color: #1A1813; transform-origin: left center; transform: scaleX(0); transition: transform .9s var(--ease), filter .2s ease; cursor: pointer; border-right: 2px solid var(--line); }
.strip .sg:last-child { border-right: 0; }
.strip.in .sg, .pronto .strip .sg { transform: scaleX(1); }
.strip .sg:hover { filter: brightness(1.08) saturate(1.15); }
.strip .sg b { font-weight: 900; font-stretch: 85%; font-size: 18px; line-height: 1; white-space: nowrap; }
.strip .sg span { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .sg.ok { background: var(--ok); } .strip .sg.quase { background: var(--quase); } .strip .sg.ruim { background: var(--ruim); } .strip .sg.neutro { background: var(--neutro); }
.strip .sg.quebra { background: repeating-linear-gradient(135deg, var(--paper-3) 0 5px, var(--paper) 5px 10px); color: var(--ink-2); }
.strip .sg .tick { position: absolute; top: 0; bottom: 0; width: 3px; background: #1A1813; left: var(--m); }
.strip .sg .tick::after { content: ""; position: absolute; top: 0; left: -4px; border: 5.5px solid transparent; border-top-color: #1A1813; }
.strip-leg { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12px; color: var(--ink-2); }
.strip-leg i { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line); border-radius: 3px; margin-right: 6px; vertical-align: -2px; }

/* ============ PORTAIS (painéis que se expandem) ============ */
.portais { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 18px; }
.portal { display: flex; flex-direction: column; gap: 12px; text-align: left; padding: 16px 16px 13px; border: var(--bw) solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: var(--sh-2); color: var(--ink); min-height: 178px; position: relative; overflow: hidden; }
.po-top { display: flex; align-items: center; gap: 11px; }
.po-ic { width: 38px; height: 38px; border-radius: 10px; border: 2px solid var(--line); display: grid; place-items: center; background: var(--paper-2); color: var(--ink); flex: none; }
.po-ic svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.portal.st-ok .po-ic { background: var(--ok); color: #1A1813; } .portal.st-quase .po-ic { background: var(--quase); color: #1A1813; } .portal.st-ruim .po-ic { background: var(--ruim); color: #1A1813; } .portal.st-info .po-ic { background: var(--accent); color: var(--on-accent); }
.po-t { font-weight: 850; font-stretch: 104%; font-size: 15.5px; line-height: 1.2; }
.po-prev { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
.po-big { font-weight: 900; font-stretch: 80%; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.po-big small { font-size: 15px; font-stretch: 100%; color: var(--ink-3); margin-left: 3px; }
.po-txt { font-size: 13px; color: var(--ink-2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.po-mini { height: 40px; color: var(--accent); }
.po-mini .spark, .po-mini .mbar { width: 100%; height: 40px; }
.po-pe { display: flex; align-items: center; justify-content: space-between; font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding-top: 10px; border-top: 2px dashed var(--line-soft); }
.po-pe b { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); transition: color .2s; }
.po-pe b svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.6; transition: transform .25s var(--ease); }
.portal:hover .po-pe b { color: var(--ink); }
.portal:hover .po-pe b svg { transform: translateX(4px); }

.acoes-fim { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 34px; padding: 20px 22px; border: var(--bw) dashed var(--line); border-radius: 16px; background: color-mix(in srgb, var(--paper) 55%, transparent); }
.acoes-fim p { flex: 1; min-width: 220px; margin: 0; color: var(--ink-2); font-size: 14px; }
.acoes-fim p b { color: var(--ink); }

/* ============ LEITURA AUTOMÁTICA ============ */
.leit { display: grid; gap: 12px; }
.leit-i { display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: start; padding: 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); text-align: left; width: 100%; box-shadow: var(--sh-1); color: var(--ink); transition: transform .15s var(--ease), box-shadow .15s; }
.leit-i[data-act]:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--sh-c); }
.leit-i .lic { width: 46px; height: 46px; border-radius: 11px; border: 2px solid var(--line); display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); }
.leit-i .lic svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.leit-i.ok .lic { background: var(--ok); color: #1A1813; } .leit-i.quase .lic { background: var(--quase); color: #1A1813; } .leit-i.ruim .lic { background: var(--ruim); color: #1A1813; }
.leit-i .lt-t { display: block; margin: 0; font-size: 15px; font-weight: 850; line-height: 1.3; }
.leit-i .lt-p { display: block; margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); text-wrap: pretty; }
.leit-i .lt-p b { color: var(--ink); }
.leit-i .go { align-self: center; font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.leit-i .go svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.6; }
.leit-i[data-act]:hover .go { color: var(--ink); }

/* ============ MOSTRADORES (OEE) ============ */
.dials { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
.dialc { text-align: center; padding: 12px 6px 12px; border: 2px solid var(--line); border-radius: 12px; position: relative; background: var(--paper); box-shadow: var(--sh-1); color: var(--ink); transition: transform .15s var(--ease), box-shadow .15s; }
.dialc:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--sh-c); }
.dialc .dial { width: 106px; height: 106px; margin: 0 auto; }
.dialc .dv { position: absolute; left: 0; right: 0; top: 52px; font-weight: 900; font-stretch: 82%; font-size: 17px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.dialc .dn { font-size: 13px; font-weight: 800; margin-top: -8px; }
.dialc .dm { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); }
.dl-out { fill: none; stroke: var(--line); stroke-width: 11; stroke-linecap: round; }
.dl-track { fill: none; stroke: var(--paper-2); stroke-width: 6.5; stroke-linecap: round; }
.dl-val { fill: none; stroke-width: 6.5; stroke-linecap: round; stroke-dasharray: 0 var(--full); transition: stroke-dasharray 1.3s var(--ease); }
.reveal.in .dl-val, .slide.on .dl-val, .pronto .dl-val { stroke-dasharray: var(--len) var(--full); }
.dial.st-ok .dl-val { stroke: var(--ok); } .dial.st-quase .dl-val { stroke: var(--quase); } .dial.st-ruim .dl-val { stroke: var(--ruim); } .dial.st-neutro .dl-val { stroke: var(--accent); }
.dl-meta { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }

/* ============ BARRAS HTML ============ */
.hb { display: grid; gap: 7px; }
.hb-r { display: grid; grid-template-columns: minmax(100px, 160px) 1fr 118px; gap: 14px; align-items: center; font-size: 13.5px; padding: 5px 7px; border-radius: 9px; border: 2px solid transparent; background: none; text-align: left; width: 100%; color: var(--ink); }
button.hb-r { cursor: pointer; transition: background-color .15s, border-color .15s; }
button.hb-r:hover { background: var(--paper-2); border-color: var(--line); }
.hb-r .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.hb-r .vl { text-align: right; font-weight: 850; font-variant-numeric: tabular-nums; }
.hb-r .vl small { display: block; font-family: var(--f-mono); font-weight: 400; color: var(--ink-3); font-size: 11px; }
.hb-t { position: relative; height: 22px; }
.hb-t .zero { position: absolute; top: -5px; bottom: -5px; left: 50%; width: 0; border-left: 2px dashed var(--line-mid); }
.hb-t .b { position: absolute; top: 2px; bottom: 2px; border: 2px solid var(--line); border-radius: 4px; width: 0; transition: width 1s var(--ease); }
.hb-t .b.pos { left: 50%; } .hb-t .b.neg { right: 50%; }
.reveal.in .hb-t .b, .slide.on .hb-t .b, .pronto .hb-t .b { width: var(--w); }
.hb-t .b.ok { background: var(--ok); } .hb-t .b.quase { background: var(--quase); } .hb-t .b.ruim { background: var(--ruim); } .hb-t .b.acc { background: var(--accent); } .hb-t .b.neutro { background: var(--neutro); }
.hb-t.uni { background: var(--paper-2); border-radius: 6px; border: 2px solid var(--line-soft); }
.hb-t.uni .b { left: -2px; right: auto; top: -2px; bottom: -2px; }

/* ============ GRÁFICOS ============ */
.chart { position: relative; width: 100%; }
.chart svg { overflow: visible; }
.chart .grid { stroke: var(--line-soft); stroke-width: 1; stroke-dasharray: 3 4; }
.chart .grid.zero { stroke: var(--line-mid); stroke-dasharray: none; stroke-width: 1.5; }
.chart .ax { fill: var(--ink-3); font-size: 10.5px; font-family: var(--f-mono); }
.chart .ax.nome { fill: var(--ink-2); font-weight: 700; }
.chart .meta-line { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; fill: none; opacity: .8; }
.chart .meta-tx { fill: var(--ink); font-size: 10.5px; font-weight: 700; font-family: var(--f-mono); }
.chart .ln { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart .ln.dash { stroke-dasharray: 6 5 !important; }
.chart .ln.fino { stroke-width: 2; opacity: .95; }
.chart .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.4s var(--ease); }
.chart.in .ln.draw { stroke-dashoffset: 0; }
.chart.in .ln.dash { stroke-dashoffset: 0; }
.chart .area { opacity: 0; transition: opacity 1s ease .4s; }
.chart.in .area { opacity: .13; }
.chart .band { opacity: 0; transition: opacity .8s ease .5s; }
.chart.in .band { opacity: 1; }
.chart .dot { stroke: var(--line); stroke-width: 1.5; opacity: 0; transition: opacity .4s ease .9s; }
.chart.in .dot { opacity: 1; }
.chart .dot.st-ok { fill: var(--ok); } .chart .dot.st-quase { fill: var(--quase); } .chart .dot.st-ruim { fill: var(--ruim); }
.chart .xhair { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 3; opacity: 0; }
.chart .xhair.on { opacity: .7; }
.chart .xdot { stroke: var(--line); stroke-width: 2.5; }
.chart .hit { cursor: crosshair; }
.chart .bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); transition: transform .8s var(--ease); cursor: pointer; stroke: var(--line); stroke-width: 1.5; }
.chart .bar.down { transform-origin: top; }
.chart.in .bar { transform: scaleY(1); }
.chart .bar.st-ok { fill: var(--ok); } .chart .bar.st-quase { fill: var(--quase); } .chart .bar.st-ruim { fill: var(--ruim); } .chart .bar.st-neutro { fill: var(--neutro); }
.chart .bar:hover { filter: brightness(1.1); }
.chart .pt-lab { fill: var(--ink-2); font-size: 12.5px; font-weight: 650; font-family: var(--f-ui); }
.chart .pt-lab.forte { fill: var(--ink); font-weight: 850; }
.chart .pt-val { fill: var(--ink); font-size: 11.5px; font-weight: 700; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.chart .pt-val.pos { fill: var(--ok-ink); } .chart .pt-val.neg { fill: var(--ruim-ink); }
.chart .pt-bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); transition: transform .7s var(--ease); cursor: pointer; stroke: var(--line); stroke-width: 1.5; }
.chart.in .pt-bar { transform: scaleX(1); }
.chart .pt-base { fill: var(--paper-3); } .chart .pt-pos { fill: var(--ok); } .chart .pt-neg { fill: var(--ruim); }
.chart .pt-fim.ok { fill: var(--accent); } .chart .pt-fim.ruim { fill: var(--ruim); }
.chart .pt-link { stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 2 2; }
.chart .reg { stroke: var(--violet); stroke-width: 2.5; stroke-dasharray: 7 5; }
.chart .sc-dot { stroke: var(--line); stroke-width: 1.5; opacity: 0; transition: opacity .5s ease; cursor: pointer; }
.chart.in .sc-dot { opacity: .92; }
.chart.sem-anim * { transition: none !important; }
.chart-vazio { display: grid; place-items: center; color: var(--ink-3); font-family: var(--f-mono); font-size: 12px; background: repeating-linear-gradient(-45deg, var(--paper-2) 0 10px, var(--paper) 10px 20px); border: 2px dashed var(--line-mid); border-radius: 12px; text-align: center; padding: 10px; }
.spark { display: block; overflow: visible; }
.spark .sp-ln { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.spark .sp-meta { stroke: var(--ink-3); stroke-dasharray: 3 3; stroke-width: 1.2; opacity: .8; }
.spark .sp-area { opacity: .16; stroke: none; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); margin-top: 12px; }
.legenda i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
.legenda i.tr { height: 0; border-top: 2.5px dashed var(--ink); background: none !important; }

/* ============ DICA (tooltip) ============ */
#tip { position: fixed; left: 0; top: 0; z-index: 400; max-width: 300px; pointer-events: none; opacity: 0; transition: opacity .15s ease; background: var(--paper); border: 2px solid var(--line); border-radius: 11px; box-shadow: var(--sh-2); padding: 10px 12px; font-size: 12.5px; color: var(--ink); }
#tip.on { opacity: 1; }
#tip.wide { max-width: 360px; }
#tip .tt-h { font-family: var(--f-mono); font-weight: 700; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; margin: -10px -12px 8px; padding: 7px 12px; background: var(--ink); color: var(--inv); border-radius: 8px 8px 0 0; }
#tip .tt-p { color: var(--ink-2); margin: 4px 0; line-height: 1.5; }
#tip .tt-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
#tip .tt-row i { width: 10px; height: 10px; border-radius: 3px; flex: none; border: 1.5px solid var(--line); }
#tip .tt-row.meta i { border: 0; border-top: 2.5px dashed var(--ink); height: 0; width: 12px; border-radius: 0; }
#tip .tt-row span { color: var(--ink-2); flex: 1; }
#tip .tt-row b { font-variant-numeric: tabular-nums; }
#tip .tt-dica { margin-top: 6px; font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; }
#tip .conta { margin: 6px 0 2px; }
#tip.pin { pointer-events: auto; }
#tip .tt-x { display: none; position: absolute; top: 3px; right: 5px; width: 24px; height: 24px; border-radius: 6px; border: 0; background: transparent; color: var(--inv); font-size: 17px; line-height: 22px; padding: 0; cursor: pointer; }
#tip.pin .tt-x { display: block; }
#tip.pin .tt-h { padding-right: 32px; }
#tip .tt-btn { margin-top: 8px; height: 30px; padding: 0 8px; width: 100%; justify-content: flex-start; }
.chart .bar.pinado, .chart .pt-bar.pinado { stroke-width: 3px; }
.chart .sc-dot.pinado { stroke-width: 3px; }

/* ============ CONTA / CUPOM ============ */
.conta { background: var(--paper-2); border: 2px dashed var(--line-mid); border-radius: 10px; padding: 12px 14px; margin: 10px 0; font-size: 13px; line-height: 1.75; color: var(--ink-2); }
.conta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.cupom { position: relative; background: var(--paper); border: 2px solid var(--line); border-radius: 6px; padding: 20px 18px 16px; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.8; box-shadow: var(--sh-2); color: var(--ink); }
.cupom::before { content: ""; position: absolute; left: 12px; right: 12px; top: 7px; border-top: 2px dotted var(--line-mid); }
.cp-h { text-align: center; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 2px dashed var(--line-mid); font-size: 12px; }
.cp-l { display: flex; gap: 8px; align-items: baseline; }
.cp-l span { white-space: nowrap; color: var(--ink-2); }
.cp-l i { flex: 1; min-width: 12px; border-bottom: 2px dotted var(--line-mid); transform: translateY(-4px); }
.cp-l b { white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
.cp-sep { border-top: 2px dashed var(--line-mid); margin: 8px 0; }
.cp-tot span { color: var(--ink); font-weight: 700; }
.cp-tot b { font-size: 15px; }
.cp-pe { text-align: center; margin-top: 10px; font-size: 10.5px; color: var(--ink-3); letter-spacing: .12em; text-transform: uppercase; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--ink-3); }
.kv span:nth-child(even) { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }

/* ============ TABELAS ============ */
.tb-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 2px solid var(--line); border-radius: 11px; background: var(--paper); }
.tb { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.tb th { text-align: left; font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--inv); background: var(--ink); padding: 10px 11px; white-space: nowrap; }
.tb td { padding: 10px 11px; border-bottom: 1.5px solid var(--line-soft); vertical-align: middle; }
.tb tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--paper-2) 70%, transparent); }
.tb tbody tr:last-child td { border-bottom: 0; }
.tb tbody tr { transition: background-color .12s ease; }
.tb tbody tr:hover td { background: var(--paper-3); }
.tb td.n, .tb th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tb .win { font-weight: 900; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }

/* ============ TABELA RDO ============ */
.rdo-wrap { overflow: auto; max-height: calc(100vh - 290px); min-height: 360px; border: var(--bw) solid var(--line); border-radius: 14px; box-shadow: var(--sh-2); background: var(--paper); -webkit-overflow-scrolling: touch; margin-top: 22px; }
.rdo { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 1000px; }
.rdo th, .rdo td { padding: 0; text-align: right; white-space: nowrap; }
.rdo thead th { position: sticky; top: 0; z-index: 3; background: var(--ink); color: var(--inv); padding: 12px 10px 10px; font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.rdo thead th small { display: block; font-weight: 400; opacity: .72; }
.rdo thead th.hoje { background: var(--quase); color: #1A1813; }
.rdo .c-cod { width: 52px; text-align: left; position: sticky; left: 0; z-index: 2; background: var(--paper); }
.rdo .c-item { text-align: left; position: sticky; left: 52px; z-index: 2; background: var(--paper); min-width: 210px; box-shadow: 2px 0 0 var(--line); }
.rdo thead .c-cod, .rdo thead .c-item { z-index: 4; background: var(--ink); }
.rdo td { border-bottom: 1.5px solid var(--line-soft); }
.rdo td > .cel { padding: 8px 10px; font-variant-numeric: tabular-nums; }
.rdo .dcol { min-width: 98px; }
.rdo tr.lin { cursor: pointer; }
.rdo tr.lin:hover td, .rdo tr.lin:hover .c-cod, .rdo tr.lin:hover .c-item { background: var(--paper-2); }
.rdo .cod { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); font-weight: 700; }
.rdo .nm { font-weight: 650; display: flex; align-items: center; gap: 6px; }
.rdo .nm.sub { padding-left: 24px !important; color: var(--ink-2); font-weight: 500; }
.rdo .nm svg { width: 13px; height: 13px; stroke: var(--ink-3); fill: none; stroke-width: 2.6; transition: transform .25s var(--ease); flex: none; }
.rdo tr.lin.aberta .nm svg { transform: rotate(90deg); stroke: var(--ink); }
.rdo tr.lin.aberta td { background: var(--quase-soft); }
.rdo .meta { color: var(--ink-2); font-family: var(--f-mono); font-size: 12px; }
.rdo .pill { display: inline-block; min-width: 66px; padding: 2px 8px; border-radius: 6px; font-weight: 800; border: 1.5px solid; }
.rdo .pill.ok { background: var(--ok-soft); color: var(--ok-ink); border-color: var(--ok); }
.rdo .pill.quase { background: var(--quase-soft); color: var(--quase-ink); border-color: var(--quase); }
.rdo .pill.ruim { background: var(--ruim-soft); color: var(--ruim-ink); border-color: var(--ruim); }
.rdo .acum { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); font-weight: 800; }
.rdo .vazio { color: var(--ink-3); opacity: .5; }
.rdo tr.secao td { background: var(--paper-3); padding: 0; position: sticky; left: 0; border-bottom: 2px solid var(--line); border-top: 2px solid var(--line); }
.rdo tr.secao button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 10px 14px; font-weight: 900; font-stretch: 112%; font-size: 13px; text-transform: uppercase; letter-spacing: .02em; text-align: left; position: sticky; left: 0; color: var(--ink); }
.rdo tr.secao button svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.8; transition: transform .3s var(--ease); }
.rdo tr.secao.fechada button svg { transform: rotate(-90deg); }
.rdo tr.secao button span { font-family: var(--f-mono); font-weight: 400; font-stretch: 100%; text-transform: none; color: var(--ink-3); font-size: 11.5px; }
.rdo tr.det td { background: var(--paper-2); padding: 0; border-bottom: var(--bw) solid var(--line); }
.rdo tr.det .det-in { position: sticky; left: 0; width: min(100vw - 80px, 1100px); padding: 16px 18px 18px; white-space: normal; text-align: left; animation: sobe .4s var(--ease) both; }
.det-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; }
.det-grid h4 { margin: 0 0 6px; font-size: 15px; font-weight: 850; }
.det-grid p { margin: 0 0 6px; color: var(--ink-2); font-size: 13px; }
.rdo .det-in .tb td, .rdo .det-in .tb th { text-align: left; padding: 7px 8px; }
.rdo .det-in .tb td.n, .rdo .det-in .tb th.n { text-align: right; }
.rdo .det-in .tb td { border-bottom: 1.5px solid var(--line-soft); }
.lin-g td { background: var(--paper-2); }

/* ============ FORMULÁRIOS ============ */
.field { display: grid; gap: 6px; margin-bottom: 14px; align-content: start; }
.field label { font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.field small { color: var(--ink-3); font-size: 11.5px; }
.inp, select.inp, textarea.inp { height: 42px; padding: 0 12px; border-radius: 9px; border: 2px solid var(--line); background: var(--paper); font-size: 14px; width: 100%; box-shadow: inset 2px 2px 0 var(--paper-3); transition: box-shadow .15s ease; }
textarea.inp { height: auto; min-height: 130px; padding: 10px 12px; font-family: var(--f-mono); font-size: 12px; resize: vertical; }
.inp:focus { outline: none; box-shadow: 3px 3px 0 var(--accent); }
.sw { position: relative; width: 48px; height: 28px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; border-radius: 8px; background: var(--paper-3); border: 2px solid var(--line); transition: background-color .2s ease; }
.sw span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 5px; background: var(--paper); border: 2px solid var(--line); transition: transform .35s var(--ease-mola); }
.sw input:checked + span { background: var(--ok); }
.sw input:checked + span::after { transform: translateX(20px); }
.sw input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1.5px dashed var(--line-soft); }
.opt:last-child { border-bottom: 0; }
.opt > div { flex: 1; min-width: 0; }
.opt b { display: block; font-size: 14px; font-weight: 750; }
.opt small { color: var(--ink-3); font-size: 12px; }
.opt .inp { width: 110px; }
input[type="range"] { accent-color: var(--accent); }
.drop { display: block; cursor: pointer; border: 3px dashed var(--line); border-radius: 16px; padding: 38px 20px; text-align: center; transition: background-color .2s ease, transform .25s var(--ease); position: relative; background: repeating-linear-gradient(-45deg, var(--paper) 0 14px, var(--paper-2) 14px 28px); }
.drop:hover { transform: scale(1.01); }
.drop.sobre { background: var(--quase-soft); transform: scale(1.02); }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop svg { width: 50px; height: 50px; stroke: var(--ink); fill: none; stroke-width: 1.8; margin: 0 auto 12px; }
.drop h3 { margin: 0 0 4px; font-weight: 900; font-stretch: 115%; font-size: 21px; text-transform: uppercase; }
.drop p { margin: 0; color: var(--ink-2); font-size: 13px; }
.audit { display: grid; gap: 4px; font-size: 12.5px; }
.audit div { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; padding: 6px 9px; border-radius: 7px; }
.audit div:nth-child(odd) { background: var(--paper-2); }
.audit svg { width: 16px; height: 16px; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.audit .ok svg { stroke: var(--ok); } .audit .x svg { stroke: var(--ruim); }
.audit em { font-style: normal; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
details summary { cursor: pointer; }

/* ============ CALENDÁRIO ============ */
.cal { max-width: 700px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .dh { font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); text-align: center; padding-bottom: 2px; }
.cal .dc { aspect-ratio: 1.2; border-radius: 9px; background: var(--paper-2); position: relative; font-family: var(--f-mono); font-size: 11px; font-weight: 700; padding: 5px 7px; color: var(--ink-3); border: 2px solid var(--line-soft); text-align: left; transition: transform .2s var(--ease-mola), box-shadow .2s; }
.cal .dc[data-act] { border-color: var(--line); color: #1A1813; }
.cal .dc[data-act]:hover { transform: translate(-2px, -2px) scale(1.05); box-shadow: 3px 3px 0 var(--sh-c); z-index: 1; }
.cal .dc.ok { background: var(--ok); } .cal .dc.quase { background: var(--quase); } .cal .dc.ruim { background: var(--ruim); } .cal .dc.neutro { background: var(--paper-3); color: var(--ink); }
.cal .dc.fora { visibility: hidden; }
.cal .dc b { position: absolute; right: 6px; bottom: 4px; font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ============ ABAS / ESCOLHAS ============ */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; border-bottom: var(--bw) solid var(--line); padding: 0 6px; }
.tabs button { border: var(--bw) solid var(--line); border-bottom: 0; background: var(--paper-2); padding: 10px 16px 9px; border-radius: 11px 11px 0 0; font-weight: 800; font-size: 13.5px; color: var(--ink-2); position: relative; top: 5px; margin-bottom: calc(-1 * var(--bw)); transition: top .25s var(--ease), background-color .2s, color .2s; }
.tabs button:hover { top: 2px; color: var(--ink); }
.tabs button.on { background: var(--paper); color: var(--ink); top: 0; padding-bottom: 14px; z-index: 1; }
.tabs button.on::before { content: ""; position: absolute; left: 10px; right: 10px; top: 4px; height: 4px; border-radius: 2px; background: var(--quase); }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick button { display: inline-flex; align-items: center; gap: 7px; border: 2px solid var(--line); padding: 6px 13px; border-radius: 99px; background: var(--paper); font-size: 13px; font-weight: 750; color: var(--ink); box-shadow: var(--sh-1); transition: transform .15s var(--ease), box-shadow .15s, background-color .15s, color .15s; }
.pick button:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--sh-c); }
.pick button:active { transform: translate(1px, 1px); box-shadow: none; }
.pick button.on { background: var(--ink); color: var(--inv); }
.pk-dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--line); background: var(--neutro-soft); flex: none; }
.pk-dot.ok { background: var(--ok); } .pk-dot.quase { background: var(--quase); } .pk-dot.ruim { background: var(--ruim); }
.pick button.on .pk-dot { border-color: var(--inv); }

.vazio-grande { text-align: center; padding: 46px 20px; }
.vazio-grande svg { width: 62px; height: 62px; stroke: var(--ink); fill: none; stroke-width: 1.6; margin: 0 auto 14px; padding: 12px; border: 2.5px dashed var(--line); border-radius: 50%; }
.vazio-grande h3 { margin: 0 0 8px; font-weight: 900; font-stretch: 112%; font-size: 21px; }
.vazio-grande p { margin: 0 auto 18px; color: var(--ink-2); max-width: 56ch; }
.big-n { font-weight: 900; font-stretch: 80%; font-size: 38px; letter-spacing: -.01em; line-height: 1.02; font-variant-numeric: tabular-nums; }
.big-n small { font-size: 16px; font-stretch: 100%; color: var(--ink-2); font-weight: 700; }
.stat-l { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px; }
.stats > div { padding-left: 13px; border-left: 4px solid var(--line); }
.prob { position: relative; width: 100%; height: 14px; border-radius: 4px; background: var(--paper-2); border: 2px solid var(--line); overflow: hidden; }
.prob i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width 1.1s var(--ease); }
.reveal.in .prob i, .pronto .prob i { width: var(--w); }
.juntos { background: var(--accent-soft); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; }

/* ============ PERDAS: abas numeradas ============ */
.abas-num { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.aba-n { display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 16px; border: var(--bw) solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: var(--sh-2); color: var(--ink); }
.aba-n .n { width: 42px; height: 42px; border-radius: 11px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 900; font-stretch: 90%; font-size: 21px; background: var(--paper-2); flex: none; transition: background-color .2s; }
.aba-n b { display: block; font-size: 15px; font-weight: 850; line-height: 1.25; }
.aba-n small { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
.aba-n .an-v { display: inline-block; margin-top: 8px; font-family: var(--f-mono); font-weight: 700; font-size: 12.5px; padding: 2px 8px; border-radius: 6px; border: 1.5px solid currentColor; }
.aba-n.on { background: var(--ink); color: var(--inv); box-shadow: 5px 5px 0 var(--quase); transform: translate(-2px, -2px); }
.aba-n.on small { color: var(--inv); opacity: .75; }
.aba-n.on .n { background: var(--quase); color: #1A1813; border-color: var(--inv); }
.aba-n.on:hover { box-shadow: 7px 7px 0 var(--quase); }
.aba-corpo { animation: sobe .45s var(--ease) both; margin-top: 34px; }
.tb .icon-btn { width: 34px; height: 34px; box-shadow: none; }
.fi-bloco .tb td:first-child { white-space: nowrap; }
.seg .cu { display: none; }
.cc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr)); gap: 16px; }
.cc { background: var(--paper); border: var(--bw) solid var(--line); border-radius: 14px; box-shadow: var(--sh-2); padding: 0; position: relative; overflow: hidden; }
.cc-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 10px 14px; border-bottom: 2px solid var(--line); background: var(--paper-2); }
.cc.ok .cc-top { background: var(--ok-soft); } .cc.quase .cc-top { background: var(--quase-soft); } .cc.ruim .cc-top { background: var(--ruim-soft); }
.cc-top b { font-size: 15px; font-weight: 850; }
.cc-b { padding: 14px 14px 14px; }
.cc-v { font-weight: 900; font-stretch: 80%; font-size: 40px; letter-spacing: -.01em; line-height: 1; font-variant-numeric: tabular-nums; }
.cc-v small { font-size: 16px; margin-left: 4px; color: var(--ink-3); font-weight: 700; font-stretch: 100%; }
.cc-cx { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); margin: 4px 0 10px; }
.cc-barras { display: block; width: 100%; border: 2px solid var(--line); background: var(--paper-2); border-radius: 10px; padding: 8px 8px 6px; margin: 2px 0 12px; text-align: left; cursor: pointer; color: inherit; transition: background-color .15s, transform .15s var(--ease), box-shadow .15s; }
.cc-barras:hover { background: var(--quase-soft); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--sh-c); }
.cc-barras span { display: block; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .04em; color: var(--ink-3); margin-top: 5px; text-transform: uppercase; }
.mbar { width: 100%; height: 42px; display: block; }
.mbar .mb-zero { stroke: var(--line-mid); stroke-width: 1; }
.mbar .mb-pos { fill: var(--ok); } .mbar .mb-neg { fill: var(--ruim); }
.cc-seq { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 0; padding: 9px 11px; border-radius: 10px; background: var(--ruim-soft); color: var(--ruim-ink); border: 2px solid var(--ruim); font-size: 12.5px; }
.cc-seq svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.cc .kv { grid-template-columns: minmax(0, 1fr) auto; }
.det-todas { margin-top: 16px; }
.det-todas summary { font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--accent-ink); padding: 4px 0; }
.det-todas .tb-wrap { margin-top: 10px; max-height: 440px; overflow-y: auto; }

/* ============ FICHAS (conteúdo expandido) ============ */
.ficha { display: grid; gap: 22px; }
.fi-topo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 320px); gap: 24px; align-items: stretch; }
.fi-lbl { font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fi-big { font-weight: 900; font-stretch: 78%; font-size: clamp(56px, 7.5vw, 92px); line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -.01em; margin-top: 10px; }
.fi-big.c-ok { color: var(--ok-ink); } .fi-big.c-ruim { color: var(--ruim-ink); } .fi-big.c-quase { color: var(--quase-ink); }
.fi-meta { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.fi-desc { font-size: 15px; color: var(--ink-2); margin: 12px 0 0; max-width: 64ch; line-height: 1.55; }

/* ============ JANELA EXPANDIDA (foco) ============ */

.foco-bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 3px solid var(--line); background-color: var(--paper-2); background-image: repeating-linear-gradient(180deg, var(--line) 0 2px, transparent 2px 6px); background-size: 100% 26px; background-repeat: no-repeat; background-position: center; }

.foco-voltar:hover svg { animation: cutuca .6s var(--ease); }

.foco-tit { flex: 0 1 auto; min-width: 0; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; background: var(--paper-2); padding: 3px 16px; border-radius: 6px; }

.foco-x { width: 42px; height: 42px; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); display: grid; place-items: center; box-shadow: var(--sh-1); flex: none; padding: 0; transition: background-color .15s, transform .15s var(--ease), box-shadow .15s; }

.foco-b { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.foco-in { padding: 24px 26px 30px; }
.foco-win.voando .foco-bar > *, .foco-win.voando .foco-in { opacity: 0; }
.foco-in.pronto > * { animation: sobe .5s var(--ease) both; }
.foco-in.pronto > *:nth-child(2) { animation-delay: .05s; } .foco-in.pronto > *:nth-child(3) { animation-delay: .1s; } .foco-in.pronto > *:nth-child(4) { animation-delay: .15s; } .foco-in.pronto > *:nth-child(5) { animation-delay: .2s; } .foco-in.pronto > *:nth-child(n+6) { animation-delay: .25s; }

/* ============ BALÃO (toast) ============ */
#toast { position: fixed; left: 50%; bottom: 28px; z-index: 410; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--inv); padding: 12px 18px; border-radius: 12px; border: 2px solid var(--line); font-size: 13.5px; font-weight: 700; box-shadow: 4px 4px 0 var(--quase); transition: opacity .25s ease, transform .5s var(--ease-mola); max-width: calc(100vw - 32px); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#present.on ~ #toast { bottom: auto; top: 96px; transform: translate(-50%, -30px); }
#present.on ~ #toast.on { transform: translate(-50%, 0); }
.pr-atalhos { max-width: 1400px; margin: -1.4vh auto 3vh; font-family: var(--f-mono); font-size: 12px; letter-spacing: .04em; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 8px 16px; }

/* ============ BARRA DE ABAS (celular) ============ */
.tabbar { display: none; }

/* ============ APRESENTAÇÃO ============ */
.present { position: fixed; inset: 0; z-index: 150; display: none; flex-direction: column; background-color: var(--bg); background-image: radial-gradient(var(--bg-dot) 1.1px, transparent 1.5px); background-size: 18px 18px; color: var(--ink); }

.pr-topo { display: flex; align-items: center; gap: 16px; padding: 11px 24px; background: var(--placar); color: var(--placar-ink); border-bottom: 3px solid var(--line); font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; flex: none; }

.pr-per { opacity: .78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.pr-prog button { flex: 1; height: 12px; border: 2px solid var(--line); border-radius: 3px; background: var(--paper); padding: 0; position: relative; overflow: hidden; transition: background-color .35s ease; }
.pr-prog button.feito { background: var(--ink); }

.pr-prog button.on.auto::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--quase); animation: autoEnche var(--dur, 12s) linear forwards; }
@keyframes autoEnche { to { width: 100%; } }
.pr-palco { flex: 1; position: relative; overflow: hidden; }
.slide { position: absolute; inset: 0; overflow-y: auto; padding: 3.4vh 5vw 130px; display: flex; flex-direction: column; visibility: hidden; pointer-events: none; }
.slide.on { visibility: visible; pointer-events: auto; }

.slide.sai-esq, .slide.sai-dir { visibility: visible; pointer-events: none; }
.slide.sai-esq { animation: slSaiEsq .55s var(--ease) both; }
.slide.sai-dir { animation: slSaiDir .55s var(--ease) both; }
@keyframes slEntDir { from { clip-path: inset(0 0 0 100%); transform: translateX(80px); } to { clip-path: inset(0 0 0 0); transform: none; } }
@keyframes slEntEsq { from { clip-path: inset(0 100% 0 0); transform: translateX(-80px); } to { clip-path: inset(0 0 0 0); transform: none; } }
@keyframes slSaiEsq { to { opacity: 0; transform: translateX(-90px) scale(.97); } }
@keyframes slSaiDir { to { opacity: 0; transform: translateX(90px) scale(.97); } }
.sl-in { width: 100%; max-width: 1500px; margin: auto; }
.sl-kick { display: flex; align-items: center; gap: 12px; font-family: var(--f-mono); font-size: clamp(12px, 1.05vw, 15px); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 1.8vh; }
.sl-n { background: var(--ink); color: var(--inv); padding: 4px 10px; border-radius: 6px; }
.sl-kick::after { content: ""; flex: 1; border-top: 3px solid var(--line); }
.sl-t { margin: 0 0 3vh; font-weight: 900; font-stretch: 116%; font-size: clamp(28px, 3.7vw, 68px); line-height: 1.0; letter-spacing: -.02em; text-wrap: balance; max-width: 26ch; }
.slide.on .sl-t { animation: titWipe 1s var(--ease) .12s both; }

.s-anim > * { opacity: 0; transform: translateY(20px); transition: opacity .6s var(--ease), transform .6s var(--ease); }

.slide.on .s-anim > *:nth-child(2) { transition-delay: .35s; } .slide.on .s-anim > *:nth-child(3) { transition-delay: .45s; } .slide.on .s-anim > *:nth-child(4) { transition-delay: .55s; } .slide.on .s-anim > *:nth-child(5) { transition-delay: .65s; } .slide.on .s-anim > *:nth-child(6) { transition-delay: .75s; }
.s-card { background: var(--paper); border: var(--bw) solid var(--line); border-radius: 16px; box-shadow: var(--sh-3); padding: 2.6vh 2vw; min-width: 0; }

.s-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 3vw; align-items: start; }

.capa-k { font-family: var(--f-mono); font-size: clamp(13px, 1.15vw, 17px); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.slide .carimbo { font-size: clamp(13px, 1.2vw, 19px); }

/* ============================================================
   TURNO 2: filtro de item, perdas e impacto, descartes do RDO,

/* ---------- filtro de item ---------- */
.f-item { margin-left: auto; }
.f-busca { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 8px 0 11px; border: var(--bw-s) solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); font-weight: 750; font-size: 13px; box-shadow: var(--sh-1); transition: transform .15s var(--ease), box-shadow .15s; }
.f-busca svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }
.f-busca:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--sh-c); background: var(--paper-2); }
.f-busca kbd, .busca-item kbd { font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 5px; display: inline-grid; place-items: center; border: 1.5px solid var(--line-mid); border-radius: 5px; background: var(--paper-2); color: var(--ink-2); }
.f-foco { display: inline-flex; align-items: stretch; border: var(--bw-s) solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 3px 3px 0 var(--quase); background: var(--ink); animation: popIn .45s var(--ease-mola) both; }
.f-foco-nm { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 0; background: var(--ink); color: var(--inv); font-weight: 850; font-size: 13.5px; }

.f-foco-x { width: 38px; display: grid; place-items: center; border: 0; border-left: var(--bw-s) solid var(--line); background: var(--quase); color: #1A1813; padding: 0; transition: background-color .15s; }
.f-foco-x svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.8; stroke-linecap: round; }
.f-foco-x:hover { background: var(--ruim); }
.filtros.com-foco-item { box-shadow: inset 6px 0 0 var(--quase); }
.f-item.on .f-lab { color: var(--ink); }

.busca-item { display: grid; }
.bi-campo { display: flex; align-items: center; gap: 10px; border: var(--bw-s) solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--paper); box-shadow: 3px 3px 0 var(--accent); }

.bi-op:hover, .bi-op.ativo { border-color: var(--line); background: var(--paper-2); transform: translateX(3px); }

/* item em destaque em listas */

/* ---------- perdas e impacto ---------- */
.abas-num.a4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.dois-tipos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; margin-bottom: 22px; }
.tipo-h { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
.tipo-n { width: 40px; height: 40px; border-radius: 10px; border: var(--bw-s) solid var(--line); background: var(--quase); color: #1A1813; display: grid; place-items: center; font-weight: 900; font-size: 20px; flex: none; box-shadow: var(--sh-1); }
.tipo-h b { display: block; font-size: 17px; font-weight: 900; font-stretch: 105%; line-height: 1.25; }

.bdupla i.pro, .tipo-leg i.pro { background: repeating-linear-gradient(135deg, var(--neutro) 0 5px, color-mix(in srgb, var(--neutro) 65%, var(--paper)) 5px 9px); }
.bdupla i.des + i.pro { box-shadow: inset 2px 0 0 var(--line); }
.tipo-leg { display: grid; gap: 7px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.tipo-leg span { display: flex; align-items: center; gap: 8px; }
.tipo-leg i { width: 15px; height: 15px; border: var(--bw-s) solid var(--line); border-radius: 4px; flex: none; }
.tipo-leg b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tipo-lista { display: grid; border: var(--bw-s) solid var(--line); border-radius: 10px; overflow: hidden; }
.tipo-lista > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 12px; border-bottom: 1.5px solid var(--line-soft); }
.tipo-lista > div:nth-child(even) { background: var(--paper-2); }

.bfalta { display: block; width: var(--t); min-width: 46px; }
.bfalta .bdupla { height: 18px; }
.tb-imp tr.lin-imp { cursor: pointer; }

.tb-imp tr.lin-imp:focus-visible td { outline: none; background: var(--accent-soft); }
.tb tr.tot td { border-top: 2.5px solid var(--line); background: var(--paper-2) !important; }
.aviso-desc { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 20px 0 22px; padding: 14px 16px; border: var(--bw) solid var(--line); border-radius: 14px; background: var(--quase-soft); box-shadow: var(--sh-2); font-size: 13.5px; line-height: 1.55; }

.fdr-chamada .fc-ic svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2.2; }

.fdr-destino.local { border-color: var(--quase); background: color-mix(in srgb, var(--quase-soft) 55%, transparent); }

<script>
/* ============================================================
   LEITOR DO RDO (PDF exportado do Excel)
   Recebe os textos de cada página com posição (x, y, largura)
   e devolve um registro por dia que tenha produção.
   ============================================================ */
const RDOParser = (() => {
  function parseNum(raw) {
    const s = String(raw).trim();
    if (!s || s.startsWith('#')) return undefined;
    if (/^\d{1,2}:\d{2}$/.test(s)) return s.padStart(5, '0');
    let t = s.replace('%', '').replace(/\s/g, '');
    if (!/^-?[\d.]+(,\d+)?$/.test(t)) return undefined;
    t = t.replace(/\./g, '').replace(',', '.');
    const n = parseFloat(t);
    return Number.isFinite(n) ? n : undefined;
  }

  function norm(items) {
    return items
      .filter(i => i && typeof i.s === 'string' && i.s.trim())
      .map(i => ({ s: i.s.trim(), x: i.x, y: i.y, w: i.w || 0, cx: i.x + (i.w || 0) / 2 }));
  }

  function nearest(list, v, key, tol) {
    let best = null, bd = Infinity;
    for (const c of list) {
      const d = Math.abs(c[key] - v);
      if (d < bd) { bd = d; best = c; }
    }
    return bd <= tol ? best : null;
  }

  function toISO(dmy) {
    const [d, m, y] = dmy.split('/');
    const yy = y.length === 2 ? '20' + y : y;
    return `${yy}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
  }

  function parsePage1(items) {
    const its = norm(items);
    const tLabel = its.find(i => /^TURNO$/i.test(i.s));
    let turno = null;
    for (const i of its) {
      const m = i.s.match(/^([123])\s*[ºo°]?\s*T(URNO)?$/i);
      if (m && (!tLabel || Math.abs(i.y - tLabel.y) < 8)) { turno = 'T' + m[1]; break; }
    }
    let semana = null;
    const sem = its.find(i => /^SEMANA\s+\d{1,2}$/i.test(i.s));
    if (sem) semana = parseInt(sem.s.replace(/\D/g, ''), 10);

    const dates = its.filter(i => /^\d{2}\/\d{2}\/\d{2,4}$/.test(i.s)).sort((a, b) => a.x - b.x);
    if (!dates.length) throw new Error('Não encontrei as datas do cabeçalho (ex.: 19/10/26) na página 1 do RDO.');
    const headerY = dates[0].y;
    const metaH = its.find(i => /^META$/i.test(i.s) && Math.abs(i.y - headerY) < 30);
    const acumH = its.find(i => /^ACUMULADO$/i.test(i.s));

    const cols = dates.map((d, k) => ({ type: 'day', k, iso: toISO(d.s), cx: d.cx }));
    if (metaH) cols.push({ type: 'meta', cx: metaH.cx });
    if (acumH) cols.push({ type: 'acum', cx: acumH.cx });

    const codeRe = /^[A-Z]{1,2}(\.\d{1,2})?$/;
    const rows = its
      .filter(i => i.x < 75 && i.y > headerY && codeRe.test(i.s))
      .map(i => ({ key: i.s.replace(/\./g, ''), y: i.y }));
    const dorso = its.find(i => /^DORSO$/i.test(i.s) && i.x < 250 && i.y > headerY);
    if (dorso) rows.push({ key: 'DORSO', y: dorso.y });
    const ag3 = its.find(i => /^TEMPERADO MEIO DA ASA$/i.test(i.s));
    if (ag3) rows.push({ key: 'AG3', y: ag3.y });
    if (rows.length < 20) throw new Error('A página 1 não tem a coluna de códigos (N, O, P…) no formato esperado.');

    const xMin = metaH ? metaH.x - 25 : 420;
    const out = { turno, semana, dates: dates.map(d => toISO(d.s)), days: {}, metas: {}, acum: {} };
    out.dates.forEach(iso => (out.days[iso] = {}));

    for (const i of its) {
      if (i.y <= headerY + 2 || i.x < xMin) continue;
      const val = parseNum(i.s);
      if (val === undefined) continue;
      const row = nearest(rows, i.y, 'y', 7);
      if (!row) continue;
      const col = nearest(cols, i.cx, 'cx', 48);
      if (!col) continue;
      if (col.type === 'day') out.days[col.iso][row.key] = val;
      else if (col.type === 'meta') out.metas[row.key] = val;
      else out.acum[row.key] = val;
    }
    return out;
  }

  function parsePage2(items, isoDates) {
    const its = norm(items);
    const dateHdr = its.filter(i => /^\d{1,2}-[a-zç]{3}\.?$/i.test(i.s));
    if (!dateHdr.length) return null;
    const firstY = Math.min(...dateHdr.map(i => i.y));
    const hdr = dateHdr.filter(i => Math.abs(i.y - firstY) < 3).sort((a, b) => a.x - b.x);
    const pctHdr = its.filter(i => Math.abs(i.y - firstY) < 3 && /^%/.test(i.s));
    const acumH = its.find(i => Math.abs(i.y - firstY) < 3 && /^ACUM/i.test(i.s));

    const cols = hdr.map((h, k) => ({ type: 'day', iso: isoDates[k] || null, cx: h.cx }))
      .concat(pctHdr.map(p => ({ type: 'pct', cx: p.cx })));
    if (acumH) cols.push({ type: 'acum', cx: acumH.cx });
    cols.push({ type: 'meta', cx: hdr[0].cx - 45 });

    const codeRe = /^(PP\d{2}|P\d{2}|R\d{2}|\d{1,2}(\.\d{1,2}){0,3})$/;
    const rows = its.filter(i => i.x < 62 && i.y > firstY - 2 && codeRe.test(i.s)).map(i => ({ key: i.s, y: i.y }));

    const out = { days: {}, metas: {} };
    isoDates.forEach(iso => (out.days[iso] = { pp: {}, p: {}, r: {}, nq: {} }));
    for (const i of its) {
      if (i.x < 425) continue;
      const val = parseNum(i.s);
      if (val === undefined || typeof val !== 'number') continue;
