    analisar: { BD: true, BE: true, BG: true, BH: true, BI: true, BL: true, BM: true, BN: true, BO: true, BP: false, DORSO: false, BQ: false }
  };

  /* ---------------- UTILIDADES ---------------- */
  const isNum = v => typeof v === 'number' && Number.isFinite(v);
  const sumObj = o => o ? Object.values(o).reduce((s, v) => s + (isNum(v) ? v : 0), 0) : 0;
  const hm = s => { if (!s || typeof s !== 'string') return null; const m = s.match(/^(\d{1,2}):(\d{2})$/); return m ? (+m[1]) + (+m[2]) / 60 : null; };
  const round = (v, d = 0) => { const p = Math.pow(10, d); return Math.round(v * p) / p; };
  const sRound = v => Math.sign(v) * Math.round(Math.abs(v));

  function parseISO(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12); }
  function toISO(dt) { return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`; }
  function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
  function weekday(iso) { return parseISO(iso).getDay(); }
  function isoWeek(dt) {
    const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
    const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil(((d - y0) / 86400000 + 1) / 7);
  }
  // Semana do RDO: domingo a sábado, numerada pela semana ISO da segunda-feira
  function semanaRDO(iso) { const dom = addDays(iso, -weekday(iso)); return isoWeek(parseISO(addDays(dom, 1))); }
  function inicioSemana(iso) { return addDays(iso, -weekday(iso)); }

  /* ---------------- STATUS / CORES ---------------- */
  function status(val, meta, dir, cfg) {
    if (!isNum(val) || !isNum(meta) || !dir) return 'neutro';
    const tol = (cfg && cfg.amarelo ? cfg.amarelo : 95) / 100;
    if (dir > 0) { if (val >= meta - 1e-9) return 'ok'; if (meta > 0 && val >= meta * tol) return 'quase'; return 'ruim'; }
    if (val <= meta + 1e-9) return 'ok'; if (val <= meta / tol) return 'quase'; return 'ruim';
  }

  /* ---------------- REGISTRO: valores derivados ---------------- */
  function derivar(rec, cfg) {
    const v = rec.v || {};
    const metas = Object.assign({}, METAS_PADRAO, rec.metas || {});
    const d = { id: rec.id, data: rec.data, turno: rec.turno, metas };
    for (const k in v) if (isNum(v[k])) d[k] = v[k];
    d.AS = v.AS; d.AT = v.AT;
    const ini = hm(v.AS), fim = hm(v.AT);
    let janela = (ini != null && fim != null) ? ((fim - ini + 24) % 24) : null;
    if (!janela) janela = null;
    d.janela = janela;
    const ppMin = sumObj(rec.paradasProgramadas), pMin = sumObj(rec.interrupcoes), rMin = sumObj(rec.reducoes);
    d.ppMin = ppMin; d.pMin = pMin; d.rMin = rMin;
    let AU = ppMin > 0 ? ppMin / 60 : (isNum(v.AU) ? v.AU : 0);
    let AV = janela != null ? janela - AU : v.AV;
    if (isNum(v.AV) && isNum(AV) && Math.abs(AV - v.AV) > 0.16) AV = v.AV;
    let AW = pMin > 0 ? pMin / 60 : (isNum(v.AW) ? v.AW : 0);
    let AX = isNum(AV) ? AV - AW : v.AX;
    if (isNum(v.AX) && isNum(AX) && Math.abs(AX - v.AX) > 0.16) AX = v.AX;
    let AY = isNum(v.BU) && isNum(AX) ? v.BU / 100 * AX : v.AY;
    if (isNum(v.AY) && isNum(AY) && Math.abs(AY - v.AY) > 0.16) AY = v.AY;
    Object.assign(d, { AU, AV, AW, AX, AY });
    // kg de cada item
    d.kg = {}; d.metaKg = {};
    for (const it of ITENS) {
      if (isNum(v[it.c]) && isNum(v.S)) d.kg[it.c] = v[it.c] / 100 * v.S;
      if (isNum(metas[it.c]) && isNum(v.S)) d.metaKg[it.c] = metas[it.c] / 100 * v.S;
    }
    d.nq = Object.assign({}, rec.naoQualidade || {});
    // descartes: do RDO (kg ou carcaças) e lançados à parte → kg de produto perdido por item
    // Como cada descarte vira kg de produto de cada item (conta exata, com os números do PRÓPRIO turno):
    //  • peça de um item (ex.: Filé DIF 22 kg) → os 22 kg eram daquele item;
    //  • asa → coxinha, meio e ponta na proporção em que cada um foi produzido no turno (kg reais do RDO);
    //  • carcaça inteira em kg → todos os itens na proporção real do turno (kg do item ÷ kg de todos os itens);
    //  • carcaça em unidades → cada ave vale o que a ave média rendeu no turno em cada item (kg do item ÷ frangos abatidos).
    //  Só se o RDO não trouxer os kg dos itens é que a proporção cai para as metas.
    const pm = isNum(v.S) && v.R ? v.S / v.R : null;
    const comKg = ITENS.filter(i => isNum(d.kg[i.c]) && d.kg[i.c] > 0);
    const real = comKg.length >= 5;
    const peso = c => real ? (d.kg[c] || 0) : (isNum(metas[c]) && metas[c] > 0 ? metas[c] : 0);
    const mItens = ITENS.filter(i => peso(i.c) > 0);
    const somaM = mItens.reduce((t, i) => t + peso(i.c), 0) || 1;
    const asaT = (peso('BG') + peso('BH') + peso('BI')) || 1;
    const distKg = (alvo, q) => { const o = {}; if (alvo === 'carcaca') mItens.forEach(i => (o[i.c] = q * peso(i.c) / somaM)); else if (alvo === 'asa') ['BG', 'BH', 'BI'].forEach(c => (o[c] = q * peso(c) / asaT)); else o[alvo] = q; return o; };
    const distCarc = n => { const o = {}; if (real && v.R) mItens.forEach(i => (o[i.c] = n * (d.kg[i.c] || 0) / v.R)); else if (pm) mItens.forEach(i => (o[i.c] = n * pm * (metas[i.c] || 0) / 100)); return o; };
    d.descBase = real ? 'real' : 'metas';
    d.desc = []; d.descIgnorados = [];
    const addD = (k, n, alvo, un, qtd, porItem, origem, obs, linha) => d.desc.push({ k, n, alvo, un, qtd, kg: Object.values(porItem).reduce((t, x) => t + x, 0), porItem, origem, obs: obs || '', linha: linha || null });
    const temRDO = k => isNum(d.nq[k]) && d.nq[k] > 0;
    const parDe = k => (NQ[k] && NQ[k].par) || Object.keys(NQ).find(x => NQ[x].par === k) || null;
    for (const [k, q] of Object.entries(d.nq)) {
      const def = NQ[k]; if (!def || !isNum(q) || q <= 0) continue;
      if (def.un === 'kg' && def.alvo) addD(k, def.n, def.alvo, 'kg', q, distKg(def.alvo, q), 'RDO', '', k);
      else if (def.par && !temRDO(def.par)) addD(k, def.n, 'carcaca', 'carcacas', q, distCarc(q), 'RDO', '', k);
    }
    const man = (rec._descMan || []).filter(m => isNum(+m.qtd) && +m.qtd > 0);
    const manTem = k => man.some(m => m.linha === k);
    for (const m of man) {
      const qtd = +m.qtd;
      if (m.linha && NQ[m.linha]) {
        // linha do RDO lançada à mão (veio em branco no PDF). Se o RDO trouxer a mesma linha, vale o RDO.
        const def = NQ[m.linha], par = parDe(m.linha);
        if (temRDO(m.linha) || (par && temRDO(par))) { d.descIgnorados.push(m); continue; }
        if (def.un === 'und' && par && manTem(par)) continue; // carcaças e kg da mesma causa: vale o kg
        const und = def.un === 'und';
        addD('man:' + m.id, def.n, und ? 'carcaca' : (def.alvo || 'carcaca'), und ? 'carcacas' : 'kg', qtd, und ? distCarc(qtd) : distKg(def.alvo || 'carcaca', qtd), 'manual', m.obs, m.linha);
        continue;
      }
      const pi = m.un === 'carcacas' ? distCarc(qtd) : distKg(m.alvo, qtd);
      addD('man:' + m.id, m.causa ? `${m.causa} (${nomeAlvo(m.alvo).toLowerCase()})` : nomeAlvo(m.alvo), m.un === 'carcacas' ? 'carcaca' : m.alvo, m.un, qtd, pi, 'manual', m.obs);
    }

    d.pp = Object.assign({}, rec.paradasProgramadas || {});
    d.int = Object.assign({}, rec.interrupcoes || {});
    d.red = Object.assign({}, rec.reducoes || {});
    return d;
  }

  /* ---------------- AGREGAÇÃO (dia, semana, mês, T1+T2...) ---------------- */
  const SOMAS = ['Q', 'R', 'S', 'AI', 'AH', 'X', 'Y', 'Y1', 'Y2', 'Y3', 'Y4', 'Z', 'AA', 'AB', 'AC', 'AC1', 'AC2', 'AC3', 'AE', 'AF', 'AG', 'AG1', 'AG2', 'AG3', 'AN', 'AO', 'AO1', 'AQ', 'AQ1', 'AU', 'AV', 'AW', 'AX', 'AY'];

  function agregar(recs, cfg) {
    cfg = cfg || CFG_PADRAO;
    const ds = recs.map(r => r._d || (r._d = derivar(r, cfg)));
    const a = { n: ds.length, regs: recs, ds, val: {}, meta: {}, kg: {}, metaKg: {}, gapKg: {}, pp: {}, int: {}, red: {}, nq: {} };
    if (!ds.length) return a;
    const V = a.val;
    for (const k of SOMAS) { let s = 0, any = false; for (const d of ds) if (isNum(d[k])) { s += d[k]; any = true; } if (any) V[k] = s; }
    // plano: do dia (não soma turnos)
    const porDia = {};
    for (const d of ds) { (porDia[d.data] = porDia[d.data] || []).push(d); }
    a.dias = Object.keys(porDia).sort();
    a.turnos = [...new Set(ds.map(d => d.turno))].sort();
    let N = 0, anyN = false;
    for (const dia of a.dias) {
      const ns = porDia[dia].map(d => d.N).filter(isNum);
      if (ns.length) { anyN = true; N += cfg.planoCompartilhado ? Math.max(...ns) : ns.reduce((s, x) => s + x, 0); }
    }
    if (anyN) V.N = N;
    const S = V.S || 0;
    // itens (ponderado pelo peso vivo)
    for (const it of ITENS) {
      let kg = 0, mk = 0, gap = 0, any = false, anyM = false;
      for (const d of ds) {
        if (isNum(d.kg[it.c])) { kg += d.kg[it.c]; any = true; }
        if (isNum(d.metaKg[it.c])) { mk += d.metaKg[it.c]; anyM = true; }
        if (isNum(d.kg[it.c]) && isNum(d.metaKg[it.c])) gap += d.kg[it.c] - d.metaKg[it.c];
      }
      if (any && S) { a.kg[it.c] = kg; V[it.c] = kg / S * 100; }
      if (anyM && S) { a.metaKg[it.c] = mk; a.meta[it.c] = mk / S * 100; }
      if (any && anyM) a.gapKg[it.c] = gap;
    }
    // rendimento de cortes e quebra
    const wavg = (k) => { let s = 0, w = 0; for (const d of ds) if (isNum(d[k]) && isNum(d.S)) { s += d[k] * d.S; w += d.S; } return w ? s / w : undefined; };
    const wmeta = (k) => { let s = 0, w = 0; for (const d of ds) if (isNum(d.metas[k]) && isNum(d.S)) { s += d.metas[k] * d.S; w += d.S; } return w ? s / w : undefined; };
    V.BA = wavg('BA');
    if (!isNum(V.BA)) { const s = ITENS.reduce((t, it) => t + (V[it.c] || 0), 0); if (s) V.BA = s; }
    if (isNum(V.BA)) V.BB = 100 - V.BA;
    a.meta.BA = wmeta('BA'); a.meta.BB = isNum(a.meta.BA) ? 100 - a.meta.BA : undefined;
    // pés A/B ponderado pelos kg de pés
    let wp = 0, sa = 0, sb = 0;
    for (const d of ds) { const w = d.kg.BO || 0; if (w && isNum(d.AK)) { sa += d.AK * w; sb += (isNum(d.AL) ? d.AL : 100 - d.AK) * w; wp += w; } }
    if (wp) { V.AK = sa / wp; V.AL = sb / wp; }
    if (ds.length === 1) { if (isNum(ds[0].AK)) V.AK = ds[0].AK; if (isNum(ds[0].AL)) V.AL = ds[0].AL; if (isNum(ds[0].AM)) V.AM = ds[0].AM; }
    // calculados
    if (isNum(V.N) && isNum(V.R)) { V.O = V.R - V.N; V.P = V.N ? V.R / V.N * 100 : undefined; }
    if (isNum(V.Q) && V.Q) V.T = V.R / V.Q * 100;
    if (V.R) V.U = S / V.R;
    if (V.AX) V.V = V.R / V.AX;
    if (S) { V.AJ = V.AI / S * 100; V.BV = V.AJ; }
    if (V.AH) { if (isNum(V.AO)) V.AP = V.AO / V.AH * 100; if (isNum(V.AQ)) V.AR = V.AQ / V.AH * 100; }
    if (V.AV) V.BT = V.AX / V.AV * 100;
    if (V.AX) V.BU = V.AY / V.AX * 100;
    if (V.AV) V.BW = V.AY / V.AV * 100;
    if (isNum(V.BT) && isNum(V.BU) && isNum(V.BV)) V.BX = V.BT * V.BU * V.BV / 10000;
    if (isNum(V.AX) && isNum(V.AY)) V.AZ = V.AX - V.AY;
    if (ds.length === 1) { // num registro único mostramos exatamente o que veio no RDO
      for (const k of ['P', 'T', 'U', 'V', 'AJ', 'BT', 'BU', 'BV', 'BW', 'BX', 'BA', 'BB', 'O']) if (isNum(ds[0][k])) V[k] = ds[0][k];
      for (const it of ITENS) if (isNum(ds[0][it.c])) V[it.c] = ds[0][it.c];
      V.AS = ds[0].AS; V.AT = ds[0].AT;
    }
    // metas dos indicadores: do registro mais recente
    const last = ds.slice().sort((x, y) => (x.data + x.turno).localeCompare(y.data + y.turno)).pop();
    for (const k of ['N', 'P', 'T', 'AJ', 'AK', 'AL', 'AM', 'BT', 'BU', 'BV', 'BW', 'BX', '4.1', '5']) if (isNum(last.metas[k])) a.meta[k] = last.metas[k];
    if (isNum(a.meta.N) && a.dias.length > 1) a.meta.N = undefined;
    // paradas e qualidade
    for (const d of ds) {
      for (const [k, m] of Object.entries(d.pp)) if (isNum(m)) a.pp[k] = (a.pp[k] || 0) + m;
      for (const [k, m] of Object.entries(d.int)) if (isNum(m)) a.int[k] = (a.int[k] || 0) + m;
      for (const [k, m] of Object.entries(d.red)) if (isNum(m)) a.red[k] = (a.red[k] || 0) + m;
      for (const [k, m] of Object.entries(d.nq)) if (isNum(m)) a.nq[k] = (a.nq[k] || 0) + m;
    }
    a.ppMin = sumObj(a.pp); a.intMin = sumObj(a.int); a.redMin = sumObj(a.red);
    a.desc = ds.flatMap(d => d.desc || []);
    a.descKg = a.desc.reduce((t, x) => t + x.kg, 0);
    a.mort = a.nq['4.1'] || 0;
    a.mortPct = V.R ? a.mort / V.R * 100 : undefined;
    a.ritmo = V.AY ? V.R / V.AY : undefined; // frangos/h no ritmo padrão
    return a;
  }

  /* ---------------- ITENS: kg, caixas, status ---------------- */
  function caixas(gapKg, pesoCx) {
    if (!isNum(gapKg) || !pesoCx) return null;
    if (Math.abs(gapKg) < pesoCx) return null; // menos de 1 caixa: mostra só kg
    return sRound(gapKg / pesoCx);
  }

  function analisarItens(a, cfg) {
    cfg = cfg || CFG_PADRAO;
    return ITENS.map(it => {
      const real = a.val[it.c], meta = a.meta[it.c];
      const analisa = cfg.analisar && cfg.analisar[it.c] !== undefined ? cfg.analisar[it.c] : it.analisa;
      const pesoCx = (cfg.caixas && cfg.caixas[it.c]) || it.cx;
      const gapKg = a.gapKg[it.c];
      const st = analisa ? status(real, meta, 1, cfg) : 'neutro';
      return {
        c: it.c, n: it.n, grupo: it.grupo, analisa, real, meta, pesoCx,
        kg: a.kg[it.c], metaKg: a.metaKg[it.c], gapKg,
        gapKgR: isNum(gapKg) ? sRound(gapKg) : null,
        cx: analisa ? caixas(gapKg, pesoCx) : null,
        pp: isNum(real) && isNum(meta) ? real - meta : null,
        status: st, fechou: analisa && isNum(gapKg) ? gapKg >= -1e-9 : null,
        tem: isNum(real)
      };
    });
  }

  /* ---------------- PONTE DO RENDIMENTO DE CORTES ---------------- */
  function ponte(a) {
    const S = a.val.S; if (!S || !isNum(a.val.BA)) return null;
    const passos = [];
    const add = (rot, real, meta, codes) => { if (!isNum(real) || !isNum(meta)) return; const pp = real - meta; passos.push({ rot, pp, kg: pp / 100 * S, codes }); };
    for (const it of ITENS) {
      if (['BP', 'DORSO'].includes(it.c)) continue;
      if (!isNum(a.val[it.c]) && !isNum(a.meta[it.c])) continue;
      add(it.n, a.val[it.c] || 0, a.meta[it.c] || 0, [it.c]);
    }
    const cmsR = (a.val.BP || 0) + (a.val.DORSO || 0), cmsM = (a.meta.BP || 0) + (a.meta.DORSO || 0);
    if (cmsR || cmsM) add('CMS + Dorso', cmsR, cmsM, ['BP', 'DORSO']);
    return { inicio: a.meta.BA, fim: a.val.BA, passos, S };
  }

  /* ---------------- IMPACTO DAS PERDAS ---------------- */
  function impacto(a, cfg) {
    cfg = cfg || CFG_PADRAO;
    const V = a.val, S = V.S || 0;
    if (!S || !V.R) return null;
    const pesoMedio = S / V.R;
    const rendInd = isNum(V.AI) && S ? V.AI / S : (isNum(V.BA) ? V.BA / 100 : 0.83);
    const ritmo = a.ritmo || (V.AX ? V.R / V.AX : null); // fr/h
    const itensMeta = ITENS.filter(i => isNum(V[i.c]) || isNum(a.meta[i.c]));
    const somaMetas = itensMeta.reduce((s, i) => s + a.meta[i.c], 0) || 1;
    const porItemDeVivo = (kgVivo) => Object.fromEntries(itensMeta.map(i => [i.c, kgVivo * (isNum(V[i.c]) ? V[i.c] : a.meta[i.c]) / 100]));
    const volume = (min, fator) => {
      if (!min || !ritmo) return null;
      const fr = min / 60 * ritmo * fator; const kgVivo = fr * pesoMedio;
      return { min, fr, kgVivo, kgProd: kgVivo * rendInd, itens: porItemDeVivo(kgVivo) };
    };
    const res = {
      pesoMedio, rendInd, ritmo,
      interrupcoes: volume(a.intMin, 1),
      reducoes: volume(a.redMin, (cfg.fatorReducao || 50) / 100),
      mortalidade: a.mort ? { und: a.mort, pct: a.mortPct, meta: a.meta['4.1'], kgVivo: a.mort * pesoMedio, kgProd: a.mort * pesoMedio * rendInd, itens: porItemDeVivo(a.mort * pesoMedio) } : null,
      descartes: { porItem: {}, totalKg: 0, linhas: [] }
    };
    // descartes (RDO + lançados à parte) → itens
    const grupos = new Map();
    for (const x of a.desc || []) {
      res.descartes.totalKg += x.kg;
      for (const [c, kg] of Object.entries(x.porItem)) res.descartes.porItem[c] = (res.descartes.porItem[c] || 0) + kg;
      const key = x.linha ? `${x.origem === 'manual' ? 'm' : 'r'}|${x.linha}` : x.origem === 'manual' ? `m|${x.n}|${x.alvo}|${x.un}` : `r|${x.k}`;
      const g = grupos.get(key) || { k: x.k, n: x.n, alvo: x.alvo, un: x.un, qtd: 0, kg: 0, origem: x.origem, linha: x.linha || null, porItem: {} };
      g.qtd += x.qtd; g.kg += x.kg; for (const [c, kg] of Object.entries(x.porItem)) g.porItem[c] = (g.porItem[c] || 0) + kg; grupos.set(key, g);
    }
    res.descartes.linhas = [...grupos.values()];
    // simulação: sem descartes o item fecharia?
    res.simulacao = analisarItens(a, cfg).filter(i => i.analisa && i.tem).map(i => {
      const rec = res.descartes.porItem[i.c] || 0;
      const realSem = i.real + rec / S * 100;
      return { c: i.c, n: i.n, real: i.real, meta: i.meta, recKg: rec, realSem, gapSem: (i.gapKg || 0) + rec, fechouAntes: i.fechou, fechariaSem: (i.gapKg || 0) + rec >= 0 };
    });
    // contaminações
    let cont = 0;
    for (const sub of ['5.1', '5.2']) {
      if (isNum(a.nq[sub])) { cont += a.nq[sub]; continue; }
      const c1 = isNum(a.nq[sub + '.1']) ? a.nq[sub + '.1'] : ['.1.1', '.1.2', '.1.3'].reduce((s, x) => s + (a.nq[sub + x] || 0), 0);
      cont += c1 + (a.nq[sub + '.2'] || 0) + (a.nq[sub + '.3'] || 0);
    }
    res.contaminacao = { und: cont, pct: V.R ? cont / V.R * 100 : 0, meta: a.meta['5'] };
    return res;
  }

  /* ---------------- AUDITORIA DO LANÇAMENTO ---------------- */
  function auditar(rec) {
    const v = rec.v || {}, out = [];
    const chk = (nome, ok, det) => out.push({ nome, ok: !!ok, det });
    const near = (x, y, tol) => isNum(x) && isNum(y) && Math.abs(x - y) <= tol;
    const fmt = (x, d = 2) => isNum(x) ? x.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
    chk('Data e turno', /^\d{4}-\d{2}-\d{2}$/.test(rec.data || '') && /^T[123]$/.test(rec.turno || ''), `${rec.data || '?'} · ${rec.turno || '?'}`);
    chk('Tem frangos e peso abatido', v.R > 0 && v.S > 0, `R = ${fmt(v.R, 0)} · S = ${fmt(v.S, 0)} kg`);
    if (isNum(v.AI) && isNum(v.S) && isNum(v.AJ)) chk('Rendimento industrial = AI ÷ S', near(v.AI / v.S * 100, v.AJ, 0.02), `${fmt(v.AI / v.S * 100)}% calculado · ${fmt(v.AJ)}% no RDO`);
    if (isNum(v.R) && isNum(v.Q) && isNum(v.T)) chk('Programação = R ÷ Q', near(v.R / v.Q * 100, v.T, 0.15), `${fmt(v.R / v.Q * 100, 1)}% · ${fmt(v.T, 1)}%`);
    if (isNum(v.R) && isNum(v.N) && isNum(v.O)) chk('Diferença do plano = R − N', near(v.R - v.N, v.O, 1.5), `${fmt(v.R - v.N, 0)} · ${fmt(v.O, 0)}`);
    if (isNum(v.S) && isNum(v.R) && isNum(v.U)) chk('Peso médio = S ÷ R', near(v.S / v.R, v.U, 0.012), `${fmt(v.S / v.R, 3)} kg · ${fmt(v.U, 3)} kg`);
    const cxParts = ['X', 'Y', 'Z', 'AA', 'AB', 'AC', 'AE', 'AF', 'AG'].reduce((s, k) => s + (isNum(v[k]) ? v[k] : 0), 0);
    if (isNum(v.AH)) chk('Total de caixas = soma das linhas', near(cxParts, v.AH, 2), `${fmt(cxParts, 0)} · ${fmt(v.AH, 0)}`);
    const yParts = ['Y1', 'Y2', 'Y3', 'Y4'].reduce((s, k) => s + (isNum(v[k]) ? v[k] : 0), 0);
    if (isNum(v.Y) && yParts) chk('Coxa/sobrecoxa = Leg + Shawarma + BL + Coxa', near(yParts, v.Y, 1), `${fmt(yParts, 0)} · ${fmt(v.Y, 0)}`);
    const soma = ITENS.reduce((s, it) => s + (isNum(v[it.c]) ? v[it.c] : 0), 0);
    if (isNum(v.BA)) chk('Rendimento de cortes = soma dos itens', near(soma, v.BA, 0.012), `${fmt(soma, 3)}% · ${fmt(v.BA, 3)}%`);
    if (isNum(v.BA) && isNum(v.BB)) chk('Quebra = 100 − rend. de cortes', near(100 - v.BA, v.BB, 0.003), `${fmt(100 - v.BA, 3)}% · ${fmt(v.BB, 3)}%`);
    if (isNum(v.BT) && isNum(v.BU) && isNum(v.BV) && isNum(v.BX)) chk('OEE = Utilização × Eficiência × Rendimento', near(v.BT * v.BU * v.BV / 10000, v.BX, 0.06), `${fmt(v.BT * v.BU * v.BV / 10000)}% · ${fmt(v.BX)}%`);
    const ppMin = sumObj(rec.paradasProgramadas);
    if (ppMin && isNum(v.AU)) chk('Paradas programadas (min) batem com as horas', near(ppMin / 60, v.AU, 0.06), `${fmt(ppMin, 0)} min = ${fmt(ppMin / 60, 2)} h · ${fmt(v.AU, 1)} h`);
    const ini = hm(v.AS), fim = hm(v.AT);
    if (ini != null && fim != null && isNum(v.AV)) { const j = (fim - ini + 24) % 24; chk('Horas disponíveis = janela − paradas programadas', near(j - (ppMin ? ppMin / 60 : (v.AU || 0)), v.AV, 0.11), `${fmt(j - (ppMin ? ppMin / 60 : (v.AU || 0)), 2)} h · ${fmt(v.AV, 1)} h`); }
    const pMin = sumObj(rec.interrupcoes);
    if (isNum(v.AW)) chk('Interrupções (min) batem com as horas', pMin ? near(pMin / 60, v.AW, 0.06) : v.AW < 0.06, `${fmt(pMin, 0)} min · ${fmt(v.AW, 1)} h`);
    const m = (rec.naoQualidade || {})['4.1'];
    if (isNum(m)) chk('Mortalidade menor que os abatidos', m < (v.R || 0), `${fmt(m, 0)} und`);
    const fora = ITENS.filter(it => isNum(v[it.c]) && (v[it.c] < 0 || v[it.c] > 40)).map(i => i.n);
    chk('Percentuais dos itens em faixa normal (0–40%)', !fora.length, fora.length ? fora.join(', ') : 'ok');
    return out;
  }

  /* ---------------- ESTATÍSTICA E PREVISÃO ---------------- */
  function media(xs) { return xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : undefined; }
  function desvio(xs) { if (xs.length < 2) return undefined; const m = media(xs); return Math.sqrt(xs.reduce((s, x) => s + (x - m) ** 2, 0) / (xs.length - 1)); }
  function regressao(xs, ys) {
    const n = xs.length; if (n < 2) return null;
    const mx = media(xs), my = media(ys);
    let sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; syy += (ys[i] - my) ** 2; }
    if (!sxx) return null;
    const b = sxy / sxx, a = my - b * mx, r = syy ? sxy / Math.sqrt(sxx * syy) : 0;
    return { a, b, r, r2: r * r, n };
  }
  function normCdf(z) { const t = 1 / (1 + 0.2316419 * Math.abs(z)); const d = 0.3989423 * Math.exp(-z * z / 2); let p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }

  // Holt com tendência amortecida: previsão de 1..h passos à frente
  function prever(valores, h = 1) {
    const ys = valores.filter(isNum);
    if (ys.length < 4) return null;
    const al = 0.45, be = 0.15, phi = 0.85;
    let lvl = ys[0], tr = (ys[Math.min(3, ys.length - 1)] - ys[0]) / Math.min(3, ys.length - 1);
    const erros = [];
    for (let i = 1; i < ys.length; i++) {
      const prev = lvl + phi * tr; erros.push(ys[i] - prev);
      const nl = al * ys[i] + (1 - al) * prev;
      tr = be * (nl - lvl) + (1 - be) * phi * tr; lvl = nl;
    }
    const sd = Math.max(desvio(erros.slice(-20)) || 0, (desvio(ys) || 0) * 0.35, 1e-6);
    const out = []; let damp = 0;
    for (let k = 1; k <= h; k++) { damp += Math.pow(phi, k); out.push(lvl + damp * tr); }
    return { valores: out, sd, nivel: lvl, tendencia: tr, n: ys.length };
  }
  function chance(meta, mu, sd, dir = 1) { if (!isNum(meta) || !isNum(mu) || !sd) return undefined; const z = (meta - mu) / sd; return dir > 0 ? 1 - normCdf(z) : normCdf(z); }

  /* ---------------- FORMATAÇÃO ---------------- */
  const nf = {};
  function num(v, d = 0) {
    if (!isNum(v)) return '—';
    const k = 'd' + d; nf[k] = nf[k] || new Intl.NumberFormat('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
    const s = nf[k].format(v);
    return s === '-0' || /^-0(,0+)?$/.test(s) ? s.slice(1) : s;
  }
  const pct = (v, d = 2) => isNum(v) ? num(v, d) + '%' : '—';
  const sinal = (v, d = 0) => isNum(v) ? (v > 0 ? '+' : v < 0 ? '−' : '') + num(Math.abs(v), d) : '—';
  const kg = (v, comSinal = true) => isNum(v) ? (comSinal ? sinal(sRound(v)) : num(v, 0)) + ' kg' : '—';
  function fmtLinha(c, v) {
    const l = L[c]; if (!l) return isNum(v) ? num(v, 2) : (v || '—');
    if (l.un === 'hora') return v || '—';
    if (!isNum(v)) return '—';
    if (l.un === '%') return pct(v, l.dec);
    return num(v, l.dec);
  }
  const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  const DIAS_LONGOS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const MESES_C = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const dm = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '';
  const diaCurto = iso => `${DIAS[weekday(iso)]} ${dm(iso)}`;

  /* ---------------- RESUMO PARA WHATSAPP ---------------- */
  function resumoWhats(a, titulo, cfg) {
    const its = analisarItens(a, cfg).filter(i => i.analisa && i.tem && isNum(i.gapKg));
    const lin = i => `• ${i.n}: ${sinal(i.gapKg)} kg${i.cx != null ? ` (${i.cx > 0 ? '+' : '-'}${Math.abs(i.cx)} cx)` : ''}`.replace('−', '-');
    const ok = its.filter(i => i.fechou), nok = its.filter(i => !i.fechou);
    const bola = (v, m, dir) => ({ ok: '🟢', quase: '🟡', ruim: '🔴', neutro: '⚪' })[status(v, m, dir, cfg)];
    const V = a.val, M = a.meta;
    const linhas = [`📋 *${titulo}*`, ''];
    if (ok.length) { linhas.push('✅ *FECHARAM*'); ok.forEach(i => linhas.push(lin(i))); linhas.push(''); }
    if (nok.length) { linhas.push('❌ *NÃO FECHARAM*'); nok.forEach(i => linhas.push(lin(i))); linhas.push(''); }
    linhas.push('📊 *DESEMPENHO*');
    const ind = [['BT', 'Utilização', 2], ['BU', 'Eficiência', 2], ['BV', 'Rendimento', 2], ['BA', 'Rend. de cortes', 3], ['BW', 'Produtividade', 2], ['BX', 'OEE', 2]];
    for (const [c, n, d] of ind) if (isNum(V[c])) linhas.push(`${bola(V[c], M[c], 1)} ${n}: ${pct(V[c], d)}`);
    return linhas.join('\n').replace(/−/g, '-');
  }

  /* ---------------- LEITURA AUTOMÁTICA (frases) ---------------- */
  function leitura(ctx) {
    const { a, cfg, anterior, serieItens, rotulo } = ctx;
    const out = [];
    if (!a || !a.n) return out;
    const its = analisarItens(a, cfg).filter(i => i.analisa && i.tem && isNum(i.gapKg));
    const ok = its.filter(i => i.fechou), nok = its.filter(i => !i.fechou);
    const saldo = its.reduce((s, i) => s + i.gapKg, 0);
    if (its.length) {
      const pior = nok.slice().sort((x, y) => x.gapKg - y.gapKg)[0];
      const melhor = ok.slice().sort((x, y) => y.gapKg - x.gapKg)[0];
      out.push({
        tom: nok.length === 0 ? 'ok' : saldo >= 0 ? 'quase' : 'ruim', icone: 'balanca',
        titulo: `${ok.length} de ${its.length} itens fecharam`,
        texto: `Somando ganhos e perdas dos itens, o saldo ficou em <b>${kg(saldo)}</b>${pior ? `. A maior perda foi <b>${pior.n}</b> (${kg(pior.gapKg)}${pior.cx != null ? `, ${sinal(pior.cx)} cx` : ''})` : ''}${melhor ? `; o maior ganho foi <b>${melhor.n}</b> (${kg(melhor.gapKg)})` : ''}.`,
        ir: pior ? { view: 'itens', item: pior.c } : null
      });
    }
    const p = ponte(a);
    if (p && p.passos.length) {
      const analis = p.passos.filter(s => s.codes.every(c => (cfg.analisar && cfg.analisar[c] !== undefined) ? cfg.analisar[c] : (ITEM[c] && ITEM[c].analisa)));
      const outros = p.passos.filter(s => !analis.includes(s));
      const neg = analis.filter(s => s.pp < 0).sort((x, y) => x.pp - y.pp);
      const pos = analis.filter(s => s.pp > 0).sort((x, y) => y.pp - x.pp);
      const fechou = p.fim >= p.inicio;
      const fmtS = s => `${s.rot} (${sinal(s.pp, 3)} p.p.)`;
      const txtPos = pos.slice(0, 2).map(fmtS).join(' e ');
      const txtNeg = neg.slice(0, 2).map(fmtS).join(' e ');
      const txtOut = outros.filter(s => Math.abs(s.pp) >= 0.001).map(fmtS).join(' e ');
      out.push({
        tom: fechou ? 'ok' : status(p.fim, p.inicio, 1, cfg), icone: 'ponte',
        titulo: `Rendimento de cortes ${fechou ? 'fechou' : 'não fechou'}: ${pct(p.fim, 3)} contra ${pct(p.inicio, 3)}`,
        texto: [txtPos && `Puxaram para cima: ${txtPos}.`, txtNeg && `Puxaram para baixo: ${txtNeg}.`, txtOut && `Fora dos itens analisados: ${txtOut}.`].filter(Boolean).join(' ') + ` Cada 0,1 p.p. aqui vale ${kg(p.S * 0.001, false)}.`,
        ir: { view: 'painel', ancora: 'ponte' }
      });
    }
    const V = a.val, M = a.meta;
    if (isNum(V.BX)) {
      const comps = [['BT', 'utilização'], ['BU', 'eficiência'], ['BV', 'rendimento']].filter(([c]) => isNum(V[c]) && isNum(M[c]));
      const fraco = comps.map(([c, n]) => ({ n, r: V[c] / M[c] })).sort((x, y) => x.r - y.r)[0];
      out.push({
        tom: status(V.BX, M.BX, 1, cfg), icone: 'oee',
        titulo: `OEE de ${pct(V.BX)} (meta ${pct(M.BX)})`,
        texto: fraco ? `O OEE multiplica utilização × eficiência × rendimento. O componente mais perto do limite foi a <b>${fraco.n}</b> (${num(fraco.r * 100, 1)}% da meta).` : '',
        ir: { view: 'painel', ancora: 'desempenho' }
      });
    }
    if (isNum(V.P) && a.dias && a.dias.length) {
      out.push({
        tom: status(V.P, 100, 1, cfg), icone: 'volume',
        titulo: `${num(V.R)} frangos abatidos (${pct(V.P, 1)} do plano)`,
        texto: `Peso médio de <b>${num(V.U, 3)} kg</b> e ritmo de <b>${num(V.V)} frangos/h</b>.${a.turnos.length === 1 && cfg.planoCompartilhado ? ' O plano é do dia todo, então um turno sozinho fica perto de metade dele.' : ''}`,
        ir: null
      });
    }
    const imp = impacto(a, cfg);
    if (imp) {
      const partes = [];
      if (imp.interrupcoes) partes.push(`${num(imp.interrupcoes.min)} min de interrupção (≈ ${num(imp.interrupcoes.fr)} frangos a menos)`);
      if (imp.reducoes) partes.push(`${num(imp.reducoes.min)} min de redução de velocidade (≈ ${num(imp.reducoes.fr)} frangos)`);
      if (imp.mortalidade) partes.push(`${num(imp.mortalidade.und)} mortos no transporte (${pct(imp.mortalidade.pct, 3)}, meta ${pct(imp.mortalidade.meta, 2)})`);
      if (imp.descartes.totalKg) partes.push(`${kg(imp.descartes.totalKg, false)} descartados`);
      if (partes.length) {
        const salvaria = imp.simulacao.filter(s => !s.fechouAntes && s.fechariaSem).map(s => s.n);
        out.push({
          tom: salvaria.length ? 'quase' : 'info', icone: 'perdas',
          titulo: 'Perdas do período',
          texto: partes.join(' · ') + '.' + (salvaria.length ? ` Sem os descartes, <b>${salvaria.join(', ')}</b> teria(m) fechado.` : ' Paradas e mortalidade tiram volume, não mudam o % do item.'),
          ir: { view: 'perdas' }
        });
      }
    }
    if (serieItens) {
      const seq = [];
      for (const it of its) {
        const s = serieItens[it.c]; if (!s || s.length < 3) continue;
        let k = 0; for (let i = s.length - 1; i >= 0; i--) { if (s[i].ok === it.fechou) k++; else break; }
        if ((!it.fechou && k >= 3) || (it.fechou && k >= 5)) seq.push({ it, k });
      }
      seq.sort((x, y) => (x.it.fechou - y.it.fechou) || (y.k - x.k));
      const neg = seq.filter(x => !x.it.fechou), pos = seq.filter(x => x.it.fechou);
      if (neg.length) out.push({ tom: 'ruim', icone: 'desce', titulo: neg.length === 1 ? `${neg[0].it.n}: ${neg[0].k} ${rotulo || 'lançamentos'} seguidos sem fechar` : `Sequências sem fechar: ${neg.map(x => `${x.it.n} (${x.k})`).join(', ')}`, texto: 'Já não é um dia ruim isolado: é tendência. O número entre parênteses é quantos ' + (rotulo || 'lançamentos') + ' seguidos o item ficou abaixo da meta.', ir: { view: 'itens', item: neg[0].it.c } });
      if (pos.length) out.push({ tom: 'ok', icone: 'sobe', titulo: pos.length === 1 ? `${pos[0].it.n}: ${pos[0].k} ${rotulo || 'lançamentos'} seguidos fechando` : `Sequências boas: ${pos.map(x => `${x.it.n} (${x.k})`).join(', ')}`, texto: 'Sequência positiva — vale entender o que está dando certo para repetir.', ir: { view: 'itens', item: pos[0].it.c } });
    }
    if (anterior && anterior.n) {
      const ia = analisarItens(anterior, cfg).filter(i => i.analisa && i.tem);
      const mud = its.map(i => { const p0 = ia.find(x => x.c === i.c); return p0 && isNum(p0.real) ? { n: i.n, c: i.c, d: i.real - p0.real } : null; }).filter(Boolean).sort((x, y) => Math.abs(y.d) - Math.abs(x.d))[0];
      if (mud && Math.abs(mud.d) >= 0.05) out.push({ tom: 'info', icone: mud.d > 0 ? 'sobe' : 'desce', titulo: `Maior mudança: ${mud.n} ${mud.d > 0 ? 'subiu' : 'caiu'} ${num(Math.abs(mud.d), 3)} p.p.`, texto: `Comparado ao período anterior equivalente.`, ir: { view: 'itens', item: mud.c } });
    }
    return out;
  }

  /* ---------------- BASE: ordenação e serialização ---------------- */
  const ORDEM_V = LINHAS.map(l => l.c);
  function canonico(rec) {
    const v = {}, src = rec.v || {};
    for (const k of ORDEM_V) if (src[k] !== undefined && src[k] !== null && src[k] !== '') v[k] = src[k];
    for (const k in src) if (!(k in v) && src[k] !== null && src[k] !== '') v[k] = src[k];
    const ordObj = (o, keys) => { const r = {}; if (!o) return r; const ks = Object.keys(o).sort((x, y) => (keys ? keys.indexOf(x) - keys.indexOf(y) : 0) || x.localeCompare(y, 'pt-BR', { numeric: true })); for (const k of ks) if (isNum(o[k])) r[k] = o[k]; return r; };
    const out = {
      id: `${rec.data}_${rec.turno}`, data: rec.data, turno: rec.turno,
      semana: rec.semana || semanaRDO(rec.data), fonte: rec.fonte || '', lancadoPor: rec.lancadoPor || '', lancadoEm: rec.lancadoEm || '',
      v, metas: ordObj(rec.metas, ORDEM_V.concat(['4.1', '5'])),
      paradasProgramadas: ordObj(rec.paradasProgramadas), interrupcoes: ordObj(rec.interrupcoes), reducoes: ordObj(rec.reducoes),
      naoQualidade: ordObj(rec.naoQualidade), obs: rec.obs || ''
    };
    return out;
  }
  const LEI_IA_TXT = 'IA: antes de lançar, leia e siga a LEI DE LANÇAMENTO em INSTRUCOES_IA.md (raiz do repositório; cópia no index.html, bloco script#lei-lancamento-ia). Mantenha esta chave.';
  function serializar(base) {
    const regs = (base.registros || []).map(canonico).sort((x, y) => (x.data + x.turno).localeCompare(y.data + y.turno));
    const head = { sistema: base.sistema || 'RDO Rondon', versao: 1, atualizadoEm: base.atualizadoEm || new Date().toISOString(), LEI_IA: LEI_IA_TXT };
    const h = JSON.stringify(head).slice(0, -1);
    const desc = (base.descartes || []).map(canonDesc).sort((x, y) => (x.data + x.turno + x.id).localeCompare(y.data + y.turno + y.id));
    return h + ',"registros":[\n' + regs.map(r => JSON.stringify(r)).join(',\n') + '\n],"descartes":[' + (desc.length ? '\n' + desc.map(r => JSON.stringify(r)).join(',\n') + '\n' : '') + ']}\n';
  }
  function canonDesc(d) {
    return { id: d.id, data: d.data, turno: d.turno, ...(d.linha ? { linha: d.linha } : {}), alvo: d.alvo, un: d.un === 'carcacas' ? 'carcacas' : 'kg', qtd: +d.qtd, causa: d.causa || '', obs: d.obs || '', lancadoPor: d.lancadoPor || '', lancadoEm: d.lancadoEm || '' };
  }
  function upsertDesc(lista, novos) {
    const map = new Map((lista || []).map(d => [d.id, d]));
    for (const n of novos) { const c = canonDesc(n); map.set(c.id, c); }
    return [...map.values()].sort((x, y) => (x.data + x.turno + x.id).localeCompare(y.data + y.turno + y.id));
  }
  function upsert(lista, novos) {
    const map = new Map(lista.map(r => [r.id || `${r.data}_${r.turno}`, r]));
    for (const n of novos) { const c = canonico(n); map.set(c.id, c); }
    return [...map.values()].sort((x, y) => (x.data + x.turno).localeCompare(y.data + y.turno));
  }

  return {
    LINHAS, L, SECOES, ITENS, ITEM, PP, INT, RED, NQ, METAS_PADRAO, CFG_PADRAO,
    isNum, sumObj, hm, round, sRound, parseISO, toISO, addDays, weekday, semanaRDO, inicioSemana, isoWeek,
    status, derivar, agregar, analisarItens, caixas, ponte, impacto, auditar,
    media, desvio, regressao, prever, chance, normCdf,
    num, pct, sinal, kg, fmtLinha, DIAS, DIAS_LONGOS, MESES, MESES_C, dm, diaCurto,
    resumoWhats, leitura, canonico, serializar, upsert, upsertDesc, canonDesc, DESC_ALVOS, nomeAlvo
  };
})();

/* ============================================================
   GRÁFICOS (SVG desenhado na largura real do aparelho)
   ============================================================ */
const Tip = (() => {
  let el, pinKey = null, ancora = null;
  function ensure() { if (!el) el = document.getElementById('tip'); return el; }
  function posicionar(x, y) {
    const t = ensure(); const r = t.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    let left = x + 14, top = y + 14;
    if (left + r.width > vw - 8) left = x - r.width - 14;
    if (left < 8) left = Math.max(8, Math.min(vw - r.width - 8, x - r.width / 2));
    if (top + r.height > vh - 8) top = y - r.height - 14;
    if (top < 8) top = 8;

}

function periodoAnterior(p) {
  if (p.per === 'dia') {
    const ds = datasComDados(S.turno).filter(x => x < p.ref);
    const ant = ds[ds.length - 1];
    return ant ? periodo('dia', ant) : null;
  }
  if (p.per === 'semana') return periodo('semana', RDO.addDays(p.de, -7));
  if (p.per === 'mes') { const d = RDO.parseISO(p.de); d.setMonth(d.getMonth() - 1); return periodo('mes', RDO.toISO(d)); }
  if (p.per === 'ano') return periodo('ano', `${+p.de.slice(0, 4) - 1}-06-01`);
  const dias = Math.round((RDO.parseISO(p.ate) - RDO.parseISO(p.de)) / 864e5) + 1;
  const ate = RDO.addDays(p.de, -1), de = RDO.addDays(ate, -(dias - 1));
  return Object.assign(periodo('perso', p.ref), { de, ate, rot: `${RDO.dm(de)} a ${RDO.dm(ate)}` });
}
function agg(regs) {
  const key = regs.map(r => r.id).join('|');
  if (CACHE.has(key)) return CACHE.get(key);
  const a = RDO.agregar(regs, CFG);
  CACHE.set(key, a);
  return a;
}
function turnoRot(t = S.turno, regs) {
  if (t !== 'todos') return t === 'T1' ? '1º turno' : t === 'T2' ? '2º turno' : '3º turno';
  const ts = regs ? [...new Set(regs.map(r => r.turno))].sort() : [];
  if (ts.length === 1) return `${ts[0] === 'T1' ? '1º' : '2º'} turno (só ele lançado)`;
  return '1º + 2º turno';
}
function turnoCurto(t = S.turno, regs) {
  if (t !== 'todos') return t;
  const ts = regs ? [...new Set(regs.map(r => r.turno))].sort() : [];
  return ts.length === 1 ? ts[0] : 'T1+T2';
}

/* série por ponto (registro ou dia) para gráficos */
function serie(regs, modo) {
  // modo: 'reg' (cada turno), 'dia', 'semana', 'mes'
  const grupos = new Map();
  for (const r of regs) {
    let k;
    if (modo === 'reg') k = r.data + '_' + r.turno;
    else if (modo === 'dia') k = r.data;
    else if (modo === 'semana') k = RDO.inicioSemana(r.data);
    else k = r.data.slice(0, 7);
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(r);
  }
  return [...grupos.entries()].sort((x, y) => x[0].localeCompare(y[0])).map(([k, rs]) => {
    let lab;
    if (modo === 'reg') lab = `${RDO.dm(rs[0].data)} ${rs[0].turno}`;
    else if (modo === 'dia') lab = RDO.dm(k);
    else if (modo === 'semana') lab = `S${RDO.semanaRDO(k)}`;
    else lab = `${RDO.MESES_C[+k.slice(5, 7) - 1]}/${k.slice(2, 4)}`;
    let tip;
    if (modo === 'reg') tip = `${RDO.diaCurto(rs[0].data)} · ${rs[0].turno}`;
    else if (modo === 'dia') tip = RDO.diaCurto(k);
    else if (modo === 'semana') tip = `Semana ${RDO.semanaRDO(k)} (${RDO.dm(k)} a ${RDO.dm(RDO.addDays(k, 6))})`;
    else tip = `${cap(RDO.MESES[+k.slice(5, 7) - 1])} de ${k.slice(0, 4)}`;
    return { k, lab, tip, regs: rs, a: agg(rs) };
  });
}
function granAuto(p, n) {
  const dias = Math.round((RDO.parseISO(p.ate) - RDO.parseISO(p.de)) / 864e5) + 1;
  if (dias <= 45) return S.turno === 'todos' ? 'dia' : 'reg';
  if (dias <= 200) return 'semana';
  return 'mes';
}

/* ---------------- GITHUB ---------------- */
const GH = (() => {
  const enc = p => p.split('/').map(encodeURIComponent).join('/');
  function b64enc(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function b64dec(b64) {
    const bin = atob(String(b64).replace(/\s/g, ''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  const H = t => ({ Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' });

  async function carregar() {
    const c = ghCfg();
    let url, opt = { cache: 'no-store' }, via;
    if (c.token && c.owner && c.repo) {
      url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${enc(c.path)}?ref=${encodeURIComponent(c.branch)}`;
      opt.headers = Object.assign(H(c.token), { Accept: 'application/vnd.github.raw+json' });
      via = 'GitHub (API)';
    } else if (c.pages) {
      url = `${c.path}?v=${Date.now()}`; via = 'GitHub Pages';
    } else if (c.owner && c.repo) {
      url = `https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch}/${enc(c.path)}?v=${Date.now()}`; via = 'GitHub';
    } else return null;
    const r = await fetch(url, opt);
    if (r.status === 404) throw new Error('O arquivo da base não foi encontrado no GitHub (' + c.path + ').');
    if (r.status === 401 || r.status === 403) throw new Error('O GitHub recusou o acesso. Confira o token em Ajustes.');
    if (!r.ok) throw new Error('GitHub respondeu ' + r.status + '.');
    const txt = await r.text();
    let j;
    try { j = JSON.parse(txt); } catch (e) { throw new Error('O arquivo da base no GitHub está com o formato quebrado (JSON inválido). Abra-o no GitHub e confira a última linha que a IA mexeu.'); }
    const regs = Array.isArray(j) ? j : (j.registros || []);
    return { registros: regs, descartes: Array.isArray(j.descartes) ? j.descartes : [], via, atualizadoEm: j.atualizadoEm };
  }

  async function lerParaEscrever(c) {
    const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${enc(c.path)}`;
    const r = await fetch(`${url}?ref=${encodeURIComponent(c.branch)}`, { headers: H(c.token), cache: 'no-store' });
    if (r.status === 404) return { url, sha: null, base: { sistema: 'RDO Rondon', registros: [] } };
    if (r.status === 401 || r.status === 403) throw new Error('Token sem permissão. Ele precisa de "Contents: Read and write" neste repositório.');
    if (!r.ok) throw new Error('GitHub respondeu ' + r.status + ' ao ler a base.');
    const j = await r.json();
    let txt;
    if (j.content && j.encoding === 'base64') txt = b64dec(j.content);
    else {
      const rr = await fetch(`${url}?ref=${encodeURIComponent(c.branch)}`, { headers: Object.assign(H(c.token), { Accept: 'application/vnd.github.raw+json' }), cache: 'no-store' });
      txt = await rr.text();
    }
    return { url, sha: j.sha, base: JSON.parse(txt) };
  }

  async function gravar(mudar, msg, mudarDesc) {
    const c = ghCfg();
    if (!c.owner || !c.repo) throw new Error('Informe o usuário e o repositório do GitHub em Ajustes.');
    if (!c.token) throw new Error('Para publicar daqui é preciso colar um token do GitHub em Ajustes.');
    for (let t = 0; t < 3; t++) {
      const { url, sha, base } = await lerParaEscrever(c);
      if (mudar) base.registros = mudar(base.registros || []);
      if (mudarDesc) base.descartes = mudarDesc(base.descartes || []);
      base.atualizadoEm = new Date().toISOString();
      base.sistema = base.sistema || 'RDO Rondon';
      const body = { message: msg, content: b64enc(RDO.serializar(base)), branch: c.branch };
      if (sha) body.sha = sha;
      const p = await fetch(url, { method: 'PUT', headers: Object.assign(H(c.token), { 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
      if (p.ok) return base;
      if (p.status === 409 || p.status === 422) continue;
      let det = ''; try { det = (await p.json()).message || ''; } catch (e) { }
      throw new Error(`O GitHub não aceitou a gravação (${p.status}${det ? ': ' + det : ''}).`);
    }
    throw new Error('A base mudou enquanto eu gravava. Tente de novo.');
  }
  const publicar = (novos, msg) => gravar(regs => RDO.upsert(regs, novos), msg);
  const excluir = (ids, msg) => gravar(regs => regs.filter(r => !ids.includes(r.id || `${r.data}_${r.turno}`)), msg);
  const publicarDesc = (novos, msg) => gravar(null, msg, lst => RDO.upsertDesc(lst, novos));
  const excluirDesc = (ids, msg) => gravar(null, msg, lst => lst.filter(d => !ids.includes(d.id)));

  async function testar() {
    const c = ghCfg();
    if (!c.owner || !c.repo) throw new Error('Preencha usuário e repositório.');
    const out = [];
    const h = c.token ? H(c.token) : { Accept: 'application/vnd.github+json' };
    const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}`, { headers: h, cache: 'no-store' });
    if (r.status === 404) throw new Error('Repositório não encontrado (ou é privado e falta o token).');
    if (!r.ok) throw new Error('GitHub respondeu ' + r.status + '.');
    const j = await r.json();
    out.push(`Repositório ${j.full_name} ${j.private ? '(privado)' : '(público)'} encontrado.`);
    if (c.token) out.push(j.permissions && j.permissions.push ? 'O token pode gravar: publicar daqui vai funcionar.' : 'O token só lê. Para publicar, dê "Contents: Read and write".');
    const b = await carregar();
    out.push(`Base lida: ${b.registros.length} lançamento(s).`);
    return out;
  }
  return { carregar, gravar, publicar, excluir, publicarDesc, excluirDesc, testar, b64enc, b64dec };
})();

/* ---------------- LEITOR DE PDF NO NAVEGADOR ---------------- */
async function carregarPdfJs() {
  if (window._pdfjs) return window._pdfjs;
  const fontes = [
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/',
    'https://unpkg.com/pdfjs-dist@4.10.38/legacy/build/'
  ];
  let ultimo;
  for (const base of fontes) {
    try {
      const m = await import(base + 'pdf.min.mjs');
      m.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.mjs';
      window._pdfjs = m;
      return m;
    } catch (e) { ultimo = e; }
  }
  throw new Error('Não consegui carregar o leitor de PDF. Ele precisa de internet na primeira vez.' + (ultimo ? ' (' + ultimo.message + ')' : ''));
}
async function lerPDF(file) {
  const lib = await carregarPdfJs();
  const buf = await file.arrayBuffer();
  const doc = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
  const pages = [];
  for (let p = 1; p <= Math.min(doc.numPages, 3); p++) {
    const page = await doc.getPage(p);
    const vp = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    pages.push({ items: tc.items.map(it => ({ s: it.str, x: it.transform[4], y: vp.height - it.transform[5], w: it.width })) });
  }
  return RDOParser.parse(pages, file.name);
}
function lerJSONColado(txt) {
  let t = String(txt || '').trim().replace(/^```(json)?/i, '').replace(/```$/, '').trim();
  const i = t.search(/[\[{]/); if (i > 0) t = t.slice(i);
  const j = JSON.parse(t);
  let regs = Array.isArray(j) ? j : (j.registros ? j.registros : [j]);
  regs = regs.filter(r => r && r.data && r.turno && r.v);
  if (!regs.length) throw new Error('Não achei nenhum registro com "data", "turno" e "v".');
  return regs;
}

/* ---------------- DEMONSTRAÇÃO ---------------- */
let _demo = null;
function demoRegs() {
  if (_demo) return _demo;
  let seed = 20261020;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const gau = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const M = RDO.METAS_PADRAO;
  const base = { BD: [26.42, .32], BE: [26.38, .30], BG: [4.64, .055], BH: [2.83, .04], BI: [.942, .014], BL: [1.36, .19], BM: [1.21, .06], BN: [.60, .05], BO: [2.25, .33], BP: [5.25, .55], DORSO: [11.55, .75], BQ: [0, 0] };
  const t2 = { BE: -.12, BO: .18, BL: .05, BD: .06 };
  const out = [];
  let d = '2026-07-27';
  const fim = '2026-10-20';
  let k = 0;
  while (d <= fim) {
    const wd = RDO.weekday(d);
    if (wd !== 0) {
      const planoDia = Math.round((104000 + gau() * 3000) / 100) * 100;
      for (const turno of ['T1', 'T2']) {
        k++;
        const peso = 2.95 + Math.sin(k / 23) * .12 + gau() * .05;
        const tend = (k / 160) * .1;
        const R = Math.round(52200 + gau() * 1300);
        const Q = Math.round(R / (0.995 + rnd() * .006));
        const S = Math.round(R * peso);
        const v = { N: planoDia, Q, R, S };
        let soma = 0;
        for (const c in base) {
          let x = base[c][0] + base[c][1] * gau() + (turno === 'T2' ? (t2[c] || 0) : 0);
          if (c === 'BE') x += (peso - 3) * .9 + tend;
          if (c === 'BL') x += tend * 1.5;
          x = Math.max(0, +x.toFixed(3)); v[c] = x; soma += x;
        }
        v.BA = +soma.toFixed(3); v.BB = +(100 - soma).toFixed(3);
        const pp = { PP04: 60, PP05: Math.round(1 + rnd() * 9), PP06: 60 };
        const ppMin = pp.PP04 + pp.PP05 + pp.PP06;
        const ints = {}, reds = {};
        if (rnd() < .22) ints[['P01', 'P03', 'P05', 'P02', 'P09'][Math.floor(rnd() * 5)]] = Math.round(5 + rnd() * 35);
        if (rnd() < .45) reds[['R01', 'R03', 'R05', 'R12'][Math.floor(rnd() * 4)]] = Math.round(8 + rnd() * 30);
        const pMin = Object.values(ints).reduce((s, x) => s + x, 0);
        const ini = turno === 'T1' ? '03:30' : '14:10', fimH = turno === 'T1' ? '13:18' : '23:58';
        const janela = 9.8;
        const AV = janela - ppMin / 60, AW = pMin / 60, AX = AV - AW, AY = R / 6408;
        v.AI = Math.round(S * (soma + 1.3 + gau() * .15) / 100);
        Object.assign(v, {
          O: R - planoDia, P: +(R / planoDia * 100).toFixed(1), T: +(R / Q * 100).toFixed(1), U: +(S / R).toFixed(3), V: Math.round(R / AX),
          AH: Math.round(v.AI / 22.4), AJ: +(v.AI / S * 100).toFixed(2), AK: +(88 + gau() * 2.2).toFixed(2),
          AS: ini, AT: fimH, AU: +(ppMin / 60).toFixed(1), AV: +AV.toFixed(1), AW: +AW.toFixed(1), AX: +AX.toFixed(1), AY: +AY.toFixed(1), AZ: +(AX - AY).toFixed(1),
          BT: +(AX / AV * 100).toFixed(2), BU: +(AY / AX * 100).toFixed(2), BV: +(v.AI / S * 100).toFixed(2), BW: +(AY / AV * 100).toFixed(2)
        });
        v.AL = +(100 - v.AK).toFixed(2);
        v.BX = +(v.BT * v.BU * v.BV / 10000).toFixed(2);
        const nq = { '4.1': Math.max(0, Math.round(R * (0.0015 + gau() * .0004))) };
        nq['4'] = nq['4.1'];
        if (rnd() < .3) nq['1.15'] = Math.round(10 + rnd() * 60);
        if (rnd() < .25) nq['1.12'] = Math.round(10 + rnd() * 80);
        if (rnd() < .2) nq['2.2'] = Math.round(5 + rnd() * 40);
        if (rnd() < .15) nq['2.10'] = Math.round(20 + rnd() * 90);
        out.push({ id: `${d}_${turno}`, data: d, turno, semana: RDO.semanaRDO(d), fonte: 'demonstração', demo: true, v, metas: Object.assign({}, M), paradasProgramadas: pp, interrupcoes: ints, reducoes: reds, naoQualidade: nq, obs: '' });
      }
    }
    d = RDO.addDays(d, 1);
  }
  _demo = out;
  return out;
}

function stripHTML(a, its) {
  const segs = [];
  for (const i of its) {
    if (!i.tem || !(i.real > 0) || i.c === 'BP' || i.c === 'DORSO') continue;
    segs.push({ n: i.n, v: i.real, meta: i.meta, st: i.analisa ? i.status : 'neutro', kg: i.kg, c: i.c });
  }
  const cms = (a.val.BP || 0) + (a.val.DORSO || 0);
  if (cms > 0) segs.push({ n: 'CMS + dorso', v: cms, meta: null, st: 'neutro', kg: (a.kg.BP || 0) + (a.kg.DORSO || 0), c: 'BP' });
  const soma = segs.reduce((s, x) => s + x.v, 0);
  const quebra = Math.max(0, isNum(a.val.BB) ? a.val.BB : 100 - soma);
  segs.push({ n: 'Quebra', v: quebra, meta: a.meta.BB, st: 'quebra', kg: quebra / 100 * a.val.S, c: 'BB' });
  const tot = segs.reduce((s, x) => s + x.v, 0) || 100;
  S._segs = segs;
  const html = segs.map((s, k) => {
    const wd = s.v / tot * 100;
    const tick = s.st !== 'quebra' && s.st !== 'neutro' && isNum(s.meta) && s.meta > 0 ? Math.min(100, s.meta / s.v * 100) : null;
    return `<div class="sg ${s.st} ${wd < 7.5 ? 'estreito' : ''}" style="flex:${wd.toFixed(3)} 1 0;transition-delay:${k * 55}ms" data-seg="${k}">
      ${tick != null && tick < 99.5 ? `<i class="tick" style="--m:${tick.toFixed(1)}%"></i>` : ''}
      ${wd >= 3.4 ? `<b>${N(s.v, wd > 9 ? 1 : 2)}</b><span>${esc(s.n)}</span>` : ''}</div>`;
  }).join('');
  return `<div class="strip-w"><div class="strip-h"><h3>Para onde foi cada 100 kg de frango vivo</h3><span>toque nas partes para ver os detalhes</span></div>
    <div class="strip" data-strip>${html}</div>
    <div class="strip-leg"><span><i style="background:var(--ok)"></i>atingiu a meta</span><span><i style="background:var(--quase)"></i>quase (até ${100 - CFG.amarelo}% abaixo)</span><span><i style="background:var(--ruim)"></i>abaixo da meta</span><span><i style="background:var(--neutro)"></i>sem meta analisada</span><span><i style="background:var(--sunk-2)"></i>quebra industrial</span><span><i style="background:var(--ink);width:2px;height:10px;border-radius:0"></i>marca da meta</span></div></div>`;
}

const PINS = new Map();

/* Conta corrente: soma dia a dia do saldo de cada item (o que ficou devendo ou acima da meta) */
function contaCorrente(de, ate, turno) {
  const regs = regsEntre(de, ate, turno);
  const sp = serie(regs, 'dia');
  return RDO.ITENS.filter(i => (CFG.analisar[i.c] ?? i.analisa)).map(it => {
    const pts = sp.map(x => { const ii = RDO.analisarItens(x.a, CFG).find(y => y.c === it.c); return { d: x.k, lab: x.lab, tip: x.tip, gap: ii.gapKg, fechou: ii.fechou, real: ii.real, meta: ii.meta }; }).filter(q => isNum(q.gap));
    const abaixo = pts.filter(q => q.gap < 0), acima = pts.filter(q => q.gap >= 0);
    const faltou = abaixo.reduce((t, q) => t + q.gap, 0), sobrou = acima.reduce((t, q) => t + q.gap, 0);
    const saldo = faltou + sobrou;
    let seq = 0, seqKg = 0;
    for (let k = pts.length - 1; k >= 0 && pts[k].gap < 0; k--) { seq++; seqKg += pts[k].gap; }
    const pc = CFG.caixas[it.c] || it.cx;
    return { it, pts, n: pts.length, nAbaixo: abaixo.length, faltou, sobrou, saldo, seq, seqKg, pc, cx: RDO.caixas(saldo, pc) };
  });
}
function faixaAcc(p) {
  const ate = p.ate > S.ref && p.per !== 'perso' ? (datasComDados(S.turno).filter(x => x <= p.ate).pop() || p.ate) : p.ate;
  if (S.acc === 'semana') return { de: RDO.inicioSemana(ate), ate, rot: `semana ${RDO.semanaRDO(ate)} até ${RDO.dm(ate)}` };
  if (S.acc === 'ano') return { de: ate.slice(0, 4) + '-01-01', ate, rot: `${ate.slice(0, 4)} até ${RDO.dm(ate)}` };
  if (S.acc === 'topo') return { de: p.de, ate: p.ate, rot: p.rot.toLowerCase() };
  return { de: ate.slice(0, 8) + '01', ate, rot: `${RDO.MESES[+ate.slice(5, 7) - 1]} até ${RDO.dm(ate)}` };
}

function vPainel() {
  const p = periodo(), regs = regsPeriodo(p);
  if (!regs.length) return vazioPeriodo(p);
  if (S.foco && RDO.ITEM[S.foco]) return vPainelItem(S.foco);
  const a = agg(regs); S._a = a;
  PORTAIS.clear();
  const its = RDO.analisarItens(a, CFG);
  const an = its.filter(i => i.analisa && i.tem && isNum(i.gapKg));
  const ok = an.filter(i => i.fechou), nok = an.filter(i => !i.fechou);
  const saldo = an.reduce((s, i) => s + i.gapKg, 0);
  const perda = nok.reduce((s, i) => s + i.gapKg, 0), ganho = ok.reduce((s, i) => s + i.gapKg, 0);
  const cxSaldo = an.reduce((s, i) => s + i.gapKg / i.pesoCx, 0);
  const cxPerda = nok.reduce((s, i) => s + i.gapKg / i.pesoCx, 0);
  const tom = nok.length === 0 ? 'ok' : saldo >= 0 ? 'quase' : 'ruim';
  const nomes = l => l.length <= 1 ? (l[0] ? l[0].n : '') : l.slice(0, -1).map(i => i.n).join(', ') + ' e ' + l[l.length - 1].n;
  const veredito = !an.length ? 'Sem itens com meta neste período' : nok.length === 0 ? `Todos os ${an.length} itens fecharam a meta` : ok.length === 0 ? `Nenhum dos ${an.length} itens fechou a meta` : `${ok.length} de ${an.length} itens fecharam a meta`;
  const sub = !an.length ? '' : nok.length
    ? `<b>${esc(nomes(nok.slice().sort((x, y) => x.gapKg - y.gapKg)))}</b> ficaram abaixo da meta. Juntos faltaram <b>${KG(perda)}</b> (≈ ${N(Math.abs(Math.round(cxPerda)))} caixas).`
    : `Todos os itens ficaram acima da meta, somando <b>${KG(ganho)}</b>.`;

  const fx = faixaContexto(p);
  const gran = S.turno === 'todos' ? 'dia' : 'reg';
  const sp = serie(regsEntre(fx.de, p.ate), gran);
  const sr = sp.slice(-14);
  const serieItens = {};
  for (const it of RDO.ITENS) serieItens[it.c] = sr.map(pt => { const ii = RDO.analisarItens(pt.a, CFG).find(x => x.c === it.c); return { v: ii.real, ok: ii.fechou }; });
  const ccMes = Object.fromEntries(contaCorrente(p.ate.slice(0, 8) + '01', p.ate, S.turno).map(x => [x.it.c, x]));
  const saldoMes = Object.values(ccMes).reduce((t, x) => t + x.saldo, 0);
  const ant = periodoAnterior(p);
  const aAnt = ant ? agg(regsPeriodo(ant)) : null;
  const leit = RDO.leitura({ a, cfg: CFG, anterior: aAnt, serieItens: p.per === 'dia' ? serieItens : null, rotulo: S.turno === 'todos' ? 'dias' : 'turnos' });
  const imp = RDO.impacto(a, CFG);
  for (const i of its) if (i.tem) PINS.set('it:' + i.c, pinItem(i, a, ccMes[i.c]));
  const V = a.val, M = a.meta;
  const fonteTxt = regs.length === 1 && regs[0].fonte ? esc(regs[0].fonte) : regs.length > 1 ? `${regs.length} lançamentos` : '';
  const maxBar = Math.max(Math.abs(perda), Math.abs(ganho)) || 1;
  const carimboTxt = !an.length ? 'Sem meta' : nok.length === 0 ? 'Tudo fechado' : saldo >= 0 ? 'Saldo positivo' : 'Saldo negativo';

  /* ---------- 1. RESULTADO ---------- */
  let h = `<section class="hero3 tom-${tom} reveal">
    <div class="h3-faixa">${ic(STATUS_IC[tom] || 'mais')}<span>Resultado · ${esc(p.rot)} · ${esc(turnoRot(S.turno, regs))}</span><span>${fonteTxt}</span></div>
    <div class="h3-main">
      <span class="carimbo ${tom}">${carimboTxt}</span>
      <h2 class="h3-ver">${veredito}</h2>
      <p class="h3-sub">${sub}</p>
      <div class="pills">${an.slice().sort((x, y) => x.gapKg - y.gapKg).map(i => `<button class="pill-it ${i.status}" data-pin="it:${i.c}" title="Abrir ${esc(i.n)}">${ic(STATUS_IC[i.status])}<span>${esc(curtoItem(i.n))}</span><em>${SN(i.gapKg)}</em></button>`).join('')}</div>

      <p class="p-sm" style="margin:14px 0 0">A linha rodou <b>${N(V.AX, 1)} h</b> e abateu o que o ritmo padrão faria em <b>${N(V.AY, 1)} h</b> — ${V.AY >= V.AX ? `ganhou <b>${N(V.AY - V.AX, 1)} h</b> (eficiência ${P(V.BU, 1)})` : `perdeu <b>${N(V.AX - V.AY, 1)} h</b> de ritmo (eficiência ${P(V.BU, 1)})`}.${a.redMin ? ` Teve ${N(a.redMin)} min com velocidade reduzida.` : ''}</p>` : '<p class="muted">Sem horas apontadas.</p>';
  po += portalHTML('volume', { t: 'Volume e tempo de linha', ic: 'relogio', st: RDO.status(V.T, M.T, 1, CFG),
    prev: `<span class="po-big">${isNum(V.AX) ? N(V.AX, 1) : '—'}<small>h rodando</small></span><span class="po-txt">${N(V.R)} frangos · ${N(V.V)} frangos/h · ${P(V.P, 1)} do plano</span>`,
    pe: 'plano, abate e horas', sub: `Peso médio ${N(V.U, 3)} kg · ${N(V.V)} frangos/h · ritmo padrão ≈ ${N(a.ritmo)} frangos/h`,

function vPainelItem(c) {
  const p = periodo(), regs = regsPeriodo(p);
  const a = agg(regs); S._a = a;
  PORTAIS.clear();
  const its = RDO.analisarItens(a, CFG);

  if (!i || !i.tem) return pane(esc(RDO.ITEM[c].n), '', `<div class="vazio-grande">${ic('itens')}<h3>Sem dados de ${esc(RDO.ITEM[c].n.toLowerCase())} em ${esc(p.rot.toLowerCase())}</h3><p>Escolha outro período ou desligue o filtro de item.</p><button class="btn tinta" data-act="foco-limpar">Desligar filtro</button></div>`);

  const fx = faixaContexto(p), gran = S.turno === 'todos' ? 'dia' : 'reg';
  const sp = serie(regsEntre(fx.de, p.ate), gran);
  const pts = sp.map(x => RDO.analisarItens(x.a, CFG).find(y => y.c === c));
  const AI = analiseImpacto(a);
  const L = AI ? AI.linhas.find(x => x.i.c === c) : null;
  const ate = p.ate > S.ref ? S.ref : p.ate;
  const cc = i.analisa ? contaCorrente(ate.slice(0, 8) + '01', ate, S.turno).find(x => x.it.c === c) : null;
  const an = its.filter(x => x.analisa && x.tem && isNum(x.gapKg)).sort((x, y) => x.gapKg - y.gapKg);
  const pos = an.findIndex(x => x.c === c);
  for (const x of its) if (x.tem) PINS.set('it:' + x.c, pinItem(x, a, null));

  let h = `<section class="pane hero-item reveal">${itemTopoHTML(i, a, rot)}<div class="row" style="margin-top:6px">${cupomItem(i, a)}<div class="fi-bloco"><h4>${ic('alvo')}Descartes deste item</h4>${i.analisa ? descItemTxt(i, a, p) : '<p>Item só de produção.</p>'}<div class="fi-acoes" style="border:0;padding-top:14px"><button class="btn" data-pin="imp:${c}">${ic('balanca')}Ver o impacto exato</button><button class="btn" data-act="fdr-abrir">${ic('enviar')}Lançar descartes do RDO</button></div></div></div></section>`;

  const stI = i.analisa ? i.status : 'neutro';
  const nOk = pts.filter(o => o && o.fechou).length;

  const corSt = st => ({ ok: 'var(--ok)', quase: 'var(--quase)', ruim: 'var(--ruim)' })[st] || 'var(--accent)';
  h += `<div class="wgs">
    ${widget({ ic: 'itens', l: 'Rendimento', v: `${N(i.real, 3)}<small>%</small>`, f: i.analisa ? `meta ${P(i.meta, 3)} ${deltaChip(i.real, i.meta, 1, 3)}` : 'só produção', st: stI, pin: 'it:' + c, sp: sk(pts.map(o => o && o.real), corSt(stI), i.analisa ? i.meta : null) })}
    ${widget({ ic: 'balanca', l: 'Saldo contra a meta', v: i.analisa && isNum(i.gapKg) ? `${SN(i.gapKg)}<small>kg</small>` : `${N(i.kg)}<small>kg</small>`, f: i.analisa ? (i.cx != null ? `${SN(i.cx)} caixas de ${i.pesoCx} kg` : 'menos de 1 caixa') : 'produzidos', st: stI, pin: 'it:' + c, sp: sk(pts.map(o => o && o.gapKg), corSt(stI), 0) })}
    ${widget({ ic: 'calendario', l: 'Acumulado do mês', v: cc && cc.n ? `${SN(cc.saldo)}<small>kg</small>` : '—', f: cc && cc.n ? `${cc.nAbaixo} de ${cc.n} dias abaixo${cc.cx != null ? ' · ' + SN(cc.cx) + ' cx' : ''}` : 'sem meta', st: cc && cc.n ? (cc.saldo >= 0 ? 'ok' : 'ruim') : 'neutro', pin: cc ? 'cc:' + c : null })}
    ${widget({ ic: 'check', l: `Fechou nos últimos ${pts.length}`, v: i.analisa ? `${nOk}<small>/${pts.length}</small>` : '—', f: cap(fx.nota), st: !i.analisa ? 'neutro' : nOk / Math.max(1, pts.length) >= .7 ? 'ok' : nOk / Math.max(1, pts.length) >= .4 ? 'quase' : 'ruim', pin: 'it:' + c })}
    ${widget({ ic: 'alvo', l: 'Descartes do item', v: L ? `${N(L.desc, L.desc < 100 ? 1 : 0)}<small>kg</small>` : '—', f: L && L.desc > 0.05 ? `${ppNeg(L.ppDesc)} p.p. · ${L.pctExplic != null ? N(L.pctExplic, 1) + '% da falta' : 'item acima da meta'}` : 'nenhum apontado', st: L && L.desc > 0.05 ? 'quase' : 'neutro', pin: 'imp:' + c })}

  </div>`;
