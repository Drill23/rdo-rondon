  h += `<div class="row" style="margin-top:22px">${pane('Comparado aos outros itens', `Saldo em kg de cada item · ${esc(i.n.toLowerCase())} em destaque`, destacar(hbarsKg(its), c))}`;
  const tt = ['T1', 'T2'].map(t => { const rs = regsPeriodo(p, t); return rs.length ? { t, i: RDO.analisarItens(agg(rs), CFG).find(y => y.c === c) } : null; }).filter(Boolean);
  h += pane('1º × 2º turno', esc(p.rot), tt.length ? `<div class="tb-wrap"><table class="tb"><thead><tr><th>Turno</th><th class="n">Rend.</th><th class="n">Meta</th><th class="n">Saldo</th><th class="n">Caixas</th></tr></thead><tbody>${tt.map(x => `<tr><td><b>${x.t === 'T1' ? '1º turno' : '2º turno'}</b></td><td class="n">${P(x.i.real, 3)}</td><td class="n">${P(x.i.meta, 3)}</td><td class="n c-${x.i.analisa ? x.i.status : 'neutro'}"><b>${x.i.analisa ? KG(x.i.gapKg) : N(x.i.kg, 0) + ' kg'}</b></td><td class="n">${x.i.cx != null ? SN(x.i.cx) : '—'}</td></tr>`).join('')}</tbody></table></div>${tt.length === 2 && i.analisa ? `<p class="p-sm" style="margin-top:10px">Diferença: <b>${SN(tt[0].i.real - tt[1].i.real, 3)} p.p.</b> (${tt[0].i.real >= tt[1].i.real ? 'o 1º' : 'o 2º'} turno rendeu mais).</p>` : ''}` : '<p class="muted">Sem dados.</p>') + `</div>`;
  const leit = RDO.leitura({ a, cfg: CFG, anterior: null, serieItens: null, rotulo: '' }).filter(l => (l.ir && l.ir.item === c) || l.texto.includes(i.n) || l.titulo.includes(i.n));
  if (leit.length) h += `<div style="margin-top:22px">${pane('O que os números dizem sobre este item', '', leituraHTML(leit))}</div>`;
  h += `<div class="acoes-fim reveal"><p><b>Filtro de item ligado.</b> Todas as telas e a apresentação estão mostrando só ${esc(i.n.toLowerCase())}.</p>
    <button class="btn tinta grande" data-act="apresentar">${ic('play')}Apresentar este item</button>
    <button class="btn grande" data-act="view" data-v="itens" data-item="${c}">${ic('itens')}Análise completa</button>
    <button class="btn grande" data-act="foco-limpar">${ic('x')}Desligar filtro</button></div>`;
  return h;
}

/* ======================= PERDAS E IMPACTO ======================= */
// Dois tipos de perda, separados de propósito:
//  • RENDIMENTO: das aves que foram abatidas, quanto não virou item contra a meta (kg) → parte é descarte apontado, o resto é processo.
//  • VOLUME: aves que deixaram de ser abatidas (paradas, reduções, mortalidade) → não mexe no % do item.
function barraDupla(a, b, cA, cB) {
  const t = (a + b) || 1;
  return `<span class="bdupla"><i class="${cA}" style="--w:${(a / t * 100).toFixed(2)}%"></i><i class="${cB}" style="--w:${(b / t * 100).toFixed(2)}%"></i></span>`;
}
function vPerdas() {
  const p = periodo(), regs = regsPeriodo(p);
  if (!regs.length) return vazioPeriodo(p);
  const a = agg(regs); S._a = a;
  const AI = analiseImpacto(a);
  if (!AI) return pane('Perdas e impacto', '', '<p class="muted">Faltam frangos ou peso abatido nos lançamentos deste período.</p>');
  const { imp, tot } = AI;
  const V = a.val, S0 = V.S;
  const F = S.foco && RDO.ITEM[S.foco] ? S.foco : null;
  const linhasF = F ? AI.linhas.filter(l => l.i.c === F) : AI.linhas;
  const anF = linhasF.filter(l => l.i.analisa && l.gap != null);
  const soma = (lst, k) => lst.reduce((t, l) => t + (l[k] || 0), 0);
  const T = F ? { falta: soma(anF, 'falta'), explic: soma(anF, 'explic'), processo: soma(anF, 'processo'), sobra: anF.filter(l => l.gap > 0).reduce((t, l) => t + l.gap, 0), saldo: soma(anF, 'gap'), desc: soma(linhasF, 'desc'), vol: soma(linhasF, 'vol') } : tot;
  const aba = ['resumo', 'descartes', 'devendo', 'paradas'].includes(S.perdasAba) ? S.perdasAba : 'resumo';
  const cob = coberturaDesc(regs);
  const fr = faixaAcc(p);
  const cc = contaCorrente(fr.de, fr.ate, S.turno).filter(x => !F || x.it.c === F).sort((x, y) => x.saldo - y.saldo);
  S._cc = Object.fromEntries(cc.map(x => [x.it.c, x])); S._ccRot = fr.rot;
  const devedores = cc.filter(x => x.saldo < 0);
  const totDev = devedores.reduce((t, x) => t + x.saldo, 0);
  const minPerd = (a.intMin || 0) + (a.redMin || 0);
  const abas = [
    ['resumo', '1', 'Para onde foram os kg', 'O que faltou nos itens: descarte ou processo.', T.falta ? `${N(T.falta)} kg faltaram` : 'nada faltou'],
    ['descartes', '2', 'Descartes', 'Impacto exato de cada descarte em cada item.', T.desc ? `${N(T.desc)} kg · ${N(T.desc / S0 * 100, 3)} p.p.` : 'nenhum apontado'],
    ['devendo', '3', 'Conta corrente', 'Quanto cada item acumula devendo ou acima.', devedores.length ? `${KG(totDev)} ${S.acc === 'semana' ? 'na semana' : S.acc === 'ano' ? 'no ano' : S.acc === 'topo' ? 'no período' : 'no mês'}` : 'nenhum devendo'],
    ['paradas', '4', 'Paradas e mortalidade', 'Aves a menos: tiram volume, não o %.', `${N(minPerd)} min · ${N(a.mort)} aves`]
  ];
  let h = `<div class="abas-num a4" role="tablist">${abas.map(([k, n, t, s, v]) => `<button class="aba-n ${aba === k ? 'on' : ''} reveal" role="tab" aria-selected="${aba === k}" data-act="perdas-aba" data-k="${k}"><span class="n">${n}</span><span><b>${t}</b><small>${s}</small><span class="an-v">${v}</span></span></button>`).join('')}</div>`;
  h += `<div class="aba-corpo" role="tabpanel">`;

  if (aba === 'resumo') {
    const pctE = T.falta ? T.explic / T.falta * 100 : 0;
    const volFr = (imp.interrupcoes ? imp.interrupcoes.fr : 0) + (imp.reducoes ? imp.reducoes.fr : 0);
    h += `<div class="dois-tipos">
      <section class="pane tipo reveal"><div class="tipo-h"><span class="tipo-n">A</span><div><b>Perda de rendimento</b><small>Das aves que foram abatidas, o que não virou ${F ? esc(RDO.ITEM[F].n.toLowerCase()) : 'item'} contra a meta.</small></div></div>
        <div class="tipo-v c-${T.falta ? 'ruim' : 'ok'}">${T.falta ? '−' + N(T.falta) : '0'}<small>kg faltaram</small></div>
        ${T.falta ? `${barraDupla(T.explic, T.processo, 'des', 'pro')}<div class="tipo-leg"><span><i class="des"></i><b>${N(T.explic)} kg</b> descartes apontados (${N(pctE, 1)}%)</span><span><i class="pro"></i><b>${N(T.processo)} kg</b> outros pontos do processo (${N(100 - pctE, 1)}%)</span></div>` : `<p class="p-sm">${F ? 'O item' : 'Nenhum item'} ficou abaixo da meta neste período.</p>`}
        <p class="p-sm" style="margin:12px 0 0">${T.sobra ? `Do outro lado, ${F ? 'o item sobrou' : 'os itens acima da meta somaram'} <b class="c-ok">+${N(T.sobra)} kg</b>. ` : ''}Saldo: <b class="c-${T.saldo >= 0 ? 'ok' : 'ruim'}">${KG(T.saldo)}</b>.</p></section>
      <section class="pane tipo reveal"><div class="tipo-h"><span class="tipo-n">B</span><div><b>Perda de volume</b><small>Aves que deixaram de ser abatidas. Tira kg do dia, não mexe no % do item.</small></div></div>
        <div class="tipo-v c-${T.vol > 0.5 ? 'quase' : 'ok'}">${T.vol > 0.5 ? '≈ −' + N(T.vol) : '0'}<small>kg de ${F ? esc(RDO.ITEM[F].n.toLowerCase()) : 'produto dos itens'}</small></div>
        <div class="tipo-lista">
          <div><span>Interrupções</span><b>${N(a.intMin)} min</b><em>${a.intMin ? `≈ ${N(imp.interrupcoes.fr)} frangos` : 'nenhuma'}</em></div>
          <div><span>Redução de velocidade</span><b>${N(a.redMin)} min</b><em>${a.redMin ? `≈ ${N(imp.reducoes.fr)} frangos (est.)` : 'nenhuma'}</em></div>
          <div><span>Mortalidade no transporte</span><b>${N(a.mort)} aves</b><em>${isNum(a.mortPct) ? `${P(a.mortPct, 3)} · meta ${P(a.meta['4.1'], 2)}` : ''}</em></div>
        </div>
        <p class="p-sm" style="margin:12px 0 0">${volFr ? `Paradas e reduções ≈ <b>${N(volFr)} frangos</b> a menos (${N(volFr * imp.pesoMedio)} kg vivos). ` : ''}${isNum(V.T) ? `Programação cumprida: <b class="c-${RDO.status(V.T, a.meta.T, 1, CFG)}">${P(V.T, 1)}</b>${isNum(V.Q) ? ` (${SN(V.R - V.Q)} frangos)` : ''}.` : ''}</p></section>
    </div>`;
    // item por item
    const rows = linhasF.filter(l => l.i.analisa).sort((x, y) => (x.gap || 0) - (y.gap || 0));
    const mxF = Math.max(...rows.map(l => l.falta), 1);
    h += pane(F ? `${esc(RDO.ITEM[F].n)}: de onde veio a diferença` : 'Item por item: de onde veio a diferença', 'Barra = o que faltou para a meta, dividido em descarte (vermelho) e outros pontos do processo (cinza). Toque numa linha para abrir a conta.', `<div class="tb-wrap"><table class="tb tb-imp"><thead><tr><th>Item</th><th class="n">Saldo × meta</th><th style="min-width:220px">O que faltou</th><th class="n">Descartes</th><th class="n">% da falta</th><th class="n">Sem descartes</th><th class="n">Volume (paradas)</th><th></th></tr></thead><tbody>
      ${rows.map(l => `<tr class="lin-imp" data-pin="imp:${l.i.c}" tabindex="0"><td><b>${esc(l.i.n)}</b><br><small class="muted">${P(l.i.real, 3)} · meta ${P(l.i.meta, 3)}</small></td>
        <td class="n c-${l.gap >= 0 ? 'ok' : 'ruim'}"><b>${KG(l.gap)}</b>${l.i.cx != null ? `<br><small>${SN(l.i.cx)} cx</small>` : ''}</td>
        <td>${l.falta ? `<span class="bfalta" style="--t:${(l.falta / mxF * 100).toFixed(1)}%">${barraDupla(l.explic, l.processo, 'des', 'pro')}</span>` : `<span class="muted p-sm">fechou</span>`}</td>
        <td class="n">${l.desc > 0.05 ? `${N(l.desc, 1)} kg<br><small class="muted">${ppNeg(l.ppDesc)} p.p.</small>` : '<span class="muted">—</span>'}</td>
        <td class="n">${l.pctExplic != null && l.desc > 0.05 ? `<b>${N(l.pctExplic, 1)}%</b>` : '<span class="muted">—</span>'}</td>
        <td class="n">${l.desc > 0.05 ? `<span class="c-${l.gapSem >= 0 ? 'ok' : 'ruim'}">${KG(l.gapSem)}</span><br>${l.fechouAntes ? chip('ok', 'já fechava') : l.fechariaSem ? chip('quase', 'fecharia') : chip('ruim', 'faltaria')}` : '<span class="muted">igual</span>'}</td>
        <td class="n">${l.vol > 0.5 ? `≈ ${N(l.vol)} kg` : '<span class="muted">—</span>'}</td>
        <td class="n"><span class="tl-abrir">ABRIR ▸</span></td></tr>`).join('')}
      ${!F ? `<tr class="tot"><td><b>Todos os itens</b></td><td class="n c-${tot.saldo >= 0 ? 'ok' : 'ruim'}"><b>${KG(tot.saldo)}</b></td><td>${tot.falta ? barraDupla(tot.explic, tot.processo, 'des', 'pro') : ''}</td><td class="n"><b>${N(tot.descAn, 1)} kg</b></td><td class="n"><b>${tot.falta ? N(tot.explic / tot.falta * 100, 1) + '%' : '—'}</b></td><td class="n"><b class="c-${tot.saldo + tot.descAn >= 0 ? 'ok' : 'ruim'}">${KG(tot.saldo + tot.descAn)}</b></td><td class="n"><b>≈ ${N(tot.vol)} kg</b></td><td></td></tr>` : ''}
    </tbody></table></div>
    <div class="legenda"><span><i style="background:var(--ruim)"></i>parte da falta que é descarte apontado</span><span><i style="background:var(--neutro)"></i>outros pontos do processo</span></div>`);
    if (cob.sem.length) h += `<div class="aviso-desc reveal">${ic('alvo')}<div><b>${cob.sem.length} de ${cob.lst.length} lançamento(s) deste período estão sem nenhum descarte apontado.</b><br>Se o RDO veio com as linhas de descarte em branco, a parte "descarte" acima fica menor do que a real. Lance os números e o cálculo se ajusta sozinho.</div><button class="btn tinta" data-act="fdr-abrir" data-d="${cob.sem[cob.sem.length - 1].r.data}" data-t="${cob.sem[cob.sem.length - 1].r.turno}">${ic('enviar')}Lançar descartes do RDO</button></div>`;
    h += pane('Como cada número é calculado', 'Conta exata com os números do próprio período. A única estimativa é a redução de velocidade (o RDO não diz quanto a velocidade caiu).', `<div class="regras">
      <div><span class="n">1</span><p><b>Rendimento do item</b> = kg do item ÷ peso vivo abatido × 100.</p></div>
      <div><span class="n">2</span><p><b>Saldo × meta</b> = (rendimento − meta) × peso vivo. Ex.: (1,445% − 1,600%) × ${N(S0)} kg.</p></div>
      <div><span class="n">3</span><p><b>Peça descartada</b> (ex.: Filé DIF 22 kg): os 22 kg eram filé. Sem o descarte, o filé teria 22 kg a mais → sobe 22 ÷ ${N(S0)} × 100 = ${N(22 / S0 * 100, 4)} p.p.</p></div>
      <div><span class="n">4</span><p><b>Asa</b>: dividida entre coxinha, meio e ponta na proporção em que cada um foi <b>produzido de verdade</b> no turno (kg do RDO).</p></div>
      <div><span class="n">5</span><p><b>Carcaça em kg</b>: dividida entre todos os itens na proporção real do turno (kg do item ÷ kg de todos os itens).</p></div>
      <div><span class="n">6</span><p><b>Carcaça em unidades</b>: cada carcaça vale o que a ave média rendeu no turno em cada item (kg do item ÷ frangos abatidos).</p></div>
      <div><span class="n">7</span><p><b>% da falta que é descarte</b> = descartes do item ÷ kg que faltaram para a meta (no máximo 100%). O resto veio de outros pontos do processo.</p></div>
      <div><span class="n">8</span><p><b>Volume</b>: frangos a menos = minutos ÷ 60 × ritmo padrão do RDO (≈ ${N(imp.ritmo)} fr/h); kg = frangos × peso médio real × rendimento real de cada item. Na redução de velocidade usamos ${CFG.fatorReducao}% de velocidade perdida (ajustável em Ajustes).</p></div>
    </div>`);
  } else if (aba === 'descartes') {
    const S0d = S0;
    const linD = AI.causas.filter(l => !F || (l.porItem[F] || 0) > 0.0005).slice().sort((x, y) => (F ? y.porItem[F] - x.porItem[F] : y.kg - x.kg));
    const kgF = l => F ? l.porItem[F] || 0 : l.kg;
    const totD = linD.reduce((t, l) => t + kgF(l), 0);
    h += `<div class="desc-acao reveal"><div><b>${cob.com} de ${cob.lst.length}</b> lançamento(s) do período têm descarte apontado${cob.sem.length ? ` · <span class="c-ruim">${cob.sem.length} sem nenhum (linhas em branco no RDO?)</span>` : ''}.</div><button class="btn tinta grande" data-act="fdr-abrir" ${cob.sem.length ? `data-d="${cob.sem[cob.sem.length - 1].r.data}" data-t="${cob.sem[cob.sem.length - 1].r.turno}"` : ''}>${ic('enviar')}Lançar descartes do RDO</button></div>`;
    if (!totD) {
      h += pane('', '', `<div class="vazio-grande" style="padding:22px 10px">${ic('alvo')}<h3>Nenhum descarte apontado${F ? ' para ' + esc(RDO.ITEM[F].n.toLowerCase()) : ''} neste período</h3><p>As linhas de descarte ficam na página 2 do RDO (tabela “desvios de não-qualidade”). Se vieram em branco no PDF, lance os números pelo botão acima: o sistema pede linha por linha, com exemplo, e grava na base da nuvem.</p></div>`);
    } else {
      const cxTot = linD.reduce((t, l) => t + Object.entries(l.porItem).filter(([c]) => !F || c === F).reduce((s, [c, kg]) => s + kg / (CFG.caixas[c] || (RDO.ITEM[c] || {}).cx || 20), 0), 0);
      const BAsem = V.BA + totD / S0d * 100;
      h += `<div class="row c4">
        <div class="pane reveal"><div class="stat-l">Peso descartado${F ? ' (' + esc(RDO.ITEM[F].n.toLowerCase()) + ')' : ''}</div><div class="big-n">${N(totD, totD < 100 ? 1 : 0)}<small> kg</small></div><div class="p-sm">≈ ${N(Math.round(cxTot))} caixas</div></div>
        <div class="pane reveal"><div class="stat-l">Tirou do rendimento</div><div class="big-n c-ruim">−${N(totD / S0d * 100, 3)}<small> p.p.</small></div><div class="p-sm">${F ? 'no item' : 'no rendimento de cortes'}</div></div>
        <div class="pane reveal"><div class="stat-l">${F ? esc(RDO.ITEM[F].n) : 'Rendimento de cortes'}</div><div class="big-n">${F ? P(AI.linhas.find(l => l.i.c === F).i.real, 3) : P(V.BA, 3)}</div><div class="p-sm">sem descartes: <b>${F ? P(AI.linhas.find(l => l.i.c === F).realSem, 3) : P(BAsem, 3)}</b></div></div>
        <div class="pane reveal"><div class="stat-l">Parte da falta explicada</div><div class="big-n">${T.falta ? N(T.explic / T.falta * 100, 1) : '—'}<small>%</small></div><div class="p-sm">${T.falta ? `${N(T.explic)} de ${N(T.falta)} kg que faltaram` : 'não faltou nada'}</div></div>
      </div>`;
      const rowsI = linhasF.filter(l => l.desc > 0.05).sort((x, y) => y.desc - x.desc);
      const mx = Math.max(...rowsI.map(l => l.desc), 1);
      h += `<div class="row" style="margin-top:22px">`;
      h += pane('Impacto em cada item', 'Pontos percentuais que cada item perdeu por causa dos descartes. Toque para abrir a conta.', `<div class="hb hb-larga">${rowsI.map((l, k) => `<button class="hb-r" data-pin="imp:${l.i.c}"><span class="lb">${esc(l.i.n)}</span><span class="hb-t uni"><i class="b ruim" style="--w:${(l.desc / mx * 100).toFixed(1)}%;transition-delay:${k * 50}ms"></i></span><span class="vl">${ppNeg(l.ppDesc)} p.p.<small>${N(l.desc, 1)} kg · ${l.i.analisa ? (l.fechouAntes ? 'já fechava' : l.fechariaSem ? 'fecharia' : 'faltaria') : 'só produção'}</small></span></button>`).join('')}</div>`);
      const porCausa = {};
      for (const l of linD) { const g = l.grupo; porCausa[g] = (porCausa[g] || 0) + kgF(l); }
      h += pane('Por causa', 'Grupos da tabela de não-qualidade do RDO.', barrasUni(Object.entries(porCausa).sort((x, y) => y[1] - x[1]).map(([g, kg]) => ({ rot: g, v: kg, txt: `${N(kg, 1)} kg`, sub: `${N(kg / totD * 100, 1)}% · ${N(kg / S0d * 100, 3)} p.p.`, cls: 'ruim' })))
        + `<h4 style="margin:18px 0 8px;font-size:13px">Maiores linhas</h4>` + barrasUni(linD.slice(0, 8).map(l => ({ rot: l.n, v: kgF(l), txt: `${N(kgF(l), 1)} kg`, sub: l.linha ? `linha ${l.linha}` : 'à parte', cls: 'quase' }))));
      h += `</div>`;
      // causa × item
      const itensM = RDO.ITENS.filter(it => (!F || it.c === F) && linD.some(l => (l.porItem[it.c] || 0) > 0.05));
      h += pane('Causa × item (kg de produto)', 'Cada linha de descarte e para quais itens os quilos foram. Asa e carcaça são divididas pela proporção real do turno.', `<div class="tb-wrap"><table class="tb tb-mat"><thead><tr><th>Descarte</th>${itensM.map(it => `<th class="n">${esc(curtoItem(it.n))}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>${linD.map(l => `<tr><td><b>${esc(l.n)}</b>${l.linha ? ` <span class="muted mono" style="font-size:11px">${l.linha}</span>` : ''}<br><small class="muted">${l.grupo} · ${qtdDesc(l)}</small></td>${itensM.map(it => { const v = l.porItem[it.c] || 0; return `<td class="n">${v > 0.05 ? `<span class="cel-heat" style="--o:${Math.min(1, v / (l.kg || 1)).toFixed(2)}">${N(v, 1)}</span>` : '<span class="muted">·</span>'}</td>`; }).join('')}<td class="n"><b>${N(kgF(l), 1)}</b></td></tr>`).join('')}
        <tr class="tot"><td><b>Total</b></td>${itensM.map(it => `<td class="n"><b>${N(linD.reduce((t, l) => t + (l.porItem[it.c] || 0), 0), 1)}</b></td>`).join('')}<td class="n"><b>${N(totD, 1)}</b></td></tr></tbody></table></div>`);
      // dia a dia
      const fx = faixaContexto(p);
      const sp = serie(regsEntre(fx.de, fx.ate), S.turno === 'todos' ? 'dia' : 'reg');
      if (sp.length >= 2) {
        const vals = sp.map(x => { const im = RDO.impacto(x.a, CFG); return im ? (F ? im.descartes.porItem[F] || 0 : im.descartes.totalKg) : 0; });

    const fontes = [['Interrupções', imp.interrupcoes], ['Reduções', imp.reducoes], ['Mortalidade', imp.mortalidade]].filter(x => x[1]);

    h += pane('Mortalidade no transporte', `${cap(fx.nota)} · meta ${P(a.meta['4.1'], 2)} dos abatidos`, sp.length >= 2 ? Charts.slot({ type: 'line', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series: [{ name: 'Mortalidade', color: 'var(--accent)', values: sp.map(x => x.a.mortPct), status: sp.map(x => RDO.status(x.a.mortPct, x.a.meta['4.1'], -1, CFG)) }], meta: sp.map(x => x.a.meta['4.1']), yFmt: v => N(v, 2) + '%', tipFmt: v => P(v, 3) }, 210) : `<div class="big-n">${P(a.mortPct, 3)}</div><p class="p-sm">${N(a.mort)} frangos mortos · ≈ ${N(imp.mortalidade ? imp.mortalidade.kgVivo : 0)} kg vivos que não entraram no abate.</p>`) + `</div>`;

  }
  h += `</div>`;
  return h;
}


/* ======================= RDO VIVO ======================= */
const RDO_SECOES = [
  { id: 'vol', n: 'Volume de produção', codes: ['N', 'O', 'P', 'Q', 'R', 'S', 'T', 'U', 'V'] },
  { id: 'cx', n: 'Produção em caixas', codes: ['X', 'Y', 'Y1', 'Y2', 'Y3', 'Y4', 'Z', 'AA', 'AB', 'AC', 'AC1', 'AC2', 'AC3', 'AE', 'AF', 'AG', 'AG1', 'AG2', 'AG3', 'AH', 'AI', 'AJ', 'AK', 'AL', 'AM', 'AN', 'AO', 'AO1', 'AP', 'AQ', 'AQ1', 'AR'] },
  { id: 'horas', n: 'Horas máquina', codes: ['AS', 'AT', 'AU', 'AV', 'AW', 'AX', 'AY', 'AZ'] },
  { id: 'rend', n: 'Rendimento', codes: ['BA', 'BB', '#Cortes', 'BD', 'BE', 'BG', 'BH', 'BI', '#Miúdos', 'BL', 'BM', 'BN', 'BO', '#CMS e outros', 'BP', 'DORSO', 'BQ'] },
  { id: 'des', n: 'Desempenho', codes: ['BT', 'BU', 'BV', 'BW', 'BX'] },
  { id: 'pp', n: 'Paradas programadas (min)', codes: Object.keys(RDO.PP), tab: 'pp' },
  { id: 'int', n: 'Interrupções (min)', codes: Object.keys(RDO.INT), tab: 'int' },
  { id: 'red', n: 'Reduções de velocidade (min)', codes: Object.keys(RDO.RED), tab: 'red' },
  { id: 'nq', n: 'Desvios de não-qualidade', codes: Object.keys(RDO.NQ).filter(k => !RDO.NQ[k].grupo), tab: 'nq' }
];
function valCod(a, c, tab) {
  if (!a) return undefined;
  if (tab) return a[tab][c];
  if (c === 'AS' || c === 'AT') return a.val[c];
  return a.val[c];
}
function nomeCod(c, tab) {
  if (tab === 'pp') return RDO.PP[c];
  if (tab === 'int') return RDO.INT[c];
  if (tab === 'red') return RDO.RED[c];
  if (tab === 'nq') return RDO.NQ[c].n + (RDO.NQ[c].un ? ` (${RDO.NQ[c].un})` : '');
  return RDO.L[c] ? RDO.L[c].n : c;
}
function vRdo() {
  const dom = RDO.inicioSemana(S.ref);
  const dias = [0, 1, 2, 3, 4, 5, 6].map(k => RDO.addDays(dom, k));
  const regsSem = regsEntre(dias[0], dias[6]);
  if (!regsSem.length) return vazioPeriodo(periodo('semana'));
  const aDia = dias.map(d => { const rs = regsSem.filter(r => r.data === d); return rs.length ? agg(rs) : null; });
  const aAc = agg(regsSem); S._a = aAc; S._rdo = { dias, aDia, aAc };
  const metas = aAc.meta;
  const ultimoDia = [...aDia].reverse().find(Boolean);
  const rel = focoAtivo() ? rdoFocoMostra(S.foco) : null;
  let rows = '';
  for (const sec of RDO_SECOES) {
    const fech = !!S.fechadas['rdo-' + sec.id];
    let corpo = '', vis = 0;
    for (const c of sec.codes) {
      if (c.startsWith('#')) { if (rel) continue; corpo += `<tr class="lin-g"><td class="c-cod"></td><td class="c-item"><div class="cel nm" style="color:var(--ink-3);font-size:11.5px;font-weight:650">${c.slice(1)}</div></td><td colspan="9"></td></tr>`; continue; }
      if (rel && !rel.has(c)) continue;
      const vals = aDia.map(a => valCod(a, c, sec.tab));
      const vac = valCod(aAc, c, sec.tab);
      const temAlgum = vals.some(v => isNum(v) ? (sec.tab ? v !== 0 : true) : !!v);
      if (S.semVazias && !temAlgum && !(rel && c === S.foco)) continue;
      vis++;
      const l = RDO.L[c] || {};
      const dir = sec.tab ? (sec.tab === 'pp' ? 0 : -1) : (l.dir || 0);
      const meta = sec.tab === 'nq' && c === '4.1' ? metas['4.1'] : (sec.tab ? undefined : metas[c]);
      const fmt = v => {
        if (sec.tab) return isNum(v) && v !== 0 ? N(v, 0) : '';
        return isNum(v) || typeof v === 'string' ? RDO.fmtLinha(c, v) : '';
      };
      const cel = (v, aa, acum) => {
        let txt = fmt(v); if (!txt) return `<td class="dcol ${acum ? 'acum' : ''}"><div class="cel vazio">·</div></td>`;
        let st = 'neutro';
        if (sec.tab === 'nq' && c === '4.1' && aa) { const pc = aa.mortPct; st = RDO.status(pc, meta, -1, CFG); txt = `${txt} <small class="muted">${P(pc, 3)}</small>`; }
        else if (!sec.tab && dir && isNum(meta) && isNum(v) && (!RDO.ITEM[c] || (CFG.analisar[c] !== false && RDO.ITEM[c].analisa !== false) || c === 'BA')) st = RDO.status(v, meta, dir, CFG);
        if (RDO.ITEM[c] && !(CFG.analisar[c] ?? RDO.ITEM[c].analisa)) st = 'neutro';
        return `<td class="dcol ${acum ? 'acum' : ''}"><div class="cel">${st !== 'neutro' ? `<span class="pill ${st}">${txt}</span>` : txt}</div></td>`;
      };
      const sub = l.sub ? ' sub' : '';
      corpo += `<tr class="lin${rel && c === S.foco && !sec.tab ? ' aberta foco-lin' : ''}" data-act="rdo-lin" data-c="${c}" data-tab="${sec.tab || ''}"><td class="c-cod cod"><div class="cel" style="padding-left:14px">${esc(c === 'DORSO' ? '—' : c.replace(/^([A-Z]+)(\d)$/, '$1.$2'))}</div></td>
        <td class="c-item"><div class="cel nm${sub}">${ic('dir')}${esc(nomeCod(c, sec.tab))}</div></td>
        <td class="meta"><div class="cel">${isNum(meta) ? (sec.tab === 'nq' ? P(meta, 2) : RDO.fmtLinha(c, meta)) : ''}</div></td>
        ${vals.map((v, k) => cel(v, aDia[k])).join('')}${cel(sec.id === 'horas' && (c === 'AS' || c === 'AT') ? '' : vac, aAc, true)}</tr>`;
      if (rel && c === S.foco && !sec.tab) corpo += `<tr class="det"><td colspan="11"><div class="det-in">${rdoDetalhe(c, null)}</div></td></tr>`;
    }
    if (!vis && (S.semVazias || rel)) continue;
    rows += `<tbody><tr class="secao ${fech ? 'fechada' : ''}"><td colspan="11"><button data-act="rdo-sec" data-s="${sec.id}">${ic('baixo')}${esc(sec.n)} <span>${vis} linha${vis === 1 ? '' : 's'}</span></button></td></tr></tbody><tbody class="corpo-sec" ${fech ? 'hidden' : ''}>${corpo}</tbody>`;
  }
  const hoje = S.ref;
  const tab = `<div class="rdo-wrap reveal"><table class="rdo"><thead><tr><th class="c-cod">Cód.</th><th class="c-item" style="text-align:left">Item</th><th>Meta</th>
    ${dias.map(d => `<th class="dcol ${d === hoje ? 'hoje' : ''}"><button style="all:unset;cursor:pointer" data-act="ir-dia" data-d="${d}">${cap(RDO.DIAS[RDO.weekday(d)])}<small>${RDO.dm(d)}</small></button></th>`).join('')}<th>Acumulado<small>semana ${RDO.semanaRDO(dom)}</small></th></tr></thead>${rows}</table></div>`;
  return pane(`RDO vivo · semana ${RDO.semanaRDO(dom)}${rel ? ' · ' + esc(RDO.ITEM[S.foco].n) : ''}`, `${RDO.dm(dias[0])} a ${RDO.dm(dias[6])} · ${esc(turnoRot(S.turno, regsSem))}${rel ? ` · só as linhas ligadas a ${esc(RDO.ITEM[S.foco].n.toLowerCase())}: rendimento, caixas e descartes` : ''} · toque numa linha para ver a explicação e o histórico; toque no dia para abrir a visão geral dele.`,
    `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 0 12px"><label class="opt" style="border:0;padding:0;gap:8px"><span class="sw"><input type="checkbox" data-act="rdo-vazias" ${S.semVazias ? 'checked' : ''}><span></span></span><small>Esconder linhas vazias</small></label>
     <span class="p-sm muted">Cores: ${chip('ok')} ${chip('quase')} ${chip('ruim')}</span><button class="btn" style="margin-left:auto" data-act="rdo-tabela">${ic('ampliar')}Tabela em tela grande</button></div>`, { reveal: false }) + tab;
}
function rdoDetalhe(c, tab) {

  if (l.ex) h += `<p>${esc(l.ex)}</p>`;
  else if (RDO.ITEM[c]) h += `<p>De cada 100 kg de frango vivo, quantos kg viraram ${esc(RDO.ITEM[c].n.toLowerCase())}.${RDO.ITEM[c].analisa ? ` Fica verde se bater a meta, amarelo se ficar a menos de ${100 - CFG.amarelo}% dela e vermelho se ficar mais longe.` : ' Item sem análise de caixas (só produção).'}</p>`;
  if (l.f && !tab) h += `<p class="p-sm"><b>Fórmula do RDO:</b> ${esc(l.f)}</p>`;
  const ct = contaInd(c, a);

  if (item) {

    h += `<div class="tb-wrap"><table class="tb"><thead><tr><th>Dia</th><th class="n">Rend.</th><th class="n">Produzido</th><th class="n">Saldo</th><th class="n">Caixas</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  } else h += `<p class="muted">O histórico aparece quando houver mais lançamentos.</p>`;

}

function vItens() {
  if (S.foco && RDO.ITEM[S.foco]) S.item = S.foco;
  const p = periodo(), regs = regsPeriodo(p);
  const aPick = regs.length ? agg(regs) : null;
  const itsPick = aPick ? RDO.analisarItens(aPick, CFG) : [];
  const picker = `<div class="pick" style="margin-bottom:22px">${RDO.ITENS.map(i => { const ii = itsPick.find(x => x.c === i.c); const st = ii && ii.analisa && ii.tem ? ii.status : 'neutro'; return `<button class="${i.c === S.item ? 'on' : ''}" data-act="item" data-item="${i.c}"><span class="pk-dot ${st}"></span>${esc(i.n)}</button>`; }).join('')}</div>`;
  if (!regs.length) return picker + vazioPeriodo(p);
  const a = aPick; S._a = a;
  const its = itsPick;
  const i = its.find(x => x.c === S.item) || its[0];
  const st = i.analisa ? i.status : 'neutro';
  const fx = faixaContexto(p);
  const regsCtx = regsEntre(fx.de, fx.ate);
  const gran = p.per === 'ano' || p.per === 'perso' && (RDO.parseISO(p.ate) - RDO.parseISO(p.de)) / 864e5 > 70 ? 'semana' : 'dia';
  const sp = serie(regsCtx, gran);
  const vi = x => RDO.analisarItens(x.a, CFG).find(y => y.c === i.c);
  const pts = sp.map(x => ({ x, ii: vi(x) }));
  const imp = RDO.impacto(a, CFG);

  let h = picker;
  h += `<section class="pane hero-item reveal">
    ${itemTopoHTML(i, a, `${i.n} · ${p.rot} · ${turnoRot(S.turno, regs)}`)}
    <div class="row" style="margin-top:6px">${cupomItem(i, a)}<div class="fi-bloco"><h4>${ic('alvo')}Descartes e acumulado</h4>${i.analisa ? blocoDescItem(i, a, p) : '<p>Item só de produção: não entra na conta de caixas.</p>'}</div></div>
  </section>`;


  // estatísticas do contexto
  const vals = pts.map(o => o.ii.real).filter(isNum);
  if (vals.length >= 2) {
    const fech = pts.filter(o => o.ii.fechou).length;
    const melhor = pts.filter(o => isNum(o.ii.real)).sort((x, y) => y.ii.real - x.ii.real)[0];
    const pior = pts.filter(o => isNum(o.ii.real)).sort((x, y) => x.ii.real - y.ii.real)[0];
    const saldoCtx = pts.reduce((s, o) => s + (o.ii.gapKg || 0), 0);
    const rg = vals.length >= 5 ? RDO.regressao(vals.map((_, k) => k), vals) : null;
    const tend = rg && Math.abs(rg.r) >= 0.3 ? rg.b * 7 : 0;
    const stat = (v, l) => `<div><div class="big-n" style="font-size:24px">${v}</div><div class="stat-l">${l}</div></div>`;
    h += pane('Comportamento do item', `${cap(fx.nota)} · ${pts.length} ${gran === 'dia' ? 'dias' : 'semanas'}`, `<div class="stats">
      ${stat(P(RDO.media(vals), 3), 'média simples')}
      ${i.analisa ? stat(`${fech}/${pts.length}`, `${gran === 'dia' ? 'dias' : 'semanas'} que fecharam`) : ''}
      ${stat(P(melhor.ii.real, 3), 'melhor · ' + esc(melhor.x.tip))}
      ${stat(P(pior.ii.real, 3), 'pior · ' + esc(pior.x.tip))}
      ${stat(N(RDO.desvio(vals), 3), 'oscilação (desvio padrão, p.p.)')}
      ${i.analisa ? stat(`<span class="c-${saldoCtx >= 0 ? 'ok' : 'ruim'}">${KG(saldoCtx)}</span>`, 'saldo somado no intervalo') : ''}
      ${!rg ? stat('<span class="c-neutro">—</span>', 'tendência (precisa de 5+ pontos)') : stat(`<span class="c-${Math.abs(tend) < 0.005 ? 'neutro' : tend > 0 ? 'ok' : 'ruim'}">${Math.abs(tend) < 0.005 ? 'estável' : (tend > 0 ? '▲ ' : '▼ ') + N(Math.abs(tend), 3)}</span>`, Math.abs(tend) < 0.005 ? 'tendência' : `p.p. a cada 7 ${gran === 'dia' ? 'dias' : 'semanas'}`)}
    </div>`);
    const series = [{ name: i.n, color: 'var(--accent)', values: pts.map(o => o.ii.real), status: i.analisa ? pts.map(o => o.ii.status) : null, area: true }];
    if (S.turno === 'todos' && gran === 'dia' && regsCtx.some(r => r.turno === 'T2') && regsCtx.some(r => r.turno === 'T1')) { series[0].name = 'Ambos (dia)'; series[0].color = 'var(--ink-3)'; for (const t of ['T1', 'T2']) { const v = sp.map(x => { const rs = x.regs.filter(r => r.turno === t); return rs.length ? RDO.analisarItens(agg(rs), CFG).find(y => y.c === i.c).real : null; }); series.push({ name: t === 'T1' ? '1º turno' : '2º turno', color: t === 'T1' ? 'var(--t1)' : 'var(--t2)', values: v, dots: false, fino: true }); } }
    let acc = 0; const acum = pts.map(o => (acc += (o.ii.gapKg || 0)));
    h += `<div class="row" style="margin-top:18px">
      ${pane('Rendimento no tempo', 'Pontos coloridos: verde fechou, amarelo quase, vermelho não fechou.', Charts.slot({ type: 'line', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series, meta: i.analisa ? pts.map(o => o.ii.meta) : undefined, yFmt: (v, s) => N(v, s < .01 ? 3 : 2) + '%', tipFmt: v => P(v, 3), tipExtra: k => { const ii = pts[k].ii; return i.analisa && isNum(ii.gapKg) ? `<div class="tt-row"><span>Saldo</span><b>${KG(ii.gapKg)}${ii.cx != null ? ` · ${SN(ii.cx)} cx` : ''}</b></div>` : ''; } }, 250) + (series.length > 1 ? `<div class="legenda">${series.map(s => `<span><i class="${s.dash ? 'tr' : ''}" style="background:${s.color};border-color:${s.color}"></i>${s.name}</span>`).join('')}</div>` : ''))}
      ${i.analisa ? pane('Saldo acumulado em kg', 'Soma dos kg ganhos e perdidos, ponto a ponto. Descendo = perdendo; subindo = recuperando.', Charts.slot({ type: 'line', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series: [{ name: 'Saldo acumulado', color: acc >= 0 ? 'var(--ok)' : 'var(--ruim)', values: acum, area: true, dots: false }], meta: 0, metaLabel: false, yFmt: v => N(v, 0), tipFmt: v => KG(v) + ` (${SN(Math.round(v / i.pesoCx))} cx)` }, 250)) : pane('Produção em kg', '', Charts.slot({ type: 'bars', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series: [{ name: 'kg', color: 'var(--accent)', values: pts.map(o => o.ii.kg) }], yFmt: v => N(v / 1000, 0) + ' t', tipFmt: v => N(v, 0) + ' kg' }, 250))}
    </div>`;
  }

  // dia da semana (todo o histórico do turno filtrado)
  const todos = regsEntre('0000-01-01', '9999-12-31');
  const porDow = [1, 2, 3, 4, 5, 6].map(d => { const rs = todos.filter(r => RDO.weekday(r.data) === d); return rs.length ? RDO.analisarItens(agg(rs), CFG).find(y => y.c === i.c) : null; });
  if (porDow.filter(Boolean).length >= 2) {
    const nomes = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
    const dif = porDow.map(x => x && isNum(x.real) && isNum(x.meta) ? x.real - x.meta : null);
    const mx = Math.max(...dif.filter(isNum).map(Math.abs)) || 1;
    const corpo = porDow.map((x, k) => !x ? '' : i.analisa ? `<div class="hb-r"><span class="lb">${nomes[k]}</span><span class="hb-t"><i class="zero"></i><i class="b ${dif[k] >= 0 ? 'pos' : 'neg'} ${x.status}" style="--w:${(Math.abs(dif[k]) / mx * 50).toFixed(1)}%"></i></span><span class="vl c-${x.status}">${P(x.real, 3)}<small>${SN(dif[k], 3)} p.p.</small></span></div>` : `<div class="hb-r"><span class="lb">${nomes[k]}</span><span></span><span class="vl">${P(x.real, 3)}</span></div>`).join('');
    h += `<div class="row" style="margin-top:18px">${pane('Por dia da semana', i.analisa ? `Média ponderada de todo o histórico${S.turno !== 'todos' ? ' do ' + turnoRot() : ''}. Barra = distância da meta.` : 'Média ponderada de todo o histórico.', `<div class="hb">${corpo}</div>`)}`;
  } else h += `<div class="row" style="margin-top:18px">${pane('Por dia da semana', '', '<p class="muted">Aparece quando houver lançamentos em pelo menos dois dias da semana diferentes.</p>')}`;
  // T1 x T2
  const tt = ['T1', 'T2'].map(t => { const rs = regsPeriodo(p, t); return rs.length ? { t, i: RDO.analisarItens(agg(rs), CFG).find(y => y.c === i.c) } : null; }).filter(Boolean);
  h += pane('1º × 2º turno', esc(p.rot), tt.length ? `<div class="tb-wrap"><table class="tb"><thead><tr><th>Turno</th><th class="n">Rend.</th><th class="n">Meta</th><th class="n">Saldo</th><th class="n">Caixas</th></tr></thead><tbody>${tt.map(x => `<tr><td><b>${x.t}</b></td><td class="n">${P(x.i.real, 3)}</td><td class="n">${P(x.i.meta, 3)}</td><td class="n c-${x.i.analisa ? x.i.status : 'neutro'}">${x.i.analisa ? KG(x.i.gapKg) : N(x.i.kg, 0) + ' kg'}</td><td class="n">${x.i.cx != null ? SN(x.i.cx) : '—'}</td></tr>`).join('')}</tbody></table></div>${tt.length === 2 && i.analisa ? `<p class="p-sm" style="margin-top:10px">Diferença entre turnos: <b>${SN(tt[1].i.real - tt[0].i.real, 3)} p.p.</b> (${tt[1].i.real >= tt[0].i.real ? 'o 2º' : 'o 1º'} turno rendeu mais).</p>` : `<p class="p-sm muted" style="margin-top:10px">Quando os dois turnos estiverem lançados, a comparação aparece aqui.</p>`}` : '<p class="muted">Sem dados.</p>') + `</div>`;

  // descartes ligados
  if (imp) {
    const ligados = imp.descartes.linhas.filter(l => (l.porItem || {})[i.c] > 0);
    const rec = imp.descartes.porItem[i.c] || 0;
    h += pane('Descartes que tiram peso deste item', 'Quando um pedaço é descartado, o peso dele deixa de entrar no rendimento do item.', ligados.length ? `<div class="kv">${ligados.map(l => `<span>${esc(l.n)}${l.origem === 'manual' ? ' · lançado à parte' : ''} · ${qtdDesc(l)}</span><span>${N(l.porItem[i.c], 0)} kg${l.alvo !== i.c ? ' (parte)' : ''}</span>`).join('')}<span><b style="color:var(--ink)">Peso que voltaria para ${esc(i.n.toLowerCase())}</b></span><span>${N(rec, 0)} kg = ${SN(rec / a.val.S * 100, 3)} p.p.</span></div>${i.analisa && isNum(i.gapKg) ? `<p class="p-sm" style="margin-top:10px">${i.gapKg + rec >= 0 ? (i.gapKg < 0 ? `<b class="c-ok">Sem esses descartes o item teria fechado.</b>` : 'O item já fechou mesmo com os descartes.') : `Mesmo sem os descartes faltariam <b>${KG(i.gapKg + rec)}</b>: o problema principal está em outro ponto do processo.`}</p>` : ''}` : `<p class="muted">Nenhum descarte apontado para este item no período. Se o RDO veio com as linhas em branco, lance aqui.</p><button class="btn" data-act="fdr-abrir">${ic('enviar')}Lançar descartes do RDO</button>`);
  }
  h += pane('Todos os itens no período', 'Toque num item para abrir a ficha completa.', destacar(hbarsKg(its), i.c));
  return h;
}

function blocoDescItem(i, a, p) {
  const imp = RDO.impacto(a, CFG);
  const rec = imp ? imp.descartes.porItem[i.c] || 0 : 0;
  const S0 = a.val.S;
  let h = '<div class="conta">';
  if (rec > 0.05) {
    const sem = i.real + rec / S0 * 100, gapSem = (i.gapKg || 0) + rec, cx = RDO.caixas(gapSem, i.pesoCx);
    h += `<b>Descartes deste item:</b> ${N(rec, 1)} kg = −${N(rec / S0 * 100, 3)} p.p.<br>Sem eles o rendimento seria <b>${P(sem, 3)}</b> e o saldo ficaria <b class="c-${gapSem >= 0 ? 'ok' : 'ruim'}">${KG(gapSem)}</b>${cx != null ? ` (${SN(cx)} cx)` : ''} — ${i.fechou ? 'o item já fechou mesmo com os descartes.' : gapSem >= 0 ? '<b class="c-ok">teria fechado</b>.' : 'ainda faltaria: a maior parte da perda está em outro ponto do processo.'}`;
  } else h += `<b>Descartes deste item:</b> nenhum apontado em ${esc(p.rot.toLowerCase())} (nem no RDO, nem lançado à parte).`;
  const ate = p.ate > S.ref ? S.ref : p.ate;
  if (p.per === 'dia' || p.per === 'semana') {
    const cc = contaCorrente(ate.slice(0, 8) + '01', ate, S.turno).find(x => x.it.c === i.c);
    if (cc && cc.n > 1) h += `<br><b>Acumulado do mês até ${RDO.dm(ate)}:</b> <span class="c-${cc.saldo >= 0 ? 'ok' : 'ruim'}">${cc.saldo >= 0 ? 'acima da meta' : 'devendo'} ${N(Math.abs(cc.saldo))} kg</span>${cc.cx != null ? ` (${SN(cc.cx)} cx)` : ''} · ${cc.nAbaixo} de ${cc.n} dias abaixo.`;
  }
  return h + '</div>';
}

/* ======================= COMPARAR ======================= */
const CMP_LINHAS = ['R', 'S', 'U', 'V', 'AJ', 'BA', 'BB', 'BX', 'BT', 'BU', 'BD', 'BE', 'BG', 'BH', 'BI', 'BL', 'BM', 'BN', 'BO', 'BP', 'DORSO', 'saldoKg', 'mortPct', 'intMin', 'redMin', 'descKg'];
function tabelaCmp(aA, aB, rA, rB) {
  const linhas = CMP_LINHAS.filter(c => !focoAtivo() || !RDO.ITEM[c] || c === S.foco).map(c => {
    const d = indDef(c), va = indVal(aA, c), vb = indVal(aB, c);
    if (!isNum(va) && !isNum(vb)) return '';
    const dif = isNum(va) && isNum(vb) ? va - vb : null;
    const dir = d.dir;
    const melhor = dif == null || !dir || Math.abs(dif) < 1e-9 ? '' : ((dif > 0) === (dir > 0) ? 'A' : 'B');
    const ehItem = !!RDO.ITEM[c];
    const it = ehItem ? [RDO.analisarItens(aA, CFG).find(x => x.c === c), RDO.analisarItens(aB, CFG).find(x => x.c === c)] : null;
    const cel = (v, ii, w) => `<td class="n ${w ? 'win' : ''}">${fmtInd(c, v)}${ii && ii.analisa && isNum(ii.gapKg) ? `<br><small class="c-${ii.status}">${KG(ii.gapKg)}</small>` : ''}</td>`;
    const difTxt = dif == null ? '—' : d.un === '%' ? `${SN(dif, d.dec)} p.p.` : d.un === 'kg' ? KG(dif) : SN(dif, d.dec);
    return `<tr><td>${esc(d.n)}</td>${cel(va, it && it[0], melhor === 'A')}${cel(vb, it && it[1], melhor === 'B')}<td class="n ${melhor ? (melhor === 'A' ? 'c-ok' : 'c-ruim') : 'muted'}">${difTxt}</td></tr>`;
  }).join('');
  return `<div class="tb-wrap"><table class="tb"><thead><tr><th>Indicador</th><th class="n">${esc(rA)}</th><th class="n">${esc(rB)}</th><th class="n">${esc(rA)} − ${esc(rB)}</th></tr></thead><tbody>${linhas}</tbody></table></div>
  <p class="p-sm muted" style="margin-top:10px">Negrito = melhor dos dois. Verde/vermelho na diferença = ${esc(rA)} melhor/pior. Volumes (frangos, peso) não têm “melhor”.</p>`;
}
function difItensChart(aA, aB, rA, rB) {
  const its = RDO.ITENS.filter(i => (CFG.analisar[i.c] ?? i.analisa));
  const linhas = its.map(i => ({ n: i.n, c: i.c, d: (aA.val[i.c] || 0) - (aB.val[i.c] || 0), da: (aA.val[i.c] - aA.meta[i.c]), db: (aB.val[i.c] - aB.meta[i.c]) })).filter(x => isNum(x.d));
  const mx = Math.max(...linhas.map(x => Math.abs(x.d))) || 1;
  return `<div class="hb${focoAtivo() ? ' com-destaque' : ''}">${linhas.map((x, k) => `<div class="hb-r"${x.c === S.foco ? ' data-destaque="1"' : ''}><span class="lb">${esc(x.n)}</span><span class="hb-t"><i class="zero"></i><i class="b ${x.d >= 0 ? 'pos ok' : 'neg ruim'}" style="--w:${(Math.abs(x.d) / mx * 50).toFixed(1)}%;transition-delay:${k * 40}ms"></i></span><span class="vl ${x.d >= 0 ? 'c-ok' : 'c-ruim'}">${SN(x.d, 3)}<small>p.p.</small></span></div>`).join('')}</div>
  <p class="p-sm muted" style="margin-top:8px">Barra à direita: ${esc(rA)} rendeu mais que ${esc(rB)} naquele item.</p>`;
}
function vComparar() {
  const p = periodo();
  const abas = [['turnos', '1º × 2º turno'], ['periodos', 'Período × período'], ['semana', 'Dias da semana'], ['itens', 'Itens lado a lado'], ['relacoes', 'Relações']];
  let h = `<div class="tabs">${abas.map(([k, n]) => `<button class="${S.cmp === k ? 'on' : ''}" data-act="cmp" data-k="${k}">${n}</button>`).join('')}</div>`;
  if (S.cmp === 'turnos') {
    const r1 = regsPeriodo(p, 'T1'), r2 = regsPeriodo(p, 'T2');
    if (!r1.length || !r2.length) return h + pane('1º × 2º turno', esc(p.rot), `<div class="vazio-grande" style="padding:20px">${ic('comparar')}<h3>Falta um dos turnos</h3><p>${!r1.length && !r2.length ? 'Nenhum turno lançado' : `Só o ${r1.length ? '1º' : '2º'} turno está lançado`} em ${esc(p.rot.toLowerCase())}. Lance o RDO do outro turno ou escolha um período maior (semana ou mês).</p><button class="btn pri" data-act="per" data-p="mes">Ver o mês</button></div>`);
    const a1 = agg(r1), a2 = agg(r2); S._a = agg(regsPeriodo(p, 'todos'));
    const resumo = (a, t) => { const it = RDO.analisarItens(a, CFG).filter(i => i.analisa && isNum(i.gapKg)); const ok = it.filter(i => i.fechou).length; const sal = it.reduce((s, i) => s + i.gapKg, 0); return `<div><div class="stat-l" style="font-weight:650;color:var(--ink-2)">${t === 'T1' ? '1º turno' : '2º turno'}</div><div class="big-n">${ok}<small>/${it.length} fecharam</small></div><div class="p-sm">Saldo <b class="c-${sal >= 0 ? 'ok' : 'ruim'}">${KG(sal)}</b> · OEE ${P(a.val.BX)} · Rend. cortes ${P(a.val.BA, 3)}</div></div>`; };
    const aJ = agg(r1.concat(r2));
    const resJ = (() => { const it = RDO.analisarItens(aJ, CFG).filter(i => i.analisa && isNum(i.gapKg)); const ok = it.filter(i => i.fechou).length; const sal = it.reduce((s, i) => s + i.gapKg, 0); return `<div class="juntos"><div class="stat-l" style="font-weight:650;color:var(--ink-2)">Os dois juntos</div><div class="big-n">${ok}<small>/${it.length} fecharam</small></div><div class="p-sm">Saldo <b class="c-${sal >= 0 ? 'ok' : 'ruim'}">${KG(sal)}</b> · OEE ${P(aJ.val.BX)} · Rend. cortes ${P(aJ.val.BA, 3)}</div></div>`; })();
    h += pane('Placar dos turnos', esc(p.rot), `<div class="row c3">${resumo(a1, 'T1')}${resumo(a2, 'T2')}${resJ}</div>`);
    const i1 = RDO.analisarItens(a1, CFG), i2 = RDO.analisarItens(a2, CFG), iJ = RDO.analisarItens(aJ, CFG);
    const fcJ = focoAtivo() && iJ.some(i => i.c === S.foco && i.analisa && isNum(i.gapKg)) ? S.foco : null;
    const lnJ = iJ.filter(i => i.analisa && isNum(i.gapKg) && (!fcJ || i.c === fcJ));
    const cel = i => i && isNum(i.gapKg) ? `<td class="n c-${i.status}">${KG(i.gapKg)}${i.cx != null ? `<br><small>${SN(i.cx)} cx</small>` : ''}</td>` : '<td class="n muted">—</td>';
    const somaG = l => l.filter(i => i.analisa && isNum(i.gapKg)).reduce((t, i) => t + i.gapKg, 0);
    h += pane('Quanto devemos ou passamos da meta, por item', 'Saldo em kg de cada turno e dos dois turnos juntos (soma). Positivo = acima da meta; negativo = devendo.', `<div class="tb-wrap"><table class="tb"><thead><tr><th>Item</th><th class="n">1º turno</th><th class="n">2º turno</th><th class="n">Juntos</th><th class="n">Juntos (%)</th><th class="n">Meta</th></tr></thead><tbody>
      ${lnJ.map(j => `<tr><td><b>${esc(j.n)}</b></td>${cel(i1.find(x => x.c === j.c))}${cel(i2.find(x => x.c === j.c))}<td class="n c-${j.status}"><b>${KG(j.gapKg)}</b>${j.cx != null ? `<br><small>${SN(j.cx)} cx</small>` : ''}</td><td class="n">${P(j.real, 3)}</td><td class="n">${P(j.meta, 3)}</td></tr>`).join('')}
      <tr><td><b>Todos os itens</b></td><td class="n"><b class="c-${somaG(i1) >= 0 ? 'ok' : 'ruim'}">${KG(somaG(i1))}</b></td><td class="n"><b class="c-${somaG(i2) >= 0 ? 'ok' : 'ruim'}">${KG(somaG(i2))}</b></td><td class="n"><b class="c-${somaG(iJ) >= 0 ? 'ok' : 'ruim'}">${KG(somaG(iJ))}</b></td><td></td><td></td></tr>
    </tbody></table></div><p class="p-sm muted" style="margin-top:10px">Juntos = kg do 1º turno + kg do 2º turno. O % juntos é ponderado pelo peso vivo de cada turno.</p>`);
    h += `<div class="row" style="margin-top:18px">${pane('Diferença por item', 'Quanto o 1º turno rendeu a mais (ou a menos) que o 2º, em pontos percentuais.', difItensChart(a1, a2, 'T1', 'T2'))}`;
    const fx = faixaContexto(p);
    const sp = serie(regsEntre(fx.de, fx.ate, 'todos'), 'dia');
    const cI = focoAtivo() ? S.foco : 'BA';
    const lin = t => sp.map(x => { const rs = x.regs.filter(r => r.turno === t); return rs.length ? agg(rs).val[cI] : null; });

    const series = sel.map((c, k) => ({ name: RDO.ITEM[c].n, color: cores[k], values: sp.map(x => { const v = x.a.val[c], m = x.a.meta[c]; return isNum(v) && m ? v / m * 100 : null; }) }));

  const dec = d.un === '%' ? Math.min(d.dec, 3) : d.dec;

  const vv = vals.filter(isNum);

      <div><div class="big-n" style="font-size:24px">${fmtInd(c, vals[melhorK], dec)}</div><div class="stat-l">melhor · ${esc(sp[melhorK].tip)}</div></div>
      <div><div class="big-n" style="font-size:24px">${fmtInd(c, vals[piorK], dec)}</div><div class="stat-l">pior · ${esc(sp[piorK].tip)}</div></div>

    </div>`);

/* ======================= PREVISÕES ======================= */
function projecaoMes(ref, turno) {
  const ini = `${ref.slice(0, 7)}-01`, d0 = RDO.parseISO(ini);
  const fim = RDO.toISO(new Date(d0.getFullYear(), d0.getMonth() + 1, 0, 12));
  const regsMes = regsEntre(ini, ref, turno);
  if (!regsMes.length) return null;
  const aMes = agg(regsMes);
  const ultimo = regsMes[regsMes.length - 1].data;
  let rest = 0; for (let d = RDO.addDays(ultimo, 1); d <= fim; d = RDO.addDays(d, 1)) if (CFG.diasProducao.includes(RDO.weekday(d))) rest++;
  const nDias = aMes.dias.length;
  const Sdia = aMes.val.S / nDias, Srem = Sdia * rest, Sso = aMes.val.S;
  const hist = serie(regsEntre(RDO.addDays(ref, -60), ref, turno), 'dia');
  const its = RDO.analisarItens(aMes, CFG).filter(i => i.analisa && i.tem);
  const linhas = its.map(i => {
    const sv = hist.map(x => x.a.val[i.c]);
    const f = RDO.prever(sv, Math.max(1, rest));
    const media = f ? RDO.media(f.valores) : RDO.media(sv.filter(isNum));
    const sd = f ? f.sd : (RDO.desvio(sv.filter(isNum)) || 0.1);
    const meta = i.meta;
    const final = rest ? (i.kg + media / 100 * Srem) / (Sso + Srem) * 100 : i.real;
    const precisa = rest ? (meta * (Sso + Srem) / 100 - i.kg) / Srem * 100 : null;
    const sdM = Math.sqrt(sd * sd / Math.max(1, rest) + Math.pow(sd * 0.54, 2));
    const chMes = rest ? 1 - RDO.normCdf((precisa - media) / sdM) : (final >= meta ? 1 : 0);
    const prox = f ? f.valores[0] : media;
    const chProx = RDO.chance(meta, prox, sd, 1);
    return { i, f, media, sd, final, precisa, chMes, prox, chProx, gapFinal: (final - meta) / 100 * (Sso + Srem), meta };
  });
  return { ini, fim, ultimo, rest, nDias, Sdia, Srem, Sso, linhas, aMes, hist };
}
function pctChance(p) { return p < 0.01 ? '< 1%' : p > 0.99 ? '> 99%' : N(p * 100, 0) + '%'; }
function rotChance(p) { return p >= .8 ? ['ok', 'Muito provável'] : p >= .5 ? ['ok', 'Provável'] : p >= .2 ? ['quase', 'Em risco'] : ['ruim', 'Improvável']; }
function vPrev() {
  const pr = projecaoMes(S.ref, S.turno);

  }
  S._a = pr.aMes;
  if (S.foco && RDO.ITEM[S.foco]) S.item = S.foco;
  const fl = S.foco ? pr.linhas.find(l => l.i.c === S.foco) : null;
  const linhasV = fl ? [fl] : pr.linhas;
  const d0 = RDO.parseISO(pr.ini);
  const nFecha = pr.linhas.filter(l => l.final >= l.meta).length;
  let h;
  if (fl) {
    const [st, tx] = rotChance(fl.chMes);
    h = `<section class="hero3 tom-${st} reveal" style="grid-template-columns:1fr">
    <div class="h3-faixa" style="background:var(--prev);color:var(--prev-ink)">${ic('previsao')}<span>Previsão · ${esc(fl.i.n)} · ${cap(RDO.MESES[d0.getMonth()])} · ${esc(turnoRot())}</span><span>${pr.nDias} dia(s) lançado(s) · ${pr.rest} dia(s) de produção pela frente</span></div>
    <div class="h3-main"><span class="carimbo ${st}">${tx}</span>
    <h2 class="h3-ver" style="max-width:24ch">${pr.rest ? `${esc(fl.i.n)} deve fechar o mês em ${P(fl.final, 3)} (meta ${P(fl.meta, 3)})` : `Mês encerrado: ${esc(fl.i.n)} fechou em ${P(fl.final, 3)}`}</h2>
    <p class="h3-sub">Acumulado até agora: <b>${P(fl.i.real, 3)}</b>. ${pr.rest ? (fl.precisa <= 0 ? 'A meta do mês <b>já está garantida</b>.' : `Para fechar na meta, precisa render <b>${P(fl.precisa, 3)}</b> em média nos ${pr.rest} dia(s) que faltam.`) : ''} Chance de fechar: <b>${pctChance(fl.chMes)}</b>. Saldo projetado: <b class="c-${fl.gapFinal >= 0 ? 'ok' : 'ruim'}">${KG(fl.gapFinal)}</b>.</p></div></section>`;
  } else {
    h = `<section class="hero3 tom-${nFecha === pr.linhas.length ? 'ok' : nFecha >= pr.linhas.length / 2 ? 'quase' : 'ruim'} reveal" style="grid-template-columns:1fr">
    <div class="h3-faixa" style="background:var(--prev);color:var(--prev-ink)">${ic('previsao')}<span>Previsão · ${cap(RDO.MESES[d0.getMonth()])} · ${esc(turnoRot())}</span><span>${pr.nDias} dia(s) lançado(s) · ${pr.rest} dia(s) de produção pela frente</span></div>
    <div class="h3-main"><span class="carimbo prev">Projeção</span>
    <h2 class="h3-ver" style="max-width:22ch">${pr.rest ? `Se o ritmo atual continuar, ${nFecha} de ${pr.linhas.length} itens fecham o mês` : `Mês encerrado: ${nFecha} de ${pr.linhas.length} itens fecharam`}</h2>
    <p class="h3-sub">A conta usa os kg já produzidos no mês + o que deve vir nos dias restantes (≈ ${N(pr.Sdia)} kg vivos por dia, no comportamento recente de cada item). <b>“Precisa render”</b> é o rendimento médio necessário daqui para frente para fechar o mês na meta.${S.foco && RDO.ITEM[S.foco] ? ` <b>${esc(RDO.ITEM[S.foco].n)}</b> não tem meta de caixas, então a previsão mostra os itens com meta.` : ''}</p></div></section>`;
  }
  h += pane(fl ? `Fechamento do mês · ${esc(fl.i.n)}` : 'Fechamento do mês por item', 'Chance calculada com a oscilação real de cada item nos últimos dias. Toque no nome do item para ver o gráfico dele.', `<div class="tb-wrap"><table class="tb"><thead><tr><th>Item</th><th class="n">Acumulado</th><th class="n">Projeção do mês</th><th class="n">Meta</th><th class="n">Precisa render</th><th class="n">Saldo projetado</th><th>Chance de fechar</th></tr></thead><tbody>
    ${linhasV.map(l => { const [st, tx] = rotChance(l.chMes); return `<tr><td><button class="btn ghost" style="height:auto;padding:2px 4px" data-act="prev-item" data-item="${l.i.c}">${esc(l.i.n)}</button></td><td class="n">${P(l.i.real, 3)}</td><td class="n"><b>${P(l.final, 3)}</b></td><td class="n">${P(l.meta, 3)}</td><td class="n">${pr.rest ? (l.precisa <= 0 ? '<span class="c-ok">já garantido</span>' : P(l.precisa, 3)) : '—'}</td><td class="n c-${l.gapFinal >= 0 ? 'ok' : 'ruim'}">${KG(l.gapFinal)}</td><td style="min-width:160px"><div style="display:flex;align-items:center;gap:8px"><div class="prob" style="flex:1"><i style="--w:${(l.chMes * 100).toFixed(0)}%;background:repeating-linear-gradient(90deg,var(--${st}) 0 6px,transparent 6px 8px)"></i></div><b class="tab" style="width:44px;text-align:right">${pctChance(l.chMes)}</b></div><small class="c-${st}">${tx}</small></td></tr>`; }).join('')}
  </tbody></table></div>`);
  // próximo lançamento
  h += secT('Próximo lançamento', fl ? `o que esperar de ${esc(fl.i.n.toLowerCase())} no próximo dia` : 'o que esperar do próximo dia · toque para abrir o item');
  h += `<div class="tiles">${linhasV.map(l => { const [st, tx] = rotChance(l.chProx || 0); return `<button class="tile st-${st} reveal" data-act="tile" data-item="${l.i.c}"><span class="tl-band"><span class="tl-nm">${esc(l.i.n)}</span><span class="mono" style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">${tx}</span></span><span class="tl-corpo"><span class="tl-big">${P(l.prox, 3)}</span><span class="tl-meta">entre ${P(l.prox - 1.28 * l.sd, 3)} e ${P(l.prox + 1.28 * l.sd, 3)}</span><span class="tl-bot"><span>meta ${P(l.meta, 3)}</span><b style="margin-left:auto">${pctChance(l.chProx || 0)}</b></span></span></button>`; }).join('')}</div>`;

  // gráfico do item escolhido
  const it = pr.linhas.find(l => l.i.c === S.item) || pr.linhas[0];
  const hist = pr.hist.slice(-30);
  const fut = RDO.prever(pr.hist.map(x => x.a.val[it.i.c]), 6);
  if (fut) {
    let d = hist[hist.length - 1].k; const fl = [], ft = [];
    while (fl.length < 6) { d = RDO.addDays(d, 1); if (CFG.diasProducao.includes(RDO.weekday(d))) { fl.push(RDO.dm(d)); ft.push(RDO.diaCurto(d) + ' (previsão)'); } }
    const nH = hist.length;
    const labels = hist.map(x => x.lab).concat(fl);
    const real = hist.map(x => x.a.val[it.i.c]).concat(fl.map(() => null));
    const prev = hist.map((_, k) => k === nH - 1 ? real[k] : null).concat(fut.valores);
    const lo = hist.map((_, k) => k === nH - 1 ? real[k] : null).concat(fut.valores.map((v, k) => v - 1.28 * fut.sd * Math.sqrt(1 + k * .25)));
    const hi = hist.map((_, k) => k === nH - 1 ? real[k] : null).concat(fut.valores.map((v, k) => v + 1.28 * fut.sd * Math.sqrt(1 + k * .25)));
    h += pane(`${esc(it.i.n)}: histórico e próximos 6 dias`, 'Faixa roxa = onde o valor deve cair em 8 de cada 10 dias. Toque em outro item na tabela acima para trocar.', Charts.slot({ type: 'line', labels, tipLabels: hist.map(x => x.tip).concat(ft), series: [{ name: 'Realizado', color: 'var(--accent)', values: real, status: real.map(v => isNum(v) ? RDO.status(v, it.meta, 1, CFG) : null) }, { name: 'Previsão', color: 'var(--violet)', values: prev, dash: true }], band: { lo, hi }, meta: it.meta, yFmt: (v, st) => N(v, st < .01 ? 3 : 2) + '%', tipFmt: v => P(v, 3) }, 280) + `<div class="legenda"><span><i style="background:var(--accent)"></i>realizado</span><span><i class="tr" style="border-color:var(--violet)"></i>previsão</span><span><i style="background:var(--prev);height:8px"></i>faixa provável</span><span><i class="tr"></i>meta</span></div>`);
  }
  h += pane('Como a previsão é feita', '', `<p class="p-sm">Para cada item, o sistema olha os últimos 60 dias e separa três coisas: <b>o nível atual</b> (dando mais peso aos dias recentes), <b>a tendência</b> (se vem subindo ou caindo, sem deixar ela explodir) e <b>a oscilação</b> (quanto o item costuma variar de um dia para o outro). Com isso ele projeta os próximos dias e calcula a chance de bater a meta. Não é bola de cristal: dias atípicos (troca de lote, peso médio fora do normal, problema de máquina) mudam o resultado. Quanto mais lançamentos, mais confiável.</p>`);
  return h;
}

/* ======================= LANÇAR ======================= */

  const gh = ghCfg();
  const podePub = !!(gh.token && gh.owner && gh.repo);
  let h = `<div class="row">
    ${pane('Ler o PDF do RDO', 'Arraste aqui o PDF do turno (o mesmo que chega todo dia). O sistema lê todas as linhas sozinho e confere as contas antes de salvar.', `<label class="drop" id="drop">${ic('doc')}<h3>Solte o PDF aqui</h3><p>ou toque para escolher · aceita vários de uma vez (1º e 2º turno)</p><input type="file" accept="application/pdf,.pdf" multiple data-act="pdf"></label><p class="p-sm muted" style="margin-top:10px">O PDF é lido no próprio aparelho; nada é enviado a lugar nenhum até você tocar em Publicar.</p>`)}
    ${pane('Colar o que a IA gerou', 'Se a sua IA devolveu o lançamento em JSON (formato explicado no arquivo INSTRUCOES_IA.md), cole aqui.', `<textarea class="inp" id="colar" placeholder='{"data":"2026-10-20","turno":"T1","v":{ ... }}'></textarea><div style="margin-top:10px;display:flex;gap:8px"><button class="btn pri" data-act="colar">${ic('check')}Conferir</button></div>`)}
  </div>`;
  h += planHTML();
  h += `<div class="fdr-chamada reveal"><span class="fc-ic">${ic('alvo')}</span><div><b>As linhas de descarte vieram em branco no RDO?</b><span>Lance linha por linha, com exemplo do que digitar. Vai para a base na nuvem e entra na hora no rendimento de cada item.</span></div><button class="btn tinta" data-act="fdr-abrir">${ic('enviar')}Lançar descartes do RDO</button></div>`;
  if (S.lancErro) h += pane('', '', `<p class="c-ruim" style="margin:0"><b>Não deu certo:</b> ${esc(S.lancErro)}</p>`);
  h += formDescarte();
  if (S.pendentes.length) {
    const cards = S.pendentes.map((r, k) => {
      const au = RDO.auditar(r); const okN = au.filter(x => x.ok).length;
      const a = RDO.agregar([r], CFG);
      const its = RDO.analisarItens(a, CFG).filter(i => i.analisa && isNum(i.gapKg));
      const existe = S.regs.find(x => x.id === `${r.data}_${r.turno}` && !x.demo);
      const igual = existe && JSON.stringify(RDO.canonico(existe).v) === JSON.stringify(RDO.canonico(r).v) && JSON.stringify(RDO.canonico(existe).naoQualidade) === JSON.stringify(RDO.canonico(r).naoQualidade);
      return `<div class="pane reveal" style="margin-top:14px"><div class="pane-h"><div><h2>${RDO.diaCurto(r.data)} · ${r.turno === 'T1' ? '1º turno' : r.turno === 'T2' ? '2º turno' : esc(r.turno)}</h2><p>${esc(r.fonte || '')}${igual ? ' · igual ao que já está na base (sem mudanças)' : existe ? ' · <b>já existe na base com números diferentes: será atualizado</b>' : ' · <b>lançamento novo</b>'}</p></div><div class="acts">${chip(okN === au.length ? 'ok' : 'quase', `${okN}/${au.length} conferências`)}<button class="icon-btn" data-act="pend-rem" data-k="${k}" aria-label="Remover">${ic('x')}</button></div></div>
        <div class="stats" style="margin-bottom:12px"><div><div class="big-n" style="font-size:22px">${N(r.v.R)}</div><div class="stat-l">frangos</div></div><div><div class="big-n" style="font-size:22px">${N(r.v.S)} kg</div><div class="stat-l">peso vivo</div></div><div><div class="big-n" style="font-size:22px">${P(r.v.BA, 3)}</div><div class="stat-l">rend. de cortes</div></div><div><div class="big-n" style="font-size:22px">${P(r.v.BX)}</div><div class="stat-l">OEE</div></div><div><div class="big-n" style="font-size:22px">${its.filter(i => i.fechou).length}/${its.length}</div><div class="stat-l">itens fecharam</div></div></div>
        <details><summary class="p-sm" style="cursor:pointer;font-weight:600">Ver as conferências automáticas</summary><div class="audit" style="margin-top:8px">${au.map(x => `<div class="${x.ok ? 'ok' : 'x'}">${ic(x.ok ? 'check' : 'x')}<span>${esc(x.nome)}</span><em>${esc(x.det)}</em></div>`).join('')}</div></details></div>`;
    }).join('');
    h += secT('Conferir antes de salvar', `${S.pendentes.length} lançamento(s) lido(s)`) + cards;
    h += `<div class="pane reveal" style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn pri grande" data-act="publicar" ${podePub ? '' : 'disabled'}>${ic('github')}Publicar no GitHub</button>
      <button class="btn grande" data-act="salvar-local">${ic('baixar')}Salvar só neste aparelho</button>
      <button class="btn grande" data-act="baixar-base-pend">${ic('baixar')}Baixar base atualizada (.json)</button>
      <span class="p-sm muted" style="flex:1;min-width:220px">${podePub ? `Vai gravar em <b>${esc(gh.owner)}/${esc(gh.repo)}</b> → ${esc(gh.path)}. Todos que abrirem o link veem em seguida.` : 'Para publicar direto daqui, cole um token do GitHub em Ajustes (passo a passo no LEIA-ME). Sem token, salve no aparelho ou baixe a base e suba o arquivo no GitHub.'}</span></div>`;
  }
  h += pane('Rotina do dia a dia', '', `<div class="row c3" style="gap:14px">
    <div class="conta" style="margin:0"><b>1. Pelo sistema (mais rápido)</b><br>Abra esta tela, solte o PDF do turno, confira e toque em Publicar. Leva uns 20 segundos.</div>
    <div class="conta" style="margin:0"><b>2. Pela sua IA</b><br>Mande o PDF para a IA. Ela segue o INSTRUCOES_IA.md, grava no GitHub e o painel atualiza sozinho em até 1 minuto.</div>
    <div class="conta" style="margin:0"><b>3. Sem internet / sem token</b><br>Salve neste aparelho. Depois, em Base de dados, publique tudo de uma vez.</div></div>`);
  return h;
}

/* ---------- descartes lançados à parte ---------- */
function lerFormDesc() {
  const g = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  const data = g('d-data') || S.ref, turno = g('d-turno') || (S.turno === 'T2' ? 'T2' : 'T1'), alvo = g('d-alvo') || 'carcaca';
  let un = g('d-un') || 'carcacas'; if (alvo !== 'carcaca') un = 'kg';
  let t = String(g('d-qtd')).trim();
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.'); else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const qtd = parseFloat(t);
  return { data, turno, alvo, un, qtd, causa: g('d-causa').trim(), obs: g('d-obs').trim() };
}
function prevDescHTML() {
  const f = lerFormDesc();
  if (!(f.qtd > 0)) return 'Preencha a quantidade para ver, antes de salvar, quanto esse descarte tirou do rendimento.';
  const reg = S.regs.find(r => r.data === f.data && r.turno === f.turno);
  if (!reg) return `O RDO de ${RDO.diaCurto(f.data)} (${f.turno}) ainda não foi lançado. O descarte fica guardado e o impacto aparece assim que o RDO entrar.`;
  const tmp = Object.assign({}, reg, { _descMan: [Object.assign({ id: 'previa' }, f)], naoQualidade: {} });
  delete tmp._d;
  const x = RDO.derivar(tmp, CFG).desc[0];
  if (!x) return '';
  const S0 = reg.v.S;
  const its = RDO.analisarItens(agg([reg]), CFG);
  const linhas = Object.entries(x.porItem).filter(([, kg]) => kg >= 0.5).sort((p, q) => q[1] - p[1]).slice(0, 5).map(([c, kg]) => {
    const it = its.find(i => i.c === c);
    const salva = it && it.analisa && isNum(it.gapKg) && it.gapKg < 0 && it.gapKg + kg >= 0;
    return `${esc(RDO.ITEM[c].n)}: ${N(kg, 1)} kg = ${N(kg / S0 * 100, 3)} p.p.${salva ? ' — <b class="c-ok">sem esse descarte, o item teria fechado</b>' : ''}`;
  });
  return `${f.un === 'carcacas' ? `${N(f.qtd)} carcaça(s) × ${N(S0 / reg.v.R, 3)} kg de peso médio × metas dos itens = ` : ''}<b>≈ ${N(x.kg, 1)} kg de produto</b> que deixaram de entrar no rendimento de ${RDO.diaCurto(f.data)} (${f.turno}).<br>${linhas.join('<br>')}`;
}

  const t = S.turno === 'T2' ? 'T2' : 'T1';
  const lista = (S.desc || []).slice().sort((x, y) => (y.data + y.turno).localeCompare(x.data + x.turno)).slice(0, 40);
  return pane('Lançar descartes à parte', 'Para descartes que <b>não</b> vieram no RDO (planilha da qualidade, SIF, anotação do monitor). Pode ser em kg ou em número de carcaças. Não lance aqui o que já está no PDF, para não contar duas vezes.', `

    <div class="field"><label>Turno</label><select class="inp" id="d-turno"><option value="T1" ${t === 'T1' ? 'selected' : ''}>1º turno</option><option value="T2" ${t === 'T2' ? 'selected' : ''}>2º turno</option></select></div>
    <div class="field"><label>O que foi descartado</label><select class="inp" id="d-alvo">${RDO.DESC_ALVOS.map(x => `<option value="${x.k}">${esc(x.n)}</option>`).join('')}</select></div></div>
    <div class="row c3"><div class="field"><label>Unidade</label><select class="inp" id="d-un"><option value="carcacas">carcaças (unidades)</option><option value="kg">kg</option></select><small>Carcaça inteira: em unidades ou kg. Partes: sempre em kg.</small></div>
    <div class="field"><label>Quantidade</label><input class="inp" id="d-qtd" inputmode="decimal" placeholder="ex.: 45,5"></div>
    <div class="field"><label>Causa (opcional)</label><input class="inp" id="d-causa" placeholder="ex.: escaldagem excessiva"></div></div>
    <div class="field"><label>Observação (opcional)</label><input class="inp" id="d-obs" placeholder="ex.: lote, granja, quem apontou"></div>
    <div id="d-prev" class="conta" style="margin:4px 0 12px">Preencha a quantidade para ver, antes de salvar, quanto esse descarte tirou do rendimento.</div>
    <button class="btn pri" data-act="desc-add">${ic('check')}Salvar descarte</button>
    ${lista.length ? `<h4 style="margin:20px 0 6px">Descartes lançados à parte</h4><div class="tb-wrap"><table class="tb"><thead><tr><th>Dia</th><th>Turno</th><th>O quê</th><th class="n">Quantidade</th><th>Causa</th><th></th></tr></thead><tbody>${lista.map(d => `<tr><td>${RDO.diaCurto(d.data)}</td><td>${d.turno}</td><td>${esc(RDO.nomeAlvo(d.alvo))}</td><td class="n">${qtdDesc(d)}</td><td class="muted">${esc(d.causa || '')} ${d._local ? chip('quase', 'só no aparelho') : ''} ${S.regs.some(r => r.data === d.data && r.turno === d.turno) ? '' : chip('neutro', 'RDO do dia não lançado')}</td><td><button class="icon-btn" data-act="desc-del" data-id="${esc(d.id)}" aria-label="Excluir descarte">${ic('lixo')}</button></td></tr>`).join('')}</tbody></table></div>` : ''}`, { id: 'form-desc' });
}

/* ======================= BASE ======================= */
function vBase() {
  const regs = S.regs;
  S._a = null;
  const loc = locais();
  const t1 = regs.filter(r => r.turno === 'T1').length, t2 = regs.filter(r => r.turno === 'T2').length;
  const datas = [...new Set(regs.map(r => r.data))].sort();
  let faltas = [];
  if (datas.length && !S.demo) {
    const esperados = t2 ? ['T1', 'T2'] : ['T1'];
    const hojeISO = RDO.toISO(new Date());
    const fimF = datas[datas.length - 1] > hojeISO ? datas[datas.length - 1] : (hojeISO.slice(0, 7) === datas[datas.length - 1].slice(0, 7) ? RDO.addDays(hojeISO, -1) : datas[datas.length - 1]);
    for (let d = datas[0].slice(0, 8) + '01'; d <= fimF; d = RDO.addDays(d, 1)) {
      if (!CFG.diasProducao.includes(RDO.weekday(d))) continue;
      const tem = regs.filter(r => r.data === d).map(r => r.turno);
      const f = esperados.filter(t => !tem.includes(t));
      if (f.length) faltas.push({ d, f });
    }
  }
  const fonte = S.demo ? 'Demonstração (dados simulados)' : S.fonte.tipo === 'github' ? `GitHub · ${esc(S.fonte.via || '')}` : 'Base embutida no arquivo';
  let h = pane('Resumo da base', fonte, `<div class="stats">
    <div><div class="big-n">${N(regs.length)}</div><div class="stat-l">lançamentos</div></div>
    <div><div class="big-n">${N(datas.length)}</div><div class="stat-l">dias com dados</div></div>
    <div><div class="big-n">${N(t1)} / ${N(t2)}</div><div class="stat-l">1º / 2º turno</div></div>
    <div><div class="big-n" style="font-size:22px">${datas.length ? RDO.dm(datas[0]) + ' – ' + RDO.dm(datas[datas.length - 1]) : '—'}</div><div class="stat-l">período coberto</div></div>
    <div><div class="big-n ${loc.length ? 'c-quase' : ''}">${N(loc.length)}</div><div class="stat-l">só neste aparelho</div></div>
    <div><div class="big-n">${N((S.desc || []).length)}</div><div class="stat-l">descartes lançados à parte</div></div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
    <button class="btn" data-act="sync">${ic('refresh')}Atualizar do GitHub</button>
    <button class="btn" data-act="baixar-base">${ic('baixar')}Baixar base (.json)</button>
    <button class="btn" data-act="baixar-csv">${ic('baixar')}Baixar planilha (.csv)</button>
    <label class="btn" style="position:relative">${ic('enviar')}Importar .json<input type="file" accept=".json,application/json" data-act="importar" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
    ${loc.length || descLocais().length ? `<button class="btn pri" data-act="publicar-locais">${ic('github')}Publicar ${loc.length + descLocais().length} do aparelho</button>` : ''}
  </div>`);
  if (faltas.length) h += pane('Faltando lançar', 'Dias de produção (seg a sáb), desde o dia 1º do primeiro mês da base, sem o RDO de algum turno. Dica: o PDF de sábado traz a semana inteira — soltar ele em Lançar RDO preenche a semana toda.', `<div class="pick">${faltas.slice(-40).map(f => `<button data-act="view" data-v="lancar">${RDO.diaCurto(f.d)} · falta ${f.f.join(' e ')}</button>`).join('')}</div>`);
  const lin = regs.slice().reverse().slice(0, 400).map(r => {
    const au = RDO.auditar(r); const okN = au.filter(x => x.ok).length;

/* ============================================================
   IMPACTO: separa o que faltou em cada item entre
   descartes (apontados) e outros pontos do processo.
   Tudo com os números reais do período, sem estimativa.
   ============================================================ */
// perda em p.p. com sinal; valores menores que a última casa viram "< 0,001" (nunca "−0,000")
const ppNeg = (v, d = 3) => !isNum(v) ? '—' : v < 0.5 * Math.pow(10, -d) ? `< ${N(Math.pow(10, -d), d)}` : `−${N(v, d)}`;
const GRUPO_NQ = { '1': 'Falhas operacionais', '2': 'DIF', '3': 'PCC 1B' };
function grupoDesc(l) {
  const k = l.linha || (l.origem === 'RDO' ? l.k : null);
  return k && GRUPO_NQ[String(k).split('.')[0]] ? GRUPO_NQ[String(k).split('.')[0]] : 'Lançados à parte';
}
function analiseImpacto(a) {
  const imp = RDO.impacto(a, CFG); if (!imp) return null;
  const S0 = a.val.S;
  const its = RDO.analisarItens(a, CFG).filter(i => i.tem);
  const volDe = c => ['interrupcoes', 'reducoes', 'mortalidade'].reduce((t, k) => t + (imp[k] && imp[k].itens ? imp[k].itens[c] || 0 : 0), 0);
  const linhas = its.map(i => {
    const desc = imp.descartes.porItem[i.c] || 0;
    const gap = i.analisa && isNum(i.gapKg) ? i.gapKg : null;
    const falta = gap != null && gap < 0 ? -gap : 0;
    const explic = Math.min(desc, falta);
    const processo = Math.max(0, falta - explic);
    const ppDesc = desc / S0 * 100;
    const gapSem = gap != null ? gap + desc : null;
    return {
      i, desc, gap, falta, explic, processo, ppDesc,
      realSem: isNum(i.real) ? i.real + ppDesc : null, gapSem,
      pctExplic: falta > 0 ? explic / falta * 100 : null,
      fechouAntes: i.fechou, fechariaSem: gapSem != null && gapSem >= 0,
      cxSem: gapSem != null ? RDO.caixas(gapSem, i.pesoCx) : null, vol: volDe(i.c)
    };
  });
  const an = linhas.filter(l => l.i.analisa && l.gap != null);
  const soma = (lst, k) => lst.reduce((t, l) => t + (l[k] || 0), 0);
  const tot = {
    falta: soma(an, 'falta'), explic: soma(an, 'explic'), processo: soma(an, 'processo'),
    sobra: an.filter(l => l.gap > 0).reduce((t, l) => t + l.gap, 0), saldo: soma(an, 'gap'),
    desc: imp.descartes.totalKg, descAn: soma(an, 'desc'), vol: soma(an, 'vol'), volTodos: soma(linhas, 'vol')
  };
  const causas = imp.descartes.linhas.map(l => Object.assign({}, l, { grupo: grupoDesc(l) })).sort((x, y) => y.kg - x.kg);
  return { imp, linhas, an, tot, causas, S0, a };
}
// cobertura: quais lançamentos do período têm descarte apontado (RDO ou à mão)
function coberturaDesc(regs) {
  const lst = regs.map(r => { const d = r._d || RDO.derivar(r, CFG); return { r, tem: d.desc.length > 0, rdo: d.desc.some(x => x.origem === 'RDO'), man: d.desc.some(x => x.origem === 'manual') }; });
  return { lst, com: lst.filter(x => x.tem).length, sem: lst.filter(x => !x.tem) };
}

function fichaImpacto(c) {
  const p = periodo(), regs = regsPeriodo(p); if (!regs.length) return null;
  const a = agg(regs); const AI = analiseImpacto(a); if (!AI) return null;
  const L = AI.linhas.find(x => x.i.c === c); if (!L) return null;
  const i = L.i, S0 = AI.S0;
  const rot = `${p.rot} · ${turnoRot(S.turno, regs)}`;
  const cp = (t, v, cls = '') => `<div class="cp-l ${cls}"><span>${t}</span><i></i><b>${v}</b></div>`;
  let cup = `<div class="cupom"><div class="cp-h">*** Impacto dos descartes ***</div>`;
  cup += cp('Peso vivo abatido', `${N(S0)} kg`) + cp(`${esc(i.n)} produzido`, `${N(i.kg)} kg`) + cp('Rendimento realizado', P(i.real, 3));
  cup += `<div class="cp-sep"></div>` + cp(`Descartes que eram ${esc(i.n.toLowerCase())}`, `${N(L.desc, 1)} kg`) + cp(`÷ ${N(S0)} kg vivos × 100`, `${N(L.ppDesc, 3)} p.p.`) + cp('Rendimento sem os descartes', P(L.realSem, 3), 'cp-tot');
  if (i.analisa && isNum(i.meta)) {
    cup += cp('Meta', P(i.meta, 3)) + `<div class="cp-sep"></div>` + cp('Saldo contra a meta', KG(L.gap));
    if (L.falta > 0) cup += cp('· parte que foi descarte', `${N(L.explic)} kg (${N(L.pctExplic, 1)}%)`) + cp('· outros pontos do processo', `${N(L.processo)} kg (${N(100 - L.pctExplic, 1)}%)`);
    cup += cp('Sem os descartes ficaria', `${KG(L.gapSem)}${L.cxSem != null ? ' · ' + SN(L.cxSem) + ' cx' : ''}`, 'cp-tot');
  }
  const veredito = !i.analisa ? 'item só de produção' : L.desc < 0.05 ? 'nenhum descarte apontado para este item' : L.fechouAntes ? 'fechou mesmo com os descartes' : L.fechariaSem ? 'sem os descartes teria fechado' : 'mesmo sem os descartes ainda faltaria';
  cup += `<div class="cp-pe">— ${veredito} —</div></div>`;

  const lin = AI.imp.descartes.linhas.filter(l => (l.porItem[c] || 0) > 0.0005).sort((x, y) => y.porItem[c] - x.porItem[c]);
  const regra = l => l.alvo === c ? 'a peça é deste item: conta inteira' : l.alvo === 'asa' ? `asa: ${N(l.porItem[c] / l.kg * 100, 1)}% é ${esc(i.n.toLowerCase())} (proporção real do turno)` : l.alvo === 'carcaca' ? `carcaça inteira: ${N(l.porItem[c] / l.kg * 100, 1)}% vira ${esc(i.n.toLowerCase())} (proporção real)` : 'parte de outro item';
  const tab = lin.length ? `<div class="tb-wrap"><table class="tb"><thead><tr><th>Descarte</th><th>Origem</th><th class="n">Quantidade</th><th>Regra usada</th><th class="n">kg neste item</th><th class="n">p.p.</th></tr></thead><tbody>${lin.map(l => `<tr><td><b>${esc(l.n)}</b>${l.linha ? ` <span class="muted mono" style="font-size:11px">${esc(l.linha)}</span>` : ''}</td><td>${origemDesc(l)}</td><td class="n">${qtdDesc(l)}</td><td class="muted" style="white-space:normal">${regra(l)}</td><td class="n"><b>${N(l.porItem[c], 1)}</b></td><td class="n">${N(l.porItem[c] / S0 * 100, 3)}</td></tr>`).join('')}</tbody></table></div>`
    : `<p>Nenhum descarte apontado para ${esc(i.n.toLowerCase())} em ${esc(p.rot.toLowerCase())}. Se o RDO veio com as linhas em branco, lance pelo botão abaixo.</p>`;

  const fx = faixaContexto(p), gran = S.turno === 'todos' ? 'dia' : 'reg';
  const sp = serie(regsEntre(fx.de, p.ate), gran);
  const dkg = sp.map(x => { const im = RDO.impacto(x.a, CFG); return im ? im.descartes.porItem[c] || 0 : 0; });
  const graf = sp.length >= 2 && dkg.some(v => v > 0) ? Charts.slot({ type: 'bars', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series: [{ name: 'Descartes do item', color: 'var(--ruim)', values: dkg }], yFmt: v => N(v, 0), tipFmt: (v, s, k) => `${N(v, 1)} kg = ${N(v / (sp[k].a.val.S || 1) * 100, 3)} p.p.` }, 230) : '<p class="muted">Sem descartes deste item nos últimos dias.</p>';

  const st = !i.analisa ? 'neutro' : L.fechouAntes ? 'ok' : L.fechariaSem ? 'quase' : 'ruim';
  const html = `<div class="ficha">
    <div class="fi-topo"><div class="fi-num"><div class="fi-lbl">${esc(i.n)} · ${esc(rot)}</div><div class="fi-linha"><div class="fi-big c-${L.desc > 0.05 ? 'ruim' : 'neutro'}">${ppNeg(L.ppDesc)}<span style="font-size:.38em"> p.p.</span></div><span class="carimbo ${st}">${L.desc < 0.05 ? 'Sem descarte' : L.fechouAntes ? 'Fechou' : L.fechariaSem ? 'Fecharia' : 'Faltaria'}</span></div>
      <div class="fi-meta">${N(L.desc, 1)} kg descartados · ${P(i.real, 3)} → ${P(L.realSem, 3)} sem descartes${i.analisa ? ` · meta ${P(i.meta, 3)}` : ''}</div>
      <p class="fi-desc">${L.falta > 0 ? `Faltaram <b>${N(L.falta)} kg</b> para a meta. Os descartes explicam <b>${N(L.explic)} kg (${N(L.pctExplic, 1)}%)</b>; os outros <b>${N(L.processo)} kg</b> vieram de outros pontos do processo (corte, regulagem, peso das aves etc.).` : i.analisa ? `O item ficou acima da meta. Os descartes só diminuíram a sobra em <b>${N(L.desc)} kg</b>.` : 'Item só de produção (sem conta de caixas).'}</p></div>
      <div class="fi-placar"><div class="pl-l">Parte da falta que é descarte</div><div class="pl-v ${L.falta > 0 ? 'c-quase' : ''}">${L.pctExplic != null ? N(L.pctExplic, 1) : '—'}<small>%</small></div><div class="pl-cx">${L.falta > 0 ? `${N(L.explic)} de ${N(L.falta)} kg que faltaram` : 'não faltou nada contra a meta'}</div><div class="fp-l"><span>Descartado</span><b>${N(L.desc, 1)} kg</b></div><div class="fp-l" style="border:0;margin:0;padding-top:0"><span>Sem descartes</span><b class="c-${(L.gapSem || 0) >= 0 ? 'ok' : 'ruim'}">${L.gapSem != null ? KG(L.gapSem) : '—'}</b></div></div></div>
    <div class="fi-grid"><div class="fi-col">${cup}</div><div class="fi-col"><div class="fi-bloco"><h4>${ic('volume')}Descartes deste item, dia a dia</h4>${graf}</div></div></div>
    <div class="fi-bloco"><h4>${ic('alvo')}De onde vieram os ${N(L.desc, 1)} kg</h4>${tab}</div>
    <div class="fi-acoes"><button class="btn tinta" data-act="fdr-abrir">${ic('enviar')}Lançar descartes do RDO</button><button class="btn" data-act="view" data-v="itens" data-item="${c}">${ic('itens')}Análise completa do item</button></div>
  </div>`;
  return { titulo: `${i.n} · impacto dos descartes`, sub: rot, html };
}

  if (!/^\d+(\.\d+)?$/.test(t)) return NaN;
  return parseFloat(t);
}
const idFdr = (data, turno, k) => `nq-${data}-${turno}-${k}`;
function fdrCarregar(data, turno) {
  const vals = {};
  for (const d of (S.desc || [])) if (d.data === data && d.turno === turno && d.linha && +d.qtd > 0) vals[d.linha] = String(d.qtd).replace('.', ',');
  S._fdr = { data, turno, vals, salvo: JSON.stringify(vals), msg: S._fdr && S._fdr.data === data && S._fdr.turno === turno ? S._fdr.msg : null };
}
const fdrSujo = () => S._fdr && JSON.stringify(Object.fromEntries(Object.entries(S._fdr.vals).filter(([, v]) => String(v).trim()))) !== S._fdr.salvo;
function fdrAbrir(data, turno, origem) {
  let d = data || S.ref, t = turno || (S.turno === 'T2' ? 'T2' : 'T1');

function fdrRedesenhar() { const el = $('#fdr'); if (!el) return; el.innerHTML = fdrHTML(); posThumbs(el); fdrPrevia(); }
