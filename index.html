  if (leit.length) h += pane('Leitura automática', 'O que os números dizem, em frases. Toque para ir ao detalhe.', `<div class="leit">${leit.map(l => `<button class="leit-i ${l.tom}" ${l.ir ? `data-act="ir" data-ir='${esc(JSON.stringify(l.ir))}'` : ''}><span class="ic">${ic(l.icone === 'balanca' ? 'balanca' : l.icone === 'ponte' ? 'ponte' : l.icone === 'oee' ? 'oee' : l.icone === 'volume' ? 'volume' : l.icone === 'perdas' ? 'perdas' : l.icone === 'sobe' ? 'sobe' : 'desce')}</span><span><h4>${esc(l.titulo)}</h4><p>${l.texto}</p></span><span class="go">${l.ir ? ic('dir') : ''}</span></button>`).join('')}</div>`);

  h += secT('Itens', `${an.length ? `${ok.length} fecharam · ${nok.length} não fecharam` : ''} · toque para abrir a conta`);
  const nokO = nok.slice().sort((x, y) => x.gapKg - y.gapKg), okO = ok.slice().sort((x, y) => y.gapKg - x.gapKg);
  if (nokO.length) h += `<div class="tiles">${nokO.map(tile).join('')}</div>`;
  if (okO.length) h += `<div class="tiles" style="margin-top:12px">${okO.map(tile).join('')}</div>`;
  const outros = its.filter(i => !i.analisa && i.tem);
  if (outros.length) h += `<div class="tiles" style="margin-top:12px">${outros.map(tile).join('')}</div>`;

  h += `<div class="row c2-1" style="margin-top:18px">
    ${pane('Ponte do rendimento de cortes', 'Da meta ao realizado: quanto cada item somou ou tirou. Barras verdes ajudaram, vermelhas atrapalharam.', Charts.slot({ type: 'ponte', ponte: RDO.ponte(a), onClick: c => { S.item = c; ir({ view: 'itens', item: c }); } }, (RDO.ponte(a) ? RDO.ponte(a).passos.length + 2 : 4) * 30 + 12), { id: 'ponte' })}
    ${pane('Saldo em kg por item', 'Acima ou abaixo da meta, já convertido em caixas.', hbarsKg(its))}
  </div>`;

  h += pane('Desempenho da linha', 'O ponteiro no meio do arco é a meta. Toque em cada um para ver a conta.', dialsHTML(a), { id: 'desempenho' });

  // volume e tempo
  const V = a.val;
  const volLin = [
    { rot: 'Plano do dia', v: V.N, txt: N(V.N), sub: S.turno === 'todos' || !CFG.planoCompartilhado ? '' : 'dia todo' },
    { rot: 'Programado', v: V.Q, txt: N(V.Q) },
    { rot: 'Abatido', v: V.R, txt: N(V.R), sub: isNum(V.P) ? P(V.P, 1) + ' do plano' : '', cls: RDO.status(V.T, a.meta.T, 1, CFG) }
  ];
  const janela = (V.AV || 0) + (V.AU || 0);
  const pctH = x => janela ? (x / janela * 100).toFixed(2) : 0;
  const tempo = janela ? `<div class="strip" style="height:34px" data-strip>
      <div class="sg quebra" style="flex:${pctH(V.AU)} 1 0" title="Paradas programadas">${V.AU / janela > .12 ? `<b style="font-size:12px">${N(V.AU, 1)} h</b>` : ''}</div>
      ${V.AW > 0 ? `<div class="sg ruim" style="flex:${pctH(V.AW)} 1 0">${V.AW / janela > .08 ? `<b style="font-size:12px">${N(V.AW, 1)} h</b>` : ''}</div>` : ''}
      <div class="sg ok" style="flex:${pctH(V.AX)} 1 0"><b style="font-size:12px">${N(V.AX, 1)} h rodando</b></div></div>
      <div class="strip-leg"><span><i style="background:var(--sunk-2)"></i>paradas programadas ${N(a.ppMin)} min</span><span><i style="background:var(--ruim)"></i>interrupções ${N(a.intMin)} min</span><span><i style="background:var(--ok)"></i>horas trabalhadas</span></div>
      <p class="p-sm" style="margin:14px 0 0">A linha rodou <b>${N(V.AX, 1)} h</b> e abateu o que o ritmo padrão faria em <b>${N(V.AY, 1)} h</b> — ${V.AY >= V.AX ? `ganhou <b>${N(V.AY - V.AX, 1)} h</b> (eficiência ${P(V.BU, 1)})` : `perdeu <b>${N(V.AX - V.AY, 1)} h</b> de ritmo (eficiência ${P(V.BU, 1)})`}.${a.redMin ? ` Teve ${N(a.redMin)} min com velocidade reduzida.` : ''}</p>` : '<p class="muted">Sem horas apontadas.</p>';
  h += `<div class="row" style="margin-top:18px">
    ${pane('Volume', `Peso médio ${N(V.U, 3)} kg · ${N(V.V)} frangos/h · ritmo padrão ≈ ${N(a.ritmo)} frangos/h`, barrasUni(volLin))}
    ${pane('Tempo de linha', 'Como as horas do turno foram usadas.', tempo)}
  </div>`;

  if (imp) {
    const st = [
      ['Interrupções', `${N(a.intMin)} min`, a.intMin ? `≈ ${N(imp.interrupcoes.fr)} frangos a menos` : 'nenhuma'],
      ['Redução de velocidade', `${N(a.redMin)} min`, a.redMin ? `≈ ${N(imp.reducoes.fr)} frangos (estimativa)` : 'nenhuma'],
      ['Mortalidade no transporte', `${N(a.mort)}`, isNum(a.mortPct) ? `${P(a.mortPct, 3)} · meta ${P(a.meta['4.1'], 2)}` : ''],
      ['Descartes em kg', `${N(imp.descartes.totalKg)} kg`, imp.descartes.totalKg ? 'tiram peso direto dos itens' : 'nenhum apontado']

    h += pane('Perdas do período', 'Resumo. O detalhe, com a conta de cada perda, fica em Perdas e impacto.', `<div class="stats">${st.map(s => `<div><div class="big-n" style="font-size:26px">${s[1]}</div><div class="stat-l"><b style="color:var(--ink-2)">${s[0]}</b><br>${s[2]}</div></div>`).join('')}</div>`, { acts: `<button class="btn" data-act="view" data-v="perdas">Ver detalhes</button>` });
  }

  const sp = serie(regsEntre(fx.de, p.ate), gran);
  if (sp.length >= 2) {
    const sT = S.turno === 'todos' && a.turnos.length > 1 ? ['T1', 'T2'] : null;
    const labs = sp.map(x => x.lab);
    const series = [{ name: 'Rend. de cortes', color: 'var(--accent)', values: sp.map(x => x.a.val.BA), status: sp.map(x => RDO.status(x.a.val.BA, x.a.meta.BA, 1, CFG)), area: true }];
    if (sT && gran === 'dia') { series[0].name = 'Ambos (dia)'; series[0].color = 'var(--ink-3)'; for (const t of sT) series.push({ name: t === 'T1' ? '1º turno' : '2º turno', color: t === 'T1' ? 'var(--t1)' : 'var(--t2)', values: sp.map(x => { const rs = x.regs.filter(r => r.turno === t); return rs.length ? agg(rs).val.BA : null; }), dots: false, fino: true }); }
    h += pane('Rendimento de cortes no tempo', `${cap(fx.nota)} · cada ponto colorido mostra se fechou`, Charts.slot({ type: 'line', labels: labs, tipLabels: sp.map(x => x.tip), series, meta: sp.map(x => x.a.meta.BA), yFmt: (v, st) => N(v, st < .1 ? 2 : 1) + '%', tipFmt: v => P(v, 3) }, 240) + (series.length > 1 ? `<div class="legenda">${series.map(s => `<span><i class="${s.dash ? 'tr' : ''}" style="background:${s.color};${s.dash ? 'border-color:' + s.color : ''}"></i>${s.name}</span>`).join('')}<span><i class="tr"></i>meta</span></div>` : ''));
  }

  h += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
    <button class="btn pri grande" data-act="whats">${ic('whats')}Resumo para WhatsApp</button>
    <button class="btn grande" data-act="apresentar">${ic('play')}Apresentar na reunião</button></div>`;
  return h;
}

/* ======================= RDO VIVO ======================= */
const RDO_SECOES = [
  { id: 'vol', n: 'Volume de produção', codes: ['N', 'O', 'P', 'Q', 'R', 'S', 'T', 'U', 'V'] },
  { id: 'cx', n: 'Produção em caixas', codes: ['X', 'Y', 'Y1', 'Y2', 'Y3', 'Y4', 'Z', 'AA', 'AB', 'AC', 'AC1', 'AC2', 'AC3', 'AE', 'AF', 'AG', 'AG1', 'AG2', 'AG3', 'AH', 'AI', 'AJ', 'AK', 'AL', 'AM', 'AN', 'AO', 'AO1', 'AP', 'AQ', 'AQ1', 'AR'] },
  { id: 'horas', n: 'Horas máquina', codes: ['AS', 'AT', 'AU', 'AV', 'AW', 'AX', 'AY', 'AZ'] },
  { id: 'rend', n: 'Rendimento', codes: ['BA', 'BB', '#Cortes', 'BD', 'BE', 'BG', 'BH', 'BI', '#Miúdos', 'BL', 'BM', 'BN', 'BO', '#CMS e outros', 'BP', 'DORSO', 'BQ'] },
  { id: 'des', n: 'Desempenho', codes: ['BT', 'BU', 'BV', 'BW', 'BX'] },
  { id: 'pp', n: 'Paradas programadas (min)', codes: Object.keys(RDO.PP), tab: 'pp' },
  { id: 'int', n: 'Interrupções (min)', codes: Object.keys(RDO.INT), tab: 'int' },
  { id: 'red', n: 'Reduções de velocidade (min)', codes: Object.keys(RDO.RED), tab: 'red' },
  { id: 'nq', n: 'Desvios de não-qualidade', codes: Object.keys(RDO.NQ).filter(k => !RDO.NQ[k].grupo), tab: 'nq' }
];
function valCod(a, c, tab) {
  if (!a) return undefined;
  if (tab) return a[tab][c];
  if (c === 'AS' || c === 'AT') return a.val[c];
  return a.val[c];
}
function nomeCod(c, tab) {
  if (tab === 'pp') return RDO.PP[c];
  if (tab === 'int') return RDO.INT[c];
  if (tab === 'red') return RDO.RED[c];
  if (tab === 'nq') return RDO.NQ[c].n + (RDO.NQ[c].un ? ` (${RDO.NQ[c].un})` : '');
  return RDO.L[c] ? RDO.L[c].n : c;
}
function vRdo() {
  const dom = RDO.inicioSemana(S.ref);
  const dias = [0, 1, 2, 3, 4, 5, 6].map(k => RDO.addDays(dom, k));
  const regsSem = regsEntre(dias[0], dias[6]);
  if (!regsSem.length) return vazioPeriodo(periodo('semana'));
  const aDia = dias.map(d => { const rs = regsSem.filter(r => r.data === d); return rs.length ? agg(rs) : null; });
  const aAc = agg(regsSem); S._a = aAc; S._rdo = { dias, aDia, aAc };
  const metas = aAc.meta;
  const ultimoDia = [...aDia].reverse().find(Boolean);
  let rows = '';
  for (const sec of RDO_SECOES) {
    const fech = !!S.fechadas['rdo-' + sec.id];
    let corpo = '', vis = 0;
    for (const c of sec.codes) {
      if (c.startsWith('#')) { corpo += `<tr class="lin-g"><td class="c-cod"></td><td class="c-item"><div class="cel nm" style="color:var(--ink-3);font-size:11.5px;font-weight:650">${c.slice(1)}</div></td><td colspan="9"></td></tr>`; continue; }
      const vals = aDia.map(a => valCod(a, c, sec.tab));
      const vac = valCod(aAc, c, sec.tab);
      const temAlgum = vals.some(v => isNum(v) ? (sec.tab ? v !== 0 : true) : !!v);
      if (S.semVazias && !temAlgum) continue;
      vis++;
      const l = RDO.L[c] || {};
      const dir = sec.tab ? (sec.tab === 'pp' ? 0 : -1) : (l.dir || 0);
      const meta = sec.tab === 'nq' && c === '4.1' ? metas['4.1'] : (sec.tab ? undefined : metas[c]);
      const fmt = v => {
        if (sec.tab) return isNum(v) && v !== 0 ? N(v, 0) : '';
        return isNum(v) || typeof v === 'string' ? RDO.fmtLinha(c, v) : '';
      };
      const cel = (v, aa, acum) => {
        let txt = fmt(v); if (!txt) return `<td class="dcol ${acum ? 'acum' : ''}"><div class="cel vazio">·</div></td>`;
        let st = 'neutro';
        if (sec.tab === 'nq' && c === '4.1' && aa) { const pc = aa.mortPct; st = RDO.status(pc, meta, -1, CFG); txt = `${txt} <small class="muted">${P(pc, 3)}</small>`; }
        else if (!sec.tab && dir && isNum(meta) && isNum(v) && (!RDO.ITEM[c] || (CFG.analisar[c] !== false && RDO.ITEM[c].analisa !== false) || c === 'BA')) st = RDO.status(v, meta, dir, CFG);
        if (RDO.ITEM[c] && !(CFG.analisar[c] ?? RDO.ITEM[c].analisa)) st = 'neutro';
        return `<td class="dcol ${acum ? 'acum' : ''}"><div class="cel">${st !== 'neutro' ? `<span class="pill ${st}">${txt}</span>` : txt}</div></td>`;
      };
      const sub = l.sub ? ' sub' : '';
      corpo += `<tr class="lin" data-act="rdo-lin" data-c="${c}" data-tab="${sec.tab || ''}"><td class="c-cod cod"><div class="cel" style="padding-left:14px">${esc(c === 'DORSO' ? '—' : c.replace(/^([A-Z]+)(\d)$/, '$1.$2'))}</div></td>
        <td class="c-item"><div class="cel nm${sub}">${ic('dir')}${esc(nomeCod(c, sec.tab))}</div></td>
        <td class="meta"><div class="cel">${isNum(meta) ? (sec.tab === 'nq' ? P(meta, 2) : RDO.fmtLinha(c, meta)) : ''}</div></td>
        ${vals.map((v, k) => cel(v, aDia[k])).join('')}${cel(sec.id === 'horas' && (c === 'AS' || c === 'AT') ? '' : vac, aAc, true)}</tr>`;
    }
    if (!vis && S.semVazias) continue;
    rows += `<tbody><tr class="secao ${fech ? 'fechada' : ''}"><td colspan="11"><button data-act="rdo-sec" data-s="${sec.id}">${ic('baixo')}${esc(sec.n)} <span>${vis} linha${vis === 1 ? '' : 's'}</span></button></td></tr></tbody><tbody class="corpo-sec" ${fech ? 'hidden' : ''}>${corpo}</tbody>`;
  }
  const hoje = S.ref;
  const tab = `<div class="rdo-wrap reveal"><table class="rdo"><thead><tr><th class="c-cod">Cód.</th><th class="c-item" style="text-align:left">Item</th><th>Meta</th>
    ${dias.map(d => `<th class="dcol ${d === hoje ? 'hoje' : ''}"><button style="all:unset;cursor:pointer" data-act="ir-dia" data-d="${d}">${cap(RDO.DIAS[RDO.weekday(d)])}<small>${RDO.dm(d)}</small></button></th>`).join('')}<th>Acumulado<small>semana ${RDO.semanaRDO(dom)}</small></th></tr></thead>${rows}</table></div>`;
  return pane(`RDO vivo · semana ${RDO.semanaRDO(dom)}`, `${RDO.dm(dias[0])} a ${RDO.dm(dias[6])} · ${esc(turnoRot(S.turno, regsSem))} · toque numa linha para ver a explicação e o histórico; toque no dia para abrir a visão geral dele.`,
    `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 0 12px"><label class="opt" style="border:0;padding:0;gap:8px"><span class="sw"><input type="checkbox" data-act="rdo-vazias" ${S.semVazias ? 'checked' : ''}><span></span></span><small>Esconder linhas vazias</small></label>
     <span class="p-sm muted">Cores: ${chip('ok')} ${chip('quase')} ${chip('ruim')}</span></div>`, { reveal: false }) + tab;
}
function rdoDetalhe(c, tab) {
  const R = S._rdo; if (!R) return '';
  const l = RDO.L[c] || {};
  const nome = nomeCod(c, tab);
  const a = R.aAc;
  let h = `<div class="det-grid"><div><h4>${esc(nome)}</h4>`;
  if (l.ex) h += `<p>${esc(l.ex)}</p>`;
  else if (RDO.ITEM[c]) h += `<p>De cada 100 kg de frango vivo, quantos kg viraram ${esc(RDO.ITEM[c].n.toLowerCase())}.${RDO.ITEM[c].analisa ? ` Fica verde se bater a meta, amarelo se ficar a menos de ${100 - CFG.amarelo}% dela e vermelho se ficar mais longe.` : ' Item sem análise de caixas (só produção).'}</p>`;
  if (l.f && !tab) h += `<p class="p-sm"><b>Fórmula do RDO:</b> ${esc(l.f)}</p>`;
  const ct = contaInd(c, a);
  if (ct) h += `<div class="conta">No acumulado da semana: ${ct}</div>`;
  const item = RDO.ITEM[c];
  if (item) {
    const rows = R.dias.map((d, k) => { const ad = R.aDia[k]; if (!ad) return ''; const ii = RDO.analisarItens(ad, CFG).find(x => x.c === c); return `<tr><td>${RDO.diaCurto(d)}</td><td class="n">${P(ii.real, 3)}</td><td class="n">${N(ii.kg, 0)} kg</td><td class="n c-${ii.analisa ? ii.status : 'neutro'}">${ii.analisa ? KG(ii.gapKg) : ''}</td><td class="n">${ii.cx != null ? SN(ii.cx) + ' cx' : ''}</td></tr>`; }).join('');
    h += `<div class="tb-wrap"><table class="tb"><thead><tr><th>Dia</th><th class="n">Rend.</th><th class="n">Produzido</th><th class="n">Saldo</th><th class="n">Caixas</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if (tab === 'nq' && RDO.NQ[c] && RDO.NQ[c].alvo) h += `<p class="p-sm">Este peso é tirado de <b>${RDO.NQ[c].alvo === 'carcaca' ? 'todos os itens (carcaça inteira)' : RDO.NQ[c].alvo === 'asa' ? 'coxinha, meio e ponta da asa' : esc(RDO.ITEM[RDO.NQ[c].alvo] ? RDO.ITEM[RDO.NQ[c].alvo].n : RDO.NQ[c].alvo)}</b>, então derruba o rendimento desse(s) item(ns).</p>`;
  h += `</div><div>`;
  // histórico
  const fim = R.dias[6], ini = RDO.addDays(fim, -45);
  const sp = serie(regsEntre(ini, fim), S.turno === 'todos' ? 'dia' : 'reg');
  const vals = sp.map(x => { const v = tab ? x.a[tab][c] || 0 : (c === '4.1' ? x.a.mortPct : x.a.val[c]); return isNum(v) ? v : null; });
  if (vals.filter(isNum).length >= 2 && c !== 'AS' && c !== 'AT') {
    const metasL = sp.map(x => tab ? undefined : x.a.meta[c]);
    h += `<h4 style="margin-bottom:8px">Histórico (até 45 dias)</h4>` + Charts.slot({ type: tab ? 'bars' : 'line', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series: [{ name: nome, color: 'var(--accent)', values: vals, status: !tab && l.dir ? sp.map((x, i) => RDO.status(vals[i], metasL[i], l.dir, CFG)) : null }], meta: tab ? undefined : metasL, yFmt: (v, st) => l.un === '%' ? N(v, st < .1 ? 2 : 1) + '%' : N(v, st < 1 ? 1 : 0), tipFmt: v => tab ? N(v, 0) : RDO.fmtLinha(c, v) }, 190);
  } else h += `<p class="muted">O histórico aparece quando houver mais lançamentos.</p>`;
  h += `</div></div>`;
  return h;
}

/* ======================= ITENS ======================= */
function vItens() {
  const p = periodo(), regs = regsPeriodo(p);
  const picker = `<div class="pick" style="margin-bottom:16px">${RDO.ITENS.map(i => `<button class="${i.c === S.item ? 'on' : ''}" data-act="item" data-item="${i.c}">${esc(i.n)}</button>`).join('')}</div>`;
  if (!regs.length) return picker + vazioPeriodo(p);
  const a = agg(regs); S._a = a;
  const its = RDO.analisarItens(a, CFG);
  const i = its.find(x => x.c === S.item) || its[0];
  const st = i.analisa ? i.status : 'neutro';
  const fx = faixaContexto(p);
  const regsCtx = regsEntre(fx.de, fx.ate);
  const gran = p.per === 'ano' || p.per === 'perso' && (RDO.parseISO(p.ate) - RDO.parseISO(p.de)) / 864e5 > 70 ? 'semana' : 'dia';
  const sp = serie(regsCtx, gran);
  const vi = x => RDO.analisarItens(x.a, CFG).find(y => y.c === i.c);
  const pts = sp.map(x => ({ x, ii: vi(x) }));
  const imp = RDO.impacto(a, CFG);

  let h = picker;
  h += `<section class="pane hero" style="--hero-glow:${{ ok: 'var(--ok-soft)', quase: 'var(--quase-soft)', ruim: 'var(--ruim-soft)', neutro: 'var(--accent-soft)' }[st]}">
    <div class="hero-top">${chip(st, !i.analisa ? 'Só produção' : i.fechou ? 'Fechou' : st === 'quase' ? 'Quase' : 'Não fechou')}<span class="quando">${esc(p.rot)} · ${esc(turnoRot(S.turno, regs))}</span></div>
    <h2 class="veredito">${esc(i.n)}: ${P(i.real, 3)}${i.analisa && isNum(i.meta) ? ` <span style="color:var(--ink-3);font-weight:600">/ meta ${P(i.meta, 3)}</span>` : ''}</h2>
    <p class="sub">${i.analisa && isNum(i.gapKg) ? `${i.gapKg >= 0 ? 'Rendeu acima da meta' : 'Rendeu abaixo da meta'}: <b>${KG(i.gapKg)}</b>${i.cx != null ? ` = <b>${SN(i.cx)} caixas</b> de ${i.pesoCx} kg` : ' (menos de uma caixa)'}. Foram produzidos <b>${N(i.kg, 0)} kg</b>; pela meta seriam ${N(i.metaKg, 0)} kg.` : `Produzidos <b>${N(i.kg, 0)} kg</b> neste período. Este item não entra na conta de caixas.`}</p>
    ${contaItem(i, a)}
  </section>`;

  // estatísticas do contexto
  const vals = pts.map(o => o.ii.real).filter(isNum);
  if (vals.length >= 2) {
    const fech = pts.filter(o => o.ii.fechou).length;
    const melhor = pts.filter(o => isNum(o.ii.real)).sort((x, y) => y.ii.real - x.ii.real)[0];
    const pior = pts.filter(o => isNum(o.ii.real)).sort((x, y) => x.ii.real - y.ii.real)[0];
    const saldoCtx = pts.reduce((s, o) => s + (o.ii.gapKg || 0), 0);
    const rg = vals.length >= 5 ? RDO.regressao(vals.map((_, k) => k), vals) : null;
    const tend = rg && Math.abs(rg.r) >= 0.3 ? rg.b * 7 : 0;
    const stat = (v, l) => `<div><div class="big-n" style="font-size:24px">${v}</div><div class="stat-l">${l}</div></div>`;
    h += pane('Comportamento do item', `${cap(fx.nota)} · ${pts.length} ${gran === 'dia' ? 'dias' : 'semanas'}`, `<div class="stats">
      ${stat(P(RDO.media(vals), 3), 'média simples')}
      ${i.analisa ? stat(`${fech}/${pts.length}`, `${gran === 'dia' ? 'dias' : 'semanas'} que fecharam`) : ''}
      ${stat(P(melhor.ii.real, 3), 'melhor · ' + esc(melhor.x.tip))}
      ${stat(P(pior.ii.real, 3), 'pior · ' + esc(pior.x.tip))}
      ${stat(N(RDO.desvio(vals), 3), 'oscilação (desvio padrão, p.p.)')}
      ${i.analisa ? stat(`<span class="c-${saldoCtx >= 0 ? 'ok' : 'ruim'}">${KG(saldoCtx)}</span>`, 'saldo somado no intervalo') : ''}
      ${!rg ? stat('<span class="c-neutro">—</span>', 'tendência (precisa de 5+ pontos)') : stat(`<span class="c-${Math.abs(tend) < 0.005 ? 'neutro' : tend > 0 ? 'ok' : 'ruim'}">${Math.abs(tend) < 0.005 ? 'estável' : (tend > 0 ? '▲ ' : '▼ ') + N(Math.abs(tend), 3)}</span>`, Math.abs(tend) < 0.005 ? 'tendência' : `p.p. a cada 7 ${gran === 'dia' ? 'dias' : 'semanas'}`)}
    </div>`);
    const series = [{ name: i.n, color: 'var(--accent)', values: pts.map(o => o.ii.real), status: i.analisa ? pts.map(o => o.ii.status) : null, area: true }];
    if (S.turno === 'todos' && gran === 'dia' && regsCtx.some(r => r.turno === 'T2') && regsCtx.some(r => r.turno === 'T1')) { series[0].name = 'Ambos (dia)'; series[0].color = 'var(--ink-3)'; for (const t of ['T1', 'T2']) { const v = sp.map(x => { const rs = x.regs.filter(r => r.turno === t); return rs.length ? RDO.analisarItens(agg(rs), CFG).find(y => y.c === i.c).real : null; }); series.push({ name: t === 'T1' ? '1º turno' : '2º turno', color: t === 'T1' ? 'var(--t1)' : 'var(--t2)', values: v, dots: false, fino: true }); } }
    let acc = 0; const acum = pts.map(o => (acc += (o.ii.gapKg || 0)));
    h += `<div class="row" style="margin-top:18px">
      ${pane('Rendimento no tempo', 'Pontos coloridos: verde fechou, amarelo quase, vermelho não fechou.', Charts.slot({ type: 'line', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series, meta: i.analisa ? pts.map(o => o.ii.meta) : undefined, yFmt: (v, s) => N(v, s < .01 ? 3 : 2) + '%', tipFmt: v => P(v, 3), tipExtra: k => { const ii = pts[k].ii; return i.analisa && isNum(ii.gapKg) ? `<div class="tt-row"><span>Saldo</span><b>${KG(ii.gapKg)}${ii.cx != null ? ` · ${SN(ii.cx)} cx` : ''}</b></div>` : ''; } }, 250) + (series.length > 1 ? `<div class="legenda">${series.map(s => `<span><i class="${s.dash ? 'tr' : ''}" style="background:${s.color};border-color:${s.color}"></i>${s.name}</span>`).join('')}</div>` : ''))}
      ${i.analisa ? pane('Saldo acumulado em kg', 'Soma dos kg ganhos e perdidos, ponto a ponto. Descendo = perdendo; subindo = recuperando.', Charts.slot({ type: 'line', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series: [{ name: 'Saldo acumulado', color: acc >= 0 ? 'var(--ok)' : 'var(--ruim)', values: acum, area: true, dots: false }], meta: 0, metaLabel: false, yFmt: v => N(v, 0), tipFmt: v => KG(v) + ` (${SN(Math.round(v / i.pesoCx))} cx)` }, 250)) : pane('Produção em kg', '', Charts.slot({ type: 'bars', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series: [{ name: 'kg', color: 'var(--accent)', values: pts.map(o => o.ii.kg) }], yFmt: v => N(v / 1000, 0) + ' t', tipFmt: v => N(v, 0) + ' kg' }, 250))}
    </div>`;
  }

  // dia da semana (todo o histórico do turno filtrado)
  const todos = regsEntre('0000-01-01', '9999-12-31');
  const porDow = [1, 2, 3, 4, 5, 6].map(d => { const rs = todos.filter(r => RDO.weekday(r.data) === d); return rs.length ? RDO.analisarItens(agg(rs), CFG).find(y => y.c === i.c) : null; });
  if (porDow.filter(Boolean).length >= 2) {
    const nomes = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
    const dif = porDow.map(x => x && isNum(x.real) && isNum(x.meta) ? x.real - x.meta : null);
    const mx = Math.max(...dif.filter(isNum).map(Math.abs)) || 1;
    const corpo = porDow.map((x, k) => !x ? '' : i.analisa ? `<div class="hb-r"><span class="lb">${nomes[k]}</span><span class="hb-t"><i class="zero"></i><i class="b ${dif[k] >= 0 ? 'pos' : 'neg'} ${x.status}" style="--w:${(Math.abs(dif[k]) / mx * 50).toFixed(1)}%"></i></span><span class="vl c-${x.status}">${P(x.real, 3)}<small>${SN(dif[k], 3)} p.p.</small></span></div>` : `<div class="hb-r"><span class="lb">${nomes[k]}</span><span></span><span class="vl">${P(x.real, 3)}</span></div>`).join('');
    h += `<div class="row" style="margin-top:18px">${pane('Por dia da semana', i.analisa ? `Média ponderada de todo o histórico${S.turno !== 'todos' ? ' do ' + turnoRot() : ''}. Barra = distância da meta.` : 'Média ponderada de todo o histórico.', `<div class="hb">${corpo}</div>`)}`;
  } else h += `<div class="row" style="margin-top:18px">${pane('Por dia da semana', '', '<p class="muted">Aparece quando houver lançamentos em pelo menos dois dias da semana diferentes.</p>')}`;
  // T1 x T2
  const tt = ['T1', 'T2'].map(t => { const rs = regsPeriodo(p, t); return rs.length ? { t, i: RDO.analisarItens(agg(rs), CFG).find(y => y.c === i.c) } : null; }).filter(Boolean);
  h += pane('1º × 2º turno', esc(p.rot), tt.length ? `<div class="tb-wrap"><table class="tb"><thead><tr><th>Turno</th><th class="n">Rend.</th><th class="n">Meta</th><th class="n">Saldo</th><th class="n">Caixas</th></tr></thead><tbody>${tt.map(x => `<tr><td><b>${x.t}</b></td><td class="n">${P(x.i.real, 3)}</td><td class="n">${P(x.i.meta, 3)}</td><td class="n c-${x.i.analisa ? x.i.status : 'neutro'}">${x.i.analisa ? KG(x.i.gapKg) : N(x.i.kg, 0) + ' kg'}</td><td class="n">${x.i.cx != null ? SN(x.i.cx) : '—'}</td></tr>`).join('')}</tbody></table></div>${tt.length === 2 && i.analisa ? `<p class="p-sm" style="margin-top:10px">Diferença entre turnos: <b>${SN(tt[1].i.real - tt[0].i.real, 3)} p.p.</b> (${tt[1].i.real >= tt[0].i.real ? 'o 2º' : 'o 1º'} turno rendeu mais).</p>` : `<p class="p-sm muted" style="margin-top:10px">Quando os dois turnos estiverem lançados, a comparação aparece aqui.</p>`}` : '<p class="muted">Sem dados.</p>') + `</div>`;

  // descartes ligados
  if (imp) {
    const ligados = imp.descartes.linhas.filter(l => l.alvo === i.c || l.alvo === 'carcaca' || (l.alvo === 'asa' && ['BG', 'BH', 'BI'].includes(i.c)));
    const rec = imp.descartes.porItem[i.c] || 0;
    h += pane('Descartes que tiram peso deste item', 'Quando um pedaço é descartado, o peso dele deixa de entrar no rendimento do item.', ligados.length ? `<div class="kv">${ligados.map(l => `<span>${esc(l.n)}</span><span>${N(l.kg, 0)} kg${l.alvo !== i.c ? ' (parte)' : ''}</span>`).join('')}<span><b style="color:var(--ink)">Peso que voltaria para ${esc(i.n.toLowerCase())}</b></span><span>${N(rec, 0)} kg = ${SN(rec / a.val.S * 100, 3)} p.p.</span></div>${i.analisa && isNum(i.gapKg) ? `<p class="p-sm" style="margin-top:10px">${i.gapKg + rec >= 0 ? (i.gapKg < 0 ? `<b class="c-ok">Sem esses descartes o item teria fechado.</b>` : 'O item já fechou mesmo com os descartes.') : `Mesmo sem os descartes faltariam <b>${KG(i.gapKg + rec)}</b>: o problema principal está em outro ponto do processo.`}</p>` : ''}` : '<p class="muted">Nenhum descarte em kg apontado para este item no período.</p>');
  }
  h += pane('Todos os itens no período', 'Toque em um item para trocar a análise.', hbarsKg(its));
  return h;
}

/* ======================= PERDAS ======================= */
function vPerdas() {
  const p = periodo(), regs = regsPeriodo(p);
  if (!regs.length) return vazioPeriodo(p);
  const a = agg(regs); S._a = a;
  const imp = RDO.impacto(a, CFG);
  if (!imp) return pane('Perdas e impacto', '', '<p class="muted">Faltam frangos ou peso abatido nos lançamentos deste período.</p>');
  let h = pane('Duas famílias de perda', 'Entender isso muda a conversa na reunião.', `<div class="row" style="gap:14px">
    <div class="conta" style="margin:0"><b>Perdas que tiram VOLUME</b><br>Paradas, reduções de velocidade e mortalidade fazem a planta abater <b>menos frangos</b>. O % de rendimento do item não muda, porque a conta é sempre kg do item ÷ kg abatido. O que se perde são kg e caixas no total do dia.</div>
    <div class="conta" style="margin:0"><b>Perdas que tiram RENDIMENTO</b><br>Descartes e condenas em kg tiram <b>peso direto do item</b> depois do abate. Aí sim o % cai. Ex.: 50 kg de filé descartado num dia de 155 t = −0,032 p.p. no filé.</div></div>`);
  const stat = (v, l, s2) => `<div><div class="big-n" style="font-size:26px">${v}</div><div class="stat-l"><b style="color:var(--ink-2)">${l}</b>${s2 ? '<br>' + s2 : ''}</div></div>`;
  h += pane('Resumo', esc(p.rot) + ' · ' + esc(turnoRot(S.turno, regs)), `<div class="stats">
    ${stat(N(a.ppMin) + ' min', 'Paradas programadas', 'refeição, pausas, término')}
    ${stat(N(a.intMin) + ' min', 'Interrupções', a.intMin ? `≈ ${N(imp.interrupcoes.fr)} frangos` : 'nenhuma')}
    ${stat(N(a.redMin) + ' min', 'Redução de velocidade', a.redMin ? `≈ ${N(imp.reducoes.fr)} frangos (est.)` : 'nenhuma')}
    ${stat(N(a.mort), 'Mortos no transporte', isNum(a.mortPct) ? `<span class="c-${RDO.status(a.mortPct, a.meta['4.1'], -1, CFG)}">${P(a.mortPct, 3)}</span> · meta ${P(a.meta['4.1'], 2)}` : '')}
    ${stat(N(imp.descartes.totalKg) + ' kg', 'Descartes em kg', imp.descartes.totalKg ? `${N(imp.descartes.totalKg / a.val.S * 100, 3)} p.p. do rendimento` : 'nenhum')}
    ${stat(N(imp.contaminacao.und), 'Contaminações', imp.contaminacao.und ? `${P(imp.contaminacao.pct, 3)} · meta ${P(imp.contaminacao.meta, 2)}` : 'nenhuma apontada')}
  </div>`);
  const pareto = (obj, nomes, cls) => barrasUni(Object.entries(obj).filter(([, v]) => v > 0).sort((x, y) => y[1] - x[1]).map(([k, v]) => ({ rot: nomes[k] || k, v, txt: N(v) + ' min', sub: imp.ritmo ? `≈ ${N(v / 60 * imp.ritmo * (cls === 'quase' ? CFG.fatorReducao / 100 : 1))} fr` : '', cls })), { vazio: 'Nada registrado no período.' });
  h += `<div class="row" style="margin-top:18px">${pane('Interrupções (paradas não planejadas)', 'Ordenadas da maior para a menor.', pareto(a.int, RDO.INT, 'ruim'))}${pane('Reduções de velocidade', `A linha continua rodando, mais devagar. Estimativa usa ${CFG.fatorReducao}% de velocidade perdida (ajustável em Ajustes).`, pareto(a.red, RDO.RED, 'quase'))}</div>`;
  // volume perdido por item
  const fontes = [['Interrupções', imp.interrupcoes], ['Reduções', imp.reducoes], ['Mortalidade', imp.mortalidade]].filter(x => x[1]);
  if (fontes.length) {
    const lin = RDO.ITENS.filter(it => (CFG.analisar[it.c] ?? it.analisa) && isNum(a.meta[it.c])).map(it => {
      const vs = fontes.map(f => f[1].itens[it.c] || 0); const tot = vs.reduce((s, x) => s + x, 0);
      const pc = (CFG.caixas[it.c] || it.cx);
      return `<tr><td>${esc(it.n)}</td>${vs.map(v => `<td class="n">${N(v, 0)} kg</td>`).join('')}<td class="n"><b>${N(tot, 0)} kg</b></td><td class="n">${tot >= pc ? '≈ ' + N(Math.round(tot / pc)) + ' cx' : '< 1 cx'}</td></tr>`;
    }).join('');
    h += pane('Volume que deixou de virar produto', 'Estimativa: frangos perdidos × peso médio × meta de rendimento de cada item. Mostra o tamanho do impacto em kg e caixas.', `<div class="tb-wrap"><table class="tb"><thead><tr><th>Item</th>${fontes.map(f => `<th class="n">${f[0]}</th>`).join('')}<th class="n">Total</th><th class="n">Caixas</th></tr></thead><tbody>${lin}</tbody></table></div>
      <p class="p-sm" style="margin-top:10px">Peso médio ${N(imp.pesoMedio, 3)} kg · ritmo padrão ≈ ${N(imp.ritmo)} frangos/h (calculado do próprio RDO: frangos ÷ horas produtivas) · rendimento industrial ${P(imp.rendInd * 100, 2)}.</p>`);
  }
  // descartes + simulação
  const linD = imp.descartes.linhas.sort((x, y) => y.kg - x.kg);
  const sim = imp.simulacao;
  h += `<div class="row" style="margin-top:18px">${pane('Descartes e condenas em kg', 'Para onde cada peso iria se não fosse descartado.', linD.length ? `<div class="tb-wrap"><table class="tb"><thead><tr><th>Descarte</th><th>Tirou de</th><th class="n">kg</th><th class="n">p.p.</th></tr></thead><tbody>${linD.map(l => `<tr><td>${esc(l.n)}</td><td class="muted">${l.alvo === 'carcaca' ? 'todos os itens' : l.alvo === 'asa' ? 'asas' : esc((RDO.ITEM[l.alvo] || {}).n || l.alvo)}</td><td class="n">${N(l.kg, 0)}</td><td class="n">${N(l.kg / a.val.S * 100, 3)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Nenhum descarte em kg apontado no período.</p>')}
    ${pane('E se não houvesse descartes?', 'Simulação: devolve ao item o peso descartado e refaz a conta.', `<div class="tb-wrap"><table class="tb"><thead><tr><th>Item</th><th class="n">Real</th><th class="n">Sem descartes</th><th class="n">Meta</th><th class="n">Resultado</th></tr></thead><tbody>${sim.map(s => `<tr><td>${esc(s.n)}</td><td class="n">${P(s.real, 3)}</td><td class="n">${P(s.realSem, 3)}</td><td class="n">${P(s.meta, 3)}</td><td class="n">${s.fechouAntes ? chip('ok', 'Já fechou') : s.fechariaSem ? chip('quase', 'Fecharia') : chip('ruim', 'Ainda faltaria')}</td></tr>`).join('')}</tbody></table></div>`)}</div>`;
  // paradas programadas + histórico
  h += `<div class="row" style="margin-top:18px">${pane('Paradas programadas', 'Pausas previstas no turno.', barrasUni(Object.entries(a.pp).filter(([, v]) => v > 0).sort((x, y) => y[1] - x[1]).map(([k, v]) => ({ rot: RDO.PP[k] || k, v, txt: N(v) + ' min', cls: 'neutro' }))))}`;
  const fx = faixaContexto(p);
  const sp = serie(regsEntre(fx.de, fx.ate), S.turno === 'todos' ? 'dia' : 'reg');
  h += pane('Mortalidade no transporte', `${cap(fx.nota)} · meta ${P(a.meta['4.1'], 2)} dos abatidos`, sp.length >= 2 ? Charts.slot({ type: 'line', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series: [{ name: 'Mortalidade', color: 'var(--accent)', values: sp.map(x => x.a.mortPct), status: sp.map(x => RDO.status(x.a.mortPct, x.a.meta['4.1'], -1, CFG)) }], meta: sp.map(x => x.a.meta['4.1']), yFmt: v => N(v, 2) + '%', tipFmt: v => P(v, 3) }, 210) : `<div class="big-n">${P(a.mortPct, 3)}</div><p class="p-sm">${N(a.mort)} frangos mortos · ≈ ${N(imp.mortalidade ? imp.mortalidade.kgVivo : 0)} kg vivos que não entraram no abate.</p>`) + `</div>`;
  if (sp.length >= 2) h += pane('Minutos perdidos no tempo', `${cap(fx.nota)} · interrupções e reduções de velocidade`, Charts.slot({ type: 'bars', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series: [{ name: 'Interrupções', color: 'var(--ruim)', values: sp.map(x => x.a.intMin) }, { name: 'Reduções', color: 'var(--quase)', values: sp.map(x => x.a.redMin) }], yFmt: v => N(v, 0), tipFmt: v => N(v) + ' min' }, 220) + `<div class="legenda"><span><i style="background:var(--ruim)"></i>interrupções</span><span><i style="background:var(--quase)"></i>reduções</span></div>`);
  return h;
}

/* ======================= COMPARAR ======================= */
const CMP_LINHAS = ['R', 'S', 'U', 'V', 'AJ', 'BA', 'BB', 'BX', 'BT', 'BU', 'BD', 'BE', 'BG', 'BH', 'BI', 'BL', 'BM', 'BN', 'BO', 'BP', 'DORSO', 'saldoKg', 'mortPct', 'intMin', 'redMin', 'descKg'];
function tabelaCmp(aA, aB, rA, rB) {
  const linhas = CMP_LINHAS.map(c => {
    const d = indDef(c), va = indVal(aA, c), vb = indVal(aB, c);
    if (!isNum(va) && !isNum(vb)) return '';
    const dif = isNum(va) && isNum(vb) ? va - vb : null;
    const dir = d.dir;
    const melhor = dif == null || !dir || Math.abs(dif) < 1e-9 ? '' : ((dif > 0) === (dir > 0) ? 'A' : 'B');
    const ehItem = !!RDO.ITEM[c];
    const it = ehItem ? [RDO.analisarItens(aA, CFG).find(x => x.c === c), RDO.analisarItens(aB, CFG).find(x => x.c === c)] : null;
    const cel = (v, ii, w) => `<td class="n ${w ? 'win' : ''}">${fmtInd(c, v)}${ii && ii.analisa && isNum(ii.gapKg) ? `<br><small class="c-${ii.status}">${KG(ii.gapKg)}</small>` : ''}</td>`;
    const difTxt = dif == null ? '—' : d.un === '%' ? `${SN(dif, d.dec)} p.p.` : d.un === 'kg' ? KG(dif) : SN(dif, d.dec);
    return `<tr><td>${esc(d.n)}</td>${cel(va, it && it[0], melhor === 'A')}${cel(vb, it && it[1], melhor === 'B')}<td class="n ${melhor ? (melhor === 'A' ? 'c-ok' : 'c-ruim') : 'muted'}">${difTxt}</td></tr>`;
  }).join('');
  return `<div class="tb-wrap"><table class="tb"><thead><tr><th>Indicador</th><th class="n">${esc(rA)}</th><th class="n">${esc(rB)}</th><th class="n">${esc(rA)} − ${esc(rB)}</th></tr></thead><tbody>${linhas}</tbody></table></div>
  <p class="p-sm muted" style="margin-top:10px">Negrito = melhor dos dois. Verde/vermelho na diferença = ${esc(rA)} melhor/pior. Volumes (frangos, peso) não têm “melhor”.</p>`;
}
function difItensChart(aA, aB, rA, rB) {
  const its = RDO.ITENS.filter(i => (CFG.analisar[i.c] ?? i.analisa));
  const linhas = its.map(i => ({ n: i.n, c: i.c, d: (aA.val[i.c] || 0) - (aB.val[i.c] || 0), da: (aA.val[i.c] - aA.meta[i.c]), db: (aB.val[i.c] - aB.meta[i.c]) })).filter(x => isNum(x.d));
  const mx = Math.max(...linhas.map(x => Math.abs(x.d))) || 1;
  return `<div class="hb">${linhas.map((x, k) => `<div class="hb-r"><span class="lb">${esc(x.n)}</span><span class="hb-t"><i class="zero"></i><i class="b ${x.d >= 0 ? 'pos ok' : 'neg ruim'}" style="--w:${(Math.abs(x.d) / mx * 50).toFixed(1)}%;transition-delay:${k * 40}ms"></i></span><span class="vl ${x.d >= 0 ? 'c-ok' : 'c-ruim'}">${SN(x.d, 3)}<small>p.p.</small></span></div>`).join('')}</div>
  <p class="p-sm muted" style="margin-top:8px">Barra à direita: ${esc(rA)} rendeu mais que ${esc(rB)} naquele item.</p>`;
}
function vComparar() {
  const p = periodo();
  const abas = [['turnos', '1º × 2º turno'], ['periodos', 'Período × período'], ['semana', 'Dias da semana'], ['itens', 'Itens lado a lado'], ['relacoes', 'Relações']];
  let h = `<div class="tabs">${abas.map(([k, n]) => `<button class="${S.cmp === k ? 'on' : ''}" data-act="cmp" data-k="${k}">${n}</button>`).join('')}</div>`;
  if (S.cmp === 'turnos') {
    const r1 = regsPeriodo(p, 'T1'), r2 = regsPeriodo(p, 'T2');
    if (!r1.length || !r2.length) return h + pane('1º × 2º turno', esc(p.rot), `<div class="vazio-grande" style="padding:20px">${ic('comparar')}<h3>Falta um dos turnos</h3><p>${!r1.length && !r2.length ? 'Nenhum turno lançado' : `Só o ${r1.length ? '1º' : '2º'} turno está lançado`} em ${esc(p.rot.toLowerCase())}. Lance o RDO do outro turno ou escolha um período maior (semana ou mês).</p><button class="btn pri" data-act="per" data-p="mes">Ver o mês</button></div>`);
    const a1 = agg(r1), a2 = agg(r2); S._a = agg(regsPeriodo(p, 'todos'));
    const resumo = (a, t) => { const it = RDO.analisarItens(a, CFG).filter(i => i.analisa && isNum(i.gapKg)); const ok = it.filter(i => i.fechou).length; const sal = it.reduce((s, i) => s + i.gapKg, 0); return `<div><div class="stat-l" style="font-weight:650;color:var(--ink-2)">${t === 'T1' ? '1º turno' : '2º turno'}</div><div class="big-n">${ok}<small>/${it.length} fecharam</small></div><div class="p-sm">Saldo <b class="c-${sal >= 0 ? 'ok' : 'ruim'}">${KG(sal)}</b> · OEE ${P(a.val.BX)} · Rend. cortes ${P(a.val.BA, 3)}</div></div>`; };
    h += pane('Placar dos turnos', esc(p.rot), `<div class="row">${resumo(a1, 'T1')}${resumo(a2, 'T2')}</div>`);
    h += `<div class="row" style="margin-top:18px">${pane('Diferença por item', 'Quanto o 1º turno rendeu a mais (ou a menos) que o 2º, em pontos percentuais.', difItensChart(a1, a2, 'T1', 'T2'))}`;
    const fx = faixaContexto(p);
    const sp = serie(regsEntre(fx.de, fx.ate, 'todos'), 'dia');
    const lin = t => sp.map(x => { const rs = x.regs.filter(r => r.turno === t); return rs.length ? agg(rs).val.BA : null; });
    h += pane('Rendimento de cortes por turno', cap(fx.nota), Charts.slot({ type: 'line', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series: [{ name: 'T1', color: 'var(--t1)', values: lin('T1') }, { name: 'T2', color: 'var(--t2)', values: lin('T2') }], meta: sp.map(x => x.a.meta.BA), yFmt: v => N(v, 1) + '%', tipFmt: v => P(v, 3) }, 240) + `<div class="legenda"><span><i style="background:var(--t1)"></i>1º turno</span><span><i style="background:var(--t2)"></i>2º turno</span><span><i class="tr"></i>meta</span></div>`) + `</div>`;
    h += pane('Tudo lado a lado', '', tabelaCmp(a1, a2, 'T1', 'T2'));
    return h;
  }
  if (S.cmp === 'periodos') {
    const rA = regsPeriodo(p);
    let pB;
    if (S.cmpB === 'anterior') pB = periodoAnterior(p);
    else if (S.cmpB === 'mesAnt') { const sh = iso => { const d = RDO.parseISO(iso); d.setMonth(d.getMonth() - 1); return RDO.toISO(d); }; pB = { de: sh(p.de), ate: sh(p.ate), rot: `${RDO.dm(sh(p.de))} a ${RDO.dm(sh(p.ate))}` }; }
    else if (S.cmpB === 'anoAnt') { const sh = iso => `${+iso.slice(0, 4) - 1}${iso.slice(4)}`; pB = { de: sh(p.de), ate: sh(p.ate), rot: `${RDO.dm(p.de)}/${+p.de.slice(2, 4) - 1}` }; }
    else pB = { de: S.cmpBde || p.de, ate: S.cmpBate || p.ate, rot: `${RDO.dm(S.cmpBde || p.de)} a ${RDO.dm(S.cmpBate || p.ate)}` };
    const rB = pB ? regsEntre(pB.de, pB.ate) : [];
    const opts = [['anterior', 'Período anterior'], ['mesAnt', 'Mesmo período, mês anterior'], ['anoAnt', 'Mesmo período, ano anterior'], ['escolher', 'Escolher datas']];
    h += pane('Comparar com', `A = ${esc(p.rot)} (o período do topo). Escolha o B:`, `<div class="pick">${opts.map(([k, n]) => `<button class="${S.cmpB === k ? 'on' : ''}" data-act="cmpB" data-k="${k}">${n}</button>`).join('')}</div>
      ${S.cmpB === 'escolher' ? `<div class="row" style="margin-top:12px;max-width:420px"><div class="field"><label>B: de</label><input type="date" class="inp" data-act="cmpBde" value="${S.cmpBde || p.de}"></div><div class="field"><label>até</label><input type="date" class="inp" data-act="cmpBate" value="${S.cmpBate || p.ate}"></div></div>` : ''}`);
    if (!rA.length || !rB.length) return h + pane('', '', `<p class="muted">${!rA.length ? 'O período A não tem lançamentos.' : `O período B (${esc(pB ? pB.rot : '—')}) não tem lançamentos${S.turno !== 'todos' ? ' neste turno' : ''}.`}</p>`);
    const aA = agg(rA), aB = agg(rB); S._a = aA;
    h += `<div class="row" style="margin-top:18px">${pane('Diferença por item', `A − B em pontos percentuais (B = ${esc(pB.rot)})`, difItensChart(aA, aB, 'A', 'B'))}${pane('Resumo', '', `<div class="stats">${[['BA', 'Rend. de cortes', 3], ['BX', 'OEE', 2], ['BV', 'Rend. industrial', 2], ['U', 'Peso médio', 3]].map(([c, n, d]) => { const df = aA.val[c] - aB.val[c]; return `<div><div class="big-n" style="font-size:24px">${c === 'U' ? N(aA.val[c], d) : P(aA.val[c], d)}</div><div class="stat-l">${n}<br><span class="${(RDO.L[c] || {}).dir ? (df >= 0 ? 'c-ok' : 'c-ruim') : ''}">${SN(df, d)}${c === 'U' ? ' kg' : ' p.p.'} vs B</span></div></div>`; }).join('')}</div>`)}</div>`;
    h += pane('Tudo lado a lado', `A = ${esc(p.rot)} · B = ${esc(pB.rot)}`, tabelaCmp(aA, aB, 'A', 'B'));
    return h;
  }
  if (S.cmp === 'semana') {
    const largo = p.per === 'dia' || p.per === 'semana';
    const regs = largo ? regsEntre('0000-01-01', '9999-12-31') : regsPeriodo(p);
    S._a = regs.length ? agg(regs) : null;
    const dows = [1, 2, 3, 4, 5, 6];
    const as = dows.map(d => { const rs = regs.filter(r => RDO.weekday(r.data) === d); return rs.length ? agg(rs) : null; });
    if (as.filter(Boolean).length < 2) return h + pane('Dias da semana', '', '<p class="muted">Precisa de lançamentos em pelo menos dois dias da semana diferentes.</p>');
    const cods = ['BA', 'BX', 'BD', 'BE', 'BG', 'BH', 'BI', 'BL', 'BM', 'BN', 'BO', 'U', 'mortPct', 'intMin', 'redMin'];
    const corpo = cods.map(c => {
      const d = indDef(c);
      const vs = as.map(a => a ? indVal(a, c) : null);
      const validos = vs.filter(isNum);
      const best = d.dir ? (d.dir > 0 ? Math.max(...validos) : Math.min(...validos)) : null;
      return `<tr><td>${esc(d.n)}</td>${vs.map((v, k) => { const st = as[k] && d.dir && isNum(indMeta(as[k], c)) ? RDO.status(v, indMeta(as[k], c), d.dir, CFG) : 'neutro'; return `<td class="n ${v === best ? 'win' : ''}">${isNum(v) ? (st !== 'neutro' ? `<span class="chip ${st}" style="padding:0 7px">${fmtInd(c, v, c === 'U' ? 3 : d.un === '%' ? Math.min(d.dec, 3) : 0)}</span>` : fmtInd(c, v, c === 'U' ? 3 : undefined)) : '—'}</td>`; }).join('')}</tr>`;
    }).join('');
    h += pane('Cada dia da semana tem seu padrão?', `${largo ? 'Todo o histórico' : esc(p.rot)} · ${esc(turnoRot())} · negrito = melhor dia`, `<div class="tb-wrap"><table class="tb"><thead><tr><th>Indicador</th>${['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map(x => `<th class="n">${x}</th>`).join('')}</tr></thead><tbody>${corpo}</tbody></table></div>`);
    return h;
  }
  if (S.cmp === 'itens') {
    const fx = faixaContexto(p);
    const sp = serie(regsEntre(fx.de, fx.ate), S.turno === 'todos' ? 'dia' : 'reg');
    S._a = sp.length ? agg(regsEntre(fx.de, fx.ate)) : null;
    const cores = ['var(--t1)', 'var(--t2)', 'var(--s3)', 'var(--s4)'];
    h += pane('Escolha até 4 itens', 'Para comparar itens de tamanhos diferentes, cada linha mostra o rendimento como % da própria meta (100% = bateu a meta).', `<div class="pick">${RDO.ITENS.filter(i => i.c !== 'BQ').map(i => `<button class="${S.itensCmp.includes(i.c) ? 'on' : ''}" data-act="itcmp" data-item="${i.c}">${esc(i.n)}</button>`).join('')}</div>`);
    const sel = S.itensCmp.slice(0, 4);
    const series = sel.map((c, k) => ({ name: RDO.ITEM[c].n, color: cores[k], values: sp.map(x => { const v = x.a.val[c], m = x.a.meta[c]; return isNum(v) && m ? v / m * 100 : null; }) }));
    h += pane('Índice da meta', cap(fx.nota), sp.length ? Charts.slot({ type: 'line', labels: sp.map(x => x.lab), tipLabels: sp.map(x => x.tip), series, meta: 100, yFmt: v => N(v, 0) + '%', tipFmt: (v, s, i) => `${N(v, 1)}% da meta` }, 280) + `<div class="legenda">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}<span><i class="tr"></i>meta (100%)</span></div>` : '<p class="muted">Sem dados.</p>');
    return h;
  }
  // relações
  const largo = p.per === 'dia' || p.per === 'semana';
  const regs = largo ? regsEntre('0000-01-01', '9999-12-31') : regsPeriodo(p);
  S._a = regs.length ? agg(regs) : null;
  const pts = regs.map(r => { const a = agg([r]); return { x: indVal(a, S.relX), y: indVal(a, S.relY), label: `${RDO.diaCurto(r.data)} · ${r.turno}`, color: r.turno === 'T1' ? 'var(--t1)' : 'var(--t2)' }; }).filter(o => isNum(o.x) && isNum(o.y));
  const rg = pts.length >= 3 ? RDO.regressao(pts.map(o => o.x), pts.map(o => o.y)) : null;
  const dx = indDef(S.relX), dy = indDef(S.relY);
  let leitura = '<p class="muted">Precisa de pelo menos 3 lançamentos para medir uma relação.</p>';
  if (rg) {
    const forca = Math.abs(rg.r) >= .7 ? 'forte' : Math.abs(rg.r) >= .4 ? 'moderada' : Math.abs(rg.r) >= .2 ? 'fraca' : 'praticamente nenhuma';
    leitura = `<div class="big-n">${N(rg.r, 2)}</div><div class="stat-l">correlação (−1 a +1) · ${pts.length} lançamentos</div>
      <p style="margin-top:12px">Relação <b>${forca}</b>${Math.abs(rg.r) >= .2 ? `: quando <b>${esc(dx.n.toLowerCase())}</b> sobe, <b>${esc(dy.n.toLowerCase())}</b> tende a ${rg.b > 0 ? 'subir' : 'cair'}` : ''}.</p>
      ${Math.abs(rg.r) >= .2 ? `<p class="p-sm">Na média, cada ${dx.un === '%' ? '1 p.p.' : dx.un === 'kg' ? '1 kg' : '1 unidade'} a mais em ${esc(dx.n.toLowerCase())} vem junto com ${SN(rg.b, 3)} ${dy.un === '%' ? 'p.p.' : dy.un} em ${esc(dy.n.toLowerCase())}.</p>` : ''}
      <p class="p-sm muted">Correlação mostra o que anda junto, não prova causa. Use como pista para investigar.</p>`;
  }
  h += `<div class="row c1-2">${pane('Escolha o que relacionar', largo ? 'Usando todo o histórico (cada ponto é um turno).' : esc(p.rot) + ' (cada ponto é um turno).', `<div class="field"><label>Eixo horizontal (X)</label>${selInd('relX', S.relX, 'relX')}</div><div class="field"><label>Eixo vertical (Y)</label>${selInd('relY', S.relY, 'relY')}</div>
    <div class="pick" style="margin-top:6px">${[['U', 'BE', 'Peso médio × filé'], ['U', 'BL', 'Peso médio × fígado'], ['redMin', 'BX', 'Reduções × OEE'], ['mortPct', 'BA', 'Mortalidade × rend. cortes'], ['BU', 'BA', 'Eficiência × rend. cortes']].map(([x, y, n]) => `<button data-act="rel" data-x="${x}" data-y="${y}">${n}</button>`).join('')}</div>
    <div style="margin-top:16px">${leitura}</div>`)}
    ${pane(`${esc(dy.n)} × ${esc(dx.n)}`, 'Azul = 1º turno · laranja = 2º turno · linha tracejada = tendência', Charts.slot({ type: 'scatter', points: pts, xName: dx.n, yName: dy.n, xFmt: v => N(v, dx.dec > 2 ? 2 : dx.dec), yFmt: v => N(v, dy.dec > 2 ? 2 : dy.dec), xTip: v => fmtInd(S.relX, v), yTip: v => fmtInd(S.relY, v) }, 340))}</div>`;
  return h;
}

/* ======================= TENDÊNCIAS ======================= */
function vTend() {
  const p = periodo();
  const fx = faixaContexto(p);
  const regs = regsEntre(fx.de, fx.ate);
  const c = S.tendInd, d = indDef(c);
  const grans = [['auto', 'Automático'], ['reg', 'Por turno'], ['dia', 'Por dia'], ['semana', 'Por semana'], ['mes', 'Por mês']];
  let h = pane('O que acompanhar', `${cap(fx.nota)} · ${esc(turnoRot(S.turno, regs))}`, `<div class="row" style="align-items:end"><div class="field" style="margin:0"><label>Indicador</label>${selInd('tendInd', c, 'tendInd')}</div>
    <div class="pick">${grans.map(([k, n]) => `<button class="${S.tendGran === k ? 'on' : ''}" data-act="tgran" data-k="${k}">${n}</button>`).join('')}</div></div>`);
  if (!regs.length) return h + vazioPeriodo(p);
  S._a = agg(regs);
  const gran = S.tendGran === 'auto' ? granAuto(fx) : S.tendGran;
  const sp = serie(regs, gran);
  const vals = sp.map(x => indVal(x.a, c));
  const metas = sp.map(x => indMeta(x.a, c));
  const mm = vals.map((v, k) => { const jan = vals.slice(Math.max(0, k - 6), k + 1).filter(isNum); return jan.length >= 3 ? RDO.media(jan) : null; });
  const series = [{ name: d.n, color: 'var(--accent)', values: vals, status: d.dir ? vals.map((v, k) => RDO.status(v, metas[k], d.dir, CFG)) : null, area: true }];
  if (sp.length >= 7) series.push({ name: 'Média móvel (7 pontos)', color: 'var(--violet)', values: mm, dash: true });

  const dec = d.un === '%' ? Math.min(d.dec, 3) : d.dec;

  const vv = vals.filter(isNum);

      <div><div class="big-n" style="font-size:24px">${fmtInd(c, vals[piorK], dec)}</div><div class="stat-l">pior · ${esc(sp[piorK].tip)}</div></div>

  const fimMes = RDO.toISO(new Date(dIni.getFullYear(), dIni.getMonth() + 1, 0, 12));

  return h;
}

/* ======================= PREVISÕES ======================= */
function projecaoMes(ref, turno) {
  const ini = `${ref.slice(0, 7)}-01`, d0 = RDO.parseISO(ini);
  const fim = RDO.toISO(new Date(d0.getFullYear(), d0.getMonth() + 1, 0, 12));
  const regsMes = regsEntre(ini, ref, turno);
  if (!regsMes.length) return null;
  const aMes = agg(regsMes);
  const ultimo = regsMes[regsMes.length - 1].data;
  let rest = 0; for (let d = RDO.addDays(ultimo, 1); d <= fim; d = RDO.addDays(d, 1)) if (CFG.diasProducao.includes(RDO.weekday(d))) rest++;
  const nDias = aMes.dias.length;
  const Sdia = aMes.val.S / nDias, Srem = Sdia * rest, Sso = aMes.val.S;
  const hist = serie(regsEntre(RDO.addDays(ref, -60), ref, turno), 'dia');
  const its = RDO.analisarItens(aMes, CFG).filter(i => i.analisa && i.tem);
  const linhas = its.map(i => {
    const sv = hist.map(x => x.a.val[i.c]);
    const f = RDO.prever(sv, Math.max(1, rest));
    const media = f ? RDO.media(f.valores) : RDO.media(sv.filter(isNum));
    const sd = f ? f.sd : (RDO.desvio(sv.filter(isNum)) || 0.1);
    const meta = i.meta;
    const final = rest ? (i.kg + media / 100 * Srem) / (Sso + Srem) * 100 : i.real;
    const precisa = rest ? (meta * (Sso + Srem) / 100 - i.kg) / Srem * 100 : null;
    const sdM = Math.sqrt(sd * sd / Math.max(1, rest) + Math.pow(sd * 0.54, 2));
    const chMes = rest ? 1 - RDO.normCdf((precisa - media) / sdM) : (final >= meta ? 1 : 0);
    const prox = f ? f.valores[0] : media;
    const chProx = RDO.chance(meta, prox, sd, 1);
    return { i, f, media, sd, final, precisa, chMes, prox, chProx, gapFinal: (final - meta) / 100 * (Sso + Srem), meta };
  });
  return { ini, fim, ultimo, rest, nDias, Sdia, Srem, Sso, linhas, aMes, hist };
}
function pctChance(p) { return p < 0.01 ? '< 1%' : p > 0.99 ? '> 99%' : N(p * 100, 0) + '%'; }
function rotChance(p) { return p >= .8 ? ['ok', 'Muito provável'] : p >= .5 ? ['ok', 'Provável'] : p >= .2 ? ['quase', 'Em risco'] : ['ruim', 'Improvável']; }
function vPrev() {
  const pr = projecaoMes(S.ref, S.turno);
  const nPts = pr ? pr.hist.length : 0;
  if (!pr || nPts < 4) {
    S._a = pr ? pr.aMes : null;
    return pane('Previsões', '', `<div class="vazio-grande" style="padding:24px">${ic('previsao')}<h3>Ainda não dá para prever com honestidade</h3><p>A previsão precisa de pelo menos <b>4 dias lançados</b> (hoje há ${nPts}). Ela olha o comportamento de cada item nos últimos dias, a tendência e a oscilação, e projeta o fechamento do mês e a chance de bater a meta. Conforme a base cresce, ela fica mais precisa.</p>${S.demo ? '' : `<button class="btn" data-act="demo-on">${ic('olho')}Ver como fica com dados de demonstração</button>`}</div>`);
  }
  S._a = pr.aMes;
  const d0 = RDO.parseISO(pr.ini);
  let h = `<section class="pane hero" style="--hero-glow:var(--prev)"><div class="hero-top">${chip('prev', 'Previsão')}<span class="quando">${cap(RDO.MESES[d0.getMonth()])} · ${esc(turnoRot())} · ${pr.nDias} dia(s) lançado(s) · ${pr.rest} dia(s) de produção pela frente</span></div>
    <h2 class="veredito">${pr.rest ? `Se o ritmo atual continuar, ${pr.linhas.filter(l => l.final >= l.meta).length} de ${pr.linhas.length} itens fecham o mês` : `Mês encerrado: ${pr.linhas.filter(l => l.final >= l.meta).length} de ${pr.linhas.length} itens fecharam`}</h2>
    <p class="sub">A conta usa os kg já produzidos no mês + o que deve vir nos dias restantes (≈ ${N(pr.Sdia)} kg vivos por dia, no comportamento recente de cada item). <b>“Precisa render”</b> é o rendimento médio necessário daqui para frente para fechar o mês na meta.</p></section>`;
  h += pane('Fechamento do mês por item', 'Chance calculada com a oscilação real de cada item nos últimos dias.', `<div class="tb-wrap"><table class="tb"><thead><tr><th>Item</th><th class="n">Acumulado</th><th class="n">Projeção do mês</th><th class="n">Meta</th><th class="n">Precisa render</th><th class="n">Saldo projetado</th><th>Chance de fechar</th></tr></thead><tbody>
    ${pr.linhas.map(l => { const [st, tx] = rotChance(l.chMes); return `<tr><td><button class="btn ghost" style="height:auto;padding:2px 4px" data-act="prev-item" data-item="${l.i.c}">${esc(l.i.n)}</button></td><td class="n">${P(l.i.real, 3)}</td><td class="n"><b>${P(l.final, 3)}</b></td><td class="n">${P(l.meta, 3)}</td><td class="n">${pr.rest ? (l.precisa <= 0 ? '<span class="c-ok">já garantido</span>' : P(l.precisa, 3)) : '—'}</td><td class="n c-${l.gapFinal >= 0 ? 'ok' : 'ruim'}">${KG(l.gapFinal)}</td><td style="min-width:150px"><div style="display:flex;align-items:center;gap:8px"><div class="prob" style="flex:1"><i style="--w:${(l.chMes * 100).toFixed(0)}%;background:var(--${st})"></i></div><b class="tab" style="width:42px;text-align:right">${pctChance(l.chMes)}</b></div><small class="c-${st}">${tx}</small></td></tr>`; }).join('')}
  </tbody></table></div>`);
  // próximo lançamento
  h += secT('Próximo lançamento', 'o que esperar do próximo dia');
  h += `<div class="tiles">${pr.linhas.map(l => { const [st, tx] = rotChance(l.chProx || 0); return `<div class="tile ${st} reveal" style="padding:14px 16px 14px 18px"><div class="tile-top"><span class="nm">${esc(l.i.n)}</span>${chip(st, tx)}</div><div class="tile-mid"><span class="big">${P(l.prox, 3)}</span><span class="vs">entre ${P(l.prox - 1.28 * l.sd, 3)} e ${P(l.prox + 1.28 * l.sd, 3)}</span></div><div class="p-sm" style="margin-top:8px">Meta ${P(l.meta, 3)} · chance de bater: <b>${pctChance(l.chProx || 0)}</b></div></div>`; }).join('')}</div>`;
  // gráfico do item escolhido
  const it = pr.linhas.find(l => l.i.c === S.item) || pr.linhas[0];
  const hist = pr.hist.slice(-30);
  const fut = RDO.prever(pr.hist.map(x => x.a.val[it.i.c]), 6);
  if (fut) {
    let d = hist[hist.length - 1].k; const fl = [], ft = [];
    while (fl.length < 6) { d = RDO.addDays(d, 1); if (CFG.diasProducao.includes(RDO.weekday(d))) { fl.push(RDO.dm(d)); ft.push(RDO.diaCurto(d) + ' (previsão)'); } }
    const nH = hist.length;
    const labels = hist.map(x => x.lab).concat(fl);
    const real = hist.map(x => x.a.val[it.i.c]).concat(fl.map(() => null));
    const prev = hist.map((_, k) => k === nH - 1 ? real[k] : null).concat(fut.valores);
    const lo = hist.map((_, k) => k === nH - 1 ? real[k] : null).concat(fut.valores.map((v, k) => v - 1.28 * fut.sd * Math.sqrt(1 + k * .25)));
    const hi = hist.map((_, k) => k === nH - 1 ? real[k] : null).concat(fut.valores.map((v, k) => v + 1.28 * fut.sd * Math.sqrt(1 + k * .25)));
    h += pane(`${esc(it.i.n)}: histórico e próximos 6 dias`, 'Faixa roxa = onde o valor deve cair em 8 de cada 10 dias. Toque em outro item na tabela acima para trocar.', Charts.slot({ type: 'line', labels, tipLabels: hist.map(x => x.tip).concat(ft), series: [{ name: 'Realizado', color: 'var(--accent)', values: real, status: real.map(v => isNum(v) ? RDO.status(v, it.meta, 1, CFG) : null) }, { name: 'Previsão', color: 'var(--violet)', values: prev, dash: true }], band: { lo, hi }, meta: it.meta, yFmt: (v, st) => N(v, st < .01 ? 3 : 2) + '%', tipFmt: v => P(v, 3) }, 280) + `<div class="legenda"><span><i style="background:var(--accent)"></i>realizado</span><span><i class="tr" style="border-color:var(--violet)"></i>previsão</span><span><i style="background:var(--prev);height:8px"></i>faixa provável</span><span><i class="tr"></i>meta</span></div>`);
  }
  h += pane('Como a previsão é feita', '', `<p class="p-sm">Para cada item, o sistema olha os últimos 60 dias e separa três coisas: <b>o nível atual</b> (dando mais peso aos dias recentes), <b>a tendência</b> (se vem subindo ou caindo, sem deixar ela explodir) e <b>a oscilação</b> (quanto o item costuma variar de um dia para o outro). Com isso ele projeta os próximos dias e calcula a chance de bater a meta. Não é bola de cristal: dias atípicos (troca de lote, peso médio fora do normal, problema de máquina) mudam o resultado. Quanto mais lançamentos, mais confiável.</p>`);
  return h;
}

function vBase() {

/* ---------------- RENDER ---------------- */
let REV = null;
function revelar(root) {
  const calmo = document.documentElement.classList.contains('calmo') || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const alvos = $$('.reveal, [data-strip]', root);
  if (calmo || !('IntersectionObserver' in window)) { alvos.forEach(e => e.classList.add('in')); return; }
  if (!REV) REV = new IntersectionObserver(ents => { for (const e of ents) if (e.isIntersecting) { e.target.classList.add('in'); REV.unobserve(e.target); contar(e.target); } }, { rootMargin: '0px 0px -5% 0px', threshold: 0.06 });
  alvos.forEach(e => REV.observe(e));
}
function contar(root) {
  const calmo = document.documentElement.classList.contains('calmo') || matchMedia('(prefers-reduced-motion: reduce)').matches;
  $$('[data-count]', root).forEach(el => {
    if (el._contou) return; el._contou = true;
    const fim = parseFloat(el.dataset.count), dec = +el.dataset.dec || 0;
    if (!isFinite(fim) || calmo) return;
    const t0 = performance.now(), dur = 900;
    const passo = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = N(fim * e, dec); if (k < 1) requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  });
}
function render(anim = true) {
  Tip.hide();
  if (!VIEWS[S.view]) S.view = 'painel';
  const v = VIEWS[S.view];
  renderNav(); renderToolbar(); renderDemoFaixa();
  let html;
  try { html = v.r(); } catch (e) { console.error(e); html = pane('Algo deu errado nesta tela', '', `<p class="c-ruim">${esc(e.message)}</p><p class="p-sm">Tente outra data ou recarregue a página. Se continuar, a base pode ter um lançamento com formato estranho (veja em Base de dados).</p>`); }
  const el = $('#view');
  el.innerHTML = `<div class="view-in ${v.larga ? 'larga' : ''}">${html}</div>`;
  if (anim) { el.classList.remove('troca'); void el.offsetWidth; el.classList.add('troca'); el.scrollTop = 0; if (innerWidth <= 820) window.scrollTo(0, 0); }
  Charts.mountAll(el);
  revelar(el);
  requestAnimationFrame(() => { $$('.hero', el).forEach(contar); posThumbs(el); });
  salvarUI(); atualizarHash();
}
function atualizarHash() {
  try { history.replaceState(null, '', `#${S.view}/${S.per}/${S.ref}/${S.turno}`); } catch (e) { }
}
function lerHash() {
  const h = (location.hash || '').replace(/^#/, '').split('/');
  if (h[0] && VIEWS[h[0]]) S.view = h[0];
  if (h[1] && ['dia', 'semana', 'mes', 'ano', 'perso'].includes(h[1])) S.per = h[1] === 'perso' ? 'dia' : h[1];
  if (h[2] && /^\d{4}-\d{2}-\d{2}$/.test(h[2])) S.ref = h[2];
  if (h[3] && ['T1', 'T2', 'todos'].includes(h[3])) S.turno = h[3];
}

}

/* ---------------- NAVEGAÇÃO DE DATAS ---------------- */
function navegar(dir) {
  const v = VIEWS[S.view];
  const per = v.per === 'semana' ? 'semana' : v.per === 'mes' ? 'dia' : S.per;
  if (per === 'dia') {
    const ds = datasComDados(S.turno);
    const alvo = dir < 0 ? ds.filter(x => x < S.ref).pop() : ds.find(x => x > S.ref);
    if (alvo) S.ref = alvo; else return toast(dir < 0 ? 'Não há lançamento anterior.' : 'Este é o último lançamento.');
  } else if (per === 'semana') S.ref = RDO.addDays(RDO.inicioSemana(S.ref), dir * 7 + (dir > 0 ? 6 : 6));
  else if (per === 'mes') { const d = RDO.parseISO(S.ref); d.setDate(1); d.setMonth(d.getMonth() + dir); S.ref = RDO.toISO(new Date(d.getFullYear(), d.getMonth() + 1, 0, 12)); }
  else if (per === 'ano') S.ref = `${+S.ref.slice(0, 4) + dir}-12-31`;
  else if (per === 'perso') { const n = Math.round((RDO.parseISO(S.ate) - RDO.parseISO(S.de)) / 864e5) + 1; S.de = RDO.addDays(S.de, dir * n); S.ate = RDO.addDays(S.ate, dir * n); S.ref = S.ate; }
  // dentro de semana/mês/ano, ancora no último dia com dados do intervalo (se houver)

/* ---------------- DADOS: sincronizar, publicar ---------------- */
let sincronizando = false;
async function sincronizar(manual) {
  if (S.demo) { if (manual) toast('Modo demonstração ligado. Desligue para ver os dados reais.'); return; }
  if (sincronizando) return; sincronizando = true;
  const b = $('#btn-sync'); if (b) b.classList.add('gira');
  const assinatura = () => S.regs.length + '|' + (S.regs.length ? S.regs[S.regs.length - 1].id : '') + '|' + JSON.stringify(S.regs.slice(-1)[0] && S.regs.slice(-1)[0].v || {}).length;
  const antes = assinatura();
  const ultimaAntes = datasComDados().slice(-1)[0];
  try {
    const r = await GH.carregar();
    if (r) {
      S.remoto = r.registros;
      S.fonte = { tipo: 'github', via: r.via, quando: new Date(), atualizadoEm: r.atualizadoEm };
      store.set('cacheRemoto', { registros: r.registros, quando: Date.now(), via: r.via });
      if (manual) toast(`Base atualizada: ${r.registros.length} lançamento(s).`);
    } else if (manual) toast('Configure o GitHub em Ajustes para buscar a base.');
  } catch (e) {
    S.fonte = Object.assign({}, S.fonte, { erro: e.message });
    if (manual) toast(e.message, 4200);
  } finally {
    sincronizando = false;
    const b2 = $('#btn-sync'); if (b2) b2.classList.remove('gira');
  }
  const refAntes = S.ref;
  montarRegs();
  const ultima = datasComDados().slice(-1)[0];
  if (ultimaAntes && refAntes === ultimaAntes && ultima && ultima > ultimaAntes) S.ref = ultima;
  if (assinatura() !== antes || manual) render(false); else renderFonte();
}
function addPendente(r, por) {
  const c = RDO.canonico(Object.assign({}, r, { lancadoPor: r.lancadoPor || por, lancadoEm: r.lancadoEm || agoraISO() }));
  S.pendentes = S.pendentes.filter(x => x.id !== c.id).concat(c).sort((x, y) => (x.data + x.turno).localeCompare(y.data + y.turno));
}
async function processarArquivos(files) {
  S.lancErro = null;
  const lst = [...files].filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  if (!lst.length) { S.lancErro = 'Escolha um arquivo PDF do RDO.'; return render(false); }
  toast(`Lendo ${lst.length > 1 ? lst.length + ' PDFs' : 'o PDF'}…`, 6000);
  const erros = [];
  for (const f of lst) {
    try {
      const res = await lerPDF(f);
      if (!res.registros.length) throw new Error(`${f.name}: não achei nenhum dia com produção (frangos e peso).`);
      if (!res.turno) erros.push(`${f.name}: não achei o turno no cabeçalho — confira antes de publicar.`);
      res.registros.forEach(r => addPendente(r, 'leitor de PDF do sistema'));
    } catch (e) { erros.push(e.message); }
  }
  S.lancErro = erros.join(' ') || null;
  toast(S.pendentes.length ? `${S.pendentes.length} lançamento(s) pronto(s) para conferir.` : 'Nada lido.');
  S.view = 'lancar'; render(false);
}
async function publicarPendentes() {
  if (!S.pendentes.length) return;
  const btn = $('[data-act="publicar"]'); if (btn) { btn.disabled = true; btn.innerHTML = `${ic('refresh', 'gira')}Publicando…`; }
  const ids = S.pendentes.map(r => r.id);
  const msg = `RDO ${[...new Set(S.pendentes.map(r => RDO.dm(r.data) + ' ' + r.turno))].join(', ')} (lançado pelo painel)`;
  try {
    const base = await GH.publicar(S.pendentes, msg);
    salvarLocais(locais().filter(r => !ids.includes(r.id)));
    S.remoto = base.registros; S.fonte = { tipo: 'github', via: 'GitHub (API)', quando: new Date() };
    store.set('cacheRemoto', { registros: base.registros, quando: Date.now(), via: 'GitHub (API)' });
    const ultimo = S.pendentes[S.pendentes.length - 1];
    S.pendentes = []; S.lancErro = null;
    montarRegs(); S.ref = ultimo.data; S.per = 'dia'; S.view = 'painel';
    toast('Publicado no GitHub. Quem abrir o link já vê.', 3600);
    render();
  } catch (e) { S.lancErro = e.message; render(false); }
}

function apresentar() {
  const slides = montarSlides();

  const p = periodo();
  const el = $('#present');
  el.innerHTML = `<div class="pr-bar" id="pr-bar"></div><div class="pr-top"><span class="pr-t">RDO · ${esc(p.rot)} · ${esc(turnoRot(S.turno, regsPeriodo(p)))}</span><span id="pr-n" class="tab"></span><button class="icon-btn" data-act="pr-cheia" aria-label="Tela cheia">${ic('cheia')}</button><button class="icon-btn" data-act="pr-sair" aria-label="Sair" style="margin-left:0">${ic('x')}</button></div>
    <div class="pr-stage" id="pr-stage">${slides.map((s, k) => `<section class="slide" data-k="${k}"><div class="s-anim">${s}</div></section>`).join('')}</div>
    <div class="pr-nav"><button class="icon-btn" data-act="pr-ant" aria-label="Anterior">${ic('esq')}</button><div class="pr-dots">${slides.map((_, k) => `<button data-act="pr-ir" data-k="${k}" aria-label="Slide ${k + 1}"></button>`).join('')}</div><button class="icon-btn" data-act="pr-prox" aria-label="Próximo">${ic('dir')}</button></div>`;
  el.classList.add('on');
  document.body.style.overflow = 'hidden';
  PR = { k: 0, n: slides.length };
  requestAnimationFrame(() => irSlide(0));
  const st = $('#pr-stage'); let x0 = null;
  st.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') x0 = e.clientX; });
  st.addEventListener('pointerup', e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) irSlide(PR.k + (dx < 0 ? 1 : -1)); });
}
function irSlide(k) {
  if (!PR) return;
  k = Math.max(0, Math.min(PR.n - 1, k)); PR.k = k;
  $$('#pr-stage .slide').forEach((s, i) => { s.classList.toggle('on', i === k); s.classList.toggle('antes', i < k); });
  const ativo = $(`#pr-stage .slide[data-k="${k}"]`);
  if (ativo) { $$('.reveal', ativo).forEach(r => r.classList.add('in')); $$('[data-strip]', ativo).forEach(r => { r.classList.remove('in'); void r.offsetWidth; r.classList.add('in'); }); setTimeout(() => Charts.animar(ativo), 120); ativo.scrollTop = 0; }
  $$('.pr-dots button').forEach((b, i) => b.classList.toggle('on', i === k));
  const n = $('#pr-n'); if (n) n.textContent = `${k + 1} / ${PR.n}`;
  const bar = $('#pr-bar'); if (bar) bar.style.width = ((k + 1) / PR.n * 100) + '%';
}
function sairApresentacao() {

  },
  item: el => { S.item = el.dataset.item; render(false); },
  'prev-item': el => { S.item = el.dataset.item; render(false); setTimeout(() => { const c = $$('.chart').pop(); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60); },
  cmp: el => { S.cmp = el.dataset.k; render(false); },
  cmpB: el => { S.cmpB = el.dataset.k; render(false); },
  rel: el => { S.relX = el.dataset.x; S.relY = el.dataset.y; render(false); },
  itcmp: el => { const c = el.dataset.item; if (S.itensCmp.includes(c)) S.itensCmp = S.itensCmp.filter(x => x !== c); else { S.itensCmp.push(c); if (S.itensCmp.length > 4) S.itensCmp.shift(); } if (!S.itensCmp.length) S.itensCmp = [c]; render(false); },
  tgran: el => { S.tendGran = el.dataset.k; render(false); },
  whats: () => abrirWhats(),
  'copiar-whats': async () => { toast(await copiar(S._whats || '') ? 'Copiado. É só colar no WhatsApp.' : 'Não consegui copiar; selecione o texto.'); },
  apresentar: () => apresentar(),
  'pr-sair': () => sairApresentacao(),
  'pr-ant': () => irSlide(PR.k - 1), 'pr-prox': () => irSlide(PR.k + 1), 'pr-ir': el => irSlide(+el.dataset.k),
  'pr-cheia': () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { toast('Este aparelho não permite tela cheia.'); } },
  sync: () => sincronizar(true),
  'tema-ciclo': () => { const o = ['auto', 'light', 'dark']; const t = o[(o.indexOf(temaAtual()) + 1) % 3]; aplicarTema(t); toast(t === 'auto' ? 'Tema automático (segue o aparelho)' : t === 'light' ? 'Tema claro' : 'Tema escuro'); renderToolbar(); },
  tema: el => { aplicarTema(el.dataset.k); render(false); },
  side: () => { $('#win').classList.toggle('sem-side'); setTimeout(() => Charts.redrawAll(), 380); },
  'luz-r': () => ir({ view: 'painel' }), 'luz-y': () => ACT.side(), 'luz-g': () => ACT['pr-cheia'](),
  mais: () => sheet('Mais', `<div class="leit">${Object.keys(VIEWS).filter(v => !TABS.includes(v)).map(v => `<button class="leit-i info" data-act="view" data-v="${v}"><span class="ic">${ic(VIEWS[v].ic)}</span><span><h4>${VIEWS[v].t}</h4></span><span class="go">${ic('dir')}</span></button>`).join('')}</div>`),
  'fechar-sheet': () => fecharSheet(),
  colar: () => { S.lancErro = null; try { lerJSONColado($('#colar').value).forEach(r => addPendente(r, 'IA (colado)')); toast('Pronto para conferir.'); } catch (e) { S.lancErro = 'O texto colado não é um JSON válido de lançamento. ' + e.message; } render(false); },
  'pend-rem': el => { S.pendentes.splice(+el.dataset.k, 1); render(false); },
  publicar: () => publicarPendentes(),
  'salvar-local': () => { salvarLocais(RDO.upsert(locais(), S.pendentes)); const u = S.pendentes[S.pendentes.length - 1]; S.pendentes = []; montarRegs(); S.ref = u.data; S.per = 'dia'; S.view = 'painel'; toast('Salvo neste aparelho. Publique depois em Base de dados.'); render(); },
  'baixar-base-pend': () => { const base = { sistema: 'RDO Rondon', atualizadoEm: new Date().toISOString(), registros: RDO.upsert(S.regs.filter(r => !r.demo), S.pendentes) }; baixar('rdo-base.json', RDO.serializar(base)); toast('Arquivo baixado. Suba no GitHub em dados/rdo-base.json.'); },
  'baixar-base': () => { baixar('rdo-base.json', RDO.serializar({ sistema: 'RDO Rondon', atualizadoEm: new Date().toISOString(), registros: S.regs.filter(r => !r.demo || S.demo) })); },
  'baixar-csv': () => baixar('rdo-base.csv', '﻿' + csv(S.regs), 'text/csv;charset=utf-8'),
  'publicar-locais': async () => { S.pendentes = locais(); await publicarPendentes(); },
  'ver-json': el => { const r = S.regs.find(x => x.id === el.dataset.id); if (r) sheet(`${RDO.diaCurto(r.data)} · ${r.turno}`, `<pre style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px">${esc(JSON.stringify(RDO.canonico(r), null, 2))}</pre>`); },
  excluir: async el => {
    const id = el.dataset.id; const r = S.regs.find(x => x.id === id); if (!r) return;
    if (r._local) { salvarLocais(locais().filter(x => x.id !== id)); montarRegs(); render(false); return toast('Removido deste aparelho.'); }
    if (!ghCfg().token) return toast('Para excluir da base do GitHub, cole o token em Ajustes.', 3600);
    if (!confirm(`Excluir ${RDO.diaCurto(r.data)} ${r.turno} da base no GitHub?`)) return;
    try { const base = await GH.excluir([id], `Remove RDO ${r.data} ${r.turno} (pelo painel)`); S.remoto = base.registros; montarRegs(); render(false); toast('Excluído da base.'); } catch (e) { toast(e.message, 4000); }
  },
  'gh-salvar': () => { store.set('gh', { owner: $('#gh-owner').value.trim(), repo: $('#gh-repo').value.trim(), branch: $('#gh-branch').value.trim() || 'main', path: $('#gh-path').value.trim() || 'dados/rdo-base.json', token: $('#gh-token').value.trim() }); toast('Conexão salva neste aparelho.'); sincronizar(true); },
  'gh-testar': async () => { ACT['gh-salvar'](); const box = $('#gh-res'); box.innerHTML = 'Testando…'; try { const r = await GH.testar(); box.innerHTML = r.map(x => `<div class="c-ok">✓ ${esc(x)}</div>`).join(''); } catch (e) { box.innerHTML = `<div class="c-ruim">✕ ${esc(e.message)}</div>`; } },
  'gh-sair': () => { const g = store.get('gh', {}); delete g.token; store.set('gh', g); toast('Token apagado deste aparelho.'); render(false); },
  'cfg-dia': el => { const k = +el.dataset.k; CFG.diasProducao = CFG.diasProducao.includes(k) ? CFG.diasProducao.filter(x => x !== k) : CFG.diasProducao.concat(k).sort(); salvarCfg(); render(false); },
  'limpar-local': () => { if (!confirm('Apagar lançamentos locais, preferências e a cópia salva da base deste aparelho? (A base no GitHub não é afetada.)')) return; ['locais', 'cfg', 'ui', 'cacheRemoto', 'demo'].forEach(k => store.del(k)); location.reload(); },
  'demo-on': () => { S.demo = true; store.set('demo', true); montarRegs(); render(); },
  'demo-off': () => { S.demo = false; store.set('demo', false); montarRegs(); render(); sincronizar(false); }
};
const CHG = {
  'rdo-vazias': el => { S.semVazias = el.checked; render(false); },
  pdf: el => { if (el.files && el.files.length) processarArquivos(el.files); el.value = ''; },
  importar: async el => { const f = el.files && el.files[0]; if (!f) return; try { const regs = lerJSONColado(await f.text()); regs.forEach(r => addPendente(r, 'importado de arquivo')); S.view = 'lancar'; render(); toast(`${regs.length} lançamento(s) para conferir.`); } catch (e) { toast('Arquivo inválido: ' + e.message, 4000); } el.value = ''; },
  calmo: el => { store.set('calmo', el.checked); document.documentElement.classList.toggle('calmo', el.checked); },
  demo: el => el.checked ? ACT['demo-on']() : ACT['demo-off'](),
  'cfg-an': el => { CFG.analisar[el.dataset.item] = el.checked; salvarCfg(); toast('Regra atualizada.'); },
  'cfg-plano': el => { CFG.planoCompartilhado = el.checked; salvarCfg(); },
  'cfg-cx': el => { const v = parseFloat(String(el.value).replace(',', '.')); if (v > 0) { CFG.caixas[el.dataset.item] = v; salvarCfg(); toast('Peso da caixa atualizado.'); } },
  'cfg-amarelo': el => { CFG.amarelo = +el.value; salvarCfg(); render(false); },
  'cfg-red': el => { CFG.fatorReducao = +el.value; salvarCfg(); },
  relX: el => { S.relX = el.value; render(false); }, relY: el => { S.relY = el.value; render(false); },
  tendInd: el => { S.tendInd = el.value; render(false); },
  cmpBde: el => { S.cmpBde = el.value; render(false); }, cmpBate: el => { S.cmpBate = el.value; render(false); },
  data: el => { if (!el.value) return; S.ref = el.value; if (S.per === 'perso') S.per = 'dia'; render(); }
};
function csv(regs) {
  const cods = RDO.LINHAS.map(l => l.c);
  const itens = RDO.ITENS.filter(i => i.analisa);
  const head = ['data', 'turno', ...cods, ...itens.map(i => `saldo_kg_${i.c}`), 'mortalidade_und', 'interrupcoes_min', 'reducoes_min', 'paradas_prog_min'];
  const f = v => isNum(v) ? String(v).replace('.', ',') : (v == null ? '' : String(v));
  const lin = regs.map(r => { const a = agg([r]); const it = RDO.analisarItens(a, CFG); return [r.data, r.turno, ...cods.map(c => f(r.v[c])), ...itens.map(i => f(RDO.round((it.find(x => x.c === i.c) || {}).gapKg || 0, 1))), f(a.mort), f(a.intMin), f(a.redMin), f(a.ppMin)].join(';'); });
  return [head.join(';'), ...lin].join('\n');
}

/* ---------------- EVENTOS ---------------- */
function ligarEventos() {
  document.addEventListener('click', e => {
    if (e.target.matches && e.target.matches('input[type="date"]') && e.target.showPicker) { try { e.target.showPicker(); } catch (er) { } }
    const el = e.target.closest('[data-act]');
    if (el && !['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName)) { const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); } return; }
    if (e.target.id === 'sheet') fecharSheet();
    const inf = e.target.closest('[data-info],[data-seg]');
    if (inf) { mostrarInfo(inf); e.stopPropagation(); }
    else Tip.hide();
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-act]'); if (el && CHG[el.dataset.act]) CHG[el.dataset.act](el, e); });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.act === 'cfg-amarelo') { const o = $('#amarelo-v'); if (o) o.textContent = el.value + '%'; }
    if (el.dataset.act === 'cfg-red') { const o = $('#red-v'); if (o) o.textContent = el.value + '%'; }
  });
  document.addEventListener('pointerover', e => {
    if (e.pointerType === 'touch') return;
    const inf = e.target.closest('[data-info],[data-seg]');
    if (inf && inf !== mostrarInfo._el) mostrarInfo(inf);
  });
  document.addEventListener('pointerout', e => {
    if (e.pointerType === 'touch') return;
    const inf = e.target.closest('[data-info],[data-seg]');
    if (inf && !inf.contains(e.relatedTarget)) { mostrarInfo._el = null; Tip.hide(); }
  });
  document.addEventListener('dragover', e => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('sobre'); } });
  document.addEventListener('dragleave', e => { const d = e.target.closest('#drop'); if (d) d.classList.remove('sobre'); });
  document.addEventListener('drop', e => {
    const d = e.target.closest('#drop');
    if (!d && S.view !== 'lancar' && e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); processarArquivos(e.dataTransfer.files); return; }
    if (d) { e.preventDefault(); d.classList.remove('sobre'); processarArquivos(e.dataTransfer.files); }
  });
  window.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (PR) {
      if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); irSlide(PR.k + 1); }
      else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); irSlide(PR.k - 1); }
      else if (e.key === 'Escape') sairApresentacao();
      else if (e.key === 'Home') irSlide(0); else if (e.key === 'End') irSlide(PR.n - 1);
      return;
    }
    if (e.key === 'Escape') { fecharSheet(); Tip.hide(); }
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes((document.activeElement || {}).tagName)) return;
    if (e.key === 'ArrowLeft' && VIEWS[S.view].per) navegar(-1);
    if (e.key === 'ArrowRight' && VIEWS[S.view].per) navegar(1);
  });
  window.addEventListener('resize', () => { clearTimeout(ligarEventos._r); ligarEventos._r = setTimeout(() => posThumbs(), 100); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.fonte.quando && Date.now() - new Date(S.fonte.quando) > 120000) sincronizar(false); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => aplicarTema(temaAtual()));
  $('#view').addEventListener('scroll', () => Tip.hide(), { passive: true });
}
function mostrarInfo(el) {
  mostrarInfo._el = el;
  const k = el.dataset.info || ('seg:' + el.dataset.seg);
  const html = infoHTML(k, S._a);
  if (!html) return;
  const r = el.getBoundingClientRect();
  Tip.show(html, r.left + Math.min(r.width / 2, 120), r.bottom - 4, { wide: true });
}

/* ---------------- INÍCIO ---------------- */
function iniciar() {
  aplicarTema(temaAtual());
  if (store.get('calmo', false)) document.documentElement.classList.add('calmo');
  const cache = store.get('cacheRemoto', null);
  if (cache && Array.isArray(cache.registros) && cache.registros.length) { S.remoto = cache.registros; S.fonte = { tipo: 'cache', quando: cache.quando, via: cache.via }; }
  lerHash();
  montarRegs();
  if (!S.regs.some(r => r.data === S.ref)) S.ref = datasComDados().slice(-1)[0] || S.ref;
  ligarEventos();
  render();
  sincronizar(false);
  setInterval(() => { if (document.visibilityState === 'visible') sincronizar(false); }, 4 * 60 * 1000);
  if (/apresentar/.test(location.search)) setTimeout(apresentar, 600);
}
document.addEventListener('DOMContentLoaded', iniciar);

</script>
